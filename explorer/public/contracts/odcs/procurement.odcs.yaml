  quality:
  - name: pol_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pol_keys_not_null
    query: "SELECT * FROM procurement.purchase_order_line\nWHERE po_line_sk IS NULL OR po_line_id IS NULL\
      \ OR supplier_id IS NULL\n   OR product_id IS NULL OR store_id IS NULL OR order_date IS NULL"
  - name: pol_supplier_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pol_supplier_fk_orphan
    query: 'SELECT pol.* FROM procurement.purchase_order_line pol

      LEFT JOIN supplier.supplier s ON pol.supplier_sk = s.supplier_sk

      WHERE pol.supplier_sk IS NOT NULL AND s.supplier_sk IS NULL'
  - name: pol_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pol_product_fk_orphan
    query: 'SELECT pol.* FROM procurement.purchase_order_line pol

      LEFT JOIN product.product p ON pol.product_sk = p.product_sk

      WHERE pol.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: pol_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pol_store_fk_orphan
    query: 'SELECT pol.* FROM procurement.purchase_order_line pol

      LEFT JOIN store.store st ON pol.store_sk = st.store_sk

      WHERE pol.store_sk IS NOT NULL AND st.store_sk IS NULL'
  - name: pol_quantities_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pol_quantities_nonnegative
    query: 'SELECT * FROM procurement.purchase_order_line

      WHERE ordered_qty < 0 OR received_qty < 0 OR defective_qty < 0 OR returned_qty < 0'
  - name: pol_received_not_over_ordered
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: No over-delivery, so fill_rate stays within [0, 1].
    query: 'SELECT * FROM procurement.purchase_order_line

      WHERE received_qty > ordered_qty'
  - name: pol_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: pol_status_domain
    query: "SELECT * FROM procurement.purchase_order_line\nWHERE order_status IS NOT NULL\n  AND order_status\
      \ NOT IN ('open', 'received', 'closed', 'cancelled')"
  - name: pol_calendar_coverage
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every order_date must exist in the fiscal calendar (needed for the period grain).
    query: 'SELECT pol.order_date FROM procurement.purchase_order_line pol

      LEFT JOIN calendar.fiscal_calendar c ON pol.order_date = c.date_key

      WHERE c.date_key IS NULL

      GROUP BY pol.order_date'
  - name: pol_single_reporting_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Prices are normalized to the base currency; currency_code must be constant.
    query: 'SELECT COUNT(DISTINCT currency_code) AS distinct_currencies

      FROM procurement.purchase_order_line

      HAVING COUNT(DISTINCT currency_code) > 1'
