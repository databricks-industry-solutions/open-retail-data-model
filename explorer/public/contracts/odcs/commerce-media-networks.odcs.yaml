      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: keyword_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable keyword business key.
  - name: search_term_text
    logicalType: string
    physicalType: STRING
