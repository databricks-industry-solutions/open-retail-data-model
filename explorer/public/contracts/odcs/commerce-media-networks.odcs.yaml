    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: impression, viewable_impression, click, ad_play, video_start, video_complete.'
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the event occurred at source (UTC, ISO 8601).
  - name: event_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the event (partition/cluster key).
  - name: cost_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Media cost of this event, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Cost currency, ISO 4217 alpha-3 (single reporting currency).
  - name: duration_sec
    logicalType: integer
    physicalType: INT
    required: false
    description: Play/view duration in seconds for time-based events (NULL otherwise).
  - name: viewable_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the impression met the viewability standard (display 50%/1s, video 50%/2s).
  - name: ivt_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if classified as invalid traffic.
  - name: ivt_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Invalid-traffic class. Allowed values: none, givt, sivt.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, givt, sivt.'
  - name: click_resolved_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: 'For clicks: TRUE if resolved to a valid served impression.'
  - name: customer_key_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Hashed/tokenized customer identifier for clean-room matching (PII, never raw).
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: household_key_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Hashed/tokenized household identifier (PII, never raw).
    classification: restricted
    tags:
    - dbx_pii_identifier
