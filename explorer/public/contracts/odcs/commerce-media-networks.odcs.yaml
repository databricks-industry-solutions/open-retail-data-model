  quality:
  - name: acd_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_grain_unique
    query: SELECT campaign_day_id, COUNT(*) AS n FROM commerce_media_networks.campaign_day GROUP BY campaign_day_id
      HAVING COUNT(*) > 1
  - name: acd_grain_single_level
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The aggregate uses ''ALL'' sentinels for dims not applicable to a row. A rolled-up (''ALL''
      on every finer dim) row and detail rows must never coexist for the same campaign×day, or a downstream
      SUM double-counts the rollup with its detail. The finer axes are ALL breakout dimensions of the
      grain: ad_group, creative, placement, product, store, AND delivery_channel + audience (a delivery_channel/audience-broken-out
      row summed next to the fully-rolled row inflates delivery/spend ~2× — review M1). So all seven participate
      in the has_rollup/has_detail predicates. (attribution_model is a single per-row disclosure, not
      a grain axis — see acd_single_attribution_model — so rollup detection is model-independent.)'
    query: SELECT campaign_id, metric_date FROM (SELECT campaign_id, metric_date, MAX(CASE WHEN ad_group_id
      = 'ALL' AND creative_id = 'ALL' AND placement_id = 'ALL' AND product_id = 'ALL' AND store_id = 'ALL'
      AND delivery_channel_id = 'ALL' AND audience_id = 'ALL' THEN 1 ELSE 0 END) AS has_rollup, MAX(CASE
      WHEN ad_group_id <> 'ALL' OR creative_id <> 'ALL' OR placement_id <> 'ALL' OR product_id <> 'ALL'
      OR store_id <> 'ALL' OR delivery_channel_id <> 'ALL' OR audience_id <> 'ALL' THEN 1 ELSE 0 END)
      AS has_detail FROM commerce_media_networks.campaign_day GROUP BY campaign_id, metric_date) WHERE
      has_rollup = 1 AND has_detail = 1
  - name: acd_single_attribution_model
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The attributed measures are reported under ONE attribution model per campaign×day (the
      campaign''s configured model). attribution_model is a per-row disclosure, NOT a grain axis: the
      gold views (gold_campaign_performance, gold_supplier_campaign_report) SUM delivery + attributed
      measures without partitioning by model, so a second model for the same campaign×day would inflate
      impressions/spend (delivery is model-independent) and mix incompatible attributions — corrupting
      ROAS/iROAS. Multi-model / per-touch comparison belongs in attributed_outcome.'
    query: 'SELECT campaign_id, metric_date, COUNT(DISTINCT attribution_model) AS n

      FROM commerce_media_networks.campaign_day

      WHERE attribution_model IS NOT NULL

      GROUP BY campaign_id, metric_date HAVING COUNT(DISTINCT attribution_model) > 1'
  - name: acd_uniform_breakout
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Additivity contract (the GENERAL partition guard). Every row for a campaign×day must
      share ONE breakout signature — the same set of non-'ALL' breakout dims — so the rows form a single,
      non-overlapping partition of the campaign×day total. Two DIFFERENT partial breakouts (e.g. product-level
      rows with delivery_channel='ALL' next to delivery_channel-level rows with product='ALL') each independently
      sum to the total, so the gold views (which SUM grouped by campaign×day with no grain filter) would
      ~2x double-count. This is the general guard; acd_grain_single_level (fully-rolled 'ALL'- everywhere
      vs any detail) is the special case it subsumes. Together they make the gold SUM provably additive
      (one canonical grain per campaign×day).
    query: "SELECT campaign_id, metric_date, COUNT(DISTINCT breakout_sig) AS n FROM (\n  SELECT campaign_id,\
      \ metric_date, CONCAT(\n    CASE WHEN ad_group_id = 'ALL' THEN '0' ELSE '1' END,\n    CASE WHEN\
      \ creative_id = 'ALL' THEN '0' ELSE '1' END,\n    CASE WHEN placement_id = 'ALL' THEN '0' ELSE '1'\
      \ END,\n    CASE WHEN product_id = 'ALL' THEN '0' ELSE '1' END,\n    CASE WHEN store_id = 'ALL'\
      \ THEN '0' ELSE '1' END,\n    CASE WHEN delivery_channel_id = 'ALL' THEN '0' ELSE '1' END,\n   \
      \ CASE WHEN audience_id = 'ALL' THEN '0' ELSE '1' END) AS breakout_sig\n  FROM commerce_media_networks.campaign_day\n\
      ) GROUP BY campaign_id, metric_date HAVING COUNT(DISTINCT breakout_sig) > 1"
  - name: acd_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_campaign_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN commerce_media_networks.campaign
      c ON a.campaign_sk = c.campaign_sk WHERE a.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL
  - name: acd_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM commerce_media_networks.campaign_day
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: acd_spend_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_spend_nonnegative
    query: SELECT * FROM commerce_media_networks.campaign_day WHERE (media_spend_gross IS NOT NULL AND
      media_spend_gross < 0) OR (media_spend_net IS NOT NULL AND media_spend_net < 0)
  - name: acd_delivery_channel_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_delivery_channel_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN commerce_media_networks.delivery_channel
      d ON a.delivery_channel_sk = d.delivery_channel_sk WHERE a.delivery_channel_sk IS NOT NULL AND d.delivery_channel_sk
      IS NULL
  - name: acd_audience_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_audience_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN marketing.audience au ON a.audience_sk
      = au.audience_sk WHERE a.audience_sk IS NOT NULL AND au.audience_sk IS NULL
  - name: acd_advertiser_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_advertiser_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN commerce_media_networks.advertiser
      d ON a.advertiser_sk = d.advertiser_sk WHERE a.advertiser_sk IS NOT NULL AND d.advertiser_sk IS
      NULL
  - name: acd_ad_group_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_ad_group_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN commerce_media_networks.ad_group
      d ON a.ad_group_sk = d.ad_group_sk WHERE a.ad_group_sk IS NOT NULL AND d.ad_group_sk IS NULL
  - name: acd_creative_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_creative_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN commerce_media_networks.creative
      d ON a.creative_sk = d.creative_sk WHERE a.creative_sk IS NOT NULL AND d.creative_sk IS NULL
  - name: acd_placement_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_placement_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN commerce_media_networks.placement
      d ON a.placement_sk = d.placement_sk WHERE a.placement_sk IS NOT NULL AND d.placement_sk IS NULL
  - name: acd_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_product_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN product.product d ON a.product_sk
      = d.product_sk WHERE a.product_sk IS NOT NULL AND d.product_sk IS NULL
  - name: acd_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: acd_store_fk_orphan
    query: SELECT a.* FROM commerce_media_networks.campaign_day a LEFT JOIN store.store d ON a.store_sk
      = d.store_sk WHERE a.store_sk IS NOT NULL AND d.store_sk IS NULL
- name: conversion_event
  physicalName: commerce_media_networks.conversion_event
  physicalType: table
  description: Commerce Media Networks — paid-attribution measurement projection of the conversion-relevant
    subset (append-only); the CVR denominator + attributed_outcome FK target. Raw touch occurrence lives
    in canonical-core interaction.touchpoint (ADR 0029).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: conversion_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: conversion_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the conversion event.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk (the converting customer), if known.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable customer business key (pseudonymous).
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk (fulfilling/visited store), if applicable.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key.
  - name: order_line_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to order.customer_order_line.order_line_sk for purchase conversions.
    relationships:
    - to: customer_order_line.order_line_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: orders
      - property: enforced
        value: false
  - name: order_line_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable order-line business key.
  - name: order_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable order business key.
  - name: promo_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to marketing.promotion.promo_sk (promotion active for this conversion), if any.
    relationships:
    - to: promotion.promo_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: marketing
      - property: enforced
        value: false
  - name: promo_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable promotion business key (NO_PROMO when none).
  - name: experiment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.experiment.experiment_sk if under an experiment.
    relationships:
    - to: experiment.experiment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: experiment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable experiment business key.
  - name: experiment_cell_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.experiment_cell.experiment_cell_sk (treatment/control), if assigned.
    relationships:
    - to: experiment_cell.experiment_cell_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: experiment_cell_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable experiment cell business key.
  - name: conversion_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Kind of conversion. Allowed values: purchase, add_to_cart, pdp_view, store_visit, signup.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: purchase, add_to_cart, pdp_view, store_visit, signup.'
  - name: outcome_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the conversion occurred (UTC, ISO 8601).
  - name: outcome_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the conversion (cluster key).
  - name: gross_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Gross sales value, in the reporting/base currency (purchase conversions).
  - name: net_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Net sales value, in the reporting/base currency.
  - name: margin_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Gross margin, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Amount currency, ISO 4217 alpha-3 (single reporting currency).
  - name: units
    logicalType: integer
    physicalType: INT
    required: false
    description: Units for purchase conversions.
  - name: customer_key_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Hashed/tokenized customer identifier (PII, never raw).
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: consent_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Consent state for measurement. Allowed values: granted, denied, unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: granted, denied, unknown.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: fce_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_grain_unique
    query: SELECT conversion_event_id, COUNT(*) AS n FROM commerce_media_networks.conversion_event GROUP
      BY conversion_event_id HAVING COUNT(*) > 1
  - name: fce_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_keys_not_null
    query: SELECT * FROM commerce_media_networks.conversion_event WHERE conversion_event_sk IS NULL OR
      conversion_event_id IS NULL OR conversion_type IS NULL OR outcome_ts IS NULL
  - name: fce_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_product_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.conversion_event f LEFT JOIN product.product p ON f.product_sk
      = p.product_sk WHERE f.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: fce_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM commerce_media_networks.conversion_event
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: fce_promotion_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_promotion_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.conversion_event f LEFT JOIN marketing.promotion p
      ON f.promo_sk = p.promo_sk WHERE f.promo_sk IS NOT NULL AND p.promo_sk IS NULL
  - name: fce_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_profile_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.conversion_event f LEFT JOIN customer.profile d ON
      f.profile_sk = d.profile_sk WHERE f.profile_sk IS NOT NULL AND d.profile_sk IS NULL
  - name: fce_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_store_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.conversion_event f LEFT JOIN store.store d ON f.store_sk
      = d.store_sk WHERE f.store_sk IS NOT NULL AND d.store_sk IS NULL
  - name: fce_order_line_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_order_line_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.conversion_event f LEFT JOIN orders.customer_order_line
      d ON f.order_line_sk = d.order_line_sk WHERE f.order_line_sk IS NOT NULL AND d.order_line_sk IS
      NULL
  - name: fce_experiment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_experiment_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.conversion_event f LEFT JOIN commerce_media_networks.experiment
      d ON f.experiment_sk = d.experiment_sk WHERE f.experiment_sk IS NOT NULL AND d.experiment_sk IS
      NULL
  - name: fce_experiment_cell_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fce_experiment_cell_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.conversion_event f LEFT JOIN commerce_media_networks.experiment_cell
      d ON f.experiment_cell_sk = d.experiment_cell_sk WHERE f.experiment_cell_sk IS NOT NULL AND d.experiment_cell_sk
      IS NULL
- name: creative
  physicalName: commerce_media_networks.creative
  physicalType: table
  description: ORDM Commerce Media Networks retail-media creative dimension (SCD2).
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: creative_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version; the join/FK target.
  - name: creative_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the creative.
  - name: campaign_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to campaign.campaign_sk (the campaign this creative belongs to).
    relationships:
    - to: campaign.campaign_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: campaign_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the parent campaign (join on current campaign version).
  - name: creative_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable creative name.
  - name: creative_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Asset type. Allowed values: image, video, audio, html, native, text.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: image, video, audio, html, native, text.'
  - name: mime_type
    logicalType: string
    physicalType: STRING
    required: false
    description: MIME type of the asset (e.g. image/jpeg, video/mp4).
  - name: duration_seconds
    logicalType: integer
    physicalType: INT
    required: false
    description: Play duration in seconds for time-based assets (NULL for static).
  - name: aspect_ratio
    logicalType: string
    physicalType: STRING
    required: false
    description: Aspect ratio of the asset (e.g. 16:9, 1:1, 9:16).
  - name: language_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Creative language, ISO 639-1 alpha-2.
  - name: approval_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Review workflow state. Allowed values: draft, submitted, approved, rejected, archived.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: draft, submitted, approved, rejected, archived.'
  - name: brand_safety_class
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Brand-safety classification. Allowed values: safe, moderate, restricted.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: safe, moderate, restricted.'
  - name: asset_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Reference/URI to the stored asset (not the asset itself).
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this creative.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: creative_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_keys_not_null
    query: "SELECT * FROM commerce_media_networks.creative\nWHERE creative_sk IS NULL OR creative_id IS\
      \ NULL\n   OR effective_from_date IS NULL OR is_current IS NULL"
  - name: creative_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_business_key_unique_current
    query: 'SELECT creative_id, COUNT(*) AS current_versions

      FROM commerce_media_networks.creative

      WHERE is_current = true

      GROUP BY creative_id

      HAVING COUNT(*) > 1'
  - name: creative_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_campaign_fk_orphan
    query: 'SELECT cr.* FROM commerce_media_networks.creative cr

      LEFT JOIN commerce_media_networks.campaign c ON cr.campaign_sk = c.campaign_sk

      WHERE cr.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL'
  - name: creative_campaign_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_campaign_businesskey_orphan
    query: "SELECT cr.* FROM commerce_media_networks.creative cr\nLEFT JOIN (SELECT DISTINCT campaign_id\
      \ FROM commerce_media_networks.campaign) c\n  ON cr.campaign_id = c.campaign_id\nWHERE cr.campaign_id\
      \ IS NOT NULL AND c.campaign_id IS NULL"
  - name: creative_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_type_domain
    query: "SELECT * FROM commerce_media_networks.creative\nWHERE creative_type IS NOT NULL\n  AND creative_type\
      \ NOT IN ('image', 'video', 'audio', 'html', 'native', 'text')"
  - name: creative_approval_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_approval_status_domain
    query: "SELECT * FROM commerce_media_networks.creative\nWHERE approval_status IS NOT NULL\n  AND approval_status\
      \ NOT IN ('draft', 'submitted', 'approved', 'rejected', 'archived')"
  - name: creative_brand_safety_class_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_brand_safety_class_domain
    query: "SELECT * FROM commerce_media_networks.creative\nWHERE brand_safety_class IS NOT NULL\n  AND\
      \ brand_safety_class NOT IN ('safe', 'moderate', 'restricted')"
  - name: creative_duration_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_duration_nonnegative
    query: 'SELECT * FROM commerce_media_networks.creative

      WHERE duration_seconds IS NOT NULL AND duration_seconds < 0'
  - name: creative_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_scd2_current_open
    query: "SELECT * FROM commerce_media_networks.creative\nWHERE (is_current = true  AND effective_to_date\
      \ IS NOT NULL)\n   OR (is_current = false AND effective_to_date IS NULL)"
  - name: creative_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: creative_scd2_date_order
    query: 'SELECT * FROM commerce_media_networks.creative

      WHERE effective_to_date IS NOT NULL AND effective_to_date <= effective_from_date'
- name: delivery_channel
  physicalName: commerce_media_networks.delivery_channel
  physicalType: table
  description: ORDM Commerce Media Networks conformed delivery-channel reference dimension (Type 1). The
    coarse distribution channel / environment, distinct from media_platform, device_type, and the fine
    placement slot.
  tags:
  - reference
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: delivery_channel_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: delivery_channel_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key / delivery-channel code (e.g., onsite_app, in_store_screen).
  - name: delivery_channel_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable delivery-channel / environment label.
  - name: delivery_channel_category
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Coarse distribution/delivery-channel class. Allowed values: onsite_web, onsite_app,
      offsite, in_store_screen, in_store_audio, dooh, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: onsite_web, onsite_app, offsite, in_store_screen, in_store_audio,
        dooh, other.'
  - name: is_in_store_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE for in-store channels (screens, audio); FALSE for online/offsite channels.
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: delivery_channel_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: delivery_channel_keys_not_null
    query: 'SELECT * FROM commerce_media_networks.delivery_channel

      WHERE delivery_channel_sk IS NULL OR delivery_channel_id IS NULL'
  - name: delivery_channel_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: delivery_channel_id_unique
    query: 'SELECT delivery_channel_id, COUNT(*) AS n

      FROM commerce_media_networks.delivery_channel

      GROUP BY delivery_channel_id HAVING COUNT(*) > 1'
  - name: delivery_channel_category_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: delivery_channel_category_domain
    query: "SELECT * FROM commerce_media_networks.delivery_channel\nWHERE delivery_channel_category IS\
      \ NOT NULL\n  AND delivery_channel_category NOT IN ('onsite_web', 'onsite_app', 'offsite', 'in_store_screen',\
      \ 'in_store_audio', 'dooh', 'other')"
- name: experiment
  physicalName: commerce_media_networks.experiment
  physicalType: table
  description: ORDM Commerce Media Networks incrementality experiment design dimension (SCD2).
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: experiment_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version; the join/FK target.
  - name: experiment_id
    logicalType: string
    physicalType: STRING
    required: true
