  - name: experiment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.experiment.experiment_sk if this event is under an experiment.
    relationships:
    - to: experiment.experiment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: experiment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable experiment business key.
  - name: experiment_cell_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.experiment_cell.experiment_cell_sk (treatment/control), if assigned.
    relationships:
    - to: experiment_cell.experiment_cell_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: experiment_cell_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable experiment cell business key.
  - name: parent_media_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to media_event.media_event_sk — the served impression a click resolved from.
    relationships:
    - to: media_event.media_event_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: parent_media_event_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the parent served impression.
  - name: event_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Event type. Allowed values: impression, viewable_impression, click, ad_play, video_start,
