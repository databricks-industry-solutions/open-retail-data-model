  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this experiment.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: experiment_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_keys_not_null
    query: "SELECT * FROM commerce_media_networks.experiment\nWHERE experiment_sk IS NULL OR experiment_id\
      \ IS NULL\n   OR effective_from_date IS NULL OR is_current IS NULL"
  - name: experiment_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_business_key_unique_current
    query: 'SELECT experiment_id, COUNT(*) AS current_versions

      FROM commerce_media_networks.experiment

      WHERE is_current = true

      GROUP BY experiment_id

      HAVING COUNT(*) > 1'
  - name: experiment_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When set, the campaign under test must reference an existing campaign.
    query: 'SELECT e.* FROM commerce_media_networks.experiment e

      LEFT JOIN commerce_media_networks.campaign c ON e.campaign_sk = c.campaign_sk

      WHERE e.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL'
  - name: experiment_campaign_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_campaign_businesskey_orphan
    query: "SELECT e.* FROM commerce_media_networks.experiment e\nLEFT JOIN (SELECT DISTINCT campaign_id\
      \ FROM commerce_media_networks.campaign) c\n  ON e.campaign_id = c.campaign_id\nWHERE e.campaign_id\
      \ IS NOT NULL AND c.campaign_id IS NULL"
  - name: experiment_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_type_domain
    query: "SELECT * FROM commerce_media_networks.experiment\nWHERE experiment_type IS NOT NULL\n  AND\
      \ experiment_type NOT IN ('geo_holdout', 'audience_holdout', 'ghost_ads', 'switchback', 'pre_post',\
      \ 'other')"
  - name: experiment_methodology_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_methodology_domain
    query: "SELECT * FROM commerce_media_networks.experiment\nWHERE methodology IS NOT NULL\n  AND methodology\
      \ NOT IN ('randomized_control', 'matched_market', 'synthetic_control', 'difference_in_differences',\
      \ 'other')"
  - name: experiment_unit_of_assignment_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_unit_of_assignment_domain
    query: "SELECT * FROM commerce_media_networks.experiment\nWHERE unit_of_assignment IS NOT NULL\n \
      \ AND unit_of_assignment NOT IN ('user', 'household', 'geo', 'store', 'device')"
  - name: experiment_objective_metric_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_objective_metric_domain
    query: "SELECT * FROM commerce_media_networks.experiment\nWHERE objective_metric IS NOT NULL\n  AND\
      \ objective_metric NOT IN ('incremental_sales', 'incremental_units', 'roas', 'conversion_rate',\
      \ 'reach', 'other')"
  - name: experiment_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_status_domain
    query: "SELECT * FROM commerce_media_networks.experiment\nWHERE experiment_status IS NOT NULL\n  AND\
      \ experiment_status NOT IN ('draft', 'running', 'completed', 'analyzed', 'archived')"
  - name: experiment_confidence_level_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Confidence level is a probability in [0,1].
    query: 'SELECT * FROM commerce_media_networks.experiment

      WHERE confidence_level IS NOT NULL AND confidence_level NOT BETWEEN 0 AND 1'
  - name: experiment_dates_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_dates_order
    query: 'SELECT * FROM commerce_media_networks.experiment

      WHERE start_date IS NOT NULL AND end_date IS NOT NULL AND end_date < start_date'
  - name: experiment_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_scd2_current_open
    query: "SELECT * FROM commerce_media_networks.experiment\nWHERE (is_current = true  AND effective_to_date\
      \ IS NOT NULL)\n   OR (is_current = false AND effective_to_date IS NULL)"
  - name: experiment_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: experiment_scd2_date_order
    query: 'SELECT * FROM commerce_media_networks.experiment

      WHERE effective_to_date IS NOT NULL AND effective_to_date <= effective_from_date'
