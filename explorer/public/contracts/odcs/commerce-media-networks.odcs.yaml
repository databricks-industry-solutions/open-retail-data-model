  - name: psd_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: psd_grain_unique
    query: SELECT product_store_day_id, COUNT(*) AS n FROM commerce_media_networks.product_store_day GROUP
      BY product_store_day_id HAVING COUNT(*) > 1
  - name: psd_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: psd_product_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.product_store_day f LEFT JOIN product.product p ON
      f.product_sk = p.product_sk WHERE f.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: psd_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: psd_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM commerce_media_networks.product_store_day
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: psd_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: psd_store_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.product_store_day f LEFT JOIN store.store d ON f.store_sk
      = d.store_sk WHERE f.store_sk IS NOT NULL AND d.store_sk IS NULL
