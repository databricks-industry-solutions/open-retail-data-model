- name: pacing_snapshot
  physicalName: commerce_media_networks.pacing_snapshot
  physicalType: table
  description: Commerce Media Networks — budget pacing snapshot fact (append-only operational state).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: pacing_snapshot_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: pacing_snapshot_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the snapshot.
  - name: campaign_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.campaign.campaign_sk.
    relationships:
    - to: campaign.campaign_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: campaign_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable campaign business key.
  - name: ad_group_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.ad_group.ad_group_sk (or NULL at campaign level).
    relationships:
    - to: ad_group.ad_group_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: ad_group_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable ad group business key.
  - name: placement_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.placement.placement_sk (or NULL).
    relationships:
    - to: placement.placement_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: placement_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable placement business key.
  - name: snapshot_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the pacing state was captured (UTC, ISO 8601).
  - name: snapshot_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the snapshot (cluster key).
  - name: daily_budget
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Daily budget target, in the reporting/base currency.
  - name: planned_spend_to_date
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Planned cumulative spend to date, in the reporting/base currency.
  - name: actual_spend_to_date
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Actual cumulative spend to date, in the reporting/base currency.
  - name: expected_spend_to_date
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Expected cumulative spend to date under the pacing curve.
  - name: projected_end_spend
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Projected total spend at window end, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Amount currency, ISO 4217 alpha-3 (single reporting currency).
  - name: pacing_ratio
    logicalType: number
    physicalType: DECIMAL(9,4)
    required: false
    description: actual_spend_to_date / planned_spend_to_date.
  - name: pacing_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Pacing state. Allowed values: on_track, under_pacing, over_pacing, exhausted.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: on_track, under_pacing, over_pacing, exhausted.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: fps_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fps_grain_unique
    query: SELECT pacing_snapshot_id, COUNT(*) AS n FROM commerce_media_networks.pacing_snapshot GROUP
      BY pacing_snapshot_id HAVING COUNT(*) > 1
  - name: fps_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fps_campaign_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.pacing_snapshot f LEFT JOIN commerce_media_networks.campaign
      c ON f.campaign_sk = c.campaign_sk WHERE f.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL
  - name: fps_pacing_ratio_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fps_pacing_ratio_nonnegative
    query: SELECT * FROM commerce_media_networks.pacing_snapshot WHERE pacing_ratio IS NOT NULL AND pacing_ratio
      < 0
  - name: fps_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fps_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM commerce_media_networks.pacing_snapshot
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: fps_ad_group_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fps_ad_group_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.pacing_snapshot f LEFT JOIN commerce_media_networks.ad_group
      d ON f.ad_group_sk = d.ad_group_sk WHERE f.ad_group_sk IS NOT NULL AND d.ad_group_sk IS NULL
  - name: fps_placement_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fps_placement_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.pacing_snapshot f LEFT JOIN commerce_media_networks.placement
      d ON f.placement_sk = d.placement_sk WHERE f.placement_sk IS NOT NULL AND d.placement_sk IS NULL
- name: placement
  physicalName: commerce_media_networks.placement
  physicalType: table
  description: ORDM Commerce Media Networks retail-media placement / inventory-surface dimension (SCD2).
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: placement_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version; the join/FK target.
  - name: placement_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the placement.
  - name: placement_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable placement / inventory-package name.
  - name: media_platform
    logicalType: string
    physicalType: STRING
    required: false
    description: Buying platform or ad network — the RMN tech platform such as Criteo or CitrusAd, or
      an offsite DSP such as DV360 or The Trade Desk. Coined qualified name; no IAB standard.
  - name: ad_product_line
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Retailer go-to-market ad-product packaging / inventory line, cf. common retail-media
      ad-product taxonomies. Distinct from delivery_channel (where it rendered), media_platform (where
      bought), and device_type. Allowed values: sponsored_products, onsite_display, offsite_display, email,
      loyalty.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: sponsored_products, onsite_display, offsite_display, email, loyalty.'
  - name: placement_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Fine on-page ad surface / slot (IAB Ad Placement). Allowed values: search, banner, product_listing,
      video, audio, endcap, shelf, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: search, banner, product_listing, video, audio, endcap, shelf, other.'
  - name: ad_format
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Accepted ad format. Allowed values: display, video, audio, native, sponsored_product,
      text.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: display, video, audio, native, sponsored_product, text.'
  - name: pricing_model
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How the surface is priced. Allowed values: cpc, cpm, cpa, flat, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: cpc, cpm, cpa, flat, other.'
  - name: device_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Device platform (OS/hardware) the surface targets. Allowed values: desktop, mobile,
      tablet, ctv, other. DOOH and in-store surfaces live on delivery_channel, not here.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: desktop, mobile, tablet, ctv, other.'
  - name: store_scope
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Store reach of the surface. Allowed values: all_stores, banner, region, single_store,
      online.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: all_stores, banner, region, single_store, online.'
  - name: sellable_capacity_qty
    logicalType: integer
    physicalType: INT
    required: false
    description: Sellable capacity for the surface, expressed in capacity_unit.
  - name: capacity_unit
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Unit of sellable_capacity_qty. Allowed values: impressions, slots, seconds, sov_pct.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: impressions, slots, seconds, sov_pct.'
  - name: page_or_zone_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Page location or in-store zone code the surface maps to (external natural code).
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this placement.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: placement_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_keys_not_null
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE placement_sk IS NULL OR placement_id\
      \ IS NULL\n   OR effective_from_date IS NULL OR is_current IS NULL"
  - name: placement_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_business_key_unique_current
    query: 'SELECT placement_id, COUNT(*) AS current_versions

      FROM commerce_media_networks.placement

      WHERE is_current = true

      GROUP BY placement_id

      HAVING COUNT(*) > 1'
  - name: placement_ad_product_line_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_ad_product_line_domain
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE ad_product_line IS NOT NULL\n  AND\
      \ ad_product_line NOT IN ('sponsored_products', 'onsite_display', 'offsite_display', 'email', 'loyalty')"
  - name: placement_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_type_domain
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE placement_type IS NOT NULL\n  AND placement_type\
      \ NOT IN ('search', 'banner', 'product_listing', 'video', 'audio', 'endcap', 'shelf', 'other')"
  - name: placement_ad_format_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_ad_format_domain
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE ad_format IS NOT NULL\n  AND ad_format\
      \ NOT IN ('display', 'video', 'audio', 'native', 'sponsored_product', 'text')"
  - name: placement_pricing_model_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_pricing_model_domain
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE pricing_model IS NOT NULL\n  AND pricing_model\
      \ NOT IN ('cpc', 'cpm', 'cpa', 'flat', 'other')"
  - name: placement_device_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_device_type_domain
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE device_type IS NOT NULL\n  AND device_type\
      \ NOT IN ('desktop', 'mobile', 'tablet', 'ctv', 'other')"
  - name: placement_store_scope_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_store_scope_domain
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE store_scope IS NOT NULL\n  AND store_scope\
      \ NOT IN ('all_stores', 'banner', 'region', 'single_store', 'online')"
  - name: placement_capacity_unit_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_capacity_unit_domain
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE capacity_unit IS NOT NULL\n  AND capacity_unit\
      \ NOT IN ('impressions', 'slots', 'seconds', 'sov_pct')"
  - name: placement_capacity_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_capacity_nonnegative
    query: 'SELECT * FROM commerce_media_networks.placement

      WHERE sellable_capacity_qty IS NOT NULL AND sellable_capacity_qty < 0'
  - name: placement_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_scd2_current_open
    query: "SELECT * FROM commerce_media_networks.placement\nWHERE (is_current = true  AND effective_to_date\
      \ IS NOT NULL)\n   OR (is_current = false AND effective_to_date IS NULL)"
  - name: placement_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: placement_scd2_date_order
    query: 'SELECT * FROM commerce_media_networks.placement

      WHERE effective_to_date IS NOT NULL AND effective_to_date <= effective_from_date'
