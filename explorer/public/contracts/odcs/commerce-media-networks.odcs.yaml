- name: campaign
  physicalName: commerce_media_networks.campaign
  physicalType: table
  description: ORDM Commerce Media Networks retail-media campaign dimension (SCD2). Conformed across the
    four retail-media briefs.
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: campaign_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version; the join/FK target.
  - name: campaign_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the campaign.
  - name: advertiser_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to advertiser.advertiser_sk (the advertiser running the campaign).
    relationships:
    - to: advertiser.advertiser_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: advertiser_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the advertiser (join on current advertiser version).
  - name: campaign_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable campaign name.
  - name: objective
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Primary campaign objective. Allowed values: awareness, consideration, conversion, loyalty,
      other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: awareness, consideration, conversion, loyalty, other.'
  - name: campaign_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle status. Allowed values: draft, active, paused, completed, archived.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: draft, active, paused, completed, archived.'
  - name: start_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Campaign flight start date, inclusive (ISO 8601).
  - name: end_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Campaign flight end date, inclusive (ISO 8601); NULL if open-ended.
  - name: budget_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Total campaign budget, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Budget currency, ISO 4217 alpha-3.
  - name: buy_model
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Pricing/buy model. Allowed values: cpc, cpm, cpa, flat, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: cpc, cpm, cpa, flat, other.'
  - name: attribution_model
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Attribution model applied to conversions. Allowed values: last_touch, first_touch, linear,
      position_based, data_driven.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: last_touch, first_touch, linear, position_based, data_driven.'
  - name: default_post_click_days
    logicalType: integer
    physicalType: INT
    required: false
    description: Default post-click attribution window in days (click lookback).
  - name: default_post_view_days
    logicalType: integer
    physicalType: INT
    required: false
    description: Default post-view attribution window in days (view lookback).
  - name: sales_metric_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Whether attributed sales are measured gross or net. Allowed values: gross, net.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: gross, net.'
  - name: supplier_visible_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if this campaign is visible to the supplier/advertiser in shared reporting.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this campaign.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: campaign_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_keys_not_null
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE campaign_sk IS NULL OR campaign_id IS\
      \ NULL\n   OR effective_from_date IS NULL OR is_current IS NULL"
  - name: campaign_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_business_key_unique_current
    query: 'SELECT campaign_id, COUNT(*) AS current_versions

      FROM commerce_media_networks.campaign

      WHERE is_current = true

      GROUP BY campaign_id

      HAVING COUNT(*) > 1'
  - name: campaign_advertiser_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every campaign must reference an existing advertiser (by surrogate FK).
    query: 'SELECT c.* FROM commerce_media_networks.campaign c

      LEFT JOIN commerce_media_networks.advertiser sb ON c.advertiser_sk = sb.advertiser_sk

      WHERE c.advertiser_sk IS NOT NULL AND sb.advertiser_sk IS NULL'
  - name: campaign_advertiser_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_advertiser_businesskey_orphan
    query: "SELECT c.* FROM commerce_media_networks.campaign c\nLEFT JOIN (SELECT DISTINCT advertiser_id\
      \ FROM commerce_media_networks.advertiser) sb\n  ON c.advertiser_id = sb.advertiser_id\nWHERE c.advertiser_id\
      \ IS NOT NULL AND sb.advertiser_id IS NULL"
  - name: campaign_objective_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_objective_domain
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE objective IS NOT NULL\n  AND objective\
      \ NOT IN ('awareness', 'consideration', 'conversion', 'loyalty', 'other')"
  - name: campaign_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_status_domain
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE campaign_status IS NOT NULL\n  AND campaign_status\
      \ NOT IN ('draft', 'active', 'paused', 'completed', 'archived')"
  - name: campaign_buy_model_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_buy_model_domain
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE buy_model IS NOT NULL\n  AND buy_model\
      \ NOT IN ('cpc', 'cpm', 'cpa', 'flat', 'other')"
  - name: campaign_attribution_model_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_attribution_model_domain
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE attribution_model IS NOT NULL\n  AND\
      \ attribution_model NOT IN ('last_touch', 'first_touch', 'linear', 'position_based', 'data_driven')"
  - name: campaign_sales_metric_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_sales_metric_type_domain
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE sales_metric_type IS NOT NULL\n  AND\
      \ sales_metric_type NOT IN ('gross', 'net')"
  - name: campaign_dates_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When both set, the flight end date must be on or after the start date.
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE start_date IS NOT NULL AND end_date\
      \ IS NOT NULL\n  AND end_date < start_date"
  - name: campaign_budget_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_budget_nonnegative
    query: 'SELECT * FROM commerce_media_networks.campaign

      WHERE budget_amount IS NOT NULL AND budget_amount < 0'
  - name: campaign_attribution_windows_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_attribution_windows_nonnegative
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE (default_post_click_days IS NOT NULL\
      \ AND default_post_click_days < 0)\n   OR (default_post_view_days  IS NOT NULL AND default_post_view_days\
      \  < 0)"
  - name: campaign_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_scd2_current_open
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE (is_current = true  AND effective_to_date\
      \ IS NOT NULL)\n   OR (is_current = false AND effective_to_date IS NULL)"
  - name: campaign_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: campaign_scd2_date_order
    query: "SELECT * FROM commerce_media_networks.campaign\nWHERE effective_to_date IS NOT NULL\n  AND\
      \ effective_to_date <= effective_from_date"
