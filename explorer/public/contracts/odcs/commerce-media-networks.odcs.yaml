        value: commerce_media_networks
      - property: enforced
        value: false
  - name: experiment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable experiment business key.
  - name: outcome_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the attributed conversion (cluster key).
  - name: attribution_model
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Model that credited this outcome. Allowed values: last_touch, first_touch, linear, position_based,
      data_driven.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: last_touch, first_touch, linear, position_based, data_driven.'
  - name: click_or_view_basis
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Whether credit was earned via a click or a view. Allowed values: click, view.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: click, view.'
  - name: post_click_days
    logicalType: integer
    physicalType: INT
    required: false
    description: Declared post-click attribution window applied (days).
  - name: post_view_days
    logicalType: integer
    physicalType: INT
    required: false
    description: Declared post-view attribution window applied (days).
  - name: attributed_fraction
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: Fractional credit assigned to this touchpoint in [0,1] (multi-touch splits).
  - name: gross_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Attributed gross sales, in the reporting/base currency.
  - name: net_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Attributed net sales, in the reporting/base currency.
  - name: margin_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Attributed gross margin, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Amount currency, ISO 4217 alpha-3 (single reporting currency).
  - name: units
    logicalType: integer
    physicalType: INT
    required: false
    description: Attributed units.
  - name: same_sku_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the sold product is the same SKU/parent family as the advertised product.
  - name: halo_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if a halo (same-brand/same-category) outcome per IAB, not same-SKU.
  - name: new_to_brand_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the customer is new to the brand within the lookback.
  - name: new_to_category_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the customer is new to the category within the lookback.
  - name: extrapolated_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the outcome is modeled/extrapolated rather than deterministically observed.
  - name: customer_key_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Hashed/tokenized customer identifier (PII, never raw).
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: consent_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Consent state for measurement. Allowed values: granted, denied, unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: granted, denied, unknown.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: fao_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_grain_unique
    query: SELECT attributed_outcome_id, COUNT(*) AS n FROM commerce_media_networks.attributed_outcome
      GROUP BY attributed_outcome_id HAVING COUNT(*) > 1
  - name: fao_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_campaign_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.campaign
      c ON f.campaign_sk = c.campaign_sk WHERE f.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL
  - name: fao_touch_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_touch_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.media_event
      m ON f.touch_media_event_sk = m.media_event_sk WHERE f.touch_media_event_sk IS NOT NULL AND m.media_event_sk
      IS NULL
  - name: fao_conversion_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The attributed conversion must resolve to a real conversion event: CVR denominators
      and multi-touch dedup (fao_fraction_sum, grouped on conversion_event_id) hinge on it.'
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.conversion_event
      ce ON f.conversion_event_sk = ce.conversion_event_sk WHERE f.conversion_event_sk IS NOT NULL AND
      ce.conversion_event_sk IS NULL
  - name: fao_fraction_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_fraction_range
    query: SELECT * FROM commerce_media_networks.attributed_outcome WHERE attributed_fraction IS NOT NULL
      AND attributed_fraction NOT BETWEEN 0 AND 1
  - name: fao_fraction_sum
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Multi-touch credit for one conversion must not over-attribute: the fractions for a given
      conversion under one attribution model sum to <= 1. Guarded on a linked conversion (un-linked rows
      carry a NULL conversion and are out of scope).'
    query: SELECT conversion_event_id, attribution_model, SUM(attributed_fraction) AS total_fraction FROM
      commerce_media_networks.attributed_outcome WHERE conversion_event_id IS NOT NULL AND attributed_fraction
      IS NOT NULL GROUP BY conversion_event_id, attribution_model HAVING SUM(attributed_fraction) > 1.001
  - name: fao_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM commerce_media_networks.attributed_outcome
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: fao_promotion_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_promotion_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN marketing.promotion
      p ON f.promo_sk = p.promo_sk WHERE f.promo_sk IS NOT NULL AND p.promo_sk IS NULL
  - name: fao_ad_group_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_ad_group_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.ad_group
      d ON f.ad_group_sk = d.ad_group_sk WHERE f.ad_group_sk IS NOT NULL AND d.ad_group_sk IS NULL
  - name: fao_creative_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_creative_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.creative
      d ON f.creative_sk = d.creative_sk WHERE f.creative_sk IS NOT NULL AND d.creative_sk IS NULL
  - name: fao_placement_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_placement_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.placement
      d ON f.placement_sk = d.placement_sk WHERE f.placement_sk IS NOT NULL AND d.placement_sk IS NULL
  - name: fao_advertiser_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_advertiser_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.advertiser
      d ON f.advertiser_sk = d.advertiser_sk WHERE f.advertiser_sk IS NOT NULL AND d.advertiser_sk IS
      NULL
  - name: fao_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_product_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN product.product d ON
      f.product_sk = d.product_sk WHERE f.product_sk IS NOT NULL AND d.product_sk IS NULL
  - name: fao_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_store_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN store.store d ON f.store_sk
      = d.store_sk WHERE f.store_sk IS NOT NULL AND d.store_sk IS NULL
  - name: fao_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_profile_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN customer.profile d ON
      f.profile_sk = d.profile_sk WHERE f.profile_sk IS NOT NULL AND d.profile_sk IS NULL
  - name: fao_experiment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_experiment_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.experiment
      d ON f.experiment_sk = d.experiment_sk WHERE f.experiment_sk IS NOT NULL AND d.experiment_sk IS
      NULL
  - name: fao_keyword_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fao_keyword_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.attributed_outcome f LEFT JOIN commerce_media_networks.keyword
      d ON f.keyword_sk = d.keyword_sk WHERE f.keyword_sk IS NOT NULL AND d.keyword_sk IS NULL
