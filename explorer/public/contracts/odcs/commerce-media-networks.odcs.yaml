    physicalType: STRING
    required: false
    description: 'Primary outcome measured. Allowed values: incremental_sales, incremental_units, roas,
      conversion_rate, reach, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: incremental_sales, incremental_units, roas, conversion_rate, reach,
