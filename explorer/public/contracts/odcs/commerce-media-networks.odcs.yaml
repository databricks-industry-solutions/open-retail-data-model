    required: false
    description: Durable product business key; ALL when not applicable.
  - name: snapshot_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Measurement snapshot date (cluster key).
  - name: metric_name
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Metric evaluated. Allowed values: incremental_sales, incremental_units, roas, conversion_rate,
      reach.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: incremental_sales, incremental_units, roas, conversion_rate, reach.'
  - name: analysis_level
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Slice level of the result. Allowed values: overall, store, geo, product, category, vendor.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: overall, store, geo, product, category, vendor.'
  - name: observed_treatment_value
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Observed metric value in the treatment cell.
  - name: observed_control_value
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Observed metric value in the control cell.
  - name: counterfactual_value
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Estimated counterfactual (what treatment would have been without media).
  - name: incremental_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Incremental sales, in the reporting/base currency.
  - name: incremental_margin_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Incremental margin, in the reporting/base currency.
  - name: media_spend_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Media spend attributed to the treatment, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Amount currency, ISO 4217 alpha-3 (single reporting currency).
  - name: lift_pct
    logicalType: number
    physicalType: DECIMAL(9,4)
    required: false
    description: Relative lift of treatment over control, percent.
  - name: iroas_value
    logicalType: number
    physicalType: DECIMAL(12,4)
    required: false
    description: Incremental ROAS = incremental_sales / media_spend.
  - name: confidence_level_pct
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Confidence level of the interval, percent (e.g. 95.00).
  - name: ci_lower_value
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Lower bound of the confidence interval for the estimate.
  - name: ci_upper_value
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Upper bound of the confidence interval for the estimate.
  - name: p_value
    logicalType: number
    physicalType: DECIMAL(9,6)
    required: false
    description: p-value of the treatment-vs-control test.
  - name: statistical_significance_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the result is statistically significant at the confidence level.
  - name: sample_size_treatment
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Treatment-cell sample size.
  - name: sample_size_control
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Control-cell sample size.
  - name: methodology
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Causal method used. Allowed values: randomized_control, matched_market, synthetic_control,
      difference_in_differences, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: randomized_control, matched_market, synthetic_control, difference_in_differences,
        other.'
  - name: suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if suppressed for disclosure (below threshold / policy).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: fir_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_grain_unique
    query: SELECT incrementality_result_id, COUNT(*) AS n FROM commerce_media_networks.incrementality_result
      GROUP BY incrementality_result_id HAVING COUNT(*) > 1
  - name: fir_experiment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_experiment_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.incrementality_result f LEFT JOIN commerce_media_networks.experiment
      e ON f.experiment_sk = e.experiment_sk WHERE f.experiment_sk IS NOT NULL AND e.experiment_sk IS
      NULL
  - name: fir_p_value_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_p_value_range
    query: SELECT * FROM commerce_media_networks.incrementality_result WHERE p_value IS NOT NULL AND p_value
      NOT BETWEEN 0 AND 1
  - name: fir_confidence_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_confidence_range
    query: SELECT * FROM commerce_media_networks.incrementality_result WHERE confidence_level_pct IS NOT
      NULL AND confidence_level_pct NOT BETWEEN 0 AND 100
  - name: fir_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM commerce_media_networks.incrementality_result
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: fir_treatment_cell_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_treatment_cell_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.incrementality_result f LEFT JOIN commerce_media_networks.experiment_cell
      d ON f.treatment_cell_sk = d.experiment_cell_sk WHERE f.treatment_cell_sk IS NOT NULL AND d.experiment_cell_sk
      IS NULL
  - name: fir_control_cell_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_control_cell_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.incrementality_result f LEFT JOIN commerce_media_networks.experiment_cell
      d ON f.control_cell_sk = d.experiment_cell_sk WHERE f.control_cell_sk IS NOT NULL AND d.experiment_cell_sk
      IS NULL
  - name: fir_campaign_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_campaign_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.incrementality_result f LEFT JOIN commerce_media_networks.campaign
      d ON f.campaign_sk = d.campaign_sk WHERE f.campaign_sk IS NOT NULL AND d.campaign_sk IS NULL
  - name: fir_advertiser_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_advertiser_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.incrementality_result f LEFT JOIN commerce_media_networks.advertiser
      d ON f.advertiser_sk = d.advertiser_sk WHERE f.advertiser_sk IS NOT NULL AND d.advertiser_sk IS
      NULL
  - name: fir_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fir_product_fk_orphan
    query: SELECT f.* FROM commerce_media_networks.incrementality_result f LEFT JOIN product.product d
      ON f.product_sk = d.product_sk WHERE f.product_sk IS NOT NULL AND d.product_sk IS NULL
- name: keyword
  physicalName: commerce_media_networks.keyword
  physicalType: table
  description: ORDM Commerce Media Networks retail-media keyword (search-targeting) dimension (SCD2).
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: keyword_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version; the join/FK target.
  - name: keyword_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the keyword.
  - name: ad_group_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to ad_group.ad_group_sk (the ad group this keyword belongs to).
    relationships:
    - to: ad_group.ad_group_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: ad_group_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the parent ad group (join on current ad_group version).
  - name: keyword_text
    logicalType: string
    physicalType: STRING
    required: false
    description: The bid keyword / targeting term (vendor-neutral; not a shopper PII value).
  - name: match_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How the keyword matches queries. Allowed values: exact, phrase, broad, negative.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: exact, phrase, broad, negative.'
  - name: keyword_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle status. Allowed values: active, paused, archived.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, paused, archived.'
  - name: is_negative_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE for a negative keyword (excludes matching queries rather than bidding on them).
  - name: bid_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Keyword-level bid, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Bid currency, ISO 4217 alpha-3.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this keyword.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: keyword_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_keys_not_null
    query: "SELECT * FROM commerce_media_networks.keyword\nWHERE keyword_sk IS NULL OR keyword_id IS NULL\n\
      \   OR effective_from_date IS NULL OR is_current IS NULL"
  - name: keyword_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_business_key_unique_current
    query: 'SELECT keyword_id, COUNT(*) AS current_versions

      FROM commerce_media_networks.keyword

      WHERE is_current = true

      GROUP BY keyword_id

      HAVING COUNT(*) > 1'
  - name: keyword_ad_group_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_ad_group_fk_orphan
    query: 'SELECT k.* FROM commerce_media_networks.keyword k

      LEFT JOIN commerce_media_networks.ad_group ag ON k.ad_group_sk = ag.ad_group_sk

      WHERE k.ad_group_sk IS NOT NULL AND ag.ad_group_sk IS NULL'
  - name: keyword_ad_group_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_ad_group_businesskey_orphan
    query: "SELECT k.* FROM commerce_media_networks.keyword k\nLEFT JOIN (SELECT DISTINCT ad_group_id\
      \ FROM commerce_media_networks.ad_group) ag\n  ON k.ad_group_id = ag.ad_group_id\nWHERE k.ad_group_id\
      \ IS NOT NULL AND ag.ad_group_id IS NULL"
  - name: keyword_match_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_match_type_domain
    query: "SELECT * FROM commerce_media_networks.keyword\nWHERE match_type IS NOT NULL\n  AND match_type\
      \ NOT IN ('exact', 'phrase', 'broad', 'negative')"
  - name: keyword_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_status_domain
    query: "SELECT * FROM commerce_media_networks.keyword\nWHERE keyword_status IS NOT NULL\n  AND keyword_status\
      \ NOT IN ('active', 'paused', 'archived')"
  - name: keyword_bid_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_bid_nonnegative
    query: 'SELECT * FROM commerce_media_networks.keyword

      WHERE bid_amount IS NOT NULL AND bid_amount < 0'
  - name: keyword_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_scd2_current_open
    query: "SELECT * FROM commerce_media_networks.keyword\nWHERE (is_current = true  AND effective_to_date\
      \ IS NOT NULL)\n   OR (is_current = false AND effective_to_date IS NULL)"
  - name: keyword_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: keyword_scd2_date_order
    query: 'SELECT * FROM commerce_media_networks.keyword

      WHERE effective_to_date IS NOT NULL AND effective_to_date <= effective_from_date'
- name: media_event
  physicalName: commerce_media_networks.media_event
  physicalType: table
  description: Commerce Media Networks — conformed retail-media delivery/engagement event fact (append-only).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/commerce-media-networks/README.md
    type: businessDefinition
  - url: outcome-packages/commerce-media-networks/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: media_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: media_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the media event.
  - name: campaign_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.campaign.campaign_sk.
    relationships:
    - to: campaign.campaign_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: campaign_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable campaign business key.
  - name: ad_group_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.ad_group.ad_group_sk.
    relationships:
    - to: ad_group.ad_group_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: ad_group_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable ad group business key.
  - name: creative_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.creative.creative_sk.
    relationships:
    - to: creative.creative_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: creative_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable creative business key.
  - name: placement_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.placement.placement_sk.
    relationships:
    - to: placement.placement_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: placement_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable placement business key.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk (the advertised/served product), if applicable.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk (in-store playout location), if applicable.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk (the resolved exposed customer), if known.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable customer business key (pseudonymous).
  - name: delivery_channel_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to cmn.delivery_channel.delivery_channel_sk (coarse channel the exposure occurred
      in).
    relationships:
    - to: delivery_channel.delivery_channel_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: commerce_media_networks
      - property: enforced
        value: false
  - name: delivery_channel_id
    logicalType: string
    physicalType: STRING
    required: false
