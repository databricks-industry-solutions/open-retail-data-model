    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk (version-specific).
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: oos_start_date_key
    logicalType: date
    physicalType: DATE
    required: true
    description: First day of the OOS episode.
  - name: oos_end_date_key
    logicalType: date
    physicalType: DATE
    required: false
    description: Last day of the episode; NULL if ongoing.
  - name: oos_duration_days
    logicalType: integer
    physicalType: INT
    required: false
    description: Duration of the episode in days.
  - name: detection_method
    logicalType: string
    physicalType: STRING
    required: true
    description: 'How detected. Allowed values: inventory_snapshot, velocity_collapse, pos_absence, smart_shelf,
      planner_reported.'
  - name: oos_cause
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Root cause. Allowed values: replenishment_miss, supplier_delay, demand_spike, allocation_shortage,
      planogram_issue, phantom_stock, record_inaccuracy, shrinkage, misplaced, unknown. The phantom_stock/record_inaccuracy/shrinkage/misplaced
      values capture on-shelf-availability gaps where system on-hand > 0 but the shelf is empty (the dominant
      real-world OOS driver); populated only where a shelf/OSA signal exists, else system-availability
      causes apply.'
  - name: oos_severity
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Severity. Allowed values: critical, high, medium, low.'
  - name: is_promo_period
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Whether a promotion overlapped the episode.
  - name: stockout_pct_total
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Average stockout_pct_day over the episode.
  - name: competitor_spillover_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Competitor stockout spillover detected.
  - name: data_quality_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Suspected data quality issue.
  - name: is_preventable
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Whether the OOS was preventable.
  - name: linked_disruption_event_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Degenerate reference to early-risk-detection disruption_event.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: oos_event_dates
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_event_dates
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.oos_event

      WHERE oos_end_date_key IS NOT NULL AND oos_end_date_key < oos_start_date_key'
  - name: oos_event_duration_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When both dates are present, stored duration must match the date span (inclusive).
    query: "SELECT * FROM smarter_demand_and_inventory_decisions.oos_event\nWHERE oos_end_date_key IS\
      \ NOT NULL AND oos_duration_days IS NOT NULL\n  AND oos_duration_days <> DATEDIFF(oos_end_date_key,\
      \ oos_start_date_key) + 1"
  - name: oos_event_stockout_pct_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_event_stockout_pct_range
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.oos_event

      WHERE stockout_pct_total IS NOT NULL AND stockout_pct_total NOT BETWEEN 0 AND 1'
  - name: oos_event_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_event_product_fk_orphan
    query: 'SELECT oe.* FROM smarter_demand_and_inventory_decisions.oos_event oe

      LEFT JOIN product.product p ON p.product_sk = oe.product_sk

      WHERE oe.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: oos_event_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_event_store_fk_orphan
    query: 'SELECT oe.* FROM smarter_demand_and_inventory_decisions.oos_event oe

      LEFT JOIN store.store st ON st.store_sk = oe.store_sk

      WHERE oe.store_sk IS NOT NULL AND st.store_sk IS NULL'
  - name: oos_event_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_event_grain_unique
    query: 'SELECT oos_event_id FROM smarter_demand_and_inventory_decisions.oos_event

      GROUP BY oos_event_id HAVING COUNT(*) > 1'
  - name: oos_event_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: oos_event_rowcount
    query: SELECT COUNT(*) AS oos_event_rows FROM smarter_demand_and_inventory_decisions.oos_event
- name: oos_recovery_action
  physicalName: smarter_demand_and_inventory_decisions.oos_recovery_action
  physicalType: table
  description: Recovery actions recommended or executed for OOS events.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/smarter-demand-and-inventory-decisions/README.md
    type: businessDefinition
  - url: outcome-packages/smarter-demand-and-inventory-decisions/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: oos_recovery_action_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: oos_recovery_action_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key.
  - name: oos_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to oos_event.oos_event_sk.
    relationships:
    - to: oos_event.oos_event_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: smarter_demand_and_inventory_decisions
      - property: enforced
        value: false
  - name: oos_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable OOS event business key.
  - name: action_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Action type. Allowed values: emergency_order, transfer, allocation_shift, substitute_product,
      expedite_shipment.'
  - name: recommended_quantity
    logicalType: number
    physicalType: DECIMAL(12,3)
    required: false
    description: Recommended recovery quantity.
  - name: recommended_action_date_key
    logicalType: date
    physicalType: DATE
    required: false
    description: Recommended action date.
  - name: estimated_recovery_date_key
    logicalType: date
    physicalType: DATE
    required: false
    description: Estimated recovery date.
  - name: estimated_revenue_recovery
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Estimated revenue recovery, in the reporting/base currency.
  - name: estimated_margin_recovery
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Estimated GROSS-MARGIN recovery, in the reporting/base currency. Prioritizing by margin
      (not revenue) avoids over-ranking low-margin high-revenue SKUs.
  - name: recoverability_probability
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Probability the recovery action succeeds within the horizon (0-1). Used with estimated_margin_recovery
      for expected-value ranking.
  - name: actual_revenue_recovered
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Realized revenue recovery after execution (NULL until measured); closes the estimate-vs-actual
      learn loop.
  - name: time_to_recover_days
    logicalType: integer
    physicalType: INT
    required: false
    description: Days from recommended_action_date_key to observed recovery; NULL until recovered.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Reporting/base currency of ALL monetary columns, ISO 4217 alpha-3. Equals the deploy
      base_currency; single-currency by construction.
  - name: action_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Status. Allowed values: recommended, approved, executed, rejected.'
  - name: inventory_recommendation_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to inventory_recommendation.inventory_recommendation_sk.
    relationships:
    - to: inventory_recommendation.inventory_recommendation_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: smarter_demand_and_inventory_decisions
      - property: enforced
        value: false
  - name: inventory_recommendation_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable inventory recommendation business key.
  - name: linked_po_line_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to purchase_order_line.po_line_sk when PO created.
    relationships:
    - to: purchase_order_line.po_line_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: procurement
      - property: enforced
        value: false
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: oos_recovery_recoverability_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_recovery_recoverability_range
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.oos_recovery_action

      WHERE recoverability_probability IS NOT NULL AND recoverability_probability NOT BETWEEN 0 AND 1'
  - name: oos_recovery_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_recovery_single_currency
    query: 'SELECT 1 FROM smarter_demand_and_inventory_decisions.oos_recovery_action

      HAVING COUNT(DISTINCT currency_code) > 1 OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >
      0'
  - name: oos_recovery_action_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_recovery_action_fk_orphan
    query: 'SELECT ora.* FROM smarter_demand_and_inventory_decisions.oos_recovery_action ora

      LEFT JOIN smarter_demand_and_inventory_decisions.oos_event oe ON oe.oos_event_sk = ora.oos_event_sk

      WHERE ora.oos_event_sk IS NOT NULL AND oe.oos_event_sk IS NULL'
  - name: oos_recovery_action_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: oos_recovery_action_grain_unique
    query: 'SELECT oos_recovery_action_id FROM smarter_demand_and_inventory_decisions.oos_recovery_action

      GROUP BY oos_recovery_action_id HAVING COUNT(*) > 1'
