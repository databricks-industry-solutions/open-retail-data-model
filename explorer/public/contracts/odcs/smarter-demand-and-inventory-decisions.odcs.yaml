      - forecast_unit
    description: Planning unit business key.
  - name: forecast_date_key
    logicalType: date
    businessName: Forecast Date
    customProperties:
    - property: synonyms
      value:
      - period
      - forecast_period
      - week
    description: Forecast period.
  - name: grain_type
    logicalType: string
    businessName: Planning Grain
    customProperties:
    - property: synonyms
      value:
      - planning_grain
      - grain
      - hierarchy_level
    description: Planning grain of the unit (store_sku, dc_product, account_product_region). Filter to
      ONE grain before aggregating measures to avoid cross-grain double-counting.
  - name: abc_class
    logicalType: string
    businessName: ABC Class
    customProperties:
    - property: synonyms
      value:
      - volume_tier
      - abc
    description: Volume tier A/B/C.
  - name: xyz_class
    logicalType: string
    businessName: XYZ Class
    customProperties:
    - property: synonyms
      value:
      - variability_tier
      - xyz
    description: Variability tier X/Y/Z.
  - name: wmape
    logicalType: number
    businessName: WMAPE
    customProperties:
    - property: synonyms
      value:
      - weighted_mape
      - error_rate
      - wape
    description: 'Weighted mean absolute percentage error: SUM(|actual - forecast|) / SUM(|actual|). The
      retail-standard volume-weighted error; well-defined when individual actuals are zero, unlike per-row
      MAPE.'
  - name: accuracy_pct
    logicalType: number
    businessName: Accuracy %
    customProperties:
    - property: synonyms
      value:
      - forecast_accuracy
      - fit
    description: Volume-weighted forecast accuracy (1 - WMAPE), 0-1.
  - name: weighted_bias_pct
    logicalType: number
    businessName: Weighted Bias %
    customProperties:
    - property: synonyms
      value:
      - forecast_bias
      - weighted_bias
      - bias_pct
    description: 'Volume-weighted forecast bias: SUM(forecast - actual) / SUM(actual), a 0-1 fraction.
      Positive = over-forecast (excess inventory), negative = under-forecast (stockout risk). Named weighted_bias_pct
      (not bias_pct) to avoid the same-name/different-scale collision with forecast_accuracy.bias_pct,
      which is whole percentage points.'
  - name: planning_unit_count
    logicalType: integer
    businessName: Planning Unit Count
    customProperties:
    - property: synonyms
      value:
      - dfu_count
      - unit_count
    description: Number of distinct planning units evaluated.
