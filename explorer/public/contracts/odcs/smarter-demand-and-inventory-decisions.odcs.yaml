- name: gold_service_level_attainment
  physicalName: smarter_demand_and_inventory_decisions.gold_service_level_attainment
  physicalType: view
  description: 'ACHIEVED service level vs TARGET, per store x category x fiscal week. Review finding A2
    noted the package modeled only service-level TARGETS and never measured attainment, despite inventory_position.is_stockout
    / stockout_pct_day being available in core. This computes two attained measures with distinct, correctly-labelled
    definitions (they are NOT interchangeable): - attained_in_stock_rate = 1 - (stockout SKU-days / total
    SKU-days) A TIME-based measure: the share of SKU-days fully in stock. Answers "how often were we in
    stock", not "how much demand did we meet". - attained_fill_rate     = units_sold / (units_sold + lost_units)
    A true DEMAND-weighted (Type II / beta) fill rate: units met divided by units demanded, where unmet
    demand is the censoring-aware lost_units from lost_sales_estimate (NOT the stockout-constrained actual).
    This is the correct like-for-like counterpart to a fill_rate target — an earlier draft used 1 - SUM(stockout_pct_day)/SKU-days,
    which is a second TIME-based availability measure with no demand in the denominator, so differencing
    it against a Type-II target was the very A2 conflation this view exists to avoid. Ratios are computed
    as ratio-of-sums (not a mean of per-row rates).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/smarter-demand-and-inventory-decisions/README.md
    type: businessDefinition
  - url: outcome-packages/smarter-demand-and-inventory-decisions/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: category
    logicalType: string
    physicalType: STRING
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
  - name: total_sku_days
    logicalType: integer
    physicalType: BIGINT
  - name: stockout_sku_days
    logicalType: integer
    physicalType: BIGINT
  - name: units_sold
    logicalType: integer
    physicalType: BIGINT
  - name: lost_units
    logicalType: number
    physicalType: DECIMAL(12, 3)
  - name: attained_in_stock_rate
    logicalType: number
    physicalType: DOUBLE
    description: 'Time-based availability: 1 - stockout SKU-days / total SKU-days.'
  - name: attained_fill_rate
    logicalType: number
    physicalType: DOUBLE
    description: 'Demand-weighted (Type II) fill rate: units sold / (units sold + censoring-aware lost
      units).'
  - name: target_measure_type
    logicalType: string
    physicalType: STRING
  - name: target_service_level_pct
    logicalType: number
    physicalType: DECIMAL(5, 4)
    description: Target from the DEFAULT segment only (abc_class/xyz_class NULL); NOT the per-ABC/XYZ
      segment target. Segment-specific attainment is a documented follow-up.
  - name: gap_measure_type
    logicalType: string
    physicalType: STRING
  - name: gap_is_approximate
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when service_level_gap_to_target differences a cycle_service_level target (per-cycle
      probability) against the time-based attained_in_stock_rate proxy; FALSE when the target and attained
      measure are the same unit.
  - name: service_level_gap_to_target
    logicalType: number
    physicalType: DECIMAL(5, 4)
    description: Attained minus target on the target measure type. Exact for fill_rate/in_stock_rate;
      for a cycle_service_level target it is an approximation (per-cycle probability vs the time-based
      in-stock rate) — see gap_is_approximate. Uses the default segment target, so read as an enterprise-default
      gap, not a segment-accurate one.
- name: mv_forecast_accuracy
  physicalName: smarter_demand_and_inventory_decisions.mv_forecast_accuracy
  physicalType: view
  description: 'Forecast accuracy by planning unit and ABC/XYZ segment. Error KPIs (WMAPE, bias) are volume-weighted
    ratios of sums, the retail-standard convention — not a mean of per-row percentages. IMPORTANT: filter
    to a single grain_type when a deployment populates more than one planning grain (e.g. store_sku AND
    dc_product), otherwise measures sum across overlapping grains and double-count.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/smarter-demand-and-inventory-decisions/README.md
    type: businessDefinition
  - url: outcome-packages/smarter-demand-and-inventory-decisions/glossary.md
