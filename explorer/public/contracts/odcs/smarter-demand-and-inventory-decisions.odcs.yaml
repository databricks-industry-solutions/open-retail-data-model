- name: lost_sales_estimate
  physicalName: smarter_demand_and_inventory_decisions.lost_sales_estimate
  physicalType: table
  description: Daily lost sales estimate within an OOS episode.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/smarter-demand-and-inventory-decisions/README.md
    type: businessDefinition
  - url: outcome-packages/smarter-demand-and-inventory-decisions/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: lost_sales_estimate_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: lost_sales_estimate_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key.
  - name: oos_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to oos_event.oos_event_sk.
    relationships:
    - to: oos_event.oos_event_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: smarter_demand_and_inventory_decisions
      - property: enforced
        value: false
  - name: oos_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable OOS event business key.
  - name: estimate_date_key
    logicalType: date
    physicalType: DATE
    required: true
    description: Day within the OOS episode.
  - name: actual_units_sold
    logicalType: integer
    physicalType: INT
    required: false
    description: Actual units sold from sales.
  - name: expected_units_demand
    logicalType: number
    physicalType: DECIMAL(12,3)
    required: false
    description: Expected unconstrained demand.
  - name: lost_units
    logicalType: number
    physicalType: DECIMAL(12,3)
    required: false
    description: Estimated lost units.
  - name: estimation_method
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Method. Allowed values: forecast_residual, trailing_average, peer_store, ml_model.'
  - name: censoring_adjusted
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when forecast excludes stockout days.
  - name: lost_revenue
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Estimated lost revenue, in the reporting/base currency.
  - name: lost_margin
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Estimated lost GROSS MARGIN (lost_units x (list_price - unit_cost)), in the reporting/base
      currency. Margin, not revenue, is the correct basis for prioritizing recovery.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Reporting/base currency of ALL monetary columns, ISO 4217 alpha-3. Equals the deploy
      base_currency; single-currency by construction.
  - name: confidence_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Confidence score 0-1.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: lost_sales_non_negative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: lost_sales_non_negative
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.lost_sales_estimate

      WHERE lost_units < 0'
  - name: lost_sales_confidence_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: confidence_score is documented as 0-1.
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.lost_sales_estimate

      WHERE confidence_score IS NOT NULL AND confidence_score NOT BETWEEN 0 AND 1'
  - name: lost_sales_not_exceeding_demand
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Lost units cannot exceed expected unconstrained demand for the day.
    query: "SELECT * FROM smarter_demand_and_inventory_decisions.lost_sales_estimate\nWHERE lost_units\
      \ IS NOT NULL AND expected_units_demand IS NOT NULL\n  AND lost_units > expected_units_demand"
  - name: lost_sales_margin_non_negative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: lost_sales_margin_non_negative
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.lost_sales_estimate

      WHERE lost_margin IS NOT NULL AND lost_margin < 0'
  - name: lost_sales_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: lost_sales_single_currency
    query: 'SELECT 1 FROM smarter_demand_and_inventory_decisions.lost_sales_estimate

      HAVING COUNT(DISTINCT currency_code) > 1 OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >
      0'
  - name: lost_sales_estimate_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: lost_sales_estimate_fk_orphan
    query: 'SELECT lse.* FROM smarter_demand_and_inventory_decisions.lost_sales_estimate lse

      LEFT JOIN smarter_demand_and_inventory_decisions.oos_event oe ON oe.oos_event_sk = lse.oos_event_sk

      WHERE lse.oos_event_sk IS NOT NULL AND oe.oos_event_sk IS NULL'
  - name: lost_sales_estimate_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: lost_sales_estimate_grain_unique
    query: 'SELECT lost_sales_estimate_id FROM smarter_demand_and_inventory_decisions.lost_sales_estimate

      GROUP BY lost_sales_estimate_id HAVING COUNT(*) > 1'
  - name: lost_sales_revenue_total
    type: sql
    dimension: accuracy
    severity: info
    description: lost_sales_revenue_total
    query: SELECT COALESCE(SUM(lost_revenue), 0) AS total_lost_revenue FROM smarter_demand_and_inventory_decisions.lost_sales_estimate
- name: oos_event
  physicalName: smarter_demand_and_inventory_decisions.oos_event
  physicalType: table
