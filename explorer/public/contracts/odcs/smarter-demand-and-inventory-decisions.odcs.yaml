- name: gold_inventory_productivity
  physicalName: smarter_demand_and_inventory_decisions.gold_inventory_productivity
  physicalType: view
  description: 'Inventory PRODUCTIVITY metrics (review finding A17: turnover, weeks-of-cover, GMROI, sell-through
    were entirely absent - the package reported tied-up value but never productivity). Aggregated per
    category x ABC class over a trailing window, all as ratio-of-sums: - inventory_turnover = trailing
    COGS / average inventory value (annualized) - weeks_of_cover     = average inventory units / avg weekly
    sell rate - sell_through_rate  = units sold / (units sold + avg inventory units) - gmroi              =
    annualized gross margin / average inventory cost (gross margin = realized net_revenue - COGS) Revenue
    is the sales fact''s realized net_revenue (after discount), so promo-driven margin erosion is reflected
    rather than hidden by a list-price reconstruction.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/smarter-demand-and-inventory-decisions/README.md
    type: businessDefinition
  - url: outcome-packages/smarter-demand-and-inventory-decisions/glossary.md
