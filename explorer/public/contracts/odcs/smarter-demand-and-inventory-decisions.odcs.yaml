  properties:
  - name: service_level_target_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: service_level_target_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key.
  - name: abc_class
    logicalType: string
    physicalType: STRING
    required: false
    description: ABC class filter; NULL = default for all.
  - name: xyz_class
    logicalType: string
    physicalType: STRING
    required: false
    description: XYZ class filter; NULL = default for all.
  - name: service_measure_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Which service definition target_service_level_pct expresses. Allowed values: cycle_service_level
      (Type I / alpha - probability of no stockout per cycle, maps directly to the safety-stock z-score),
      fill_rate (Type II / beta - fraction of demand met from stock, requires the unit-normal loss function),
      in_stock_rate (share of time in stock). These are NOT interchangeable; conflating them mis-sizes
      safety stock.'
  - name: target_service_level_pct
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Target service level (0-1) interpreted per service_measure_type.
  - name: target_fill_rate_pct
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Target in-stock fill rate (0-1). Retained for backward compatibility; prefer service_measure_type
      = fill_rate with target_service_level_pct.
  - name: target_days_of_supply
    logicalType: number
    physicalType: DECIMAL(8,2)
    required: false
    description: Target days of supply alternative.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Inclusive start date for this version.
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Exclusive end date; NULL for current.
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether this is the current version.
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When created (UTC).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When last modified (UTC).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: service_level_target_current_single
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: At most one current version per (abc_class, xyz_class) segment; NULL segments are the
      default, compared with null-safe equality.
    query: 'SELECT abc_class, xyz_class, COUNT(*) AS cnt

      FROM smarter_demand_and_inventory_decisions.service_level_target

      WHERE is_current = TRUE

      GROUP BY abc_class, xyz_class

      HAVING COUNT(*) > 1'
  - name: service_level_target_noncurrent_closed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: service_level_target_noncurrent_closed
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.service_level_target

      WHERE is_current = FALSE AND effective_to_date IS NULL'
  - name: service_level_target_effective_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: service_level_target_effective_order
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.service_level_target

      WHERE effective_to_date IS NOT NULL AND effective_to_date < effective_from_date'
  - name: service_level_target_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: service_level_target_grain_unique
    query: 'SELECT service_level_target_id FROM smarter_demand_and_inventory_decisions.service_level_target

      GROUP BY service_level_target_id HAVING COUNT(*) > 1'
- name: service_level_z
  physicalName: smarter_demand_and_inventory_decisions.service_level_z
  physicalType: table
  description: Service-level to z-score and unit-normal loss lookup for safety-stock sizing.
  tags:
  - reference
  authoritativeDefinitions:
  - url: outcome-packages/smarter-demand-and-inventory-decisions/README.md
    type: businessDefinition
  - url: outcome-packages/smarter-demand-and-inventory-decisions/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: service_level_z_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: service_level_z_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key (service level as basis points, e.g. SLZ-9500).
  - name: service_level_pct
    logicalType: number
    physicalType: DECIMAL(6,5)
    required: true
    description: Cycle service level / non-stockout probability (0-1).
  - name: z_score
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Inverse standard-normal quantile for service_level_pct (safety factor).
  - name: loss_function_l_z
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Standard-normal unit loss integral L(z) = phi(z) - z*(1-Phi(z)); used for fill-rate (Type
      II) sizing.
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: service_level_z_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: service_level_z_grain_unique
    query: 'SELECT service_level_z_id FROM smarter_demand_and_inventory_decisions.service_level_z

      GROUP BY service_level_z_id HAVING COUNT(*) > 1'
  - name: service_level_z_pct_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: service_level_z_pct_range
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.service_level_z

      WHERE service_level_pct NOT BETWEEN 0 AND 1'
  - name: service_level_z_score_valid
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: z_score is multiplied directly into every safety-stock recommendation, so a NULL or negative
      seeded value silently mis-sizes stock. A standard-normal quantile at a service level >= 0.5 is non-negative.
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.service_level_z

      WHERE z_score IS NULL OR z_score < 0'
