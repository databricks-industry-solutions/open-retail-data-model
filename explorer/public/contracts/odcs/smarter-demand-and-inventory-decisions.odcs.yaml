    logicalType: integer
    physicalType: INT
    required: false
    description: Review period for periodic review policies.
  - name: lead_time_days
    logicalType: integer
    physicalType: INT
    required: false
    description: Default lead time in days.
  - name: service_level_target_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to service_level_target.service_level_target_sk.
    relationships:
    - to: service_level_target.service_level_target_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: smarter_demand_and_inventory_decisions
      - property: enforced
        value: false
  - name: service_level_target_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable service level target business key.
  - name: policy_source
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Origin. Allowed values: system_calculated, planner_override, abc_xyz_template.'
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Inclusive start date for this version.
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Exclusive end date; NULL for current.
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: Whether this is the current version.
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When created (UTC).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When last modified (UTC).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: inventory_policy_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inventory_policy_current_open
    query: 'SELECT planning_unit_sk, COUNT(*) AS cnt

      FROM smarter_demand_and_inventory_decisions.inventory_policy

      WHERE is_current = TRUE

      GROUP BY planning_unit_sk

      HAVING COUNT(*) > 1'
  - name: inventory_policy_noncurrent_closed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A superseded (is_current = FALSE) version must have a closing date.
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.inventory_policy

      WHERE is_current = FALSE AND effective_to_date IS NULL'
  - name: inventory_policy_effective_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: effective_from_date must not fall after effective_to_date.
    query: 'SELECT * FROM smarter_demand_and_inventory_decisions.inventory_policy

      WHERE effective_to_date IS NOT NULL AND effective_to_date < effective_from_date'
  - name: inventory_policy_planning_unit_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inventory_policy_planning_unit_fk_orphan
    query: 'SELECT ip.* FROM smarter_demand_and_inventory_decisions.inventory_policy ip

      LEFT JOIN smarter_demand_and_inventory_decisions.planning_unit pu ON pu.planning_unit_sk = ip.planning_unit_sk

      WHERE ip.planning_unit_sk IS NOT NULL AND pu.planning_unit_sk IS NULL'
  - name: inventory_policy_slt_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inventory_policy_slt_fk_orphan
    query: 'SELECT ip.* FROM smarter_demand_and_inventory_decisions.inventory_policy ip

      LEFT JOIN smarter_demand_and_inventory_decisions.service_level_target slt ON slt.service_level_target_sk
      = ip.service_level_target_sk

      WHERE ip.service_level_target_sk IS NOT NULL AND slt.service_level_target_sk IS NULL'
  - name: inventory_policy_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: inventory_policy_grain_unique
    query: 'SELECT inventory_policy_id FROM smarter_demand_and_inventory_decisions.inventory_policy

      GROUP BY inventory_policy_id HAVING COUNT(*) > 1'
