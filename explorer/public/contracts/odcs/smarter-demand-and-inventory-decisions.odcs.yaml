    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Forecast accuracy percentage.
  - name: bias_pct
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: 'Forecast bias in WHOLE PERCENTAGE POINTS (e.g. -5.0 = 5% under-forecast), NOT a 0-1
      fraction. Downstream thresholds (e.g. gold_oos_preventability) read this points scale. Note: mv_forecast_accuracy
      publishes a DIFFERENT, volume-weighted bias measure on a 0-1 fraction; same word, different object
      and scale.'
