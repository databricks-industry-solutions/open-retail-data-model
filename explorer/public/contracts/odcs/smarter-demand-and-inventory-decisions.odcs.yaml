- name: forecast_component
  physicalName: smarter_demand_and_inventory_decisions.forecast_component
  physicalType: table
  description: Demand driver decomposition child of demand_forecast.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/smarter-demand-and-inventory-decisions/README.md
    type: businessDefinition
  - url: outcome-packages/smarter-demand-and-inventory-decisions/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: forecast_component_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: forecast_component_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key.
  - name: demand_forecast_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to demand_forecast.demand_forecast_sk.
    relationships:
    - to: demand_forecast.demand_forecast_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: smarter_demand_and_inventory_decisions
      - property: enforced
        value: false
  - name: demand_forecast_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable demand forecast business key.
  - name: component_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Driver type. Allowed values: base, promo, price, weather, holiday, trend, residual.'
  - name: component_quantity
    logicalType: number
    physicalType: DECIMAL(12,3)
    required: true
    description: Signed contribution in UOM.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: forecast_component_decomposition_integrity
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'Component quantities should sum to the parent forecast (within rounding). WARN, not
      error: some deployments decompose only a subset of drivers.'
    query: "SELECT fc.demand_forecast_sk,\n       SUM(fc.component_quantity) AS component_total,\n   \
      \    MAX(df.forecast_quantity)  AS forecast_quantity\nFROM smarter_demand_and_inventory_decisions.forecast_component\
      \ fc\nJOIN smarter_demand_and_inventory_decisions.demand_forecast df ON df.demand_forecast_sk =\
      \ fc.demand_forecast_sk\nGROUP BY fc.demand_forecast_sk\nHAVING ABS(SUM(fc.component_quantity) -\
      \ MAX(df.forecast_quantity)) > 0.5"
  - name: forecast_component_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: forecast_component_fk_orphan
    query: 'SELECT fc.* FROM smarter_demand_and_inventory_decisions.forecast_component fc

      LEFT JOIN smarter_demand_and_inventory_decisions.demand_forecast df ON df.demand_forecast_sk = fc.demand_forecast_sk

      WHERE fc.demand_forecast_sk IS NOT NULL AND df.demand_forecast_sk IS NULL'
  - name: forecast_component_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: forecast_component_grain_unique
    query: 'SELECT forecast_component_id FROM smarter_demand_and_inventory_decisions.forecast_component

      GROUP BY forecast_component_id HAVING COUNT(*) > 1'
