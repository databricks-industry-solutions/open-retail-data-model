    query: 'SELECT product_id, COUNT(*) AS current_versions

      FROM product.product

      WHERE is_current = true

      GROUP BY product_id

      HAVING COUNT(*) > 1'
  - name: product_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
