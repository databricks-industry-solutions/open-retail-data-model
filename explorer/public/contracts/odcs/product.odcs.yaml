      HAVING COUNT(DISTINCT currency_code) > 1'
- name: product_price
  physicalName: product.product_price
  physicalType: table
  description: ORDM canonical-core product price history (SCD2 per product x price_type). Read price AS
    OF a date here; product dim carries the current snapshot.
  tags:
  - reference
  authoritativeDefinitions:
  - url: canonical-core/product/README.md
    type: businessDefinition
  - url: canonical-core/product/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_price_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per price version.
  - name: product_price_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key (product_id|price_type|effective_from).
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk (foreign surrogate; nullable, not a PK). Resolved AS OF effective_from_date
      — the product SCD2 version in effect when this price applied — matching how sales/inventory/shipment
      resolve their _sk FKs. Declared as informational FK fk_product_price_product in relationships.sql
      (the durable product_id business key is retained below).
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable product business key. The priced product. Retained alongside product_sk; the
      declared UC FK is on product_sk (under SCD2 the business key is not unique, so the FK must be on
      the surrogate).
  - name: price_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'What the amount represents. Allowed values: list, cost, promotional, contract.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: list, cost, promotional, contract.'
  - name: amount
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: 'Unit-grain price/cost (principle #9d), in the reporting/base currency.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (amount IS NULL OR amount >= 0).
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Reporting/base currency, ISO 4217 alpha-3. Equals the deploy base_currency; single-currency
      by construction.
  - name: transaction_currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Original currency before normalization (lineage only), ISO 4217 alpha-3. Convert with
      fx_rate.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this price became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current price.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently effective price per (product, price_type).'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: product_price_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: product_price_keys_not_null
    query: "SELECT * FROM product.product_price\nWHERE product_price_sk IS NULL OR product_price_id IS\
      \ NULL OR product_id IS NULL\n   OR price_type IS NULL OR effective_from_date IS NULL OR is_current\
      \ IS NULL"
  - name: product_price_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: product_price_type_domain
    query: 'SELECT * FROM product.product_price

      WHERE price_type NOT IN (''list'', ''cost'', ''promotional'', ''contract'')'
  - name: product_price_amount_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: product_price_amount_nonnegative
    query: 'SELECT * FROM product.product_price

      WHERE amount IS NOT NULL AND amount < 0'
  - name: product_price_single_current_per_type
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: At most one current price per (product, price_type).
    query: 'SELECT product_id, price_type, COUNT(*) AS current_rows

      FROM product.product_price

      WHERE is_current = true

      GROUP BY product_id, price_type

      HAVING COUNT(*) > 1'
  - name: product_price_product_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every priced product_id must exist in the product master.
    query: "SELECT pp.product_id FROM product.product_price pp\nLEFT JOIN (SELECT DISTINCT product_id\
      \ FROM product.product) p\n  ON pp.product_id = p.product_id\nWHERE p.product_id IS NULL\nGROUP\
      \ BY pp.product_id"
  - name: product_price_product_sk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The declared FK is on the surrogate: every non-null product_sk must exist in the product
      master.'
    query: 'SELECT pp.* FROM product.product_price pp

      LEFT JOIN product.product p ON pp.product_sk = p.product_sk

      WHERE pp.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: product_price_single_reporting_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: product_price_single_reporting_currency
    query: 'SELECT COUNT(DISTINCT currency_code) AS distinct_currencies

      FROM product.product_price

      HAVING COUNT(DISTINCT currency_code) > 1'
