    unit: rows
    description: 'The canonical core is single-currency: every monetary column is stored in the base currency,
      so currency_code must be constant. (transaction_currency_code carries the original sourcing currency
      and is intentionally NOT constrained.)'
    query: 'SELECT COUNT(DISTINCT currency_code) AS distinct_currencies

