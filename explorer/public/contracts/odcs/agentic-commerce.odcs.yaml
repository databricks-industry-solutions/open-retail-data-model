  physicalType: view
  description: 'KPI-ready aggregate surface for the consolidated Conversational Shopping Assistant use
    case. Grain: started date x channel x primary intent category x resolution type.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: started_date
    logicalType: date
    physicalType: DATE
  - name: entry_channel
    logicalType: string
    physicalType: STRING
  - name: primary_intent_category
    logicalType: string
    physicalType: STRING
  - name: resolution_type
    logicalType: string
    physicalType: STRING
  - name: conversation_sessions
    logicalType: integer
    physicalType: BIGINT
    description: Count of conversational shopping sessions in the reporting grain.
  - name: known_customer_sessions
    logicalType: integer
    physicalType: BIGINT
  - name: personalization_eligible_sessions
    logicalType: integer
    physicalType: BIGINT
  - name: selected_sessions
    logicalType: integer
    physicalType: BIGINT
  - name: add_to_cart_sessions
    logicalType: integer
    physicalType: BIGINT
  - name: purchase_sessions
    logicalType: integer
    physicalType: BIGINT
  - name: handoff_sessions
    logicalType: integer
    physicalType: BIGINT
  - name: fallback_sessions
    logicalType: integer
    physicalType: BIGINT
  - name: sessions_reaching_discovery
    logicalType: integer
    physicalType: BIGINT
    description: Count of conversational shopping sessions that reached at least one linked discovery
      intent.
  - name: purchased_units
    logicalType: integer
    physicalType: BIGINT
  - name: purchase_net_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Reporting/base currency (ISO 4217 alpha-3) for purchase_net_amount; NULL when the grain
      had no purchases.
  - name: avg_total_turns
    logicalType: number
    physicalType: DOUBLE
  - name: avg_turns_to_first_discovery
    logicalType: number
    physicalType: DOUBLE
  - name: selection_rate
    logicalType: number
    physicalType: DOUBLE
  - name: add_to_cart_rate
    logicalType: number
    physicalType: DOUBLE
  - name: assisted_conversion_rate
    logicalType: number
    physicalType: DOUBLE
    description: Share of conversational shopping sessions that reached a purchase.
  - name: handoff_rate
    logicalType: number
    physicalType: DOUBLE
    description: Share of conversational shopping sessions with an associate or support handoff.
  - name: fallback_rate
    logicalType: number
    physicalType: DOUBLE
    description: Share of conversational shopping sessions with at least one fallback turn.
