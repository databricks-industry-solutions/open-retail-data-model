      \ IS NOT NULL\n  AND current_list_price_amount < 0"
- name: mv_agent_performance
  physicalName: agentic_commerce.mv_agent_performance
  physicalType: view
  description: 'Per-agent performance for agent-to-agent commerce: participation, success rate, and time
    to completion by role, operator, and trust status.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: a2a_agent_id
    logicalType: string
    businessName: Agent ID
    customProperties:
    - property: synonyms
      value:
      - agent
      - bot_id
      - agent_id
    description: Durable business key for the agent.
  - name: agent_role
    logicalType: string
    businessName: Agent Role
    customProperties:
    - property: synonyms
      value:
      - role
      - side
      - party
    description: 'Which side the agent acts for: buyer_agent or seller_agent.'
  - name: operator_name
    logicalType: string
    businessName: Operator
    customProperties:
    - property: synonyms
      value:
      - operator
      - provider
      - platform
    description: Organization or platform operating the agent.
  - name: trust_status
    logicalType: string
    businessName: Trust Status
    customProperties:
    - property: synonyms
      value:
      - trust
      - verification_status
      - trust_level
    description: 'Verification/trust state: unverified, verified, suspended, revoked.'
  - name: agent_count
    logicalType: integer
    businessName: Agent Count
    customProperties:
    - property: synonyms
      value:
      - num_agents
      - total_agents
    description: Number of distinct agents.
  - name: total_sessions_participated
    logicalType: integer
    businessName: Sessions Participated
    customProperties:
    - property: synonyms
      value:
      - participations
      - involvement_count
    description: Total agent-session participations (a session with two agents counts for both).
  - name: total_sessions_completed
    logicalType: integer
    businessName: Sessions Completed
    customProperties:
    - property: synonyms
      value:
      - completed_participations
      - wins
    description: Total participations that ended in a completed session.
  - name: success_rate
    logicalType: number
    businessName: Success Rate (pooled)
    customProperties:
    - property: synonyms
      value:
      - win_rate
      - completion_rate
      - pooled_success_rate
    description: 'Pooled success rate across the selected agents: total completed participations / total
      participations. Weights each session equally (a busy agent counts more), which is what most users
      expect from a rate.'
  - name: avg_success_rate_per_agent
    logicalType: number
    businessName: Avg Success Rate (per-agent mean)
    customProperties:
    - property: synonyms
      value:
      - mean_success_rate
      - macro_success_rate
    description: Mean of per-agent success rates — each agent weighs equally regardless of session volume,
      so a one-session agent counts as much as a 500-session one. Use success_rate for the pooled rate.
  - name: avg_time_to_completion_minutes
    logicalType: number
    businessName: Avg Time to Completion (per-agent mean, min)
    customProperties:
    - property: synonyms
      value:
      - avg_deal_time
      - negotiation_speed
    description: Mean of per-agent average minutes from session start to completion, on completed sessions
      — each agent weighs equally regardless of volume. Completion is the terminal lifecycle timestamp,
      which can trail the acceptance event.
- name: mv_conversational_shopping_session
  physicalName: agentic_commerce.mv_conversational_shopping_session
  physicalType: view
  description: 'Session-level KPIs for Conversational Shopping Assistant: assisted conversion, handoff
    occurrence, and fallback rates by channel, intent category, and resolution type.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: started_date
    logicalType: date
    businessName: Session Start Date
    customProperties:
    - property: synonyms
      value:
      - date
      - session_date
    description: Business date when the conversation session began.
  - name: entry_channel
    logicalType: string
    businessName: Channel
    customProperties:
    - property: synonyms
      value:
      - channel
      - surface
      - platform
    description: 'Surface where the shopper accessed the conversational assistant: web, mobile_app, kiosk,
      store_associate, voice, or api.'
  - name: primary_intent_category
    logicalType: string
    businessName: Primary Intent Category
    customProperties:
    - property: synonyms
      value:
      - intent
      - intent_category
      - shopper_need
    description: 'Shopper need classification from the first discovery intent in the session: product_search,
      need_based, occasion, problem_solution, compatibility, style_fit, replenishment, comparison, or
      unknown.'
  - name: resolution_type
    logicalType: string
    businessName: Resolution Type
    customProperties:
    - property: synonyms
      value:
      - outcome
      - resolution
      - session_outcome
    description: 'How the session ended: product_selected, add_to_cart, purchase, handoff, no_resolution,
      or abandoned.'
  - name: known_customer_flag
    logicalType: boolean
    businessName: Known Customer
    customProperties:
    - property: synonyms
      value:
      - authenticated
      - identified
      - resolved_customer
    description: TRUE when the shopper resolved to a customer profile.
  - name: personalization_eligible_flag
    logicalType: boolean
    businessName: Personalization Eligible
    customProperties:
    - property: synonyms
      value:
      - personalized
      - personalization_enabled
    description: TRUE when personalized ranking was enabled during the session.
  - name: conversation_session_count
    logicalType: integer
    businessName: Conversation Sessions
    customProperties:
    - property: synonyms
      value:
      - conversation_sessions
      - assistant_sessions
    description: Number of conversation sessions in the grain.
  - name: known_customer_session_count
    logicalType: integer
    businessName: Known Customer Sessions
    customProperties:
    - property: synonyms
      value:
      - identified_sessions
      - authenticated_sessions
    description: Conversation sessions where the shopper resolved to a customer profile.
  - name: personalization_eligible_session_count
    logicalType: integer
    businessName: Personalization Eligible Sessions
    customProperties:
    - property: synonyms
      value:
      - personalized_sessions
    description: Conversation sessions eligible for personalized product ranking.
  - name: selection_count
    logicalType: integer
    businessName: Selection Sessions
    customProperties:
    - property: synonyms
      value:
      - selected_sessions
    description: Sessions where the shopper selected (clicked on) a discovery result.
  - name: add_to_cart_count
    logicalType: integer
    businessName: Add-to-Cart Sessions
    customProperties:
    - property: synonyms
      value:
      - cart_sessions
    description: Sessions where the shopper added a discovery result to cart.
  - name: assisted_conversion_count
    logicalType: integer
    businessName: Assisted Conversion Sessions
    customProperties:
    - property: synonyms
      value:
      - converted_sessions
      - purchase_sessions
    description: Sessions with a discovery-attributed purchase engagement (narrower than resolution_type='purchase').
  - name: handoff_count
    logicalType: integer
    businessName: Handoff Sessions
    customProperties:
    - property: synonyms
      value:
      - escalation_sessions
      - agent_handoff_sessions
    description: Sessions where a handoff to agent/human occurred (turn-derived handoff_flag OCCURRENCE,
      not terminal outcome).
  - name: fallback_count
    logicalType: integer
    businessName: Fallback Sessions
    customProperties:
    - property: synonyms
      value:
      - fallback_sessions
    description: Sessions where the assistant used a fallback turn (not ideal path).
  - name: session_selection_rate
    logicalType: number
    businessName: Session Selection Rate
    customProperties:
    - property: synonyms
      value:
      - sessions_with_selection_rate
    description: Fraction of sessions where the shopper selected a discovery result.
  - name: session_add_to_cart_rate
    logicalType: number
    businessName: Session Add-to-Cart Rate
    customProperties:
    - property: synonyms
      value:
      - session_cart_rate
      - sessions_with_add_to_cart_rate
    description: Fraction of sessions where the shopper added a discovery result to cart.
  - name: assisted_conversion_rate
    logicalType: number
    businessName: Assisted Conversion Rate
    customProperties:
    - property: synonyms
      value:
      - assisted_purchase_rate
      - session_conversion_rate
    description: Fraction of sessions with a discovery-attributed purchase. Narrower than resolution_type='purchase'
      because it counts only sessions where a discovery result had a purchase engagement.
  - name: handoff_rate
    logicalType: number
    businessName: Handoff Rate
    customProperties:
    - property: synonyms
      value:
      - agent_handoff_rate
      - assistant_handoff_rate
    description: Fraction of sessions where a handoff occurred (turn-derived OCCURRENCE flag, not terminal
      outcome). A session can hand off mid-flow yet resolve to purchase.
  - name: fallback_rate
    logicalType: number
    businessName: Fallback Rate
    customProperties:
    - property: synonyms
      value:
      - fallback_frequency
    description: Fraction of sessions that included an assistant fallback turn (not ideal path).
  - name: avg_turns
    logicalType: number
    businessName: Average Turns
    customProperties:
    - property: synonyms
      value:
      - avg_turns_per_session
      - mean_turns
    description: Mean number of conversation turns per session.
