  - name: gcsa_performance_rates_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gcsa_performance_rates_range
    query: "SELECT * FROM agentic_commerce.gold_conversational_shopping_performance\nWHERE (selection_rate\
      \ IS NOT NULL AND selection_rate NOT BETWEEN 0 AND 1)\n   OR (add_to_cart_rate IS NOT NULL AND add_to_cart_rate\
      \ NOT BETWEEN 0 AND 1)\n   OR (assisted_conversion_rate IS NOT NULL AND assisted_conversion_rate\
      \ NOT BETWEEN 0 AND 1)\n   OR (handoff_rate IS NOT NULL AND handoff_rate NOT BETWEEN 0 AND 1)\n\
      \   OR (fallback_rate IS NOT NULL AND fallback_rate NOT BETWEEN 0 AND 1)"
- name: gold_conversational_shopping_session
  physicalName: agentic_commerce.gold_conversational_shopping_session
  physicalType: view
  description: Session-level performance surface for Conversational Shopping Assistant. Joins structured
    session and turn events to discovery outcomes while excluding raw prompt text, hashes, session identifiers,
    conversation identifiers, and customer IDs from the gold output.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: conversation_session_id
    logicalType: string
    physicalType: STRING
    description: Durable session business key; raw session and conversation identifiers are not exposed.
  - name: started_date
    logicalType: date
    physicalType: DATE
  - name: started_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: ended_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: entry_channel
    logicalType: string
    physicalType: STRING
    description: Surface where the guided shopping conversation started.
  - name: locale_code
    logicalType: string
    physicalType: STRING
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
  - name: known_customer_flag
    logicalType: boolean
    physicalType: BOOLEAN
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: session_status
    logicalType: string
    physicalType: STRING
  - name: resolution_type
    logicalType: string
    physicalType: STRING
  - name: personalization_eligible_flag
    logicalType: boolean
    physicalType: BOOLEAN
  - name: consent_status
    logicalType: string
    physicalType: STRING
  - name: total_turns
    logicalType: integer
    physicalType: BIGINT
    description: Total structured turns observed in the conversation session.
  - name: shopper_turns
    logicalType: integer
    physicalType: BIGINT
  - name: assistant_turns
    logicalType: integer
    physicalType: BIGINT
  - name: recommendation_turns
    logicalType: integer
    physicalType: BIGINT
  - name: fallback_turns
    logicalType: integer
    physicalType: BIGINT
    description: Number of turns where fallback behavior was used.
  - name: handoff_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the session included an associate or support handoff.
  - name: first_turn_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: last_turn_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: first_discovery_turn_number
    logicalType: integer
    physicalType: INT
  - name: discovery_intent_count
    logicalType: integer
    physicalType: BIGINT
  - name: primary_intent_category
    logicalType: string
    physicalType: STRING
    description: Representative intent category for the session based on linked discovery intent events.
  - name: selected_flag
    logicalType: boolean
    physicalType: BOOLEAN
  - name: added_to_cart_flag
    logicalType: boolean
    physicalType: BOOLEAN
  - name: purchased_flag
    logicalType: boolean
    physicalType: BOOLEAN
  - name: purchased_units
    logicalType: integer
    physicalType: BIGINT
  - name: purchase_net_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Net purchase amount attributed to the conversation session, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Reporting/base currency (ISO 4217 alpha-3) for purchase_net_amount; NULL when the session
      had no purchase.
  quality:
  - name: gcsa_session_one_row_per_session
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gcsa_session_one_row_per_session
    query: 'SELECT conversation_session_id, COUNT(*) AS n

      FROM agentic_commerce.gold_conversational_shopping_session

      GROUP BY conversation_session_id

      HAVING COUNT(*) > 1'
  - name: gcsa_session_nonnegative_measures
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gcsa_session_nonnegative_measures
    query: "SELECT * FROM agentic_commerce.gold_conversational_shopping_session\nWHERE total_turns < 0\n\
      \   OR shopper_turns < 0\n   OR assistant_turns < 0\n   OR recommendation_turns < 0\n   OR fallback_turns\
      \ < 0\n   OR discovery_intent_count < 0\n   OR purchased_units < 0\n   OR purchase_net_amount <\
      \ 0"
  - name: gcsa_session_count
    type: sql
    dimension: accuracy
    severity: info
    description: gcsa_session_count
    query: 'SELECT COUNT(*) AS conversational_shopping_session_rows

      FROM agentic_commerce.gold_conversational_shopping_session'
  - name: gcsa_assisted_conversion_rate
    type: sql
    dimension: accuracy
    severity: info
    description: gcsa_assisted_conversion_rate
    query: 'SELECT ROUND(AVG(CASE WHEN purchased_flag THEN 1.0 ELSE 0.0 END), 4) AS assisted_conversion_rate

      FROM agentic_commerce.gold_conversational_shopping_session'
