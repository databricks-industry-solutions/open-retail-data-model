  - name: personalization_eligible_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when personalized ranking was allowed at event time.
  - name: consent_status
    logicalType: string
    physicalType: STRING
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: product_name
    logicalType: string
    physicalType: STRING
  - name: brand
    logicalType: string
    physicalType: STRING
  - name: category
    logicalType: string
    physicalType: STRING
  - name: subcategory
    logicalType: string
    physicalType: STRING
  - name: department
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: result_rank
    logicalType: integer
    physicalType: INT
    description: One-based product rank within the returned result set.
  - name: retrieval_score
    logicalType: number
    physicalType: DOUBLE
  - name: ranking_score
    logicalType: number
    physicalType: DOUBLE
  - name: personalization_score
    logicalType: number
    physicalType: DOUBLE
  - name: availability_score
    logicalType: number
    physicalType: DOUBLE
  - name: reason_code
    logicalType: string
    physicalType: STRING
    description: Primary explainability reason for why the product was returned.
  - name: is_available_flag
    logicalType: boolean
    physicalType: BOOLEAN
  - name: units_available
    logicalType: number
    physicalType: DECIMAL(12, 3)
  - name: list_price_amount
    logicalType: number
    physicalType: DECIMAL(18, 4)
  - name: currency_code
    logicalType: string
    physicalType: STRING
  - name: viewed_flag
    logicalType: boolean
    physicalType: BOOLEAN
  - name: selected_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the returned product received a select engagement.
  - name: added_to_cart_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the returned product received an add-to-cart engagement.
  - name: purchased_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when this returned product had any purchase engagement (per-result). Uses a different
      attribution rule than purchase_net_amount/purchased_units, so a row may be purchased_flag=TRUE yet
      carry 0 attributed units/amount when the order line was attributed to a sibling result.
  - name: engagement_count
    logicalType: integer
    physicalType: BIGINT
  - name: purchased_units
    logicalType: integer
    physicalType: BIGINT
  - name: purchase_net_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Net purchase amount in the reporting/base currency, with each order line attributed to
      a SINGLE result (deduped to avoid double-counting across sibling results). 0 on a result whose order
      line was attributed elsewhere even if purchased_flag is TRUE.
  - name: first_engagement_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: purchase_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
  quality:
  - name: gipdp_rank_positive
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gipdp_rank_positive
    query: 'SELECT * FROM agentic_commerce.gold_intent_product_discovery_performance

      WHERE result_rank <= 0'
  - name: gipdp_scores_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gipdp_scores_range
    query: "SELECT * FROM agentic_commerce.gold_intent_product_discovery_performance\nWHERE (retrieval_score\
      \ IS NOT NULL AND retrieval_score NOT BETWEEN 0 AND 1)\n   OR (ranking_score IS NOT NULL AND ranking_score\
      \ NOT BETWEEN 0 AND 1)\n   OR (personalization_score IS NOT NULL AND personalization_score NOT BETWEEN\
      \ 0 AND 1)\n   OR (availability_score IS NOT NULL AND availability_score NOT BETWEEN 0 AND 1)"
  - name: gipdp_result_count
    type: sql
    dimension: accuracy
    severity: info
    description: gipdp_result_count
    query: 'SELECT COUNT(*) AS discovery_performance_rows

      FROM agentic_commerce.gold_intent_product_discovery_performance'
  - name: gipdp_selection_rate
    type: sql
    dimension: accuracy
    severity: info
    description: gipdp_selection_rate
    query: 'SELECT ROUND(AVG(CASE WHEN selected_flag THEN 1.0 ELSE 0.0 END), 4) AS selected_result_rate

      FROM agentic_commerce.gold_intent_product_discovery_performance'
