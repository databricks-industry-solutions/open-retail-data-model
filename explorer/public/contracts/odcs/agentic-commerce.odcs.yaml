    description: event_type must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_negotiation_event

      WHERE event_type NOT IN (''price_request'', ''offer'', ''counter_offer'', ''acceptance'', ''rejection'',
      ''availability_check'', ''escalation_to_human'')'
  - name: a2a_negotiation_event_session_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every event must reference an existing session (by surrogate FK).
    query: 'SELECT e.* FROM agentic_commerce.a2a_negotiation_event e

      LEFT JOIN agentic_commerce.a2a_session s ON e.a2a_session_sk = s.a2a_session_sk

      WHERE e.a2a_session_sk IS NOT NULL AND s.a2a_session_sk IS NULL'
  - name: a2a_negotiation_event_agent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every event with an emitting agent must reference an existing agent.
    query: 'SELECT e.* FROM agentic_commerce.a2a_negotiation_event e

      LEFT JOIN agentic_commerce.a2a_agent a ON e.a2a_agent_sk = a.a2a_agent_sk

      WHERE e.a2a_agent_sk IS NOT NULL AND a.a2a_agent_sk IS NULL'
  - name: a2a_negotiation_event_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every event with a product must reference an existing product.
    query: 'SELECT e.* FROM agentic_commerce.a2a_negotiation_event e

      LEFT JOIN product.product p ON e.product_sk = p.product_sk

      WHERE e.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: a2a_negotiation_event_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Monetary fact: all priced events must carry the single reporting currency. Replace ''USD''
      via ${base_currency} at deploy; the check asserts consistency, not a specific code, by flagging
      any second distinct currency among priced rows.'
    query: "SELECT * FROM agentic_commerce.a2a_negotiation_event\nWHERE proposed_price IS NOT NULL\n \
      \ AND currency_code IS NOT NULL\n  AND currency_code <> (\n    SELECT MIN(currency_code) FROM agentic_commerce.a2a_negotiation_event\n\
      \    WHERE proposed_price IS NOT NULL AND currency_code IS NOT NULL\n  )"
  - name: a2a_negotiation_event_price_currency_paired
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A proposed_price requires a currency_code (and vice versa) — no orphan money.
    query: "SELECT * FROM agentic_commerce.a2a_negotiation_event\nWHERE (proposed_price IS NOT NULL AND\
      \ currency_code IS NULL)\n   OR (proposed_price IS NULL AND currency_code IS NOT NULL)"
  - name: a2a_negotiation_event_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Proposed price and quantity, when set, must be non-negative.
    query: "SELECT * FROM agentic_commerce.a2a_negotiation_event\nWHERE (proposed_price IS NOT NULL AND\
      \ proposed_price < 0)\n   OR (proposed_quantity IS NOT NULL AND proposed_quantity < 0)"
  - name: a2a_negotiation_event_sequence_unique
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: event_sequence is documented as the monotonic step number within a session; two events
      sharing a sequence within one session break replay/ordering.
    query: 'SELECT a2a_session_sk, event_sequence, COUNT(*) AS rows_at_sequence

      FROM agentic_commerce.a2a_negotiation_event

      WHERE event_sequence IS NOT NULL

      GROUP BY a2a_session_sk, event_sequence

      HAVING COUNT(*) > 1'
  - name: a2a_negotiation_event_single_acceptance
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A session concludes with at most one acceptance. More than one would fan out gold_a2a_session_summary's
      agreed-terms join and double-count the session.
    query: 'SELECT a2a_session_sk, COUNT(*) AS acceptance_count

      FROM agentic_commerce.a2a_negotiation_event

      WHERE event_type = ''acceptance''

      GROUP BY a2a_session_sk

      HAVING COUNT(*) > 1'
- name: a2a_session
  physicalName: agentic_commerce.a2a_session
  physicalType: table
  description: Agent-to-agent commerce session tracking for the Agentic Commerce outcome package. One
    row per A2A negotiation lifecycle between a buying agent (customer) and a selling agent (retailer).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: a2a_session_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per session.
  - name: a2a_session_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the session (e.g. a UUID issued by the orchestrator).
  - name: buyer_profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk — the individual the buying agent represents.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: buyer_profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the buyer profile. Stable across SCD2 versions.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store.store_sk — the store or channel the selling agent represents.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the store.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product.product_sk — the primary product being negotiated, if applicable.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the product.
  - name: initiating_agent_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to a2a_agent.a2a_agent_sk — the agent that opened the session.
    relationships:
    - to: a2a_agent.a2a_agent_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: initiating_agent_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the initiating agent.
  - name: responding_agent_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to a2a_agent.a2a_agent_sk — the agent that responded.
    relationships:
    - to: a2a_agent.a2a_agent_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: responding_agent_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key of the responding agent.
  - name: session_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Lifecycle status. Allowed values: initiated, negotiating, agreed, completed, abandoned,
      failed, expired.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: initiated, negotiating, agreed, completed, abandoned, failed, expired.'
  - name: communication_channel
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Communication channel between agents. Allowed values: api, marketplace, direct, voice.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: api, marketplace, direct, voice.'
  - name: initiator_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Which side initiated the session. Allowed values: buyer_agent, seller_agent.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: buyer_agent, seller_agent.'
  - name: session_summary
    logicalType: string
    physicalType: STRING
    required: false
    description: Free-text summary of the session outcome or current state. May contain PII if agents
      reference customer details.
    classification: restricted
    tags:
    - dbx_pii
  - name: initiated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the session was created (UTC, ISO 8601).
  - name: last_activity_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the most recent interaction occurred (UTC, ISO 8601). Updated on each negotiation
      event.
  - name: completed_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the session concluded (UTC, ISO 8601). NULL if still active.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system or orchestration platform that produced this session.
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this session row was last modified in the source system (UTC, ISO 8601). Advances
      on each in-place status/activity update.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the lakehouse (UTC, ISO 8601).
  quality:
  - name: a2a_session_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Surrogate key, business key, status, channel, initiator, and initiated timestamp are
      mandatory.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE a2a_session_sk IS NULL OR a2a_session_id\
      \ IS NULL\n   OR session_status IS NULL OR communication_channel IS NULL\n   OR initiator_type IS\
      \ NULL OR initiated_timestamp IS NULL"
  - name: a2a_session_business_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Each session business key must be unique (no SCD2; one row per session).
    query: 'SELECT a2a_session_id, COUNT(*) AS row_count

      FROM agentic_commerce.a2a_session

      GROUP BY a2a_session_id

      HAVING COUNT(*) > 1'
  - name: a2a_session_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: session_status must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE session_status NOT IN (''initiated'', ''negotiating'', ''agreed'', ''completed'', ''abandoned'',
      ''failed'', ''expired'')'
  - name: a2a_session_communication_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: communication_channel must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE communication_channel NOT IN (''api'', ''marketplace'', ''direct'', ''voice'')'
  - name: a2a_session_initiator_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: initiator_type must be within the declared enum.
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE initiator_type NOT IN (''buyer_agent'', ''seller_agent'')'
  - name: a2a_session_buyer_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a buyer must reference an existing profile (by surrogate FK).
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN customer.profile p ON s.buyer_profile_sk = p.profile_sk

      WHERE s.buyer_profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: a2a_session_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a store must reference an existing store.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN store.store st ON s.store_sk = st.store_sk

      WHERE s.store_sk IS NOT NULL AND st.store_sk IS NULL'
  - name: a2a_session_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a product must reference an existing product.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN product.product p ON s.product_sk = p.product_sk

      WHERE s.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: a2a_session_completed_timestamp_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Completed sessions must have a completed_timestamp; active sessions must not.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE (session_status IN ('completed', 'abandoned',\
      \ 'failed', 'expired') AND completed_timestamp IS NULL)\n   OR (session_status IN ('initiated',\
      \ 'negotiating', 'agreed') AND completed_timestamp IS NOT NULL)"
  - name: a2a_session_timestamp_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: completed_timestamp, when set, must be after initiated_timestamp.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE completed_timestamp IS NOT NULL\n  AND completed_timestamp\
      \ <= initiated_timestamp"
  - name: a2a_session_last_activity_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: last_activity_timestamp, when set, must fall on or after initiated_timestamp and (when
      the session has ended) on or before completed_timestamp.
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE last_activity_timestamp IS NOT NULL\n  AND\
      \ (last_activity_timestamp < initiated_timestamp\n    OR (completed_timestamp IS NOT NULL AND last_activity_timestamp\
      \ > completed_timestamp))"
  - name: a2a_session_audit_block_present
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'Audit provenance should be populated: record_source and load_timestamp identify where
      each row came from and when it landed.'
    query: 'SELECT * FROM agentic_commerce.a2a_session

      WHERE record_source IS NULL OR load_timestamp IS NULL'
  - name: a2a_session_initiating_agent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with an initiating agent must reference an existing agent.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN agentic_commerce.a2a_agent a ON s.initiating_agent_sk = a.a2a_agent_sk

      WHERE s.initiating_agent_sk IS NOT NULL AND a.a2a_agent_sk IS NULL'
  - name: a2a_session_responding_agent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every session with a responding agent must reference an existing agent.
    query: 'SELECT s.* FROM agentic_commerce.a2a_session s

      LEFT JOIN agentic_commerce.a2a_agent a ON s.responding_agent_sk = a.a2a_agent_sk

      WHERE s.responding_agent_sk IS NOT NULL AND a.a2a_agent_sk IS NULL'
  - name: a2a_session_agents_distinct
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'The two agents on a session must be different rows. A self-paired session (one agent
      as both initiator and responder) would double-count that agent in gold_a2a_agent_scorecard, which
      UNION ALLs the two roles. warn: hardens the spine without blocking on a data anomaly.'
    query: "SELECT * FROM agentic_commerce.a2a_session\nWHERE initiating_agent_sk IS NOT NULL AND responding_agent_sk\
      \ IS NOT NULL\n  AND initiating_agent_sk = responding_agent_sk"
  - name: a2a_session_agents_opposite_side
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'The two agents must sit on opposite sides — one buyer_agent, one seller_agent (the A2A
      model is a buying agent negotiating with a selling agent). Joins the current a2a_agent version for
      each side''s role. warn, not error: an agent''s role is SCD2 and could in principle change, so this
      is a consistency signal.'
    query: "SELECT s.* FROM agentic_commerce.a2a_session s\nJOIN agentic_commerce.a2a_agent ia\n  ON s.initiating_agent_sk\
      \ = ia.a2a_agent_sk AND ia.is_current = TRUE\nJOIN agentic_commerce.a2a_agent ra\n  ON s.responding_agent_sk\
      \ = ra.a2a_agent_sk AND ra.is_current = TRUE\nWHERE ia.agent_role = ra.agent_role"
  - name: a2a_session_completed_has_acceptance
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'A completed session should have an acceptance event behind it — completion is the terminal
      lifecycle state a deal reaches after its terms are accepted. If a session reads ''completed'' with
      no acceptance in the event log, the funnel''s completed count (gold_a2a_negotiation_funnel, from
      session_status) can exceed reached_agreed (from the event log). warn, not error: the session''s
      mutable status and the append-only log can legitimately lag at read time, so this is a consistency
      signal rather than a hard invariant.'
    query: "SELECT s.a2a_session_sk, s.a2a_session_id\nFROM agentic_commerce.a2a_session s\nLEFT JOIN\
      \ (\n  SELECT DISTINCT a2a_session_sk\n  FROM agentic_commerce.a2a_negotiation_event\n  WHERE event_type\
      \ = 'acceptance'\n) a ON s.a2a_session_sk = a.a2a_session_sk\nWHERE s.session_status = 'completed'\
      \ AND a.a2a_session_sk IS NULL"
- name: assistant_turn_event
  physicalName: agentic_commerce.assistant_turn_event
  physicalType: table
  description: Agentic Commerce structured assistant turn/action fact for conversational shopping.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: assistant_turn_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for the assistant turn event.
  - name: assistant_turn_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the assistant turn event.
  - name: conversation_session_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to conversation_session.conversation_session_sk.
    relationships:
    - to: conversation_session.conversation_session_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: conversation_session_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the parent conversational shopping session.
  - name: discovery_intent_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to discovery_intent_event.discovery_intent_event_sk when this turn captured or used
      a discovery intent.
    relationships:
    - to: discovery_intent_event.discovery_intent_event_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: discovery_intent_event_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable business key for the linked discovery intent event.
  - name: turn_sequence_number
    logicalType: integer
    physicalType: INT
    required: true
    description: One-based turn order within the conversation session.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (turn_sequence_number > 0).
  - name: actor_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Actor responsible for the turn. Allowed values: shopper, assistant, associate, system.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: shopper, assistant, associate, system.'
  - name: turn_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Structured turn type. Allowed values: intent_capture, recommendation, product_comparison,
      availability_check, cart_action, handoff, fallback, clarification, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: intent_capture, recommendation, product_comparison, availability_check,
        cart_action, handoff, fallback, clarification, other.'
  - name: assistant_action_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Structured assistant action. Allowed values: none, search_products, recommend_products,
      compare_products, check_availability, add_to_cart, handoff_to_associate, answer_question, clarify_intent.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, search_products, recommend_products, compare_products, check_availability,
        add_to_cart, handoff_to_associate, answer_question, clarify_intent.'
  - name: intent_category
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Turn-local normalized shopper intent category when this turn captured or refined intent;
      not authoritative over the linked discovery_intent_event (use that row for the session intent of
      record). Allowed values: product_search, need_based, occasion, problem_solution, compatibility,
      style_fit, replenishment, comparison, unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: product_search, need_based, occasion, problem_solution, compatibility,
        style_fit, replenishment, comparison, unknown.'
  - name: intent_confidence_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Turn-local model confidence that the normalized category reflects the shopper intent,
      from 0.0 to 1.0; scoped to this turn, not authoritative over the linked discovery_intent_event.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (intent_confidence_score IS NULL OR (intent_confidence_score >= 0.0 AND intent_confidence_score
        <= 1.0)).
  - name: is_fallback_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the assistant could not confidently answer or proceed without fallback behavior.
  - name: is_handoff_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the turn handed the shopper to an associate or other support channel.
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the turn occurred at source (UTC, ISO 8601).
  - name: event_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the turn event.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: ate_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_keys_not_null
    query: "SELECT * FROM agentic_commerce.assistant_turn_event\nWHERE assistant_turn_event_sk IS NULL\n\
      \   OR assistant_turn_event_id IS NULL\n   OR conversation_session_id IS NULL\n   OR turn_sequence_number\
      \ IS NULL\n   OR actor_type IS NULL\n   OR turn_type IS NULL\n   OR event_ts IS NULL\n   OR event_date\
      \ IS NULL"
  - name: ate_business_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_business_key_unique
    query: 'SELECT assistant_turn_event_id, COUNT(*) AS n

      FROM agentic_commerce.assistant_turn_event

      GROUP BY assistant_turn_event_id

      HAVING COUNT(*) > 1'
  - name: ate_turn_sequence_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_turn_sequence_unique
    query: 'SELECT conversation_session_id, turn_sequence_number, COUNT(*) AS n

      FROM agentic_commerce.assistant_turn_event

      GROUP BY conversation_session_id, turn_sequence_number

      HAVING COUNT(*) > 1'
  - name: ate_session_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_session_fk_orphan
    query: "SELECT t.* FROM agentic_commerce.assistant_turn_event t\nLEFT JOIN agentic_commerce.conversation_session\
      \ s\n  ON t.conversation_session_sk = s.conversation_session_sk\nWHERE t.conversation_session_sk\
      \ IS NOT NULL\n  AND s.conversation_session_sk IS NULL"
  - name: ate_session_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_session_businesskey_orphan
    query: "SELECT t.* FROM agentic_commerce.assistant_turn_event t\nLEFT JOIN agentic_commerce.conversation_session\
      \ s\n  ON t.conversation_session_id = s.conversation_session_id\nWHERE s.conversation_session_id\
      \ IS NULL"
  - name: ate_intent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_intent_fk_orphan
    query: "SELECT t.* FROM agentic_commerce.assistant_turn_event t\nLEFT JOIN agentic_commerce.discovery_intent_event\
      \ i\n  ON t.discovery_intent_event_sk = i.discovery_intent_event_sk\nWHERE t.discovery_intent_event_sk\
      \ IS NOT NULL\n  AND i.discovery_intent_event_sk IS NULL"
  - name: ate_intent_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_intent_businesskey_orphan
    query: "SELECT t.* FROM agentic_commerce.assistant_turn_event t\nLEFT JOIN agentic_commerce.discovery_intent_event\
      \ i\n  ON t.discovery_intent_event_id = i.discovery_intent_event_id\nWHERE t.discovery_intent_event_id\
      \ IS NOT NULL\n  AND i.discovery_intent_event_id IS NULL"
  - name: ate_intent_session_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When a turn links a discovery intent, that intent must belong to the SAME conversation
      session as the turn (turn -> intent -> session equals turn -> session). The redundant grandparent
      key (conversation_session_sk) is published and joinable, so assert it agrees with the path through
      the intent.
    query: "SELECT t.* FROM agentic_commerce.assistant_turn_event t\nJOIN agentic_commerce.discovery_intent_event\
      \ i\n  ON t.discovery_intent_event_sk = i.discovery_intent_event_sk\nWHERE t.discovery_intent_event_sk\
      \ IS NOT NULL\n  AND t.conversation_session_sk <> i.conversation_session_sk"
  - name: ate_actor_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_actor_type_domain
    query: 'SELECT * FROM agentic_commerce.assistant_turn_event

      WHERE actor_type NOT IN (''shopper'', ''assistant'', ''associate'', ''system'')'
  - name: ate_turn_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_turn_type_domain
    query: 'SELECT * FROM agentic_commerce.assistant_turn_event

      WHERE turn_type NOT IN (''intent_capture'', ''recommendation'', ''product_comparison'', ''availability_check'',
      ''cart_action'', ''handoff'', ''fallback'', ''clarification'', ''other'')'
  - name: ate_action_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_action_type_domain
    query: 'SELECT * FROM agentic_commerce.assistant_turn_event

      WHERE assistant_action_type NOT IN (''none'', ''search_products'', ''recommend_products'', ''compare_products'',
      ''check_availability'', ''add_to_cart'', ''handoff_to_associate'', ''answer_question'', ''clarify_intent'')'
  - name: ate_intent_category_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_intent_category_domain
    query: "SELECT * FROM agentic_commerce.assistant_turn_event\nWHERE intent_category IS NOT NULL\n \
      \ AND intent_category NOT IN ('product_search', 'need_based', 'occasion', 'problem_solution', 'compatibility',\
      \ 'style_fit', 'replenishment', 'comparison', 'unknown')"
  - name: ate_confidence_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_confidence_score_range
    query: "SELECT * FROM agentic_commerce.assistant_turn_event\nWHERE intent_confidence_score IS NOT\
      \ NULL\n  AND intent_confidence_score NOT BETWEEN 0 AND 1"
  - name: ate_event_date_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ate_event_date_consistency
    query: 'SELECT * FROM agentic_commerce.assistant_turn_event

      WHERE event_date <> CAST(event_ts AS DATE)'
  - name: ate_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: ate_rowcount
    query: 'SELECT COUNT(*) AS assistant_turn_event_rows

      FROM agentic_commerce.assistant_turn_event'
- name: conversation_session
  physicalName: agentic_commerce.conversation_session
  physicalType: table
  description: Agentic Commerce append-only privacy-safe conversational shopping session fact.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: conversation_session_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for the conversational shopping session.
  - name: conversation_session_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the conversational shopping session.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk when the shopper is resolved.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable customer business key (pseudonymous). NULL for anonymous sessions.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk when the conversation is scoped to a store/location.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key when store context is known.
  - name: session_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Pseudonymous session identifier from the shopping surface; degenerate, not application
      state.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: conversation_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Pseudonymous conversation identifier; degenerate, not transcript state.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: entry_channel
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Surface where the conversation started. Allowed values: web, mobile_app, kiosk, store_associate,
      voice, api.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: web, mobile_app, kiosk, store_associate, voice, api.'
  - name: locale_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Locale/language context for the conversation, e.g. en-US.
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Jurisdiction used for consent/personalization evaluation, ISO 3166-1 alpha-2 when available.
  - name: started_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the conversation started at source (UTC, ISO 8601).
  - name: ended_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the conversation ended at source (UTC, ISO 8601). NULL only when still active at
      the reporting cutoff or unknown.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (ended_ts IS NULL OR ended_ts >= started_ts).
  - name: started_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date the conversation started.
  - name: session_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle status at the immutable reporting point. Allowed values: active, completed,
      abandoned, escalated.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, completed, abandoned, escalated.'
  - name: resolution_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How the session resolved. Allowed values: product_selected, add_to_cart, purchase, handoff,
      no_resolution, abandoned.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: product_selected, add_to_cart, purchase, handoff, no_resolution, abandoned.'
  - name: personalization_eligible_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the shopper was eligible for personalized assistance at session start.
  - name: consent_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Consent state used for personalization at session start. Allowed values: granted, denied,
      unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: granted, denied, unknown.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: cs_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_keys_not_null
    query: "SELECT * FROM agentic_commerce.conversation_session\nWHERE conversation_session_sk IS NULL\n\
      \   OR conversation_session_id IS NULL\n   OR started_ts IS NULL\n   OR started_date IS NULL"
  - name: cs_business_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_business_key_unique
    query: 'SELECT conversation_session_id, COUNT(*) AS n

      FROM agentic_commerce.conversation_session

      GROUP BY conversation_session_id

      HAVING COUNT(*) > 1'
  - name: cs_conversation_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_conversation_id_unique
    query: 'SELECT conversation_id, COUNT(*) AS n

      FROM agentic_commerce.conversation_session

      WHERE conversation_id IS NOT NULL

      GROUP BY conversation_id

      HAVING COUNT(*) > 1'
  - name: cs_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_profile_fk_orphan
    query: 'SELECT s.* FROM agentic_commerce.conversation_session s

      LEFT JOIN customer.profile p ON s.profile_sk = p.profile_sk

      WHERE s.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: cs_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_store_fk_orphan
    query: 'SELECT s.* FROM agentic_commerce.conversation_session s

      LEFT JOIN store.store st ON s.store_sk = st.store_sk

      WHERE s.store_sk IS NOT NULL AND st.store_sk IS NULL'
  - name: cs_entry_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_entry_channel_domain
    query: 'SELECT * FROM agentic_commerce.conversation_session

      WHERE entry_channel NOT IN (''web'', ''mobile_app'', ''kiosk'', ''store_associate'', ''voice'',
      ''api'')'
  - name: cs_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_status_domain
    query: 'SELECT * FROM agentic_commerce.conversation_session

      WHERE session_status NOT IN (''active'', ''completed'', ''abandoned'', ''escalated'')'
  - name: cs_resolution_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_resolution_type_domain
    query: 'SELECT * FROM agentic_commerce.conversation_session

      WHERE resolution_type NOT IN (''product_selected'', ''add_to_cart'', ''purchase'', ''handoff'',
      ''no_resolution'', ''abandoned'')'
  - name: cs_consent_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_consent_status_domain
    query: 'SELECT * FROM agentic_commerce.conversation_session

      WHERE consent_status NOT IN (''granted'', ''denied'', ''unknown'')'
  - name: cs_timestamp_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_timestamp_order
    query: 'SELECT * FROM agentic_commerce.conversation_session

      WHERE ended_ts IS NOT NULL AND ended_ts < started_ts'
  - name: cs_status_ended_ts_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Emit-once lifecycle invariant (ADR 0034): a session reported as ''completed'' has an
      end timestamp, and an ''active'' snapshot has none. ORDM accepts one immutable row per conversation_session_id
      (cs_business_key_unique) and never a later active->completed correction, so the two states must
      be internally consistent at the single reporting point. ''abandoned''/''escalated'' may end or not.'
    query: "SELECT * FROM agentic_commerce.conversation_session\nWHERE (session_status = 'completed' AND\
      \ ended_ts IS NULL)\n   OR (session_status = 'active' AND ended_ts IS NOT NULL)"
  - name: cs_status_resolution_coherence
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'session_status and resolution_type are overlapping lifecycle signals. Flag the incoherent
      combinations the glossary rules out: a terminal handoff mirrors ''escalated'', and an abandoned
      resolution mirrors the ''abandoned'' status. warn, not error: these are producer-conformance signals,
      not load-blocking integrity, and other status/resolution pairings are legitimately independent (e.g.
      a session can reach ''completed'' with any of the non-terminal resolutions).'
    query: "SELECT * FROM agentic_commerce.conversation_session\nWHERE (resolution_type = 'handoff'  \
      \ AND session_status <> 'escalated')\n   OR (resolution_type = 'abandoned' AND session_status <>\
      \ 'abandoned')"
  - name: cs_started_date_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cs_started_date_consistency
    query: 'SELECT * FROM agentic_commerce.conversation_session

      WHERE started_date <> CAST(started_ts AS DATE)'
  - name: cs_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: cs_rowcount
    query: 'SELECT COUNT(*) AS conversation_session_rows

      FROM agentic_commerce.conversation_session'
- name: discovery_engagement_event
  physicalName: agentic_commerce.discovery_engagement_event
  physicalType: table
  description: Agentic Commerce engagement fact for organic intent product discovery results.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: discovery_engagement_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for the discovery engagement event.
  - name: discovery_engagement_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the engagement event.
  - name: discovery_result_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to discovery_result_event.discovery_result_event_sk.
    relationships:
    - to: discovery_result_event.discovery_result_event_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: discovery_result_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the engaged result.
  - name: discovery_intent_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to discovery_intent_event.discovery_intent_event_sk.
    relationships:
    - to: discovery_intent_event.discovery_intent_event_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: discovery_intent_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the parent discovery intent event.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk when the shopper is resolved.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable customer business key (pseudonymous). NULL for anonymous engagement.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk for the engaged product.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable product business key for the engaged product.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk when engagement is store-scoped.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key when engagement is store-scoped.
  - name: order_line_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer_order_line.order_line_sk when engagement converted to a purchase.
    relationships:
    - to: customer_order_line.order_line_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: orders
      - property: enforced
        value: false
  - name: order_line_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable order-line business key when purchase attribution is known.
  - name: order_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Operational order identifier retained as a degenerate attribute.
  - name: engagement_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Type of engagement. Allowed values: view, select, add_to_cart, purchase, dismiss.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: view, select, add_to_cart, purchase, dismiss.'
  - name: engagement_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the engagement occurred at source (UTC, ISO 8601).
  - name: engagement_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the engagement.
  - name: quantity
    logicalType: integer
    physicalType: INT
    required: false
    description: Units associated with the engagement, populated for add-to-cart or purchase events when
      known.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((quantity IS NULL OR quantity >= 0) AND (net_amount IS NULL OR net_amount >=
        0.0) AND (attribution_window_minutes IS NULL OR attribution_window_minutes >= 0)).
  - name: net_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Net purchase amount in the reporting/base currency, populated only for purchase events.
      Point-of-engagement attribution snapshot; not reconciled against customer_order_line.net_amount
      even when order_line_sk resolves.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Reporting/base currency for net_amount, ISO 4217 alpha-3.
  - name: attribution_window_minutes
    logicalType: integer
    physicalType: INT
    required: false
    description: Minutes between result production and engagement when known.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: dee_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_keys_not_null
    query: "SELECT * FROM agentic_commerce.discovery_engagement_event\nWHERE discovery_engagement_event_sk\
      \ IS NULL\n   OR discovery_engagement_event_id IS NULL\n   OR discovery_result_event_id IS NULL\n\
      \   OR discovery_intent_event_id IS NULL\n   OR product_id IS NULL\n   OR engagement_type IS NULL\n\
      \   OR engagement_ts IS NULL\n   OR engagement_date IS NULL"
  - name: dee_business_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_business_key_unique
    query: 'SELECT discovery_engagement_event_id, COUNT(*) AS n

      FROM agentic_commerce.discovery_engagement_event

      GROUP BY discovery_engagement_event_id

      HAVING COUNT(*) > 1'
  - name: dee_result_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_result_fk_orphan
    query: "SELECT e.* FROM agentic_commerce.discovery_engagement_event e\nLEFT JOIN agentic_commerce.discovery_result_event\
      \ r\n  ON e.discovery_result_event_sk = r.discovery_result_event_sk\nWHERE e.discovery_result_event_sk\
      \ IS NOT NULL\n  AND r.discovery_result_event_sk IS NULL"
  - name: dee_result_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_result_businesskey_orphan
    query: "SELECT e.* FROM agentic_commerce.discovery_engagement_event e\nLEFT JOIN agentic_commerce.discovery_result_event\
      \ r\n  ON e.discovery_result_event_id = r.discovery_result_event_id\nWHERE r.discovery_result_event_id\
      \ IS NULL"
  - name: dee_intent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_intent_fk_orphan
    query: "SELECT e.* FROM agentic_commerce.discovery_engagement_event e\nLEFT JOIN agentic_commerce.discovery_intent_event\
      \ i\n  ON e.discovery_intent_event_sk = i.discovery_intent_event_sk\nWHERE e.discovery_intent_event_sk\
      \ IS NOT NULL\n  AND i.discovery_intent_event_sk IS NULL"
  - name: dee_result_intent_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The engaged result's parent intent must equal the engagement's own intent (engagement
      -> result -> intent equals engagement -> intent). Both grandparent keys are published on the row,
      so assert the redundant intent id agrees with the path through the result rather than trusting them
      to be set consistently.
    query: "SELECT e.* FROM agentic_commerce.discovery_engagement_event e\nJOIN agentic_commerce.discovery_result_event\
      \ r\n  ON e.discovery_result_event_id = r.discovery_result_event_id\nWHERE e.discovery_intent_event_id\
      \ <> r.discovery_intent_event_id"
  - name: dee_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_profile_fk_orphan
    query: 'SELECT e.* FROM agentic_commerce.discovery_engagement_event e

      LEFT JOIN customer.profile p ON e.profile_sk = p.profile_sk

      WHERE e.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: dee_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_product_fk_orphan
    query: 'SELECT e.* FROM agentic_commerce.discovery_engagement_event e

      LEFT JOIN product.product p ON e.product_sk = p.product_sk

      WHERE e.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: dee_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_store_fk_orphan
    query: 'SELECT e.* FROM agentic_commerce.discovery_engagement_event e

      LEFT JOIN store.store s ON e.store_sk = s.store_sk

      WHERE e.store_sk IS NOT NULL AND s.store_sk IS NULL'
  - name: dee_order_line_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_order_line_fk_orphan
    query: 'SELECT e.* FROM agentic_commerce.discovery_engagement_event e

      LEFT JOIN orders.customer_order_line o ON e.order_line_sk = o.order_line_sk

      WHERE e.order_line_sk IS NOT NULL AND o.order_line_sk IS NULL'
  - name: dee_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_type_domain
    query: 'SELECT * FROM agentic_commerce.discovery_engagement_event

      WHERE engagement_type NOT IN (''view'', ''select'', ''add_to_cart'', ''purchase'', ''dismiss'')'
  - name: dee_nonnegative_values
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_nonnegative_values
    query: "SELECT * FROM agentic_commerce.discovery_engagement_event\nWHERE (quantity IS NOT NULL AND\
      \ quantity < 0)\n   OR (net_amount IS NOT NULL AND net_amount < 0)\n   OR (attribution_window_minutes\
      \ IS NOT NULL AND attribution_window_minutes < 0)"
  - name: dee_purchase_has_amount
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_purchase_has_amount
    query: "SELECT * FROM agentic_commerce.discovery_engagement_event\nWHERE engagement_type = 'purchase'\n\
      \  AND (net_amount IS NULL OR currency_code IS NULL)"
  - name: dee_engagement_date_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_engagement_date_consistency
    query: 'SELECT * FROM agentic_commerce.discovery_engagement_event

      WHERE engagement_date <> CAST(engagement_ts AS DATE)'
  - name: dee_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dee_single_currency
    query: "SELECT 'discovery_engagement_event' AS table_name, COUNT(DISTINCT currency_code) AS currencies\n\
      FROM agentic_commerce.discovery_engagement_event\nWHERE net_amount IS NOT NULL\nHAVING COUNT(DISTINCT\
      \ currency_code) > 1\n    OR SUM(CASE WHEN currency_code IS NULL THEN 1 ELSE 0 END) > 0"
  - name: dee_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: dee_rowcount
    query: 'SELECT COUNT(*) AS discovery_engagement_event_rows

      FROM agentic_commerce.discovery_engagement_event'
- name: discovery_intent_event
  physicalName: agentic_commerce.discovery_intent_event
  physicalType: table
  description: Agentic Commerce intent event fact for organic product discovery.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: discovery_intent_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for the discovery intent event.
  - name: discovery_intent_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the intent event.
  - name: conversation_session_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to conversation_session.conversation_session_sk when the intent is part of a guided
      shopping conversation.
    relationships:
    - to: conversation_session.conversation_session_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: conversation_session_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable conversational shopping session business key when the intent is part of a guided
      conversation.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk when the shopper is resolved.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable customer business key (pseudonymous). NULL for anonymous intent.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk when discovery is scoped to a store/location.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key when store context is known.
  - name: session_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Pseudonymous session identifier from the discovery surface; degenerate, not application
      state.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: conversation_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Pseudonymous conversation identifier when the intent came from an agent/chat turn; degenerate,
      not transcript state.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: discovery_channel
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Surface where intent was captured. Allowed values: web, mobile_app, kiosk, store_associate,
      voice, api.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: web, mobile_app, kiosk, store_associate, voice, api.'
  - name: locale_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Locale/language context for the intent, e.g. en-US.
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Jurisdiction used for consent/personalization evaluation, ISO 3166-1 alpha-2 when available.
  - name: intent_text_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Deterministic hash of the redacted normalized intent text. Raw shopper text is not stored
      in ORDM.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: intent_category
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Normalized intent category. Allowed values: product_search, need_based, occasion, problem_solution,
      compatibility, style_fit, replenishment, comparison, unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: product_search, need_based, occasion, problem_solution, compatibility,
        style_fit, replenishment, comparison, unknown.'
  - name: intent_confidence_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Model confidence that the normalized category reflects the shopper intent, from 0.0 to
      1.0.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (intent_confidence_score IS NULL OR (intent_confidence_score >= 0.0 AND intent_confidence_score
        <= 1.0)).
  - name: personalization_eligible_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the shopper was eligible for personalized ranking at event time.
  - name: consent_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Consent state used for personalization at event time. Allowed values: granted, denied,
      unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: granted, denied, unknown.'
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the intent event occurred at source (UTC, ISO 8601).
  - name: event_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the intent event.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: die_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_keys_not_null
    query: "SELECT * FROM agentic_commerce.discovery_intent_event\nWHERE discovery_intent_event_sk IS\
      \ NULL\n   OR discovery_intent_event_id IS NULL\n   OR event_ts IS NULL\n   OR event_date IS NULL"
  - name: die_business_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_business_key_unique
    query: 'SELECT discovery_intent_event_id, COUNT(*) AS n

      FROM agentic_commerce.discovery_intent_event

      GROUP BY discovery_intent_event_id

      HAVING COUNT(*) > 1'
  - name: die_session_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_session_fk_orphan
    query: "SELECT i.* FROM agentic_commerce.discovery_intent_event i\nLEFT JOIN agentic_commerce.conversation_session\
      \ s\n  ON i.conversation_session_sk = s.conversation_session_sk\nWHERE i.conversation_session_sk\
      \ IS NOT NULL\n  AND s.conversation_session_sk IS NULL"
  - name: die_session_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_session_businesskey_orphan
    query: "SELECT i.* FROM agentic_commerce.discovery_intent_event i\nLEFT JOIN agentic_commerce.conversation_session\
      \ s\n  ON i.conversation_session_id = s.conversation_session_id\nWHERE i.conversation_session_id\
      \ IS NOT NULL\n  AND s.conversation_session_id IS NULL"
  - name: die_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_profile_fk_orphan
    query: 'SELECT i.* FROM agentic_commerce.discovery_intent_event i

      LEFT JOIN customer.profile p ON i.profile_sk = p.profile_sk

      WHERE i.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: die_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_store_fk_orphan
    query: 'SELECT i.* FROM agentic_commerce.discovery_intent_event i

      LEFT JOIN store.store s ON i.store_sk = s.store_sk

      WHERE i.store_sk IS NOT NULL AND s.store_sk IS NULL'
  - name: die_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_channel_domain
    query: 'SELECT * FROM agentic_commerce.discovery_intent_event

      WHERE discovery_channel NOT IN (''web'', ''mobile_app'', ''kiosk'', ''store_associate'', ''voice'',
      ''api'')'
  - name: die_intent_category_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_intent_category_domain
    query: 'SELECT * FROM agentic_commerce.discovery_intent_event

      WHERE intent_category NOT IN (''product_search'', ''need_based'', ''occasion'', ''problem_solution'',
      ''compatibility'', ''style_fit'', ''replenishment'', ''comparison'', ''unknown'')'
  - name: die_consent_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_consent_status_domain
    query: 'SELECT * FROM agentic_commerce.discovery_intent_event

      WHERE consent_status NOT IN (''granted'', ''denied'', ''unknown'')'
  - name: die_confidence_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_confidence_score_range
    query: "SELECT * FROM agentic_commerce.discovery_intent_event\nWHERE intent_confidence_score IS NOT\
      \ NULL\n  AND intent_confidence_score NOT BETWEEN 0 AND 1"
  - name: die_event_date_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: die_event_date_consistency
    query: 'SELECT * FROM agentic_commerce.discovery_intent_event

      WHERE event_date <> CAST(event_ts AS DATE)'
  - name: die_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: die_rowcount
    query: 'SELECT COUNT(*) AS discovery_intent_event_rows

      FROM agentic_commerce.discovery_intent_event'
- name: discovery_result_event
  physicalName: agentic_commerce.discovery_result_event
  physicalType: table
  description: Agentic Commerce returned product result fact for organic intent product discovery.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: discovery_result_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for the returned discovery result.
  - name: discovery_result_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the returned result.
  - name: discovery_intent_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to discovery_intent_event.discovery_intent_event_sk.
    relationships:
    - to: discovery_intent_event.discovery_intent_event_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: agentic_commerce
      - property: enforced
        value: false
  - name: discovery_intent_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the parent discovery intent event.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk for the returned product.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable product business key for the returned product.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk when result availability is store-scoped.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key when result availability is store-scoped.
  - name: result_rank
    logicalType: integer
    physicalType: INT
    required: true
    description: One-based product rank within the returned result set.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (result_rank > 0).
  - name: retrieval_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Candidate retrieval score, from 0.0 to 1.0 when normalized.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((retrieval_score IS NULL OR (retrieval_score >= 0.0 AND retrieval_score <= 1.0))
        AND (ranking_score IS NULL OR (ranking_score >= 0.0 AND ranking_score <= 1.0)) AND (personalization_score
        IS NULL OR (personalization_score >= 0.0 AND personalization_score <= 1.0)) AND (availability_score
        IS NULL OR (availability_score >= 0.0 AND availability_score <= 1.0))).
  - name: ranking_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Final ranking score, from 0.0 to 1.0 when normalized.
  - name: personalization_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Personalization component of the ranking score, from 0.0 to 1.0 when normalized.
  - name: availability_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Availability component of the ranking score, from 0.0 to 1.0 when normalized.
  - name: reason_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Primary explainability reason. Allowed values: lexical_match, semantic_match, purchase_affinity,
      substitute, complement, trending, available_nearby, business_rule.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: lexical_match, semantic_match, purchase_affinity, substitute, complement,
        trending, available_nearby, business_rule.'
  - name: is_available_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE when the result was considered buyable/available at ranking time.
  - name: units_available
    logicalType: number
    physicalType: DECIMAL(12,3)
    required: false
    description: Units available at ranking time when known.
  - name: list_price_amount
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: List/shelf price shown or used at ranking time, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Reporting/base currency for price fields, ISO 4217 alpha-3.
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the result was produced at source (UTC, ISO 8601).
  - name: event_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the result event.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: dre_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_keys_not_null
    query: "SELECT * FROM agentic_commerce.discovery_result_event\nWHERE discovery_result_event_sk IS\
      \ NULL\n   OR discovery_result_event_id IS NULL\n   OR discovery_intent_event_id IS NULL\n   OR\
      \ product_id IS NULL\n   OR result_rank IS NULL\n   OR event_ts IS NULL\n   OR event_date IS NULL"
  - name: dre_business_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_business_key_unique
    query: 'SELECT discovery_result_event_id, COUNT(*) AS n

      FROM agentic_commerce.discovery_result_event

      GROUP BY discovery_result_event_id

      HAVING COUNT(*) > 1'
  - name: dre_rank_unique_per_intent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_rank_unique_per_intent
    query: 'SELECT discovery_intent_event_id, result_rank, COUNT(*) AS n

      FROM agentic_commerce.discovery_result_event

      GROUP BY discovery_intent_event_id, result_rank

      HAVING COUNT(*) > 1'
  - name: dre_intent_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_intent_fk_orphan
    query: "SELECT r.* FROM agentic_commerce.discovery_result_event r\nLEFT JOIN agentic_commerce.discovery_intent_event\
      \ i\n  ON r.discovery_intent_event_sk = i.discovery_intent_event_sk\nWHERE r.discovery_intent_event_sk\
      \ IS NOT NULL\n  AND i.discovery_intent_event_sk IS NULL"
  - name: dre_intent_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_intent_businesskey_orphan
    query: "SELECT r.* FROM agentic_commerce.discovery_result_event r\nLEFT JOIN agentic_commerce.discovery_intent_event\
      \ i\n  ON r.discovery_intent_event_id = i.discovery_intent_event_id\nWHERE i.discovery_intent_event_id\
      \ IS NULL"
  - name: dre_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_product_fk_orphan
    query: 'SELECT r.* FROM agentic_commerce.discovery_result_event r

      LEFT JOIN product.product p ON r.product_sk = p.product_sk

      WHERE r.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: dre_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_store_fk_orphan
    query: 'SELECT r.* FROM agentic_commerce.discovery_result_event r

      LEFT JOIN store.store s ON r.store_sk = s.store_sk

      WHERE r.store_sk IS NOT NULL AND s.store_sk IS NULL'
  - name: dre_scores_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_scores_range
    query: "SELECT * FROM agentic_commerce.discovery_result_event\nWHERE (retrieval_score IS NOT NULL\
      \ AND retrieval_score NOT BETWEEN 0 AND 1)\n   OR (ranking_score IS NOT NULL AND ranking_score NOT\
      \ BETWEEN 0 AND 1)\n   OR (personalization_score IS NOT NULL AND personalization_score NOT BETWEEN\
      \ 0 AND 1)\n   OR (availability_score IS NOT NULL AND availability_score NOT BETWEEN 0 AND 1)"
  - name: dre_reason_code_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_reason_code_domain
    query: 'SELECT * FROM agentic_commerce.discovery_result_event

      WHERE reason_code NOT IN (''lexical_match'', ''semantic_match'', ''purchase_affinity'', ''substitute'',
      ''complement'', ''trending'', ''available_nearby'', ''business_rule'')'
  - name: dre_event_date_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_event_date_consistency
    query: 'SELECT * FROM agentic_commerce.discovery_result_event

      WHERE event_date <> CAST(event_ts AS DATE)'
  - name: dre_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dre_single_currency
    query: "SELECT 'discovery_result_event' AS table_name, COUNT(DISTINCT currency_code) AS currencies\n\
      FROM agentic_commerce.discovery_result_event\nWHERE list_price_amount IS NOT NULL\nHAVING COUNT(DISTINCT\
      \ currency_code) > 1\n    OR SUM(CASE WHEN currency_code IS NULL THEN 1 ELSE 0 END) > 0"
  - name: dre_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: dre_rowcount
    query: 'SELECT COUNT(*) AS discovery_result_event_rows

      FROM agentic_commerce.discovery_result_event'
- name: gold_a2a_agent_scorecard
  physicalName: agentic_commerce.gold_a2a_agent_scorecard
  physicalType: view
  description: 'Per-agent performance scorecard. Attributes each session to the agents on both sides (initiating
    and responding), then aggregates outcome metrics per agent: how many sessions it took part in, how
    many completed, its success rate, and average time to completion. Joins the current a2a_agent version
    for role/operator/trust context. Note: this measures start -> completed (the terminal lifecycle timestamp
    on the session), NOT start -> acceptance event; agreement (the acceptance event) can precede completion,
    so this is the wider end-to-end duration, named accordingly.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/agentic-commerce/README.md
    type: businessDefinition
  - url: outcome-packages/agentic-commerce/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: a2a_agent_id
    logicalType: string
    physicalType: STRING
  - name: agent_name
    logicalType: string
    physicalType: STRING
  - name: agent_role
    logicalType: string
    physicalType: STRING
  - name: operator_name
    logicalType: string
    physicalType: STRING
  - name: trust_status
    logicalType: string
    physicalType: STRING
  - name: sessions_participated
    logicalType: integer
    physicalType: BIGINT
  - name: sessions_completed
    logicalType: integer
