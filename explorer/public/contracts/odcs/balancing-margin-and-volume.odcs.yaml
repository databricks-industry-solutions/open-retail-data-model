    logicalType: number
    businessName: Booked Gross Profit
    customProperties:
    - property: synonyms
      value:
      - gross_profit_accrual
      - margin_before_leakage
    description: Booked revenue minus COGS; gross of all payment reversals
  - name: realized_margin_lc
    logicalType: number
    businessName: Realized Gross Profit
    customProperties:
    - property: synonyms
      value:
      - realized_gross_profit
      - margin_after_leakage
    description: Realized revenue minus COGS; net of all refunds, chargebacks, and adjustments; sale-cohort
      basis
  - name: booked_margin_pct
    logicalType: number
    businessName: Booked Margin %
    customProperties:
    - property: synonyms
      value:
      - booked_margin_rate
      - gross_margin_pct_accrual
    description: Booked gross margin rate (ratio-of-sums); gross of payment reversals
  - name: realized_margin_pct
    logicalType: number
    businessName: Realized Margin %
    customProperties:
    - property: synonyms
      value:
      - realized_margin_rate
      - post_leakage_margin_pct
    description: Realized gross margin rate (ratio-of-sums); net of all reversals; sale-cohort basis
  - name: leakage_rate
    logicalType: number
    businessName: Leakage Rate of Booked Revenue (sale cohort)
    customProperties:
    - property: synonyms
      value:
      - cohort_leakage_rate
      - leakage_pct_of_booked
    description: Revenue leakage as a percentage of total booked revenue across POS and order channels
      (ratio-of-sums); combines unsettled, refund, chargeback, adjustment. Diluted by the POS share, which
      carries no reversals; use order_channel_leakage_rate to compare leakage intensity. Sale-cohort basis.
  - name: order_channel_leakage_rate
    logicalType: number
    businessName: Order Channel Leakage Rate (sale cohort)
    customProperties:
    - property: synonyms
      value:
      - order_leakage_rate
      - cohort_order_leakage_pct
    description: Revenue leakage as a percentage of ORDER-channel booked sales (ratio-of-sums). Leakage
      occurs only on the order channel (POS sales carry no payment reversals in ORDM), so this is the
      rate to compare across stores or categories; leakage_rate divides by total booked revenue including
      POS and is diluted by the POS share. Sale-cohort basis.
  - name: order_channel_share
    logicalType: number
    businessName: Order Channel Share
    customProperties:
    - property: synonyms
      value:
      - order_revenue_share
      - ecommerce_revenue_share
      - order_channel_pct
    description: Proportion of booked revenue from orders (customer_order_line channel, excluding POS)
