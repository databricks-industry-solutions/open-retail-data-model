- name: mv_assortment_recommendations
  physicalName: balancing_margin_and_volume.mv_assortment_recommendations
  physicalType: view
  description: Assortment optimization recommendations.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    description: Surrogate key for the product.
  - name: store_sk
    logicalType: integer
    description: Surrogate key for the store.
  - name: product_id
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - sku
      - article_id
      - item_id
    description: Universal article identifier
  - name: store_id
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - location_id
      - branch_id
    description: Universal store identifier
  - name: category
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - department
      - merch_category
    description: Product category
  - name: recommendation
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - assortment_action
      - action
      - decision
    description: Rule-based assortment action (KEEP / DROP / EXPAND)
  - name: sku_count
    logicalType: integer
    businessName: SKU Count
    customProperties:
    - property: synonyms
      value:
      - unique_items
      - item_count
      - assortment_size
    description: Number of unique SKUs (counts distinct product_ids across the filtered set of stores,
      as the underlying table is at product x store grain)
  - name: total_projected_volume_lift
    logicalType: number
    businessName: Total Projected Volume Lift (units per selling day)
    customProperties:
    - property: synonyms
      value:
      - projected_units_lift
      - volume_uplift
    description: 'Change in units per selling day, at the baseline rate, if the recommendations are applied:
      EXPAND adds one facing (space-elasticity response), DROP removes the SKU''s own baseline units,
      KEEP adds 0. Heuristic scenario, not a forecast.'
  - name: total_projected_margin_lift_lc
    logicalType: number
    businessName: Total Projected Margin Lift (per selling day)
    customProperties:
    - property: synonyms
      value:
      - projected_margin_uplift
      - margin_delta
    description: 'Net gross-margin change per selling day in local currency if the recommendations are
      applied: own margin change minus cannibalization drag on mapped substitutes. Heuristic scenario,
      not a forecast.'
  - name: total_cannibalization_drag_lc
    logicalType: number
    businessName: Total Cannibalization Drag (per selling day)
    customProperties:
    - property: synonyms
      value:
      - cannibalization_impact
      - substitute_margin_drag
    description: 'Gross margin per selling day the actions take from mapped substitutes: positive when
      EXPAND pulls demand from substitutes, negative when a DROP''s demand is recaptured by them. Heuristic
      scenario.'
  - name: drop_candidate_sku_count
    logicalType: integer
    businessName: DROP-candidate SKU Count
    customProperties:
    - property: synonyms
      value:
      - delist_candidates
      - drop_skus
    description: Unique SKUs the rule flags as DROP candidates (slow mover + weak margin)
