- name: gold_affinity_features
  physicalName: balancing_margin_and_volume.gold_affinity_features
  physicalType: view
  description: Cross-elasticity and affinity scores for complementary / substitute items.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the product.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store.
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: date_key
    logicalType: date
    physicalType: DATE
  - name: substitute_price_ratio
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: Own price divided by average substitute price.
  - name: complement_price_ratio
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: Own price divided by average complement price.
  - name: substitute_markdown_depth_pct
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: Average markdown depth of substitute products.
  - name: complement_markdown_depth_pct
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: Average markdown depth of complement products.
  - name: substitute_demand_transfer_pct
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: 'Share of this SKU demand assumed to move to its mapped substitutes if it is removed
      or out of stock: 1 - product of (1 - affinity_coefficient) over its substitutes, reading each affinity
      as the share of shoppers who accept that substitute. 0 when no substitute is mapped. Heuristic assumption;
      adopters can replace it with a fitted demand-transfer model.'
  quality:
  - name: bmv_affinity_features_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Ensure gold_affinity_features operates at the product x store x date grain
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_affinity_features

      GROUP BY product_sk, store_sk, date_key

      HAVING COUNT(*) > 1'
  - name: bmv_affinity_demand_transfer_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The demand-transfer share is a fraction: never NULL (0 when no substitute is mapped),
      within [0, 1].'
    query: "SELECT product_sk, store_sk, date_key, substitute_demand_transfer_pct\nFROM balancing_margin_and_volume.gold_affinity_features\n\
      WHERE substitute_demand_transfer_pct IS NULL\n   OR substitute_demand_transfer_pct < 0 OR substitute_demand_transfer_pct\
      \ > 1"
- name: gold_assortment_optimization
  physicalName: balancing_margin_and_volume.gold_assortment_optimization
  physicalType: view
  description: 'Assortment optimization: features, a rule-based recommendation, and heuristic model outputs.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the product.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store.
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: snapshot_date
    logicalType: date
    physicalType: DATE
  - name: allocated_facings
    logicalType: integer
    physicalType: INT
    description: Number of facings on the planogram.
  - name: allocated_sqft
    logicalType: number
    physicalType: DECIMAL(10, 2)
    description: Square footage on the planogram.
  - name: substitute_demand_transfer_pct
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: Share of this SKU demand assumed to move to its mapped substitutes if it is removed (0
      to 1; 0 when no substitute is mapped). Heuristic over product_relationship affinities, from gold_affinity_features;
      an assumption, not estimated from observed substitution.
  - name: rolling_sales_velocity_14d
    logicalType: number
    physicalType: DOUBLE
    description: 14-day rolling average of daily units sold.
  - name: rolling_revenue_14d
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: 14-day rolling sum of daily net revenue.
  - name: units_on_hand_eod
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: Units on hand at end of day.
  - name: rolling_margin_14d
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: 14-day rolling sum of daily gross-margin dollars (numerator for margin_contribution_pct).
  - name: rolling_margin_base_rev_14d
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: 14-day rolling sum of net revenue on days that carry a gross-margin rate; the denominator
      base for margin_contribution_pct so days lacking a rate do not bias it down.
  - name: baseline_units_28d
    logicalType: number
    physicalType: DECIMAL(18, 3)
    description: 28-day non-promo unit sum (numerator for baseline_velocity).
  - name: baseline_nonpromo_days_28d
    logicalType: integer
    physicalType: INT
    description: 28-day count of non-promo days (denominator for baseline_velocity).
  - name: baseline_velocity
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: 28-day non-promo observed mean units/day (heuristic baseline proxy; ratio of baseline_units_28d
      / baseline_nonpromo_days_28d).
  - name: margin_contribution_pct
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: 14-day realized gross-margin rate = rolling_margin_14d / rolling_margin_base_rev_14d
      (rate-bearing revenue only).
  - name: recommendation
    logicalType: string
    physicalType: STRING
    description: Rule-based assortment action (KEEP / DROP / EXPAND) over velocity + margin buckets and
      days-on-hand; deterministic, not ML.
  - name: space_elasticity
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: 'Heuristic space elasticity: percent change in units per 1 percent change in facings,
      per space-planning category. Within-product cross-store log-log slope of non-promo velocity on facings,
      shrunk toward a 0.17 prior (Eisend 2014 meta-analytic average) by its standard error, clamped to
      0..1. Observational, not causal. NULL when the SKU x store has no planogram allocation.'
  - name: space_elasticity_se
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: Standard error of space_elasticity after shrinkage toward the prior (0.10 when only the
      prior is used).
  - name: space_elasticity_n_obs
    logicalType: integer
    physicalType: INT
    description: Number of product x store x planogram-allocation observations behind the category space_elasticity
      fit (0 = prior only).
  - name: projected_volume_lift
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: 'Scenario: change in this SKU own units per selling day at the baseline rate if the recommendation
      is applied. EXPAND adds one facing (baseline x (((facings + 1) / facings) ^ space_elasticity - 1));
      DROP removes the SKU (minus baseline_velocity); KEEP is 0. Not a forecast.'
  - name: projected_margin_lift_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: 'Scenario: net gross-margin change per selling day in local currency if the recommendation
      is applied = projected_volume_lift x own unit margin - cannibalization_drag_lc. Unit margin is the
      14-day margin over units on rate-bearing days.'
  - name: cannibalization_drag_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: 'Scenario: gross margin per selling day in local currency that the action takes from
      mapped substitutes = projected_volume_lift x store-conditional demand transfer (1 - product of (1
      - affinity) over the mapped substitutes sold in the store) x affinity-weighted substitute unit margin
      (0 when no mapped substitute sells in the store; own unit margin when substitutes sell there but
      their margin is unknown). Positive on EXPAND, negative (recapture) on DROP, 0 on KEEP.'
  quality:
  - name: bmv_assortment_opt_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Ensure gold_assortment_optimization operates at the product x store grain (snapshot)
    query: 'SELECT product_sk, store_sk

      FROM balancing_margin_and_volume.gold_assortment_optimization

      GROUP BY product_sk, store_sk

      HAVING COUNT(*) > 1'
  - name: bmv_assortment_opt_metrics_validity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Ensure inventory and productivity metrics are non-negative
    query: "SELECT * FROM balancing_margin_and_volume.gold_assortment_optimization\nWHERE (units_on_hand_eod\
      \ IS NOT NULL AND units_on_hand_eod < 0)\n   OR (rolling_revenue_14d IS NOT NULL AND rolling_revenue_14d\
      \ < 0)"
  - name: bmv_assortment_recommendation_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The rule-based recommendation is one of the three allowed actions (never NULL/other)
    query: 'SELECT product_sk, store_sk, recommendation

      FROM balancing_margin_and_volume.gold_assortment_optimization

      WHERE recommendation NOT IN (''KEEP'', ''DROP'', ''EXPAND'') OR recommendation IS NULL'
  - name: bmv_assortment_computed_not_all_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Guard the NULL-KPI regression: when the view has rows, the computed columns must have
      at least one non-NULL value (a 100%-NULL governed output is the anti-pattern this view was fixed
      to avoid). The COUNT(*) > 0 guard means a legitimately-empty deploy stage does NOT red the run (empty
      != all-NULL).'
    query: "SELECT 1\nFROM balancing_margin_and_volume.gold_assortment_optimization\nHAVING COUNT(*) >\
      \ 0 AND (COUNT(margin_contribution_pct) = 0 OR COUNT(baseline_velocity) = 0\n                  \
      \       OR COUNT(projected_volume_lift) = 0)"
  - name: bmv_assortment_space_elasticity_valid
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The heuristic space elasticity is clamped to [0, 1], carries a positive standard error,
      and is only set exactly on rows that have a planogram allocation with a category (no allocation
      or no category -> NULL, while a category with no usable fit still gets the 0.17 prior).
    query: "SELECT product_sk, store_sk, allocated_facings, space_elasticity, space_elasticity_se, space_elasticity_n_obs\n\
      FROM balancing_margin_and_volume.gold_assortment_optimization\nWHERE (space_elasticity IS NOT NULL\
      \ AND (space_elasticity < 0 OR space_elasticity > 1\n                                         OR\
      \ space_elasticity_se IS NULL OR space_elasticity_se <= 0\n                                    \
      \     OR space_elasticity_n_obs IS NULL OR space_elasticity_n_obs < 0))\n   OR (space_elasticity\
      \ IS NOT NULL AND allocated_facings IS NULL)\n   OR (space_elasticity IS NULL AND allocated_facings\
      \ IS NOT NULL\n       AND EXISTS (SELECT 1 FROM balancing_margin_and_volume.planogram pl\n     \
      \              WHERE pl.product_sk = gold_assortment_optimization.product_sk\n                 \
      \    AND pl.store_sk = gold_assortment_optimization.store_sk\n                     AND pl.space_planning_category\
      \ IS NOT NULL\n                     AND gold_assortment_optimization.snapshot_date >= pl.effective_from_date\n\
      \                     AND (pl.effective_to_date IS NULL OR gold_assortment_optimization.snapshot_date\
      \ < pl.effective_to_date)))"
  - name: bmv_assortment_space_elasticity_estimated
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: When the view has planogram-backed rows, at least one category's elasticity should come
      from data (n_obs > 0) rather than the prior alone; all-prior means the planogram/sales overlap is
      too thin to fit.
    query: 'SELECT 1

      FROM balancing_margin_and_volume.gold_assortment_optimization

      HAVING COUNT(space_elasticity) > 0 AND MAX(space_elasticity_n_obs) = 0'
  - name: bmv_assortment_projection_sign
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Scenario projections follow the recommendation: KEEP projects no change; DROP removes
      the SKU''s own units (lift <= 0); EXPAND adds units (lift >= 0). The drag''s sign also depends on
      the substitutes'' unit margin, which can be negative, so only KEEP pins it (to 0).'
    query: "SELECT product_sk, store_sk, recommendation, projected_volume_lift, cannibalization_drag_lc\n\
      FROM balancing_margin_and_volume.gold_assortment_optimization\nWHERE (recommendation = 'KEEP'  \
      \ AND (projected_volume_lift <> 0 OR cannibalization_drag_lc <> 0))\n   OR (recommendation = 'DROP'\
      \   AND projected_volume_lift > 0)\n   OR (recommendation = 'EXPAND' AND projected_volume_lift <\
      \ 0)"
