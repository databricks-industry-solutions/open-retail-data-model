      on fiscal_calendar
  - name: fiscal_period
    logicalType: integer
    customProperties:
    - property: synonyms
      value:
      - fiscal_month
      - retail_period
    description: Fiscal period or month
  - name: currency_code
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - base_currency
      - reporting_currency
    description: Reporting/base currency of all monetary measures (ISO 4217), single-currency by construction
  - name: booked_revenue_lc
    logicalType: number
    businessName: Booked Revenue (sale cohort)
    customProperties:
    - property: synonyms
      value:
      - total_booked_sales
      - booked_net_sales
    description: Total revenue recognized at sale (POS net sales + order booked sales), gross of all reversals
  - name: realized_revenue_lc
    logicalType: number
    businessName: Realized Revenue (sale cohort)
    customProperties:
    - property: synonyms
      value:
      - cohort_realized_revenue
      - sale_cohort_net_revenue
    description: POS net sales plus order-channel SETTLED sales, less refunds, chargebacks and adjustments
      attributed to the original order date (excludes order sales never captured or settled). Sale-cohort
      basis.
  - name: leakage_lc
    logicalType: number
    businessName: Revenue Leakage incl. Unsettled (sale cohort)
    customProperties:
    - property: synonyms
      value:
      - cohort_leakage
