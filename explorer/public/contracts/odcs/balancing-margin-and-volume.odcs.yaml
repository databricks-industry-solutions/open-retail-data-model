      WHERE markdown_depth_pct < 0.0 OR markdown_depth_pct > 1.0'
- name: gold_realized_margin
  physicalName: balancing_margin_and_volume.gold_realized_margin
  physicalType: view
  description: 'Realized margin and revenue leakage at product x store x SALE day grain, across the two
    separate channels ORDM models. Reads canonical core directly: * transaction.sales (POS; no payment
    lifecycle), dated by the sale day * orders.customer_order_line (orders), dated by order_date * payment.payment
    (order payments only), re-allocated here to order lines with the SAME weight, lifecycle dedup and
    status predicates as gold_payment_actuals, but attributed to the original order''s lines and order_date
    (sale cohort) instead of the payment event date. gold_payment_actuals remains the event-date (cash)
    view; conservation checks tie the two.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the product (resolved by SCD2 product version at ingest).
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store.
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product business key.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: date_key
    logicalType: date
    physicalType: DATE
    description: 'Sale cohort date: POS transaction date or order date (not payment event date). Recent
      cohorts are immature; reversals can land weeks after the sale.'
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Reporting/base currency of all monetary columns (ISO 4217 alpha-3); single-currency by
      construction.
  - name: pos_units
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: SUM of net units from POS sales (sales.units), accounting for returns as negative units.
  - name: pos_net_sales_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM of net revenue from POS transactions (sales.net_revenue).
  - name: pos_cogs_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM(units * product.unit_cost) for POS sales by product version (SCD2 as-of the ingest
      date).
  - name: order_units
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: SUM of units from customer order lines (net of internal payment allocations).
  - name: order_booked_sales_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM of booked net amount from customer order lines (customer_order_line.net_amount).
  - name: order_settled_sales_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM of order-line allocated amount from settled/captured payments (net-share allocation,
      same predicates as gold_payment_actuals).
  - name: order_unsettled_sales_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: order_booked_sales_lc - order_settled_sales_lc; booked revenue not yet received as payment
      (authorized/declined/voided attempts excluded).
  - name: order_refund_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM of order-line allocated amount from merchant-initiated refunds; contra-revenue (not
      recovered from COGS).
  - name: order_chargeback_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM of order-line allocated amount from bank-initiated chargebacks (payment disputes);
      contra-revenue.
  - name: order_adjustment_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM of order-line allocated amount from post-sale adjustments (goodwill, corrections);
      contra-revenue (NULL order_id adjustments excluded).
  - name: order_cogs_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: SUM(units * product.unit_cost) for order lines by product version (SCD2 as-of); no recovery
      on refunded merchandise.
  - name: booked_revenue_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: pos_net_sales_lc + order_booked_sales_lc; total booked revenue from both channels on
      sale cohort date.
  - name: realized_revenue_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: pos_net_sales_lc + order_settled_sales_lc - order_refund_lc - order_chargeback_lc - order_adjustment_lc;
      cash-basis revenue (payment event amounts attributed to sale date).
  - name: leakage_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: booked_revenue_lc - realized_revenue_lc; equals order_unsettled_sales_lc + order_refund_lc
      + order_chargeback_lc + order_adjustment_lc (unreceived and reversed payment amounts).
  - name: cogs_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: pos_cogs_lc + order_cogs_lc; total cost of goods sold (COGS not recovered on refunded
      merchandise).
  - name: booked_margin_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: booked_revenue_lc - cogs_lc; gross margin on booked revenue (pre-payment collection).
  - name: realized_margin_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: realized_revenue_lc - cogs_lc; gross margin on realized (cash-basis) revenue after payment
      reversals.
  quality:
  - name: bmv_realized_margin_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Ensure gold_realized_margin operates at the product x store x date grain
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      GROUP BY product_sk, store_sk, date_key

      HAVING COUNT(*) > 1'
  - name: bmv_realized_margin_booked_revenue_identity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Verify booked_revenue_lc = pos_net_sales_lc + order_booked_sales_lc within 0.02 tolerance
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE ABS(booked_revenue_lc - (pos_net_sales_lc + order_booked_sales_lc)) > 0.02'
  - name: bmv_realized_margin_realized_revenue_identity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Verify realized_revenue_lc = pos_net_sales_lc + order_settled_sales_lc - order_refund_lc
      - order_chargeback_lc - order_adjustment_lc within 0.02 tolerance
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE ABS(realized_revenue_lc - (pos_net_sales_lc + order_settled_sales_lc - order_refund_lc - order_chargeback_lc
      - order_adjustment_lc)) > 0.02'
  - name: bmv_realized_margin_leakage_identity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Verify leakage_lc = booked_revenue_lc - realized_revenue_lc within 0.02 tolerance
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE ABS(leakage_lc - (booked_revenue_lc - realized_revenue_lc)) > 0.02'
  - name: bmv_realized_margin_cogs_identity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Verify cogs_lc = pos_cogs_lc + order_cogs_lc within 0.02 tolerance
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE ABS(cogs_lc - (pos_cogs_lc + order_cogs_lc)) > 0.02'
  - name: bmv_realized_margin_booked_margin_identity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Verify booked_margin_lc = booked_revenue_lc - cogs_lc within 0.02 tolerance
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE ABS(booked_margin_lc - (booked_revenue_lc - cogs_lc)) > 0.02'
  - name: bmv_realized_margin_realized_margin_identity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Verify realized_margin_lc = realized_revenue_lc - cogs_lc within 0.02 tolerance
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE ABS(realized_margin_lc - (realized_revenue_lc - cogs_lc)) > 0.02'
  - name: bmv_realized_margin_nonneg_order_amounts
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Allocated payment magnitudes are non-negative: payment amounts are non-negative by contract
      and the allocation weight is clamped at 0, so a negative value here means the view regressed. (Booked
      order sales and COGS follow core order-line values, which carry no non-negativity CHECK; they are
      covered by the warn-severity check below.)'
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE order_settled_sales_lc < 0 OR order_refund_lc < 0 OR order_chargeback_lc < 0 OR order_adjustment_lc
      < 0'
  - name: bmv_realized_margin_nonneg_booked_and_cogs
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'Booked sales and COGS on either channel can legitimately be negative on otherwise-valid
      core data: POS when an adopter loads returns as negative units, orders when a line carries a negative
      net (deep discount or return line; customer_order_line.net_amount has no non-negativity CHECK).
      Surfaced as a warning rather than failing the run, matching gold_payment_actuals, which clamps such
      lines to zero allocation weight for the same reason.'
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE pos_cogs_lc < 0 OR pos_net_sales_lc < 0 OR order_booked_sales_lc < 0 OR order_cogs_lc < 0'
  - name: bmv_realized_margin_unsettled_sanity
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'When order_unsettled_sales_lc is negative (settled > booked), flag for investigation.
      The usual cause is an amount-basis mismatch: payment sale amounts that include tax or shipping while
      customer_order_line.net_amount excludes them. Net those out upstream so both are on the same basis.'
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_realized_margin

      WHERE order_unsettled_sales_lc < -0.05'
  - name: bmv_realized_margin_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: All rows use the single reporting/base currency; no NULL or mixed currencies allowed
    query: "SELECT DISTINCT currency_code\nFROM balancing_margin_and_volume.gold_realized_margin\nWHERE\
      \ currency_code <> (SELECT MAX(currency_code) FROM balancing_margin_and_volume.gold_realized_margin)\n\
      \   OR currency_code IS NULL"
  - name: bmv_realized_margin_computed_not_all_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Guard NULL-KPI regression: when rows exist, computed measures must have at least one
      non-NULL value'
    query: 'SELECT 1

      FROM balancing_margin_and_volume.gold_realized_margin

      HAVING COUNT(*) > 0 AND (COUNT(realized_revenue_lc) = 0 OR COUNT(realized_margin_lc) = 0 OR COUNT(booked_revenue_lc)
      = 0)'
  - name: bmv_realized_margin_conservation_order_refund
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Lifetime SUM(order_refund_lc) in gold_realized_margin equals gold_payment_actuals refund_amount_lc
      sum within max(1.00, 0.1%) tolerance. Both sides allocate the same events (payments whose order
      has lines; NULL-order and zero-net events are excluded by both) with identical predicates: payment_type=''refund''
      AND payment_status NOT IN (''authorized'', ''declined'', ''voided'').'
    query: "SELECT 1 AS mismatch\nWHERE ABS(\n  (SELECT COALESCE(SUM(order_refund_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)\n\
      \  -\n  (SELECT COALESCE(SUM(refund_amount_lc), 0) FROM balancing_margin_and_volume.gold_payment_actuals)\n\
      ) > GREATEST(1.00, 0.001 * ABS((SELECT COALESCE(SUM(order_refund_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)))"
  - name: bmv_realized_margin_conservation_order_chargeback
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Lifetime SUM(order_chargeback_lc) in gold_realized_margin equals gold_payment_actuals
      chargeback_amount_lc sum within max(1.00, 0.1%) tolerance. Both sides use identical allocation predicates:
      payment_type=''chargeback'' AND payment_status NOT IN (''authorized'', ''declined'', ''voided'').'
    query: "SELECT 1 AS mismatch\nWHERE ABS(\n  (SELECT COALESCE(SUM(order_chargeback_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)\n\
      \  -\n  (SELECT COALESCE(SUM(chargeback_amount_lc), 0) FROM balancing_margin_and_volume.gold_payment_actuals)\n\
      ) > GREATEST(1.00, 0.001 * ABS((SELECT COALESCE(SUM(order_chargeback_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)))"
  - name: bmv_realized_margin_conservation_order_adjustment
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Lifetime SUM(order_adjustment_lc) in gold_realized_margin equals gold_payment_actuals
      adjustment_amount_lc sum within max(1.00, 0.1%) tolerance. Both sides use identical allocation predicates:
      payment_type=''adjustment'' AND payment_status NOT IN (''authorized'', ''declined'', ''voided'').
      Note: adjustments with NULL order_id cannot be allocated and are excluded from both views.'
    query: "SELECT 1 AS mismatch\nWHERE ABS(\n  (SELECT COALESCE(SUM(order_adjustment_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)\n\
      \  -\n  (SELECT COALESCE(SUM(adjustment_amount_lc), 0) FROM balancing_margin_and_volume.gold_payment_actuals)\n\
      ) > GREATEST(1.00, 0.001 * ABS((SELECT COALESCE(SUM(order_adjustment_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)))"
  - name: bmv_realized_margin_conservation_pos_booked
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Booked-side conservation: lifetime POS net sales in gold_realized_margin equal the POS
      sales fact. Catches a join that silently drops sales (e.g. a product or store key with no match).'
    query: "SELECT 1 AS mismatch\nWHERE ABS(\n  (SELECT COALESCE(SUM(pos_net_sales_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)\n\
      \  -\n  (SELECT COALESCE(SUM(net_revenue), 0) FROM transaction.sales)\n) > GREATEST(1.00, 0.001\
      \ * ABS((SELECT COALESCE(SUM(net_revenue), 0) FROM transaction.sales)))"
  - name: bmv_realized_margin_conservation_order_booked
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Booked-side conservation: lifetime order booked sales equal the order-line fact.'
    query: "SELECT 1 AS mismatch\nWHERE ABS(\n  (SELECT COALESCE(SUM(order_booked_sales_lc), 0) FROM balancing_margin_and_volume.gold_realized_margin)\n\
      \  -\n  (SELECT COALESCE(SUM(net_amount), 0) FROM orders.customer_order_line)\n) > GREATEST(1.00,\
      \ 0.001 * ABS((SELECT COALESCE(SUM(net_amount), 0) FROM orders.customer_order_line)))"
  - name: bmv_realized_margin_unit_cost_coverage
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: Share of booked revenue on products with no unit_cost (missing product row or NULL product.unit_cost,
      which the product checks tolerate). That revenue carries no COGS, so realized margin is overstated
      by it. Fires when more than 1% of booked revenue is uncosted.
    query: "SELECT uncosted_booked_lc, booked_lc\nFROM (\n  SELECT\n    SUM(CASE WHEN p.unit_cost IS NULL\
      \ THEN g.booked_revenue_lc ELSE 0 END) AS uncosted_booked_lc,\n    SUM(g.booked_revenue_lc) AS booked_lc\n\
      \  FROM balancing_margin_and_volume.gold_realized_margin g\n  LEFT JOIN product.product p ON g.product_sk\
      \ = p.product_sk\n)\nWHERE booked_lc > 0 AND uncosted_booked_lc > 0.01 * booked_lc"
- name: gold_sales_actuals
  physicalName: balancing_margin_and_volume.gold_sales_actuals
  physicalType: view
  description: Grain-level sales and volume actuals.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the product.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store.
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: date_key
    logicalType: date
    physicalType: DATE
  - name: units_sold
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: Raw units sold at the till.
  - name: gross_sales_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total sales value before discounts.
  - name: net_sales_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total sales value after discounts.
  - name: discount_value_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
  - name: returns_units
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: Units returned by customers.
  - name: net_units_sold
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: units_sold - returns_units.
  - name: log_units_sold
    logicalType: number
    physicalType: DECIMAL(10, 6)
  - name: log_net_sales_lc
    logicalType: number
    physicalType: DECIMAL(10, 6)
  - name: baseline_units_sold
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: De-seasonalized and de-promoted normal demand.
  - name: incremental_lift_units
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: Extra units sold attributable specifically to a promotion.
  - name: stockout_pct_day
    logicalType: number
    physicalType: DECIMAL(5, 4)
    description: Percentage of the day the product was out of stock on shelf.
  - name: units_received_today
    logicalType: number
    physicalType: DECIMAL(12, 3)
    description: Units received today for sell-through calculation.
  quality:
  - name: bmv_sales_actuals_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Ensure gold_sales_actuals operates at the product x store x date grain (spine for window
      measures)
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_sales_actuals

      GROUP BY product_sk, store_sk, date_key

      HAVING COUNT(*) > 1'
  - name: bmv_sales_actuals_inventory_validity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Ensure units_received_today is non-negative
    query: 'SELECT * FROM balancing_margin_and_volume.gold_sales_actuals

      WHERE units_received_today IS NOT NULL AND units_received_today < 0'
- name: gold_seasonality_features
  physicalName: balancing_margin_and_volume.gold_seasonality_features
  physicalType: view
  description: Seasonal and cyclical encodings for baseline models.
  tags:
  - gold
