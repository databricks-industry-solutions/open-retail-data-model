- name: mv_payment_actuals
  physicalName: balancing_margin_and_volume.mv_payment_actuals
  physicalType: view
  description: Payment-side revenue leakage metrics at product x store x day grain. Exposes settled sales,
    refunds, chargebacks, and adjustments with normalized rate measures (ratio-of-sums). Amounts dated
    by payment event date (cash basis). Per-product amounts are order-revenue-share allocations.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_id
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - article_id
      - item_code
      - sku_number
    description: Universal article identifier
  - name: store_id
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - location_code
      - branch_id
    description: Universal store identifier
  - name: date_key
    logicalType: date
    customProperties:
    - property: synonyms
      value:
      - payment_date
      - event_date
    description: Daily grain; attribution date is payment event date (refunds/chargebacks dated when money
      settles, not original sale date)
  - name: category
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - merch_category
      - department
    description: Merchandising category
  - name: store_format
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - format_type
      - store_class
    description: Store format or classification
  - name: fiscal_year
    logicalType: integer
    customProperties:
    - property: synonyms
      value:
      - retail_year
      - fy
    description: NRF 4-5-4 fiscal year, conformed on fiscal_calendar. Group with fiscal_period or fiscal_season
      so the same period in different years is not merged.
  - name: fiscal_season
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - retail_season
      - merch_season
      - half_year
    description: Retail merchandising half-year season (spring = fiscal periods 1-6, fall = 7-12), conformed
      on fiscal_calendar
  - name: fiscal_period
    logicalType: integer
    customProperties:
    - property: synonyms
      value:
      - fiscal_month
      - retail_period
    description: Fiscal period or month
  - name: currency_code
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - base_currency
      - reporting_currency
    description: Reporting/base currency of all monetary measures (ISO 4217), single-currency by construction
  - name: settled_sale_amount_lc
    logicalType: number
    businessName: Settled Sales (payment date)
    customProperties:
    - property: synonyms
      value:
      - order_settled_sales
      - settled_order_payments
    description: Total realized sales revenue from settled/captured payment events (order-grain events
      allocated to product x store x day via order line weight). This is the base denominator for all
      leakage rate calculations. Dated by payment event.
  - name: refund_amount_lc
    logicalType: number
    businessName: Refunds (payment date)
    customProperties:
    - property: synonyms
      value:
      - cash_refunds
      - refunds_by_payment_date
    description: Total refund magnitude (allocated, excluding declined/voided refunds). Contra-revenue
      representing voluntary customer returns processed as separate refund-typed payment events. Per-product
      amounts allocated by order-revenue share. Dated by payment event.
  - name: refund_rate
    logicalType: number
    businessName: Refund Rate (payment date)
    customProperties:
    - property: synonyms
      value:
      - refund_pct
      - cash_refund_rate
    description: 'Refund magnitude as a percentage of settled sales (ratio-of-sums: total refunds / total
      settled sales). No rolling or cohort logic baked in; filter date_key or fiscal_season at query time
      for period-specific rates. Dated by payment event.'
  - name: chargeback_amount_lc
    logicalType: number
    businessName: Chargebacks (payment date)
    customProperties:
    - property: synonyms
      value:
      - cash_chargebacks
      - chargebacks_by_payment_date
      - involuntary_returns
    description: Total chargeback magnitude (allocated, excluding declined/voided). Involuntary reversals
      initiated by the customer's payment provider (fraud/dispute), kept separate from refunds for root-cause
      analysis. Per-product amounts allocated by order-revenue share. Dated by payment event.
  - name: chargeback_rate
    logicalType: number
    businessName: Chargeback Rate (payment date)
    customProperties:
    - property: synonyms
      value:
      - dispute_rate
      - chargeback_pct
      - cash_chargeback_rate
    description: Chargeback magnitude as a percentage of settled sales (ratio-of-sums). Signals payment
      fraud or customer dispute risk; distinct from refund_rate for merchant risk assessment. Dated by
      payment event.
  - name: adjustment_amount_lc
    logicalType: number
    businessName: Adjustments (payment date)
    customProperties:
    - property: synonyms
      value:
      - cash_adjustments
      - adjustments_by_payment_date
      - payment_adjustments
    description: Total adjustment magnitude (allocated, excluding declined/voided). Post-sale goodwill
      credits, corrections, or disputed-amount settlements; a non-negative magnitude (payment.amount is
      >= 0 by contract) treated as contra-revenue, as in gold_payment_actuals. Per-product amounts allocated
      by order-revenue share. Dated by payment event.
  - name: adjustment_rate
    logicalType: number
    businessName: Adjustment Rate (payment date)
    customProperties:
    - property: synonyms
      value:
      - adjustment_pct
      - payment_adjustment_rate
    description: Adjustment magnitude as a percentage of settled sales (ratio-of-sums). Reflects post-sale
      discretionary credits (loyalty, goodwill, dispute settlement); isolated to measure operational fairness/discounting
      policy. Dated by payment event.
  - name: total_leakage_amount
    logicalType: number
    businessName: Payment Reversals (payment date)
    customProperties:
    - property: synonyms
      value:
      - cash_leakage
      - total_reversals
    description: Refunds plus chargebacks plus adjustments, dated by the payment event. Excludes order
      sales that were never captured or settled; mv_realized_margin leakage_lc includes them and is dated
      by the sale.
  - name: payment_leakage_rate
    logicalType: number
    businessName: Payment Reversal Rate (payment date)
    customProperties:
    - property: synonyms
      value:
      - payment_reversal_pct
      - reversal_share_of_settled
    description: Aggregate leakage (all contra-revenue) as a percentage of settled sales (ratio-of-sums).
      Holistic metric for revenue retention; complement is net realized revenue pct. Dated by payment
      event.
  - name: net_revenue_after_leakage
    logicalType: number
    businessName: Settled Sales After Reversals (payment date)
    customProperties:
    - property: synonyms
      value:
      - net_payment_revenue
      - cash_revenue_after_reversals
    description: Settled sales less all contra-revenue (refunds, chargebacks, adjustments). True net revenue
      from the payment perspective (not yet adjusted for cost to yield realized margin). Dated by payment
      event.
  - name: net_revenue_retention_pct
    logicalType: number
    businessName: Settled Sales Retained % (payment date)
    customProperties:
    - property: synonyms
      value:
      - revenue_retention_rate
      - net_revenue_pct
      - non_leakage_rate
    description: Percentage of settled sales retained after leakage (ratio-of-sums). Complement to payment_leakage_rate;
      a clean measure of end-to-end payment health. Dated by payment event.
