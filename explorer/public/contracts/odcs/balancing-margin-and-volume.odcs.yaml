- name: gold_payment_actuals
  physicalName: balancing_margin_and_volume.gold_payment_actuals
  physicalType: view
  description: 'Payment-side revenue leakage at product x store x day, giving BMV a REALIZED-margin lens
    the POS `sales` fact cannot: refunds, chargebacks, and adjustments (contra-revenue in money) plus
    a settled-sale base. This is the first consumer of the canonical-core `payment` domain.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the product (from the order line the payment allocated to).
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store (from the order line).
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product business key.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: date_key
    logicalType: date
    physicalType: DATE
    description: Payment event date (when money moved), not the original sale date.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Reporting/base currency of all monetary columns (ISO 4217 alpha-3); single-currency by
      construction.
  - name: settled_sale_amount_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Allocated magnitude of settled/captured sale payments; the base for payment-side leakage
      rates.
  - name: refund_amount_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Allocated magnitude of merchant-initiated refunds (contra-revenue). Distinct from chargebacks.
  - name: chargeback_amount_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Allocated magnitude of bank-initiated payment reversals (disputes); involuntary, typically
      irrecoverable, never touches the POS sales fact.
  - name: adjustment_amount_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Allocated magnitude of post-sale payment adjustments (goodwill / corrections); treated
      as contra-revenue.
  quality:
  - name: bmv_payment_actuals_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Ensure gold_payment_actuals operates at the product x store x date grain
    query: 'SELECT product_sk, store_sk, date_key

      FROM balancing_margin_and_volume.gold_payment_actuals

      GROUP BY product_sk, store_sk, date_key

      HAVING COUNT(*) > 1'
  - name: bmv_payment_actuals_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'All allocated payment magnitudes are in the single reporting/base currency. NULL-aware
      (matches bmv_single_currency_check): a NULL currency_code is a leak, not silently ignored.'
    query: "SELECT DISTINCT currency_code\nFROM balancing_margin_and_volume.gold_payment_actuals\nWHERE\
      \ currency_code <> (SELECT MAX(currency_code) FROM balancing_margin_and_volume.gold_payment_actuals)\n\
      \   OR currency_code IS NULL"
  - name: bmv_payment_actuals_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Allocated magnitudes are non-negative (payment_type carries direction, amount is a magnitude)
    query: "SELECT product_sk, store_sk, date_key\nFROM balancing_margin_and_volume.gold_payment_actuals\n\
      WHERE settled_sale_amount_lc < 0 OR refund_amount_lc < 0\n   OR chargeback_amount_lc < 0 OR adjustment_amount_lc\
      \ < 0"
  - name: bmv_payment_alloc_reconciliation
    type: sql
    dimension: accuracy
    severity: info
    description: Report the share of ALLOCATABLE payment magnitude that landed on the product grain. The
      denominator is scoped to the SAME event set the gold view aggregates (settled/captured sales + REALIZED
      refund/chargeback/adjustment) so the gap reflects allocation/bridge loss (orphan/zero-net orders)
      ONLY, not non-realized volume (authorized/declined/voided). The status predicate mirrors the gold
      view's M1 guard exactly. To match the view's append-only-lifecycle dedup (H1), the denominator also
      collapses to the latest row per payment_id, so a multi-row lifecycle counts its magnitude once on
      both sides. Metric never fails the run.
    query: "SELECT\n  (SELECT COALESCE(SUM(settled_sale_amount_lc + refund_amount_lc + chargeback_amount_lc\
      \ + adjustment_amount_lc), 0)\n     FROM balancing_margin_and_volume.gold_payment_actuals)\n  /\
      \ NULLIF((\n      SELECT SUM(amount) FROM (\n        SELECT amount, payment_type, payment_status,\n\
      \               ROW_NUMBER() OVER (PARTITION BY payment_id\n                                  ORDER\
      \ BY event_timestamp DESC, payment_sk DESC) AS rn\n        FROM payment.payment\n      )\n     \
      \ WHERE rn = 1\n        AND ((payment_type IN ('refund', 'chargeback', 'adjustment')\n         \
      \       AND payment_status NOT IN ('authorized', 'declined', 'voided'))\n             OR (payment_type\
      \ = 'sale' AND payment_status IN ('settled', 'captured')))), 0)\n    AS pct_payment_magnitude_allocated"
