  - name: date_key
    logicalType: date
    customProperties:
    - property: synonyms
      value:
      - sale_date
      - order_date
      - cohort_date
    description: Daily grain; sale-cohort basis (POS dated by sale day, orders dated by order_date)
  - name: category
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - merch_category
      - department
    description: Merchandising category
  - name: store_format
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - format_type
      - store_class
    description: Store format or classification. Order-channel rows carry the store the order is attributed
      to (ship-to or fulfilling store), so this dimension applies to both channels.
  - name: fiscal_year
    logicalType: integer
    customProperties:
    - property: synonyms
      value:
      - retail_year
      - fy
    description: NRF 4-5-4 fiscal year, conformed on fiscal_calendar. Group with fiscal_period or fiscal_season
