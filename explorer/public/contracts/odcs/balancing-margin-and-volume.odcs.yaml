- name: mv_sales_actuals
  physicalName: balancing_margin_and_volume.mv_sales_actuals
  physicalType: view
  description: Grain-level sales and volume actuals.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/balancing-margin-and-volume/README.md
    type: businessDefinition
  - url: outcome-packages/balancing-margin-and-volume/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    description: Surrogate key for the product.
  - name: store_sk
    logicalType: integer
    description: Surrogate key for the store.
  - name: product_id
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - article_id
      - item_code
      - sku_number
    description: Universal article identifier
  - name: store_id
    logicalType: string
    customProperties:
    - property: synonyms
      value:
      - store_id
      - location_code
      - branch_id
    description: Universal store identifier
  - name: date_key
    logicalType: date
    customProperties:
    - property: synonyms
      value:
      - snapshot_date
      - calendar_day
    description: Daily grain
  - name: fiscal_season
    customProperties:
    - property: synonyms
      value:
      - retail_season
      - merch_season
    description: Retail merchandising half-year season (spring = fiscal periods 1-6, fall = 7-12), conformed
      on fiscal_calendar.
  - name: fiscal_period
    description: Fiscal period or month
  - name: total_units_sold
    logicalType: number
    businessName: Total Units Sold
    customProperties:
    - property: synonyms
      value:
      - overall_volume
      - total_quantity_moved
    description: Total units sold
  - name: total_net_sales
    logicalType: number
    businessName: Total Net Sales
    customProperties:
    - property: synonyms
      value:
      - realized_revenue
    description: Total net sales in local currency
  - name: total_discount_value
    logicalType: number
    businessName: Total Discount Value
    customProperties:
    - property: synonyms
      value:
      - total_savings_amount
    description: Total discount value in local currency
  - name: total_gross_sales
    logicalType: number
    businessName: Total Gross Sales
    customProperties:
    - property: synonyms
      value:
      - pre_discount_revenue
      - ticket_sales_value
    description: Total gross sales value
  - name: markdown_rate
    logicalType: number
    businessName: Markdown Rate
    customProperties:
    - property: synonyms
      value:
      - discount_percentage
      - markdown_depth_ratio
    description: Markdown discount value as a percentage of gross sales
  - name: total_returns
    logicalType: number
    businessName: Total Returns
    customProperties:
    - property: synonyms
      value:
      - refunded_units
      - returned_items_count
    description: Total units returned
  - name: net_units_sold
    logicalType: number
    businessName: Net Units Sold
    customProperties:
    - property: synonyms
      value:
      - kept_volume
      - post_returns_quantity
    description: Net units sold after returns
  - name: stockout_adjusted_demand
    logicalType: number
    businessName: Stockout-Adjusted Demand
    customProperties:
    - property: synonyms
      value:
      - unconstrained_demand_estimate
      - lost_sales_adjusted_volume
    description: Estimated unconstrained demand adjusting for stockouts
  - name: total_baseline_units_sold
    logicalType: number
    businessName: Total Baseline Units Sold
    customProperties:
    - property: synonyms
      value:
      - organic_volume
      - non_promo_base_demand
    description: De-seasonalized and de-promoted normal demand.
  - name: total_incremental_lift_units
    logicalType: number
    businessName: Total Incremental Lift Units
    customProperties:
    - property: synonyms
      value:
      - promo_driven_extra_volume
      - campaign_lift_quantity
    description: Extra units sold attributable specifically to a promotion.
  - name: avg_stockout_pct_day
    logicalType: number
    businessName: Avg Stockout Pct per Day
    customProperties:
    - property: synonyms
      value:
      - shelf_empty_duration_pct
      - oos_time_ratio
    description: Percentage of the day the product was out of stock on shelf.
  - name: sell_through_pct
    logicalType: number
    businessName: Sell-Through Pct
    customProperties:
    - property: synonyms
      value:
      - sell_through_rate
      - str
      - sell_through
      - season_to_date_sell_through
      - rolling_90d_sell_through_pct
      - fiscal_season_sell_through_pct
    description: 'Units sold as a percentage of units received (ratio of sums) over the query''s grouping/filter
      window. No rolling or seasonal logic is baked in: group by the fiscal_season dimension for season-to-date
      sell-through, or filter date_key to a trailing window (e.g. 90 days) for rolling sell-through. Replaces
      the former identical rolling_90d_sell_through_pct + fiscal_season_sell_through_pct measures, whose
      names implied window/season logic the expr never carried.'
