    physicalType: DECIMAL(18, 2)
    description: Derived maximum price bounded by MRP.
  - name: min_price_lc
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Derived minimum price bounded by cost and min margin.
  - name: max_competitor_index
    logicalType: number
    physicalType: DECIMAL(5, 4)
    description: Maximum allowable price index against the primary competitor.
  - name: price_rounding_rule_code
    logicalType: string
    physicalType: STRING
    description: Rule applied to round recommended prices.
  quality:
  - name: bmv_pricing_constraints_logic
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Minimum bound price cannot be greater than the maximum bound price
    query: 'SELECT * FROM balancing_margin_and_volume.gold_pricing_constraints

      WHERE min_price_lc > max_price_lc'
