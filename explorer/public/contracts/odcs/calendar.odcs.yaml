    required: false
    description: TRUE for Saturday/Sunday.
  - name: is_holiday
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if a recognized retail holiday.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    required: false
    description: NRF 4-5-4 fiscal year.
  - name: fiscal_quarter
    logicalType: integer
    physicalType: INT
    required: false
    description: NRF fiscal quarter (1-4).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (fiscal_quarter IS NULL OR fiscal_quarter BETWEEN 1 AND 4).
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    required: false
    description: NRF fiscal period / retail month (1-12), following the 4-5-4 week pattern.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (fiscal_period IS NULL OR fiscal_period BETWEEN 1 AND 12).
  - name: fiscal_season
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Retail merchandising half-year season derived from fiscal_period: spring for periods
      1-6 (fiscal H1), fall for periods 7-12 (fiscal H2). Labels follow the northern-hemisphere retail-season
      convention; they name the fiscal half, not a local meteorological season. Allowed values: spring,
      fall.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: spring, fall.'
  - name: fiscal_week
    logicalType: integer
    physicalType: INT
    required: false
    description: NRF fiscal week within the fiscal year (1-53).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (fiscal_week IS NULL OR fiscal_week BETWEEN 1 AND 53).
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    required: false
    description: Week identifier = fiscal_year * 100 + fiscal_week (e.g. 202614). Week-level join key.
  - name: fiscal_week_index
    logicalType: integer
    physicalType: INT
    required: false
    description: Globally monotonic week counter across the whole calendar; use for trailing N-week windows.
  - name: fiscal_week_start_date
    logicalType: date
    physicalType: DATE
    required: false
    description: First date (Sunday, NRF convention) of the fiscal week.
  - name: fiscal_week_end_date
    logicalType: date
