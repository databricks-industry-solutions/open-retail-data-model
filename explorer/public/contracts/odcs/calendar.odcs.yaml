  quality:
  - name: calendar_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: calendar_keys_not_null
    query: "SELECT * FROM calendar.fiscal_calendar\nWHERE date_sk IS NULL OR date_key IS NULL OR date_id\
      \ IS NULL\n   OR fiscal_week_id IS NULL OR fiscal_week_index IS NULL"
  - name: calendar_date_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: calendar_date_unique
    query: 'SELECT date_key, COUNT(*) AS rows

      FROM calendar.fiscal_calendar

      GROUP BY date_key

      HAVING COUNT(*) > 1'
  - name: calendar_fiscal_ranges
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'NRF 4-5-4 bounds: week 1-53, quarter 1-4, period 1-12.'
    query: "SELECT * FROM calendar.fiscal_calendar\nWHERE fiscal_week NOT BETWEEN 1 AND 53\n   OR fiscal_quarter\
      \ NOT BETWEEN 1 AND 4\n   OR fiscal_period NOT BETWEEN 1 AND 12"
  - name: calendar_fiscal_season_matches_period
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'fiscal_season is derived from fiscal_period: spring = periods 1-6 (H1), fall = 7-12
      (H2). Catches a season that disagrees with its period (derivation drift), plus any value outside
      the two-season domain.'
    query: "SELECT * FROM calendar.fiscal_calendar\nWHERE fiscal_season IS NOT NULL\n  AND ( fiscal_season\
      \ NOT IN ('spring', 'fall')\n     OR (fiscal_season = 'spring' AND fiscal_period NOT BETWEEN 1 AND\
      \ 6)\n     OR (fiscal_season = 'fall'   AND fiscal_period NOT BETWEEN 7 AND 12) )"
  - name: calendar_week_date_order
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: calendar_week_date_order
    query: 'SELECT * FROM calendar.fiscal_calendar

      WHERE fiscal_week_end_date < fiscal_week_start_date'
  - name: calendar_weeks_per_year_4_5_4
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'NRF 4-5-4 allows 52 or 53 weeks per fiscal year. This flags any fiscal year with MORE
      than 53 weeks (a calendar bug). Partial leading/trailing years in a bounded synthetic span are expected
      and not flagged. NOTE: the synthetic generator models 52-week years only (no NRF 53rd leap week)
      — see runtime/synthetic-data/generators/trade_promotion.py.'
    query: 'SELECT fiscal_year, COUNT(DISTINCT fiscal_week) AS weeks_in_year

      FROM calendar.fiscal_calendar

      GROUP BY fiscal_year

      HAVING COUNT(DISTINCT fiscal_week) > 53'
- name: fx_rate
  physicalName: calendar.fx_rate
  physicalType: table
  description: ORDM canonical-core daily FX rates (from -> base). Conversion reference for single-currency
    normalization.
  tags:
  - reference
  authoritativeDefinitions:
  - url: canonical-core/calendar/README.md
    type: businessDefinition
  - url: canonical-core/calendar/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: fx_rate_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: fx_rate_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key (date_key|from|to).
  - name: date_key
    logicalType: date
    physicalType: DATE
    required: true
    description: Rate date. Logical join key to fiscal_calendar.date_key (not a declared UC FK; ISO 8601).
  - name: from_currency_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Source currency, ISO 4217 alpha-3.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (from_currency_code IS NULL OR char_length(from_currency_code) = 3).
  - name: to_currency_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Target/reporting currency, ISO 4217 alpha-3 (the base_currency).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (to_currency_code IS NULL OR char_length(to_currency_code) = 3).
  - name: rate
    logicalType: number
    physicalType: DECIMAL(18,8)
    required: false
    description: Multiply a from-currency amount by rate to get the to-currency amount. 1.0 when from
      = to.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (rate IS NULL OR rate > 0).
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601). Required on reference
      tables (standard §8).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601). Required on reference
      tables (standard §8).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Timestamp this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: fx_rate_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fx_rate_keys_not_null
    query: "SELECT * FROM calendar.fx_rate\nWHERE fx_rate_sk IS NULL OR fx_rate_id IS NULL OR date_key\
      \ IS NULL\n   OR from_currency_code IS NULL OR to_currency_code IS NULL OR rate IS NULL"
  - name: fx_rate_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One rate per (date, from, to).
    query: 'SELECT date_key, from_currency_code, to_currency_code, COUNT(*) AS rows

      FROM calendar.fx_rate

      GROUP BY date_key, from_currency_code, to_currency_code

      HAVING COUNT(*) > 1'
  - name: fx_rate_positive
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: FX rates must be strictly positive.
    query: 'SELECT * FROM calendar.fx_rate

      WHERE rate <= 0'
  - name: fx_rate_base_self_rate
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The base->base self-rate must be exactly 1 (identity conversion).
    query: 'SELECT * FROM calendar.fx_rate

      WHERE from_currency_code = to_currency_code AND rate <> 1'
  - name: fx_rate_calendar_coverage
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: Every rate date should exist in the fiscal calendar.
    query: 'SELECT fx.date_key FROM calendar.fx_rate fx

      LEFT JOIN calendar.fiscal_calendar c ON fx.date_key = c.date_key

      WHERE c.date_key IS NULL

      GROUP BY fx.date_key'
  - name: fx_rate_single_base
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The canonical core normalizes to ONE reporting currency: every row must convert TO the
      same base currency.'
    query: 'SELECT COUNT(DISTINCT to_currency_code) AS distinct_base

      FROM calendar.fx_rate

      HAVING COUNT(DISTINCT to_currency_code) > 1'
