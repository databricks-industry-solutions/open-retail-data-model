  - name: calendar_day
    logicalType: integer
    physicalType: INT
    required: false
    description: Day of month (1-31).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (calendar_day IS NULL OR calendar_day BETWEEN 1 AND 31).
