    mustBe: 0
    unit: rows
    description: shipment_tracking_lat_lon_range
    query: "SELECT * FROM logistics.shipment_tracking\nWHERE (latitude IS NOT NULL AND (latitude < -90\
      \ OR latitude > 90))\n   OR (longitude IS NOT NULL AND (longitude < -180 OR longitude > 180))"
  - name: shipment_tracking_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: shipment_tracking_rowcount
    query: SELECT COUNT(*) AS shipment_tracking_rows FROM logistics.shipment_tracking
  - name: shipment_tracking_avg_latency
    type: sql
    dimension: accuracy
    severity: info
    description: shipment_tracking_avg_latency
    query: 'SELECT ROUND(AVG(latency_seconds), 1) AS avg_latency_seconds

      FROM logistics.shipment_tracking'
  - name: shipment_tracking_checkpoint_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: shipment_tracking_checkpoint_distribution
    query: 'SELECT checkpoint_type, COUNT(*) AS event_count

      FROM logistics.shipment_tracking

      GROUP BY checkpoint_type'
