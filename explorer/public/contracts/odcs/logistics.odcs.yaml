      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable product business key.
  - name: po_line_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to purchase_order_line.po_line_sk (foreign surrogate; nullable, not a PK). The purchase-order
      line this shipment line fulfills. purchase_order_line is an append-only transactional fact (NOT
      SCD2), so this is a straight surrogate FK with no version ambiguity. Declared as informational FK
      fk_shipment_line_purchase_order_line in relationships.sql; the durable po_line_id business key is
      retained below.
    relationships:
    - to: purchase_order_line.po_line_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: procurement
      - property: enforced
        value: false
  - name: po_line_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable purchase-order line business key this shipment line fulfills. Retained alongside
      po_line_sk; the declared UC FK is on the surrogate.
  - name: shipped_quantity
    logicalType: integer
    physicalType: INT
    required: true
    description: Units shipped on this line.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (shipped_quantity >= 0 AND (received_quantity IS NULL OR received_quantity >=
        0) AND (damaged_quantity IS NULL OR damaged_quantity >= 0)).
  - name: received_quantity
    logicalType: integer
    physicalType: INT
    required: false
    description: Units actually received; NULL if not yet delivered.
  - name: damaged_quantity
    logicalType: integer
    physicalType: INT
    required: false
    description: Units received damaged.
  - name: unit_weight_kg
    logicalType: number
    physicalType: DECIMAL(10,3)
    required: false
    description: Weight per unit in kilograms.
  - name: line_weight_kg
    logicalType: number
    physicalType: DECIMAL(12,3)
    required: false
    description: Total line weight in kilograms.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: shipment_line_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shipment_line_pk_unique
    query: 'SELECT shipment_line_sk

      FROM logistics.shipment_line

      GROUP BY shipment_line_sk

      HAVING COUNT(*) > 1'
  - name: shipment_line_shipment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shipment_line_shipment_fk_orphan
    query: 'SELECT sl.* FROM logistics.shipment_line sl

      LEFT JOIN logistics.shipment s ON sl.shipment_sk = s.shipment_sk

      WHERE s.shipment_sk IS NULL AND sl.shipment_sk IS NOT NULL'
  - name: shipment_line_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shipment_line_product_fk_orphan
    query: 'SELECT sl.* FROM logistics.shipment_line sl

      LEFT JOIN product.product p ON sl.product_sk = p.product_sk

      WHERE p.product_sk IS NULL AND sl.product_sk IS NOT NULL'
  - name: shipment_line_po_line_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every non-null po_line_sk must reference an existing purchase_order_line (surrogate FK).
    query: 'SELECT sl.* FROM logistics.shipment_line sl

      LEFT JOIN procurement.purchase_order_line pol ON sl.po_line_sk = pol.po_line_sk

      WHERE pol.po_line_sk IS NULL AND sl.po_line_sk IS NOT NULL'
  - name: shipment_line_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: shipment_line_rowcount
    query: SELECT COUNT(*) AS shipment_line_rows FROM logistics.shipment_line
