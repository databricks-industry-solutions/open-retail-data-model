- name: promotion
  physicalName: marketing.promotion
  physicalType: table
  description: Trade-promotion dimension (SCD2) for the Promote with Purpose outcome package.
  tags:
  - master
  authoritativeDefinitions:
  - url: canonical-core/marketing/README.md
    type: businessDefinition
  - url: canonical-core/marketing/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: promo_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version; the join/FK target.
  - name: promo_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the promotion. The reserved value NO_PROMO marks the
      no-promotion member.
  - name: promo_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable promotion name.
  - name: promo_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Promotion mechanic. Allowed values: TPR, FEATURE, DISPLAY, FEATURE_AND_DISPLAY, BOGO,
      COUPON, BUNDLE. NULL only for the NO_PROMO member.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: TPR, FEATURE, DISPLAY, FEATURE_AND_DISPLAY, BOGO, COUPON, BUNDLE.'
  - name: funding_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How the promotion is funded. Allowed values: OFF_INVOICE, BILL_BACK, SCAN_DOWN, LUMP_SUM.
      NULL only for the NO_PROMO member.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: OFF_INVOICE, BILL_BACK, SCAN_DOWN, LUMP_SUM.'
  - name: funded_by
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Who funds the promotion. Allowed values: SUPPLIER, RETAILER, SHARED. NULL only for the
      NO_PROMO member.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: SUPPLIER, RETAILER, SHARED.'
  - name: supplier_share_pct
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Percent of trade spend funded by the supplier (0-100). Required when funded_by <> RETAILER.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (supplier_share_pct IS NULL OR (supplier_share_pct >= 0 AND supplier_share_pct
        <= 100)).
  - name: start_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Promotion start date, inclusive (ISO 8601).
  - name: end_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Promotion end date, inclusive (ISO 8601).
  - name: fiscal_week_start
    logicalType: integer
    physicalType: INT
    required: false
    description: Fiscal week id (fiscal_calendar.fiscal_week_id) containing start_date.
  - name: fiscal_week_end
    logicalType: integer
    physicalType: INT
    required: false
    description: Fiscal week id (fiscal_calendar.fiscal_week_id) containing end_date.
  - name: planned_discount_pct
    logicalType: number
    physicalType: DECIMAL(5,2)
    required: false
    description: Planned price discount percent (0-100).
  - name: planned_lift_pct
    logicalType: number
    physicalType: DECIMAL(6,2)
    required: false
    description: Planned incremental unit lift percent over baseline.
  - name: planned_trade_spend
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Planned total trade spend for the promotion, in the reporting/base currency (single-currency
      by construction).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (planned_trade_spend IS NULL OR planned_trade_spend >= 0).
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: promotion_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: promotion_keys_not_null
    query: 'SELECT * FROM marketing.promotion

      WHERE promo_sk IS NULL OR promo_id IS NULL OR is_current IS NULL'
  - name: promotion_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: promotion_business_key_unique_current
    query: 'SELECT promo_id, COUNT(*) AS current_versions

      FROM marketing.promotion

      WHERE is_current = true

      GROUP BY promo_id

      HAVING COUNT(*) > 1'
  - name: promotion_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: promotion_type_domain
    query: "SELECT * FROM marketing.promotion\nWHERE promo_type IS NOT NULL\n  AND promo_type NOT IN ('TPR',\
      \ 'FEATURE', 'DISPLAY', 'FEATURE_AND_DISPLAY', 'BOGO', 'COUPON', 'BUNDLE')"
  - name: promotion_funding_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: promotion_funding_type_domain
    query: "SELECT * FROM marketing.promotion\nWHERE funding_type IS NOT NULL\n  AND funding_type NOT\
      \ IN ('OFF_INVOICE', 'BILL_BACK', 'SCAN_DOWN', 'LUMP_SUM')"
  - name: promotion_funded_by_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: promotion_funded_by_domain
    query: "SELECT * FROM marketing.promotion\nWHERE funded_by IS NOT NULL\n  AND funded_by NOT IN ('SUPPLIER',\
      \ 'RETAILER', 'SHARED')"
  - name: promotion_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: End date must not precede start date.
    query: 'SELECT * FROM marketing.promotion

      WHERE start_date IS NOT NULL AND end_date IS NOT NULL AND end_date < start_date'
  - name: promotion_supplier_share_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: supplier_share_pct must be within [0, 100] when present.
    query: 'SELECT * FROM marketing.promotion

      WHERE supplier_share_pct IS NOT NULL AND (supplier_share_pct < 0 OR supplier_share_pct > 100)'
  - name: promotion_supplier_share_required
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: supplier_share_pct is mandatory unless the retailer funds the whole promotion.
    query: 'SELECT * FROM marketing.promotion

      WHERE funded_by IS NOT NULL AND funded_by <> ''RETAILER'' AND supplier_share_pct IS NULL'
