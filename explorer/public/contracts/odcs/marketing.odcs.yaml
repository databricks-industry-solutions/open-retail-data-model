      \ NOT IN ('behavioral', 'value_rfm', 'lifecycle', 'demographic', 'geographic', 'predictive', 'lookalike',\
      \ 'contextual')"
  - name: audience_definition_origin_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
