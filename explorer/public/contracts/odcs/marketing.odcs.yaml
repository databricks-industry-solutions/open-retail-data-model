    query: "SELECT * FROM marketing.audience\nWHERE definition_origin IS NOT NULL\n  AND definition_origin\
      \ NOT IN ('canned', 'custom', 'agent_generated')"
  - name: audience_definition_method_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: audience_definition_method_domain
    query: "SELECT * FROM marketing.audience\nWHERE definition_method IS NOT NULL\n  AND definition_method\
      \ NOT IN ('rule', 'ml_score', 'imported')"
  - name: audience_evaluation_mode_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
