  physicalName: customer.consent
  physicalType: table
  description: ORDM canonical-core customer consent — the single source of truth for opt-ins and processing
    permissions.
  tags:
  - master
  authoritativeDefinitions:
  - url: canonical-core/customer/README.md
    type: businessDefinition
  - url: canonical-core/customer/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: consent_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per consent version.
  - name: consent_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the consent record.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to profile.profile_sk.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key of the customer giving/withholding consent.
  - name: consent_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'What the consent governs. third_party_sharing = disclosure of personal information for
      cross-context behavioral advertising (CCPA/CPRA do-not-SHARE); data_sale = disclosure for monetary
      or other valuable consideration (CCPA/CPRA do-not-SELL) - the two are legally distinct opt-outs
      (the mandated link reads Do Not Sell or Share), so they are separate types, not one. Allowed values:
      marketing_email, marketing_sms, marketing_phone, marketing_postal, data_processing, third_party_sharing,
      data_sale, profiling, cookies.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: marketing_email, marketing_sms, marketing_phone, marketing_postal,
        data_processing, third_party_sharing, data_sale, profiling, cookies.'
  - name: consent_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Current decision. Allowed values: granted, withdrawn, pending, expired.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: granted, withdrawn, pending, expired.'
  - name: legal_basis
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lawful basis for processing. Allowed values: consent, contract, legitimate_interest,
      legal_obligation, vital_interest, public_task.'
  - name: capture_channel
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Channel where consent was captured (vendor-neutral). Allowed values: web, mobile_app,
      store, call_center, email.'
  - name: disclosure_version
    logicalType: string
    physicalType: STRING
    required: false
    description: Identifier/version of the consent statement or privacy notice presented at capture.
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Region/law scope this decision applies under. May be an ISO 3166-1 country (GB), an ISO
      3166-2 subdivision (US-CA), or a reserved regional code (EU) — not alpha-2-only, since regulatory
      scope does not map cleanly to countries. Lets one customer hold different consent per jurisdiction
      (GDPR vs CCPA/CPRA). NULL = global/unspecified.
  - name: suppression_indicator
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Operational do-not-activate overlay for this consent scope. TRUE = suppress activation
      on this purpose x channel even when consent_status is granted (suppression OVERRIDES consent). Distinct
      from withdrawal (consent_status=withdrawn is the customer revoking permission; suppression is an
      operational/legal do-not-contact signal, e.g. hard bounce or a direct-marketing objection). NULL/FALSE
      = not suppressed.
  - name: suppression_reason_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Why this scope is suppressed (set only when suppression_indicator is TRUE). Two scopes:
      CHANNEL-level reasons block only this consent scope (unsubscribe, hard_bounce, spam_complaint, list_hygiene);
      PERSON-level reasons block every plane for the profile (deceased, fraud, do_not_contact, legal_objection)
      via the shared UCV gold_person_do_not_target_current view, which both the owned activation gate
      and any paid/non-owned plane consult (ADR 0028). Allowed values: unsubscribe, hard_bounce, spam_complaint,
      legal_objection, deceased, fraud, do_not_contact, list_hygiene.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: unsubscribe, hard_bounce, spam_complaint, legal_objection, deceased,
        fraud, do_not_contact, list_hygiene.'
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this consent version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL while still in effect.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently effective consent record per (profile, consent_type, jurisdiction_code).'
  - name: decision_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Legal-grade instant the consent decision was given/withdrawn (UTC, ISO 8601).
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: consent_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: consent_keys_not_null
    query: "SELECT * FROM customer.consent\nWHERE consent_sk IS NULL OR consent_id IS NULL OR profile_id\
      \ IS NULL\n   OR consent_type IS NULL OR consent_status IS NULL\n   OR effective_from_date IS NULL\
      \ OR is_current IS NULL"
  - name: consent_profile_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: consent_profile_businesskey_orphan
    query: "SELECT c.* FROM customer.consent c\nLEFT JOIN (SELECT DISTINCT profile_id FROM customer.profile)\
      \ p\n  ON c.profile_id = p.profile_id\nWHERE p.profile_id IS NULL"
  - name: consent_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: consent_type_domain
    query: "SELECT * FROM customer.consent\nWHERE consent_type NOT IN ('marketing_email', 'marketing_sms',\
      \ 'marketing_phone',\n  'marketing_postal', 'data_processing', 'third_party_sharing', 'data_sale',\
      \ 'profiling', 'cookies')"
  - name: consent_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: consent_status_domain
    query: 'SELECT * FROM customer.consent

      WHERE consent_status NOT IN (''granted'', ''withdrawn'', ''pending'', ''expired'')'
  - name: consent_single_current_per_type
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Single source of truth: at most one current consent per (profile, type, jurisdiction).
      jurisdiction_code is nullable (global/unspecified); COALESCE so NULLs group together.'
    query: 'SELECT profile_id, consent_type, COALESCE(jurisdiction_code, '''') AS jurisdiction_code, COUNT(*)
      AS current_rows

      FROM customer.consent

      WHERE is_current = true

      GROUP BY profile_id, consent_type, COALESCE(jurisdiction_code, '''')

      HAVING COUNT(*) > 1'
  - name: consent_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The current version must have an open (NULL) end date; non-current must be closed. (Consent
      is an SCD2 date-grained master like profile/household/channel_preference; the activation gate now
      depends on consent SCD2 integrity, so it carries the same guards.)
    query: "SELECT * FROM customer.consent\nWHERE (is_current = true  AND effective_to_date IS NOT NULL)\n\
      \   OR (is_current = false AND effective_to_date IS NULL)"
  - name: consent_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When set, the end date must be strictly after the start date.
    query: "SELECT * FROM customer.consent\nWHERE effective_to_date IS NOT NULL\n  AND effective_to_date\
      \ <= effective_from_date"
  - name: consent_suppression_reason_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: consent_suppression_reason_domain
    query: "SELECT * FROM customer.consent\nWHERE suppression_reason_code IS NOT NULL\n  AND suppression_reason_code\
      \ NOT IN ('unsubscribe', 'hard_bounce', 'spam_complaint',\n    'legal_objection', 'deceased', 'fraud',\
      \ 'do_not_contact', 'list_hygiene')"
  - name: consent_suppression_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'A suppression reason is meaningful only when the scope is actually suppressed. This
      guard is ONE-DIRECTIONAL BY DESIGN (reason ⇒ indicator, not the reverse): an indicator=TRUE with
      a NULL reason is a valid CHANNEL-scope-only suppression that blocks its own scope but will NOT propagate
      person-wide — person-level propagation in the activation gate keys on the reason (deceased/fraud/do_not_contact/legal_objection),
      so an uncategorized suppression deliberately stays channel-local.'
    query: 'SELECT * FROM customer.consent

      WHERE suppression_reason_code IS NOT NULL AND COALESCE(suppression_indicator, FALSE) = FALSE'
  - name: consent_suppressed_rate
    type: sql
    dimension: accuracy
    severity: info
    description: Share of current consent scopes carrying an active suppression overlay.
    query: 'SELECT ROUND(AVG(CASE WHEN COALESCE(suppression_indicator, FALSE) THEN 1.0 ELSE 0 END), 4)
      AS suppressed_rate

      FROM customer.consent

      WHERE is_current = true'
- name: contact
  physicalName: customer.contact
  physicalType: table
  description: ORDM canonical-core customer contact points (email/phone), operational current-state.
  tags:
  - master
  authoritativeDefinitions:
  - url: canonical-core/customer/README.md
    type: businessDefinition
  - url: canonical-core/customer/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: contact_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: contact_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the contact point.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to profile.profile_sk.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key of the owning customer.
  - name: contact_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Type of contact point. Allowed values: email, mobile_phone, landline_phone, fax.'
  - name: contact_value
    logicalType: string
    physicalType: STRING
    required: false
    description: The email address or phone number (PII). Format depends on contact_type.
    classification: restricted
    tags:
    - dbx_pii_email
    - dbx_pii_phone
  - name: country_calling_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'For phone types: country calling code without the + prefix (e.g. 1, 44).'
  - name: is_primary
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if this is the primary contact point of its type for the customer.
  - name: is_verified
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if the contact point has been verified (e.g. confirmed email / SMS).
  - name: verified_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Timestamp the contact point was verified (UTC, ISO 8601); NULL if unverified.
  - name: contact_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Deliverability/consent status. Allowed values: active, inactive, bounced, opted_out.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, inactive, bounced, opted_out.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: contact_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: contact_keys_not_null
    query: "SELECT * FROM customer.contact\nWHERE contact_sk IS NULL OR contact_id IS NULL OR profile_id\
      \ IS NULL\n   OR contact_type IS NULL OR contact_value IS NULL"
  - name: contact_profile_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: contact_profile_businesskey_orphan
    query: "SELECT c.* FROM customer.contact c\nLEFT JOIN (SELECT DISTINCT profile_id FROM customer.profile)\
      \ p\n  ON c.profile_id = p.profile_id\nWHERE p.profile_id IS NULL"
  - name: contact_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: contact_type_domain
    query: 'SELECT * FROM customer.contact

      WHERE contact_type NOT IN (''email'', ''mobile_phone'', ''landline_phone'', ''fax'')'
  - name: contact_email_shape
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: Email contact points should look like an email address.
    query: 'SELECT * FROM customer.contact

      WHERE contact_type = ''email'' AND contact_value NOT LIKE ''%@%.%'''
- name: household
  physicalName: customer.household
  physicalType: table
  description: ORDM canonical-core household master (SCD2). Conformed household grouping shared by all
    outcome packages.
  tags:
  - master
  authoritativeDefinitions:
  - url: canonical-core/customer/README.md
    type: businessDefinition
  - url: canonical-core/customer/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: household_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version. FK target for profile.household_sk.
  - name: household_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the household. Referenced by profile.household_id. Treated
      as PII.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: household_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Nature of the household grouping. Allowed values: family, single, shared, business,
      other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: family, single, shared, business, other.'
  - name: formation_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Date the household grouping was first established/observed (ISO 8601 date).
  - name: household_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle status. Allowed values: active, inactive.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, inactive.'
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this household.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: household_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: household_keys_not_null
    query: "SELECT * FROM customer.household\nWHERE household_sk IS NULL OR household_id IS NULL\n   OR\
      \ effective_from_date IS NULL OR is_current IS NULL"
  - name: household_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A business key must resolve to at most one current version.
    query: 'SELECT household_id, COUNT(*) AS current_versions

      FROM customer.household

      WHERE is_current = true

      GROUP BY household_id

      HAVING COUNT(*) > 1'
  - name: household_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: household_type_domain
    query: "SELECT * FROM customer.household\nWHERE household_type IS NOT NULL\n  AND household_type NOT\
      \ IN ('family', 'single', 'shared', 'business', 'other')"
  - name: household_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: household_status_domain
    query: "SELECT * FROM customer.household\nWHERE household_status IS NOT NULL\n  AND household_status\
      \ NOT IN ('active', 'inactive')"
  - name: household_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: household_scd2_current_open
    query: "SELECT * FROM customer.household\nWHERE (is_current = true  AND effective_to_date IS NOT NULL)\n\
      \   OR (is_current = false AND effective_to_date IS NULL)"
  - name: household_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: household_scd2_date_order
    query: "SELECT * FROM customer.household\nWHERE effective_to_date IS NOT NULL\n  AND effective_to_date\
      \ <= effective_from_date"
- name: identity_link
  physicalName: customer.identity_link
  physicalType: table
  description: ORDM canonical-core resolved identity links — pseudonymized identifier→profile assertions
    with match confidence.
  tags:
  - association
  authoritativeDefinitions:
  - url: canonical-core/customer/README.md
    type: businessDefinition
  - url: canonical-core/customer/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: identity_link_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: identity_link_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the assertion, stable per (source_system, identifier_type,
      identifier_value_hash) across SCD2 versions.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to profile.profile_sk (the profile version this identifier resolves to).
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key of the resolved customer (join on current profile version).
  - name: source_system
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system that asserted the identifier (vendor-neutral label).
  - name: identifier_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Type of identifier. Allowed values: email_hash, phone_hash, device_id, cookie_id, maid,
      loyalty_id, login_id, customer_id.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: email_hash, phone_hash, device_id, cookie_id, maid, loyalty_id, login_id,
        customer_id.'
  - name: identifier_value_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Canonical hashed/tokenized identifier value. Never a raw email/phone/device id (PII,
      pseudonymized).
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: match_method
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How the link was established. Allowed values: deterministic, probabilistic, declared,
      manual.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: deterministic, probabilistic, declared, manual.'
  - name: match_confidence
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Resolution confidence in [0,1]. 1.0000 = asserted/deterministic.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (match_confidence IS NULL OR (match_confidence >= 0 AND match_confidence <= 1)).
  - name: link_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle of the link. Allowed values: active, superseded, suppressed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, superseded, suppressed.'
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this link version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL while still in effect.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently effective version of this identity link.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: identity_link_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: identity_link_keys_not_null
    query: "SELECT * FROM customer.identity_link\nWHERE identity_link_sk IS NULL OR identity_link_id IS\
      \ NULL OR profile_id IS NULL\n   OR effective_from_date IS NULL OR is_current IS NULL"
  - name: identity_link_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: identity_link_business_key_unique_current
    query: 'SELECT identity_link_id, COUNT(*) AS current_versions

      FROM customer.identity_link

      WHERE is_current = true

      GROUP BY identity_link_id

      HAVING COUNT(*) > 1'
  - name: identity_link_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every link must resolve to an existing profile (by surrogate FK).
    query: 'SELECT il.* FROM customer.identity_link il

      LEFT JOIN customer.profile p ON il.profile_sk = p.profile_sk

      WHERE il.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: identity_link_profile_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The durable resolved-customer business key must also exist on profile.
    query: "SELECT il.* FROM customer.identity_link il\nLEFT JOIN (SELECT DISTINCT profile_id FROM customer.profile)\
      \ p\n  ON il.profile_id = p.profile_id\nWHERE p.profile_id IS NULL"
  - name: identity_link_identifier_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: identity_link_identifier_type_domain
    query: "SELECT * FROM customer.identity_link\nWHERE identifier_type IS NOT NULL\n  AND identifier_type\
      \ NOT IN ('email_hash', 'phone_hash', 'device_id', 'cookie_id',\n    'maid', 'loyalty_id', 'login_id',\
      \ 'customer_id')"
  - name: identity_link_match_method_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: identity_link_match_method_domain
    query: "SELECT * FROM customer.identity_link\nWHERE match_method IS NOT NULL\n  AND match_method NOT\
      \ IN ('deterministic', 'probabilistic', 'declared', 'manual')"
  - name: identity_link_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: identity_link_status_domain
    query: "SELECT * FROM customer.identity_link\nWHERE link_status IS NOT NULL\n  AND link_status NOT\
      \ IN ('active', 'superseded', 'suppressed')"
  - name: identity_link_single_active_profile_per_identifier
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Resolution guarantee: a current, active identifier must resolve to ONE profile. superseded/suppressed
      links are excluded (they exist precisely to hold the losers).'
    query: "SELECT identifier_type, identifier_value_hash, COUNT(DISTINCT profile_id) AS profiles\nFROM\
      \ customer.identity_link\nWHERE is_current = true AND link_status = 'active'\n  AND identifier_value_hash\
      \ IS NOT NULL\nGROUP BY identifier_type, identifier_value_hash\nHAVING COUNT(DISTINCT profile_id)\
      \ > 1"
  - name: identity_link_confidence_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Match confidence is a probability in [0,1].
    query: "SELECT * FROM customer.identity_link\nWHERE match_confidence IS NOT NULL\n  AND (match_confidence\
      \ < 0 OR match_confidence > 1)"
  - name: identity_link_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: identity_link_scd2_current_open
    query: "SELECT * FROM customer.identity_link\nWHERE (is_current = true  AND effective_to_date IS NOT\
      \ NULL)\n   OR (is_current = false AND effective_to_date IS NULL)"
  - name: identity_link_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: identity_link_scd2_date_order
    query: "SELECT * FROM customer.identity_link\nWHERE effective_to_date IS NOT NULL\n  AND effective_to_date\
      \ <= effective_from_date"
- name: profile
  physicalName: customer.profile
  physicalType: table
  description: ORDM canonical-core individual-customer master (SCD2). Conformed identity shared by all
    outcome packages.
  tags:
  - master
  authoritativeDefinitions:
  - url: canonical-core/customer/README.md
    type: businessDefinition
  - url: canonical-core/customer/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version. Used as the join/FK target for downstream dimensional
      models.
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the individual customer. Stable across SCD2 versions;
      pseudonymous identifier, not a name.
  - name: name_prefix
    logicalType: string
    physicalType: STRING
    required: false
    description: Honorific prefix. Common values include mr, mrs, ms, mx, dr.
  - name: first_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Given name.
    classification: restricted
    tags:
    - dbx_pii_name
  - name: middle_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Middle name(s) or initial.
    classification: restricted
    tags:
    - dbx_pii_name
  - name: last_name
    logicalType: string
    physicalType: STRING
    required: false
    description: Family / surname.
    classification: restricted
    tags:
    - dbx_pii_name
  - name: name_suffix
    logicalType: string
    physicalType: STRING
    required: false
    description: Generational/qualification suffix. Common values include jr, sr, ii, iii.
  - name: date_of_birth
    logicalType: date
    physicalType: DATE
    required: false
    description: Date of birth (ISO 8601 date).
    classification: restricted
    tags:
    - dbx_pii_dob
  - name: gender
    logicalType: string
    physicalType: STRING
    required: false
    description: Self-described gender. Free text; common values include female, male, non_binary, prefer_not_to_say.
  - name: preferred_language_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Preferred communication language, ISO 639-1 alpha-2 (e.g. en, fr, es).
  - name: nationality_country_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Nationality, ISO 3166-1 alpha-2 country code.
  - name: loyalty_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Loyalty/membership program identifier for the individual. Treated as PII.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: household_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to household.household_sk (the household version this profile is a member of). Resolved
      as-of the profile version.
    relationships:
    - to: household.household_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: household_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable household grouping key linking related individuals; joins household.household_id
      (current version). Treated as PII.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: customer_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle status. Allowed values: prospect, active, inactive, closed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: prospect, active, inactive, closed.'
  - name: enrollment_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Date the individual first became a known customer (ISO 8601 date).
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date this version stopped being effective; NULL for the current
      version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version of this profile.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: profile_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Surrogate key, business key, SCD2 start date and current flag are mandatory.
    query: "SELECT * FROM customer.profile\nWHERE profile_sk IS NULL OR profile_id IS NULL\n   OR effective_from_date\
      \ IS NULL OR is_current IS NULL"
  - name: profile_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A business key must resolve to at most one current version.
    query: 'SELECT profile_id, COUNT(*) AS current_versions

      FROM customer.profile

      WHERE is_current = true

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: profile_customer_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: customer_status must be within the declared enum.
    query: "SELECT * FROM customer.profile\nWHERE customer_status IS NOT NULL\n  AND customer_status NOT\
      \ IN ('prospect', 'active', 'inactive', 'closed')"
  - name: profile_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The current version must have an open (NULL) end date; non-current must be closed.
    query: "SELECT * FROM customer.profile\nWHERE (is_current = true  AND effective_to_date IS NOT NULL)\n\
      \   OR (is_current = false AND effective_to_date IS NULL)"
  - name: profile_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When set, the end date must be strictly after the start date.
    query: "SELECT * FROM customer.profile\nWHERE effective_to_date IS NOT NULL\n  AND effective_to_date\
      \ <= effective_from_date"
  - name: profile_household_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When set, the household surrogate FK must reference an existing household.
    query: 'SELECT p.* FROM customer.profile p

      LEFT JOIN customer.household h ON p.household_sk = h.household_sk

      WHERE p.household_sk IS NOT NULL AND h.household_sk IS NULL'
  - name: profile_household_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'When set, the durable household business key should exist on household. WARN (not error)
      by design — asymmetric with the identity_link / channel_preference business-key-orphan checks, which
      are error: those are children whose parent (profile) is a hard prerequisite, so a missing parent
      is a real integrity fault. Here profile is the parent and household is an optional, independently-loaded
      dimension that may lag profile ingestion; a not-yet-loaded household is expected transient state,
      not a defect.'
    query: "SELECT p.* FROM customer.profile p\nLEFT JOIN (SELECT DISTINCT household_id FROM customer.household)\
      \ h\n  ON p.household_id = h.household_id\nWHERE p.household_id IS NOT NULL AND h.household_id IS\
      \ NULL"
