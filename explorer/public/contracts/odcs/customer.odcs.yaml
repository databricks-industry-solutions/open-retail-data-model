- name: channel_preference
  physicalName: customer.channel_preference
  physicalType: table
  description: ORDM canonical-core customer communication preferences (SCD2). Soft preferences only —
    legal permissions live in consent.
  tags:
  - master
  authoritativeDefinitions:
  - url: canonical-core/customer/README.md
    type: businessDefinition
  - url: canonical-core/customer/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: channel_preference_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: channel_preference_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the preference record.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to profile.profile_sk (the profile version this preference attaches to).
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key of the owning customer (join on current profile version).
  - name: channel
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Communication channel the preference applies to. For preference_type = preferred_channel
      this is the CHOSEN channel (not a scope). Allowed values: email, sms, phone, postal, push, in_app,
      web.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: email, sms, phone, postal, push, in_app, web.'
  - name: preference_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'What the preference governs. Allowed values: contact_frequency, topic_subscription,
      format, preferred_channel.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: contact_frequency, topic_subscription, format, preferred_channel.'
  - name: preference_value
    logicalType: string
    physicalType: STRING
    required: false
    description: 'The preference value, interpreted per preference_type: topic name (topic_subscription),
      format code (format). Unused (NULL) for preferred_channel (the chosen channel is in `channel`) and
      contact_frequency (see frequency_cap_per_period).'
  - name: is_subscribed
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: 'Soft enrolment flag for THIS preference (topic/format/channel), by customer choice.
      Non-legal: a false value is a soft targeting opt-out, NOT a consent withdrawal — legal permission
      lives only in consent, which still governs lawful contact.'
  - name: frequency_cap_per_period
    logicalType: integer
    physicalType: INT
    required: false
    description: Maximum desired contacts per frequency_period for this channel (NULL = no cap expressed).
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (frequency_cap_per_period IS NULL OR frequency_cap_per_period >= 0).
  - name: frequency_period
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Period the frequency cap applies over. Allowed values: day, week, month.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: day, week, month.'
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version. Current-row grain by type: (profile, channel,
      preference_type) for contact_frequency/format; + preference_value for topic_subscription (multi-valued);
      (profile) alone for preferred_channel (a single cross-channel choice).'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: channel_preference_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_keys_not_null
    query: "SELECT * FROM customer.channel_preference\nWHERE channel_preference_sk IS NULL OR channel_preference_id\
      \ IS NULL OR profile_id IS NULL\n   OR effective_from_date IS NULL OR is_current IS NULL"
  - name: channel_preference_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_business_key_unique_current
    query: 'SELECT channel_preference_id, COUNT(*) AS current_versions

      FROM customer.channel_preference

      WHERE is_current = true

      GROUP BY channel_preference_id

      HAVING COUNT(*) > 1'
  - name: channel_preference_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_profile_fk_orphan
    query: 'SELECT cp.* FROM customer.channel_preference cp

      LEFT JOIN customer.profile p ON cp.profile_sk = p.profile_sk

      WHERE cp.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: channel_preference_profile_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_profile_businesskey_orphan
    query: "SELECT cp.* FROM customer.channel_preference cp\nLEFT JOIN (SELECT DISTINCT profile_id FROM\
      \ customer.profile) p\n  ON cp.profile_id = p.profile_id\nWHERE p.profile_id IS NULL"
  - name: channel_preference_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_channel_domain
    query: "SELECT * FROM customer.channel_preference\nWHERE channel IS NOT NULL\n  AND channel NOT IN\
      \ ('email', 'sms', 'phone', 'postal', 'push', 'in_app', 'web')"
  - name: channel_preference_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_type_domain
    query: "SELECT * FROM customer.channel_preference\nWHERE preference_type IS NOT NULL\n  AND preference_type\
      \ NOT IN ('contact_frequency', 'topic_subscription', 'format', 'preferred_channel')"
  - name: channel_preference_frequency_period_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_frequency_period_domain
    query: "SELECT * FROM customer.channel_preference\nWHERE frequency_period IS NOT NULL\n  AND frequency_period\
      \ NOT IN ('day', 'week', 'month')"
  - name: channel_preference_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_scd2_current_open
    query: "SELECT * FROM customer.channel_preference\nWHERE (is_current = true  AND effective_to_date\
      \ IS NOT NULL)\n   OR (is_current = false AND effective_to_date IS NULL)"
  - name: channel_preference_scd2_date_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: channel_preference_scd2_date_order
    query: "SELECT * FROM customer.channel_preference\nWHERE effective_to_date IS NOT NULL\n  AND effective_to_date\
      \ <= effective_from_date"
  - name: channel_preference_single_current_singlevalue
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Per-channel single-valued types hold ONE current row per (profile, channel, preference_type):
      a customer has one frequency cap and one format per channel. preference_value is NOT a discriminator
      here. (topic_subscription is multi-valued and preferred_channel is a cross-channel choice — see
      the next two checks.)'
    query: "SELECT profile_id, channel, preference_type, COUNT(*) AS current_rows\nFROM customer.channel_preference\n\
      WHERE is_current = true\n  AND preference_type IN ('contact_frequency', 'format')\nGROUP BY profile_id,\
      \ channel, preference_type\nHAVING COUNT(*) > 1"
  - name: channel_preference_single_preferred_channel
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: preferred_channel names the ONE channel a customer prefers — a choice ACROSS channels,
      so at most one current row per profile (the grain ignores `channel`, which here holds the chosen
      channel, not a scope). Prevents "prefers two channels at once."
    query: 'SELECT profile_id, COUNT(*) AS current_rows

      FROM customer.channel_preference

      WHERE is_current = true AND preference_type = ''preferred_channel''

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: channel_preference_single_current_topic
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'topic_subscription is multi-valued: multiple concurrent topics per channel are valid
      (grain includes preference_value), but the SAME topic must not be current twice. COALESCE so NULL
      topics group together.'
    query: "SELECT profile_id, channel, COALESCE(preference_value, '') AS preference_value, COUNT(*) AS\
      \ current_rows\nFROM customer.channel_preference\nWHERE is_current = true\n  AND preference_type\
      \ = 'topic_subscription'\nGROUP BY profile_id, channel, COALESCE(preference_value, '')\nHAVING COUNT(*)\
      \ > 1"
  - name: channel_preference_frequency_cap_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A frequency cap, when expressed, cannot be negative.
    query: 'SELECT * FROM customer.channel_preference

      WHERE frequency_cap_per_period IS NOT NULL AND frequency_cap_per_period < 0'
