    description: competitor_promotion_source_identity
    query: 'SELECT *

      FROM actionable_customer_understanding.competitor_promotion

      WHERE competitor_promotion_id <> concat_ws(''|'', record_source, source_observation_id)'
  - name: competitor_promotion_competitor_logical_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: competitor_promotion_competitor_logical_fk_orphan
    query: "SELECT p.*\nFROM actionable_customer_understanding.competitor_promotion p\nWHERE NOT EXISTS\
      \ (\n  SELECT 1\n  FROM balancing_margin_and_volume.competitor c\n  WHERE c.competitor_id = p.competitor_id\n\
      )"
  - name: competitor_promotion_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: competitor_promotion_product_fk_orphan
    query: 'SELECT p.*

      FROM actionable_customer_understanding.competitor_promotion p

      LEFT JOIN product.product d ON p.product_sk = d.product_sk

      WHERE p.product_sk IS NOT NULL AND d.product_sk IS NULL'
  - name: competitor_promotion_calendar_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: competitor_promotion_calendar_fk_orphan
    query: 'SELECT p.*

      FROM actionable_customer_understanding.competitor_promotion p

      LEFT JOIN calendar.fiscal_calendar c ON p.date_key = c.date_key

      WHERE c.date_key IS NULL'
  - name: competitor_promotion_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: competitor_promotion_single_currency
    query: "SELECT 1\nFROM actionable_customer_understanding.competitor_promotion\nHAVING COUNT(DISTINCT\
      \ currency_code) > 1\n    OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) > 0"
  - name: competitor_promotion_discount_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: competitor_promotion_discount_consistency
    query: "SELECT *\nFROM actionable_customer_understanding.competitor_promotion\nWHERE promo_price IS\
      \ NOT NULL\n  AND regular_price IS NOT NULL\n  AND discount_depth_pct IS NOT NULL\n  AND regular_price\
      \ > 0\n  AND ABS(discount_depth_pct - 100.0 * (regular_price - promo_price) / regular_price) > 0.02"
- name: market_benchmark
  physicalName: actionable_customer_understanding.market_benchmark
  physicalType: table
  description: Append-only market benchmark cell versions. License terms are adopter-owned; redistribution
    is disabled by default.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: market_benchmark_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key for this delivered cell version.
  - name: market_benchmark_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable delivered-version key: record_source|source_observation_id.'
  - name: source_observation_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Source-system identity of this delivered cell version.
  - name: benchmark_cell_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Stable logical-cell identity: record_source|market_definition|geography_level|geography_code|category_ref|subject_type|subject_id-or-TOTAL|period_type|period_end_date.
      An adopter category remap intentionally creates a new cell; see ADR 0042.'
  - name: competitor_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Nullable competitor SCD2 version retained as lineage, not a cross-package FK.
  - name: competitor_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Nullable durable competitor key and logical relationship to the BMV-owned dimension.
  - name: market_definition
    logicalType: string
    physicalType: STRING
    required: true
    description: Provider-defined measured market/store universe, preserved verbatim.
  - name: geography_level
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Geography grain: total, region, market, key_account, or account_market.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: total, region, market, key_account, account_market.'
  - name: geography_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Provider or adopter geography identifier at geography_level.
  - name: category_ref
    logicalType: string
    physicalType: STRING
    required: true
    description: Adopter-owned mapping to the own merchandising category hierarchy.
  - name: subject_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Cell subject: own_banner, competitor_banner, brand, private_label, or total_category.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: own_banner, competitor_banner, brand, private_label, total_category.'
  - name: subject_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Subject identifier in the provider namespace; NULL only for total_category.
  - name: period_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Provider period type: week, quad_week, 13_week, or 52_week.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: week, quad_week, 13_week, 52_week.'
  - name: period_end_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Provider period end date; never relabeled as an own fiscal week.
  - name: sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Measured sales amount in reporting currency.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((sales_amount IS NULL OR sales_amount >= 0) AND (unit_volume IS NULL OR unit_volume
        >= 0) AND (eq_volume IS NULL OR eq_volume >= 0) AND (tdp IS NULL OR tdp >= 0) AND (promo_sales_amount
        IS NULL OR promo_sales_amount >= 0) AND (base_sales_amount IS NULL OR base_sales_amount >= 0)).
  - name: unit_volume
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Measured unit volume for the benchmark cell.
  - name: market_share_pct
    logicalType: number
    physicalType: DECIMAL(7,4)
    required: false
    description: Provider-reported market share percentage, from 0 through 100.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((market_share_pct IS NULL OR market_share_pct BETWEEN 0 AND 100) AND (acv_weighted_distribution_pct
        IS NULL OR acv_weighted_distribution_pct BETWEEN 0 AND 100) AND (numeric_distribution_pct IS NULL
        OR numeric_distribution_pct BETWEEN 0 AND 100)).
  - name: market_growth_rate_pct
    logicalType: number
    physicalType: DECIMAL(7,4)
    required: false
    description: Provider-reported market growth percentage; never recomputed across restatements.
  - name: eq_volume
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Optional equivalized volume supplied by the provider.
  - name: acv_weighted_distribution_pct
    logicalType: number
    physicalType: DECIMAL(7,4)
    required: false
    description: Optional importance-weighted distribution percentage.
  - name: numeric_distribution_pct
    logicalType: number
    physicalType: DECIMAL(7,4)
    required: false
    description: Optional outlet-count-weighted distribution percentage.
  - name: tdp
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Optional total distribution points.
  - name: promo_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Optional sales amount attributed to promotional conditions.
  - name: base_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Optional sales amount attributed to base conditions.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: true
    description: ISO 4217 reporting/base currency for monetary measures.
  - name: is_restatement
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE when this delivered version revises an earlier logical cell.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((is_restatement = TRUE AND restates_market_benchmark_id IS NOT NULL) OR (is_restatement
        = FALSE AND restates_market_benchmark_id IS NULL)).
  - name: restates_market_benchmark_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Delivered-version key superseded by this restatement, when supplied.
  - name: observed_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Timestamp the provider observed or published this delivered cell version.
  - name: provider_updated_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Provider update timestamp used before observed/load time in latest-wins ordering.
  - name: raw_data_uri
    logicalType: string
    physicalType: STRING
    required: false
    description: Optional governed pointer to the licensed delivery evidence.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: true
    description: Licensed provider/source-system identifier and version namespace.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Timestamp this delivered version was loaded into the lakehouse.
  quality:
  - name: market_benchmark_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_benchmark_grain_unique
    query: 'SELECT market_benchmark_id

      FROM actionable_customer_understanding.market_benchmark

      GROUP BY market_benchmark_id

      HAVING COUNT(*) > 1'
  - name: market_benchmark_source_identity
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_benchmark_source_identity
    query: 'SELECT *

      FROM actionable_customer_understanding.market_benchmark

      WHERE market_benchmark_id <> concat_ws(''|'', record_source, source_observation_id)'
  - name: market_benchmark_competitor_logical_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_benchmark_competitor_logical_fk_orphan
    query: "SELECT b.*\nFROM actionable_customer_understanding.market_benchmark b\nWHERE b.competitor_id\
      \ IS NOT NULL\n  AND NOT EXISTS (\n    SELECT 1\n    FROM balancing_margin_and_volume.competitor\
      \ c\n    WHERE c.competitor_id = b.competitor_id\n  )"
  - name: market_benchmark_calendar_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Provider periods retain their own vocabulary; only the literal end date maps to the daily
      fiscal calendar, with no claim that provider weeks equal fiscal weeks.
    query: 'SELECT b.*

      FROM actionable_customer_understanding.market_benchmark b

      LEFT JOIN calendar.fiscal_calendar c ON b.period_end_date = c.date_key

      WHERE c.date_key IS NULL'
  - name: market_benchmark_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_benchmark_single_currency
    query: "SELECT 1\nFROM actionable_customer_understanding.market_benchmark\nHAVING COUNT(DISTINCT currency_code)\
      \ > 1\n    OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) > 0"
- name: segment_membership
  physicalName: actionable_customer_understanding.segment_membership
  physicalType: table
  description: ORDM Actionable Customer Understanding behavioral-segment membership (append-only as-of
    snapshots). Targeting plane only; gated for activation in UCV.
  tags:
  - association
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: segment_membership_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per (profile, segment, as_of) row.
  - name: segment_membership_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the membership row (profile_id + audience_id + as_of_date).
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable customer business key (pseudonymous; not raw PII). Joins customer.profile / gold_customer_behavioral_attributes
      and is the single stable activation/join key.
  - name: audience_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable key of the segment DEFINITION this membership is for. FK to marketing.audience.audience_id
      (the shared conformed definition, ADR 0022).
  - name: as_of_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Evaluation date of this membership snapshot (the temporal key; append-only, never version-closed).
  - name: membership_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Membership state at as_of. Allowed values: realized, existing, exited. Standard segment-membership
      lifecycle semantics: realized = newly qualified this evaluation, existing = still qualifies, exited
      = no longer qualifies. v1 is current-state append-only: the generator emits mostly `existing` plus
      a deterministic ~5% `exited` slice (so the exclusion path is exercised on seed data); `realized`
      is RESERVED for a future entered/exited delta feed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: realized, existing, exited.'
  - name: membership_score
    logicalType: number
    physicalType: DECIMAL(8,4)
    required: false
    description: Optional confidence/propensity score behind the membership (0..1); NULL for a pure deterministic
      rule match.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (membership_score IS NULL OR (membership_score >= 0 AND membership_score <= 1)).
  - name: assignment_method
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How membership was assigned. Allowed values: rule, ml_score, imported.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: rule, ml_score, imported.'
  - name: model_version
    logicalType: string
    physicalType: STRING
    required: false
    description: Version of the rule set / model that produced this membership (audit / reproducibility).
      NULL if not applicable.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: segment_membership_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per (profile_id x audience_id x as_of_date) — no fan-out/double-count.
    query: 'SELECT profile_id, audience_id, as_of_date

      FROM actionable_customer_understanding.segment_membership

      GROUP BY profile_id, audience_id, as_of_date

      HAVING COUNT(*) > 1'
  - name: segment_membership_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: segment_membership_keys_not_null
    query: 'SELECT * FROM actionable_customer_understanding.segment_membership

      WHERE segment_membership_id IS NULL OR profile_id IS NULL OR audience_id IS NULL OR as_of_date IS
      NULL'
  - name: segment_membership_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: segment_membership_status_domain
    query: "SELECT * FROM actionable_customer_understanding.segment_membership\nWHERE membership_status\
      \ IS NOT NULL\n  AND membership_status NOT IN ('realized', 'existing', 'exited')"
  - name: segment_membership_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: segment_membership_score_range
    query: 'SELECT * FROM actionable_customer_understanding.segment_membership

      WHERE membership_score IS NOT NULL AND (membership_score < 0 OR membership_score > 1)'
  - name: segment_membership_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Membership profile_id must resolve to a current customer profile (durable-key FK).
    query: "SELECT m.segment_membership_id, m.profile_id\nFROM actionable_customer_understanding.segment_membership\
      \ m\nLEFT JOIN customer.profile p\n  ON m.profile_id = p.profile_id AND p.is_current = TRUE\nWHERE\
      \ p.profile_id IS NULL"
  - name: segment_membership_audience_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Membership audience_id must resolve to a current segment definition (durable-key FK into
      the shared silver marketing.audience dim, ADR 0022).
    query: "SELECT m.segment_membership_id, m.audience_id\nFROM actionable_customer_understanding.segment_membership\
      \ m\nLEFT JOIN marketing.audience a\n  ON m.audience_id = a.audience_id AND a.is_current = TRUE\n\
      WHERE a.audience_id IS NULL"
  - name: segment_membership_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: segment_membership_rowcount
    query: SELECT COUNT(*) AS membership_rows FROM actionable_customer_understanding.segment_membership
- name: gold_competitive_position
  physicalName: actionable_customer_understanding.gold_competitive_position
  physicalType: view
  description: Observation-native synthesis over competitor price, promotion and assortment. Each observation
    family is aggregated independently before the grains are joined, so sparse feeds do not multiply rows
    or silently erase dimensions.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: category
    logicalType: string
    physicalType: STRING
    description: Own merchandising category captured by the version-specific price product or source observation.
  - name: competitor_id
    logicalType: string
    physicalType: STRING
    description: Durable competitor business key; aggregation never fragments on the SCD2 surrogate.
  - name: competitor_name
    logicalType: string
    physicalType: STRING
    description: Display name effective at fiscal-period end, selected after aggregation by durable competitor_id.
  - name: channel_code
    logicalType: string
    physicalType: STRING
    description: Source-observed promotion/assortment channel; all for national competitor-price observations.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF 4-5-4 fiscal year.
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    description: NRF 4-5-4 fiscal period.
  - name: period_start_date
    logicalType: date
    physicalType: DATE
    description: First date in the fiscal period.
  - name: period_end_date
    logicalType: date
    physicalType: DATE
    description: Last date in the fiscal period and SCD2 display-name as-of date.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: ISO 4217 reporting currency where monetary observation families agree; NULL on assortment-only
      rows.
  - name: measure_scope
    logicalType: string
    physicalType: STRING
    description: 'Reachable observation-family scope: price, promotion, assortment, or promotion_assortment.
      National price cannot co-occur with source-channel promotion/assortment.'
  - name: price_ratio_sum
    logicalType: number
    physicalType: DOUBLE
    description: Additive sum of own list price divided by competitor MRP for usable positive same-currency
      pairs.
  - name: valid_price_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Usable positive same-currency regular-price pairs.
  - name: valid_price_product_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct observed products with at least one usable regular-price pair in this gold grain.
  - name: observed_price_product_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct matched products present in competitor-price observations.
  - name: price_index_vs_competitor
    logicalType: number
    physicalType: DOUBLE
    description: Unweighted arithmetic mean of usable product-day own-list/competitor-MRP price relatives;
      100 is parity.
  - name: sales_weighted_price_ratio_sum
    logicalType: number
    physicalType: DOUBLE
    description: Additive own-list/competitor-MRP ratio multiplied by positive matched own units.
  - name: matched_units
    logicalType: number
    physicalType: DOUBLE
    description: Own units on usable regular-price-pair product-days.
  - name: sales_weighted_price_index_vs_competitor
    logicalType: number
    physicalType: DOUBLE
    description: Own-unit-weighted arithmetic mean of usable product-day own-list/competitor-MRP price
      relatives; not a ratio of aggregate price totals.
  - name: price_observation_coverage_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x usable price products divided by observed matched price products; no cap is applied.
  - name: competitor_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Competitor-price observations represented by the row.
  - name: own_promo_presence_count
    logicalType: integer
    physicalType: BIGINT
    description: Own promoted product-days within the shared any-competitor-observation coverage population.
  - name: competitor_promo_presence_count
    logicalType: integer
    physicalType: BIGINT
    description: Competitor promoted product-days within the same observation-coverage population.
  - name: comparable_promo_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct covered own product-days from price, promotion or assortment observations; SOV
      denominator population.
  - name: comparable_promo_day_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct dates represented by the shared promotion-SOV coverage population in this gold
      grain.
  - name: competitor_promotion_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: All competitor-promotion observations, including category-only placements.
  - name: discount_depth_pct_sum
    logicalType: number
    physicalType: DOUBLE
    description: Additive sum of known competitor-promotion discount depths.
  - name: valid_discount_depth_count
    logicalType: integer
    physicalType: BIGINT
    description: Promotion observations with a known discount depth.
  - name: promo_sov_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x own promoted presence divided by own plus competitor presence on comparable product-days.
  - name: avg_discount_depth_pct
    logicalType: number
    physicalType: DOUBLE
    description: Arithmetic mean of observed or ingest-derived discount-depth percentages over promotion
      observations with known depth.
  - name: circular_print_promo_count
    logicalType: integer
    physicalType: BIGINT
    description: Observed print-circular promotion placements.
  - name: circular_digital_promo_count
    logicalType: integer
    physicalType: BIGINT
    description: Observed digital-circular promotion placements.
  - name: onsite_promo_count
    logicalType: integer
    physicalType: BIGINT
    description: Observed onsite promotion placements.
  - name: in_store_promo_count
    logicalType: integer
    physicalType: BIGINT
    description: Observed in-store promotion placements.
  - name: email_app_promo_count
    logicalType: integer
    physicalType: BIGINT
    description: Observed email or app promotion placements.
  - name: other_promo_count
    logicalType: integer
    physicalType: BIGINT
    description: Observed promotion placements in other vehicles.
  - name: assortment_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: All competitor listing and availability observations.
  - name: listed_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Assortment observations explicitly marked listed.
  - name: available_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Listed assortment observations explicitly marked available.
  - name: out_of_stock_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Listed assortment observations explicitly marked unavailable.
  - name: stock_flagged_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Listed assortment observations with known availability state.
  - name: points_of_availability_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct listed competitor locations in the gold grain; national v1 uses ALL.
  - name: listed_channel_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct channels with a listed item for the category, competitor and period; repeated
      on channel rows and non-additive.
  - name: listed_share_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x listed observations divided by all assortment observations.
  - name: availability_rate_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x available listed observations divided by listed observations with known stock state.
  - name: unmatched_listed_item_present_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when match-quality review is needed because a listed competitor item lacks a confidence-qualified
      exact/equivalent match; not a directional distribution gap.
  - name: competitor_listed_item_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct listed competitor items in this gold grain.
  - name: matched_listed_product_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct active own products with exact/equivalent listed competitor matches at confidence
      0.80 or higher.
  - name: matched_listed_inactive_product_count
    logicalType: integer
    physicalType: BIGINT
    description: Confidence-qualified listed matches excluded from overlap because the own product is
      outside the active period-end catalog.
  - name: observed_own_product_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct active own products represented by at least one assortment observation; overlap/uniqueness
      denominator.
  - name: matched_listed_competitor_item_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct listed competitor items with exact/equivalent matches at confidence 0.80 or
      higher.
  - name: unmatched_listed_item_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct listed competitor items without a confidence-qualified exact/equivalent match.
  - name: own_catalog_product_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct active own products in the category at fiscal-period end.
  - name: own_catalog_observation_coverage_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x observed active own products divided by the full active period-end catalog.
  - name: assortment_overlap_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x confidence-qualified active-own matched products divided by observed active own
      products.
  - name: assortment_uniqueness_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x observed active own products without a confidence-qualified competitor listing
      divided by observed active own products.
  - name: assortment_jaccard_index_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x matched product-space intersection divided by observed active own products plus
      unmatched listed competitor items.
  - name: match_coverage_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x confidence-qualified listed competitor items divided by all listed competitor items.
  - name: search_rank_sum
    logicalType: number
    physicalType: DOUBLE
    description: Additive sum of known competitor-item search ranks.
  - name: search_rank_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Assortment observations with a supplied search rank.
  - name: share_of_search_avg_rank
    logicalType: number
    physicalType: DOUBLE
    description: Search-rank sum divided by ranked observations; not physical shelf share.
  - name: promotion_detection_lag_days_sum
    logicalType: number
    physicalType: DOUBLE
    description: Additive upper-bound days from displayed promotion start to source observation.
  - name: promotion_detection_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Promotion observations with a computable displayed-start lag.
  - name: avg_promotion_detection_lag_days
    logicalType: number
    physicalType: DOUBLE
    description: Mean displayed-start-to-observation bound for competitor promotions; median is deferred.
  - name: assortment_detection_lag_days_sum
    logicalType: number
    physicalType: DOUBLE
    description: Additive prior-observation intervals where assortment state changed.
  - name: assortment_detection_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Observed assortment state changes with a prior observation.
  - name: avg_assortment_detection_lag_days
    logicalType: number
    physicalType: DOUBLE
    description: Mean prior-observation interval for observed assortment state changes; median is deferred.
  - name: detection_lag_days_sum
    logicalType: number
    physicalType: DOUBLE
    description: Combined promotion and assortment detection-bound day sum.
  - name: detection_lag_observation_count
    logicalType: integer
    physicalType: BIGINT
    description: Combined promotion and assortment observations with a detection bound.
  - name: avg_detection_lag_upper_bound_days
    logicalType: number
    physicalType: DOUBLE
    description: Detection-bound day sum divided by detection-bound observations; not exact event-to-alert
      latency.
  - name: assortment_state_change_count
    logicalType: integer
    physicalType: BIGINT
    description: Listing or availability changes versus the prior durable-item observation.
  - name: observation_interval_days_sum
    logicalType: number
    physicalType: DOUBLE
    description: Additive days between consecutive assortment observations.
  - name: observation_interval_count
    logicalType: integer
    physicalType: BIGINT
    description: Consecutive assortment-observation intervals.
  - name: avg_observation_cadence_days
    logicalType: number
    physicalType: DOUBLE
    description: Observation-interval day sum divided by interval count.
  - name: price_index_basis
    logicalType: string
    physicalType: STRING
    description: 'Regular-price basis: own list price versus competitor MRP.'
  - name: price_coverage_basis
    logicalType: string
    physicalType: STRING
    description: Usable regular-price products over observed matched price products.
  - name: promo_sov_basis
    logicalType: string
    physicalType: STRING
    description: Promoted product-day presence over own product-days covered by any competitor observation;
      placement/spend bases are not blended.
  - name: distribution_basis
    logicalType: string
    physicalType: STRING
    description: Observed channel/location presence plus separately labelled unmatched-item match quality;
      no fabricated ACV weighting.
  - name: availability_basis
    logicalType: string
    physicalType: STRING
    description: Listed assortment observations with known stock state.
  - name: assortment_basis
    logicalType: string
    physicalType: STRING
    description: Observed active own products versus observed competitor items at the 0.80 exact/equivalent
      match floor.
  - name: detection_basis
    logicalType: string
    physicalType: STRING
    description: Displayed promotion start or prior assortment observation upper-bound basis.
  - name: channel_basis
    logicalType: string
    physicalType: STRING
    description: Distinguishes national all-channel price rows from source-observed promotion/assortment
      channels.
  quality:
  - name: market_analysis_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per category × durable competitor × observed channel × fiscal period.
    query: 'SELECT category, competitor_id, channel_code, fiscal_year, fiscal_period

      FROM actionable_customer_understanding.gold_competitive_position

      GROUP BY category, competitor_id, channel_code, fiscal_year, fiscal_period

      HAVING COUNT(*) > 1'
  - name: market_analysis_count_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Raw numerators cannot exceed their same-grain observation populations. listed_channel_count
      is period-grain and intentionally repeats on channel rows, so it cannot be compared with per-channel
      listed_observation_count here.
    query: "SELECT *\nFROM actionable_customer_understanding.gold_competitive_position\nWHERE valid_price_product_count\
      \ > observed_price_product_count\n   OR valid_price_observation_count > competitor_observation_count\n\
      \   OR own_promo_presence_count > comparable_promo_observation_count\n   OR competitor_promo_presence_count\
      \ > comparable_promo_observation_count\n   OR comparable_promo_day_count > comparable_promo_observation_count\n\
      \   OR valid_discount_depth_count > competitor_promotion_observation_count\n   OR circular_print_promo_count\
      \ + circular_digital_promo_count\n      + onsite_promo_count + in_store_promo_count\n      + email_app_promo_count\
      \ + other_promo_count\n      <> competitor_promotion_observation_count\n   OR listed_observation_count\
      \ > assortment_observation_count\n   OR stock_flagged_observation_count > listed_observation_count\n\
      \   OR available_observation_count + out_of_stock_observation_count\n      <> stock_flagged_observation_count\n\
      \   OR points_of_availability_count > listed_observation_count\n   OR matched_listed_competitor_item_count\
      \ > competitor_listed_item_count\n   OR unmatched_listed_item_count > competitor_listed_item_count\n\
      \   OR observed_own_product_count > own_catalog_product_count\n   OR matched_listed_product_count\
      \ > observed_own_product_count\n   OR matched_listed_inactive_product_count > competitor_listed_item_count\n\
      \   OR search_rank_observation_count > assortment_observation_count\n   OR detection_lag_observation_count\n\
      \      <> promotion_detection_observation_count\n       + assortment_detection_observation_count\n\
      \   OR assortment_detection_observation_count > assortment_state_change_count\n   OR observation_interval_count\
      \ > assortment_observation_count"
  - name: market_analysis_percentage_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_analysis_percentage_bounds
    query: "SELECT *\nFROM actionable_customer_understanding.gold_competitive_position\nWHERE (price_observation_coverage_pct\
      \ IS NOT NULL\n       AND price_observation_coverage_pct NOT BETWEEN 0 AND 100)\n   OR (promo_sov_pct\
      \ IS NOT NULL AND promo_sov_pct NOT BETWEEN 0 AND 100)\n   OR (avg_discount_depth_pct IS NOT NULL\
      \ AND avg_discount_depth_pct NOT BETWEEN 0 AND 100)\n   OR (listed_share_pct IS NOT NULL AND listed_share_pct\
      \ NOT BETWEEN 0 AND 100)\n   OR (availability_rate_pct IS NOT NULL AND availability_rate_pct NOT\
      \ BETWEEN 0 AND 100)\n   OR (assortment_overlap_pct IS NOT NULL AND assortment_overlap_pct NOT BETWEEN\
      \ 0 AND 100)\n   OR (assortment_uniqueness_pct IS NOT NULL\n       AND assortment_uniqueness_pct\
      \ NOT BETWEEN 0 AND 100)\n   OR (assortment_jaccard_index_pct IS NOT NULL\n       AND assortment_jaccard_index_pct\
      \ NOT BETWEEN 0 AND 100)\n   OR (match_coverage_pct IS NOT NULL AND match_coverage_pct NOT BETWEEN\
      \ 0 AND 100)\n   OR (own_catalog_observation_coverage_pct IS NOT NULL\n       AND own_catalog_observation_coverage_pct\
      \ NOT BETWEEN 0 AND 100)\n   OR (share_of_search_avg_rank IS NOT NULL AND share_of_search_avg_rank\
      \ <= 0)\n   OR (avg_detection_lag_upper_bound_days IS NOT NULL\n       AND avg_detection_lag_upper_bound_days\
      \ < 0)\n   OR (avg_promotion_detection_lag_days IS NOT NULL\n       AND avg_promotion_detection_lag_days\
      \ < 0)\n   OR (avg_assortment_detection_lag_days IS NOT NULL\n       AND avg_assortment_detection_lag_days\
      \ < 0)\n   OR (avg_observation_cadence_days IS NOT NULL AND avg_observation_cadence_days < 0)\n\
      \   OR (price_index_vs_competitor IS NOT NULL AND price_index_vs_competitor <= 0)\n   OR (sales_weighted_price_index_vs_competitor\
      \ IS NOT NULL\n       AND sales_weighted_price_index_vs_competitor <= 0)"
  - name: market_analysis_currency_known
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A NULL with monetary observations means currencies disagreed inside one grain. Assortment-only
      rows carry no currency and remain NULL-honest.
    query: "SELECT *\nFROM actionable_customer_understanding.gold_competitive_position\nWHERE (valid_price_observation_count\
      \ > 0 OR competitor_promotion_observation_count > 0)\n  AND currency_code IS NULL"
  - name: market_analysis_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: market_analysis_rowcount
    query: 'SELECT COUNT(*) AS competitive_position_rows

      FROM actionable_customer_understanding.gold_competitive_position'
- name: gold_customer_behavioral_attributes
  physicalName: actionable_customer_understanding.gold_customer_behavioral_attributes
  physicalType: view
  description: The wide, agent-discoverable customer TRAIT surface for behavioral segmentation (the "parent
    model" a warehouse-native / composable CDP activation platform reads to compose custom audiences).
    ONE CURRENT ROW PER CUSTOMER, keyed on the durable `profile_id` — a single stable join key so a downstream
    activation platform (and reverse-ETL CDC) diffs on one column, never a multi-column predicate.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer business key (not raw PII) — the single stable activation/join
      key.
  - name: recency_periods
    logicalType: integer
    physicalType: INT
    description: Fiscal periods since the customer last purchased.
  - name: frequency
    logicalType: integer
    physicalType: BIGINT
    description: Distinct purchase occasions (orders) observed.
  - name: frequency_per_period
    logicalType: number
    physicalType: DOUBLE
    description: Orders per fiscal period of tenure (purchase cadence).
  - name: total_units
    logicalType: integer
    physicalType: BIGINT
    description: Total units purchased.
  - name: total_spend
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total net spend.
  - name: last_order_date
    logicalType: date
    physicalType: DATE
    description: Date of the customer's most recent order.
  - name: tenure_periods
    logicalType: integer
    physicalType: INT
    description: Fiscal periods from first to latest observed order.
  - name: avg_cadence_periods
    logicalType: number
    physicalType: DOUBLE
    description: 'The customer''s average purchase cadence: fiscal periods of tenure per order (tenure
      / frequency). Drives the lifecycle_stage derivation.'
  - name: distinct_categories
    logicalType: integer
    physicalType: BIGINT
    description: Count of distinct product categories purchased (breadth of category affinity).
  - name: distinct_brands
    logicalType: integer
    physicalType: BIGINT
    description: Count of distinct brands purchased.
  - name: top_category
    logicalType: string
    physicalType: STRING
    description: The category the customer spends the most net revenue in (dominant category affinity).
  - name: top_brand
    logicalType: string
    physicalType: STRING
    description: The brand the customer spends the most net revenue in.
  - name: promo_purchase_share_ratio
    logicalType: number
    physicalType: DECIMAL(6, 4)
    description: Share of net spend on discounted lines (net < gross) — promo responsiveness, 0..1.
  - name: lifecycle_stage
    logicalType: string
    physicalType: STRING
    description: 'Behaviorally-derived relationship stage: new / active / lapsing / churned (from recency
      vs the customer''s own cadence).'
  - name: r_score
    logicalType: integer
    physicalType: INT
    description: Recency score 1-5 (from gold_customer_ltv; surfaced as a trait, not recomputed).
  - name: f_score
    logicalType: integer
    physicalType: INT
    description: Frequency score 1-5 (from gold_customer_ltv).
  - name: m_score
    logicalType: integer
    physicalType: INT
    description: Monetary score 1-5 (from gold_customer_ltv).
  - name: rfm_score
    logicalType: integer
    physicalType: INT
    description: Combined RFM cell 111..555 (from gold_customer_ltv).
  - name: value_tier
    logicalType: string
    physicalType: STRING
    description: Value tier PLATINUM/GOLD/SILVER/BRONZE (from gold_customer_ltv).
  - name: historical_clv
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Realized lifetime gross margin (from gold_customer_ltv).
  - name: predicted_clv
    logicalType: number
    physicalType: DOUBLE
    description: Heuristic forward CLV estimate (from gold_customer_ltv).
  - name: churn_risk_proxy
    logicalType: boolean
    physicalType: BOOLEAN
    description: Heuristic churn-risk flag (from gold_customer_ltv).
  - name: opt_in_status
    logicalType: string
    physicalType: STRING
    description: Marketing consent as a DISCOVERABLE ATTRIBUTE (opted_in / opted_out / unknown). NOT the
      legal source of truth (that is canonical-core consent) and never the activation gate — the net gate
      is applied only in UCV gold_activatable_audience_current.
  - name: interaction_count
    logicalType: integer
    physicalType: BIGINT
    description: 'Clickstream (ADR 0029), LIFETIME grain (unbounded — NOT the RFM observation window):
      count of ENGAGEMENT touches for this profile (stitched touches only), excluding session bookkeeping
      verbs (session_start/session_end/app_open). NULL for a purchaser with no stitched touches.'
  - name: session_count
    logicalType: integer
    physicalType: BIGINT
    description: 'Clickstream, LIFETIME grain (unbounded): distinct sessions (session_id) the profile
      interacted in.'
  - name: last_interaction_date
    logicalType: date
    physicalType: DATE
    description: 'Clickstream (lifetime scan): most recent touch date (engagement recency).'
  - name: avg_digital_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream, LIFETIME grain (unbounded): mean page-dwell seconds over DIGITAL engagement
      touches (web/mobile_app) only. Restricted to one modality because touchpoint.dwell_seconds is cross-modal
      (page dwell vs call duration vs visit length are not comparable).'
  - name: digital_interaction_share
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream channel mix, LIFETIME grain (unbounded — NOT the RFM window; a stale customer''s
      mix reads like an active one): share of touches on web / mobile_app (0..1). NOTE: the three interaction_share
      columns are NON-EXHAUSTIVE named shares (direct_mail and other are not bucketed), so they do not
      sum to 1 — do not treat them as a partition. A touch with a NULL channel_code counts toward the
      denominator but no named share (harmless on shipped data — the generator always populates channel_code).'
  - name: in_store_interaction_share
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream channel mix, LIFETIME grain (unbounded): share of touches in store / kiosk
      (0..1).'
  - name: call_center_interaction_share
    logicalType: number
    physicalType: DOUBLE
    description: 'Clickstream channel mix, LIFETIME grain (unbounded): share of touches via call center
      (0..1).'
  - name: has_search_intent_flag
    logicalType: integer
    physicalType: INT
    description: 'Clickstream intent, LIFETIME grain: 1 if the profile had any search touch (ever), else
      0.'
  - name: has_cart_activity_flag
    logicalType: integer
    physicalType: INT
    description: 'Clickstream intent, LIFETIME grain: 1 if the profile had any add_to_cart touch (ever),
      else 0.'
  - name: cart_without_checkout_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Clickstream, LIFETIME grain: TRUE if the profile ever added to cart but NEVER reached
      checkout_start across ALL touches. NOTE: checkout_start is reaching checkout, NOT a completed purchase
      (touchpoint carries no order-completion signal), and this is lifetime not per-cart/session — a habitual
      buyer who abandoned one old cart still reads FALSE once they checked out. A per-cart/session rate
      keyed on cart_id/session_id is a follow-on.'
  - name: account_id
    logicalType: string
    physicalType: STRING
    description: 'B2B: durable account key this customer is the PRIMARY CONTACT for. NULL for B2C and
      for non-primary account members (a full all-contacts roll-up is a follow-up).'
  - name: account_type
    logicalType: string
    physicalType: STRING
    description: B2B account type (NULL for B2C).
  - name: parent_account_id
    logicalType: string
    physicalType: STRING
    description: B2B parent account (account hierarchy), NULL if none.
  - name: computed_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When this trait row was computed (freshness).
  quality:
  - name: behavioral_attributes_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One current row per customer (the wide trait surface / parent model).
    query: 'SELECT profile_id

      FROM actionable_customer_understanding.gold_customer_behavioral_attributes

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: behavioral_attributes_lifecycle_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: behavioral_attributes_lifecycle_domain
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_behavioral_attributes

      WHERE lifecycle_stage NOT IN (''new'', ''active'', ''lapsing'', ''churned'')'
  - name: behavioral_attributes_opt_in_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: behavioral_attributes_opt_in_domain
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_behavioral_attributes

      WHERE opt_in_status NOT IN (''opted_in'', ''opted_out'', ''unknown'')'
- name: gold_customer_ltv
  physicalName: actionable_customer_understanding.gold_customer_ltv
  physicalType: view
  description: 'Per-customer lifetime value: historical realized value + a transparent forward estimate,
    plus RFM segmentation and value tiers. Built on the BASE dimensional model (customer_order_line +
    product for margin + the NRF 4-5-4 fiscal calendar) -- NOT on the in-progress C360/CDP semantic layer
    (none exists yet). Keyed on the customer SURROGATE; no raw PII (loyalty/household identifiers or names)
    is exposed -- those stay in the governed dimension.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    description: Customer surrogate key (the governed dimension key).
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer business key (not raw PII).
  - name: recency_periods
    logicalType: integer
    physicalType: INT
    description: Fiscal periods (NRF 4-5-4) since the customer last purchased.
  - name: frequency
    logicalType: integer
    physicalType: BIGINT
    description: Distinct purchase occasions (orders) in the observation window.
  - name: total_units
    logicalType: integer
    physicalType: BIGINT
    description: Total units purchased.
  - name: total_spend
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total net spend.
  - name: avg_order_value
    logicalType: number
    physicalType: DECIMAL
    description: Average net spend per order (total_spend / frequency).
  - name: historical_clv
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Realized gross margin to date; can be negative (a real loss).
  - name: expected_active_periods
    logicalType: integer
    physicalType: INT
    description: 'Survival heuristic: GREATEST(0, LEAST(tenure, 12) - recency) forward periods.'
  - name: predicted_clv
    logicalType: number
    physicalType: DOUBLE
    description: Transparent forward estimate = avg_order_margin x freq_per_period x expected_active_periods;
      clamped >= 0. Heuristic, not an ML model.
  - name: r_score
    logicalType: integer
    physicalType: INT
    description: Recency score 1-5 from stable fixed thresholds (5 = most recent; reproducible across
      refreshes, not a population quintile).
  - name: f_score
    logicalType: integer
    physicalType: INT
    description: Frequency score 1-5 from stable fixed thresholds (5 = most frequent).
  - name: m_score
    logicalType: integer
    physicalType: INT
    description: Monetary score 1-5 from stable fixed thresholds (5 = highest spend).
  - name: rfm_score
    logicalType: integer
    physicalType: INT
    description: Combined RFM cell = 100*R + 10*F + M (111..555).
  - name: value_tier
    logicalType: string
    physicalType: STRING
    description: historical_clv tier from stable fixed thresholds (PLATINUM >=2500 / GOLD >=1000 / SILVER
      >=250 / BRONZE else); reproducible across refreshes, not an NTILE quartile.
  - name: churn_risk_proxy
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Heuristic flag: recency exceeds 2x the typical purchase cadence (tenure / frequency).'
  quality:
  - name: ltv_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per customer, keyed on the DURABLE profile_id (never the version-specific profile_sk).
      A re-versioned customer must not fragment into multiple rows — the SCD2 fragmentation guard (standard
      §A.16). Dormant-green under single-version synthetic data; fires once profile carries history.
    query: 'SELECT profile_id

      FROM actionable_customer_understanding.gold_customer_ltv

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: ltv_rfm_components_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_rfm_components_range
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_ltv

      WHERE r_score NOT BETWEEN 1 AND 5 OR f_score NOT BETWEEN 1 AND 5 OR m_score NOT BETWEEN 1 AND 5'
  - name: ltv_value_tier_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_value_tier_domain
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_ltv

      WHERE value_tier NOT IN (''PLATINUM'', ''GOLD'', ''SILVER'', ''BRONZE'')'
  - name: ltv_predicted_clv_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_predicted_clv_nonnegative
    query: 'SELECT * FROM actionable_customer_understanding.gold_customer_ltv

      WHERE predicted_clv < 0'
  - name: ltv_customer_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ltv_customer_fk_orphan
    query: 'SELECT g.* FROM actionable_customer_understanding.gold_customer_ltv g

      LEFT JOIN customer.profile p ON g.profile_sk = p.profile_sk

      WHERE p.profile_sk IS NULL'
  - name: ltv_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: ltv_rowcount
    query: SELECT COUNT(*) AS ltv_rows FROM actionable_customer_understanding.gold_customer_ltv
  - name: ltv_value_tier_spread
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: distinct value tiers present (4 = full spread).'
    query: SELECT COUNT(DISTINCT value_tier) AS distinct_tiers FROM actionable_customer_understanding.gold_customer_ltv
  - name: ltv_predicted_clv_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: ltv_predicted_clv_null_rate
    query: 'SELECT ROUND(AVG(CASE WHEN predicted_clv IS NULL THEN 1.0 ELSE 0.0 END), 4) AS predicted_null_rate

      FROM actionable_customer_understanding.gold_customer_ltv'
- name: gold_customer_product_affinity
  physicalName: actionable_customer_understanding.gold_customer_product_affinity
  physicalType: view
  description: 'Individualized customer -> product affinity: one row per (customer × product) the customer
    has purchased, with a transparent, recency-weighted PURCHASE-HISTORY affinity score. Feeds "recommended
    for you" / personalized re-purchase prompts. Built on the BASE order fact; keyed on the DURABLE, pseudonymous
    profile_id (no raw PII). This is the explicit, explainable modality (NOT an ML model) — the analogue
    of predicted_clv''s heuristic-not-model stance.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: customer_product_affinity_id
    logicalType: string
    physicalType: STRING
    description: 'Durable grain key: profile_id|product_id.'
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer business key (not raw PII).
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product business key.
  - name: product_name
    logicalType: string
    physicalType: STRING
    description: Display name of the product (current version; label only).
  - name: category
    logicalType: string
    physicalType: STRING
    description: Merchandising category (current version; label only).
  - name: subcategory
    logicalType: string
    physicalType: STRING
    description: Merchandising subcategory (current version; label only).
  - name: brand
    logicalType: string
    physicalType: STRING
    description: Brand (current version; label only).
  - name: purchase_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct orders (purchase occasions) the customer bought this product on.
  - name: total_units
    logicalType: integer
    physicalType: BIGINT
    description: Total units of this product the customer purchased.
  - name: total_net_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total net spend on this product, in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Reporting/base currency of total_net_amount (ISO 4217).
  - name: first_purchase_date
    logicalType: date
    physicalType: DATE
    description: Date of the customer's first purchase of this product.
  - name: last_purchase_date
    logicalType: date
    physicalType: DATE
    description: Date of the customer's most recent purchase of this product.
  - name: last_purchased_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Event-time (UTC) of the customer's most recent PURCHASE of this product (MAX event_timestamp)
      — carries time-of-day, not midnight. Named for the single v1 driver (PURCHASE_HISTORY); a broader
      last_interacted_at spanning browse/ML interaction sources is a documented follow-on.
  - name: days_since_last_purchase
    logicalType: integer
    physicalType: INT
    description: Days from the last purchase to as_of_date (MAX(order_date) in the data) — the input to
      recency decay.
  - name: recency_weight
    logicalType: number
    physicalType: DECIMAL(5, 4)
    description: Exponential time-decay weight pow(0.5, days_since_last_purchase / 90) in (0,1]. Half-life
      90 days.
  - name: affinity_score
    logicalType: number
    physicalType: DECIMAL(5, 4)
    description: Purchase-history affinity in [0,1] = LEAST(1, purchase_intensity x recency_weight); purchase_intensity
      = LEAST(1, purchase_count / 5). Transparent heuristic, not an ML model.
  - name: affinity_band
    logicalType: string
    physicalType: STRING
    description: 'Coarse affinity bucket: high (>= 0.6) / medium (>= 0.2) / low.'
  - name: primary_driver
    logicalType: string
    physicalType: STRING
    description: What the affinity is derived from. v1 is always PURCHASE_HISTORY; BROWSE_BEHAVIOR and
      latent/embedding (ML) drivers are a documented follow-on.
  quality:
  - name: customer_product_affinity_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per (customer × product), keyed on the durable profile_id + product_id.
    query: 'SELECT profile_id, product_id

      FROM actionable_customer_understanding.gold_customer_product_affinity

      GROUP BY profile_id, product_id

      HAVING COUNT(*) > 1'
  - name: customer_product_affinity_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: customer_product_affinity_keys_not_null
    query: 'SELECT *

      FROM actionable_customer_understanding.gold_customer_product_affinity

      WHERE customer_product_affinity_id IS NULL OR profile_id IS NULL OR product_id IS NULL'
  - name: customer_product_affinity_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: affinity_score and recency_weight are bounded [0,1]; days_since_last_purchase >= 0.
    query: "SELECT *\nFROM actionable_customer_understanding.gold_customer_product_affinity\nWHERE affinity_score\
      \ NOT BETWEEN 0 AND 1\n   OR recency_weight NOT BETWEEN 0 AND 1\n   OR days_since_last_purchase\
      \ < 0"
  - name: customer_product_affinity_band_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: customer_product_affinity_band_domain
    query: 'SELECT *

      FROM actionable_customer_understanding.gold_customer_product_affinity

      WHERE affinity_band NOT IN (''high'', ''medium'', ''low'')'
  - name: customer_product_affinity_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'total_net_amount is a monetary fact, so it must never silently mix currencies: the canonical
      core is single-reporting-currency by construction, so the view carries exactly one currency_code
      and never a NULL. Mirrors competitor_promotion_single_currency / market_benchmark_single_currency
      (DQ-FACT-COVERAGE, standard §A.12). Vacuously green when empty.'
    query: "SELECT 1\nFROM actionable_customer_understanding.gold_customer_product_affinity\nHAVING COUNT(DISTINCT\
      \ currency_code) > 1\n    OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) > 0"
  - name: customer_product_affinity_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: customer_product_affinity_profile_fk_orphan
    query: "SELECT g.customer_product_affinity_id, g.profile_id\nFROM actionable_customer_understanding.gold_customer_product_affinity\
      \ g\nLEFT JOIN customer.profile p\n  ON g.profile_id = p.profile_id AND p.is_current = TRUE\nWHERE\
      \ p.profile_id IS NULL"
  - name: customer_product_affinity_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: customer_product_affinity_product_fk_orphan
    query: "SELECT g.customer_product_affinity_id, g.product_id\nFROM actionable_customer_understanding.gold_customer_product_affinity\
      \ g\nLEFT JOIN product.product p\n  ON g.product_id = p.product_id AND p.is_current = TRUE\nWHERE\
      \ p.product_id IS NULL"
  - name: customer_product_affinity_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: customer_product_affinity_rowcount
    query: 'SELECT COUNT(*) AS customer_product_affinity_rows

      FROM actionable_customer_understanding.gold_customer_product_affinity'
- name: gold_market_share
  physicalName: actionable_customer_understanding.gold_market_share
  physicalType: view
  description: 'License: see repository LICENSE.md'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: benchmark_cell_id
    logicalType: string
    physicalType: STRING
    description: Stable logical cell identity shared across original and restated deliveries.
  - name: market_benchmark_id
    logicalType: string
    physicalType: STRING
    description: Current delivered-version identity selected for the stable benchmark cell.
  - name: source_observation_id
    logicalType: string
    physicalType: STRING
    description: Source identity of the selected delivered cell version.
  - name: record_source
    logicalType: string
    physicalType: STRING
    description: Licensed benchmark source namespace; methodology and usage rights remain source-specific.
  - name: market_definition
    logicalType: string
    physicalType: STRING
    description: Measured store/channel universe supplied by the source; a share number is not meaningful
      without it.
  - name: geography_level
    logicalType: string
    physicalType: STRING
    description: 'Provider geography hierarchy level: total, region, market, key_account or account_market.'
  - name: geography_code
    logicalType: string
    physicalType: STRING
    description: Provider or adopter identifier at geography_level.
  - name: category_ref
    logicalType: string
    physicalType: STRING
    description: Adopter-owned mapping from the benchmark category to the own merchandising hierarchy.
  - name: subject_type
    logicalType: string
    physicalType: STRING
    description: 'Served subject: own banner, competitor banner, brand or private label; total-category
      cells are denominator-only inputs.'
  - name: subject_id
    logicalType: string
    physicalType: STRING
    description: Source identifier for the served non-total subject.
  - name: competitor_id
    logicalType: string
    physicalType: STRING
    description: Durable BMV competitor key when a competitor-banner subject is mapped.
  - name: competitor_name
    logicalType: string
    physicalType: STRING
    description: Competitor display name effective at provider period end.
  - name: period_type
    logicalType: string
    physicalType: STRING
    description: Provider period vocabulary; never relabeled as an own fiscal period.
  - name: period_end_date
    logicalType: date
    physicalType: DATE
    description: Provider-defined period end date used for stable-cell grain and period-end display-name
      resolution.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: ISO 4217 reporting currency for benchmark monetary measures.
  - name: market_share_sales_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Additive measured sales for this subject cell; numerator for market share.
  - name: market_size_sales_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Matching total-category sales; denominator for market share.
  - name: subject_unit_volume
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Measured unit volume for the selected subject cell.
  - name: market_size_unit_volume
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Matching total-category unit volume.
  - name: market_share_pct
    logicalType: number
    physicalType: DOUBLE
    description: 100 x subject sales / matching total-category sales. NULL when the denominator cell is
      unavailable.
  - name: provider_reported_market_share_pct
    logicalType: number
    physicalType: DOUBLE
    description: Provider-reported share retained for reconciliation; non-additive and not averaged by
      the metric view.
  - name: provider_reported_market_growth_rate_pct
    logicalType: number
    physicalType: DOUBLE
    description: Provider-reported growth retained without recomputation across restatements.
  - name: eq_volume
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Optional provider-supplied equivalized volume.
  - name: acv_weighted_distribution_pct
    logicalType: number
    physicalType: DOUBLE
    description: Optional provider-supplied importance-weighted distribution percentage; non-additive.
  - name: numeric_distribution_pct
    logicalType: number
    physicalType: DOUBLE
    description: Optional provider-supplied outlet-count-weighted distribution percentage; non-additive.
  - name: tdp
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Optional provider-supplied total distribution points.
  - name: promo_sales_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Optional provider-supplied sales attributed to promotional conditions.
  - name: base_sales_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Optional provider-supplied sales attributed to base conditions.
  - name: is_restatement
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the selected current delivery revised an earlier version of the stable cell.
  - name: restates_market_benchmark_id
    logicalType: string
    physicalType: STRING
    description: Delivered-version key superseded by the selected restatement, when supplied.
  - name: observed_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Provider observation or publication timestamp for the selected version.
  - name: provider_updated_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Provider update timestamp used first in latest-wins ordering.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Lakehouse load timestamp used after provider and observation timestamps in latest-wins
      ordering.
  - name: market_share_basis
    logicalType: string
    physicalType: STRING
    description: 'Ratio basis used by the metric view: subject sales over matching total-category sales.'
  - name: license_posture
    logicalType: string
    physicalType: STRING
    description: Default internal-use-only boundary for licensed cells and their derivatives; adopters
      apply their own contracts.
  quality:
  - name: market_benchmark_latest_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_benchmark_latest_unique
    query: 'SELECT benchmark_cell_id

      FROM actionable_customer_understanding.gold_market_share

      GROUP BY benchmark_cell_id

      HAVING COUNT(*) <> 1'
  - name: market_benchmark_share_sum
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: 'Gold excludes total-category denominator cells. A sum below 100 is an honest unmeasured
      remainder; only over-allocation beyond rounding tolerance is flagged. Subject types are non-mutually-exclusive
      measurement lenses: banners, brands and private label may overlap, so the per-subject_type partition
      is deliberate.'
    query: "SELECT\n  record_source, market_definition, geography_level, geography_code,\n  category_ref,\
      \ subject_type, period_type, period_end_date,\n  SUM(provider_reported_market_share_pct) AS measured_subject_share_pct\n\
      FROM actionable_customer_understanding.gold_market_share\nWHERE provider_reported_market_share_pct\
      \ IS NOT NULL\nGROUP BY\n  record_source, market_definition, geography_level, geography_code,\n\
      \  category_ref, subject_type, period_type, period_end_date\nHAVING SUM(provider_reported_market_share_pct)\
      \ > 100.01"
  - name: market_share_banner_set_share_sum
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: Own and competitor banners form one mutually-exclusive lens, so validate their combined
      reported share without mixing in overlapping brand/private-label lenses.
    query: "SELECT\n  record_source, market_definition, geography_level, geography_code,\n  category_ref,\
      \ period_type, period_end_date,\n  SUM(provider_reported_market_share_pct) AS measured_banner_share_pct\n\
      FROM actionable_customer_understanding.gold_market_share\nWHERE subject_type IN ('own_banner', 'competitor_banner')\n\
      \  AND provider_reported_market_share_pct IS NOT NULL\nGROUP BY\n  record_source, market_definition,\
      \ geography_level, geography_code,\n  category_ref, period_type, period_end_date\nHAVING SUM(provider_reported_market_share_pct)\
      \ > 100.01"
  - name: market_share_percentage_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_share_percentage_bounds
    query: "SELECT *\nFROM actionable_customer_understanding.gold_market_share\nWHERE (market_share_pct\
      \ IS NOT NULL AND market_share_pct NOT BETWEEN 0 AND 100)\n   OR (provider_reported_market_share_pct\
      \ IS NOT NULL\n       AND provider_reported_market_share_pct NOT BETWEEN 0 AND 100)\n   OR (acv_weighted_distribution_pct\
      \ IS NOT NULL\n       AND acv_weighted_distribution_pct NOT BETWEEN 0 AND 100)\n   OR (numeric_distribution_pct\
      \ IS NOT NULL\n       AND numeric_distribution_pct NOT BETWEEN 0 AND 100)"
  - name: market_share_component_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: market_share_component_consistency
    query: "SELECT *\nFROM actionable_customer_understanding.gold_market_share\nWHERE market_share_sales_amount\
      \ IS NOT NULL\n  AND market_size_sales_amount IS NOT NULL\n  AND market_share_sales_amount > market_size_sales_amount"
  - name: market_share_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: Counts served non-total subject cells; denominator-only total-category cells stay internal.
    query: 'SELECT COUNT(*) AS market_share_subject_rows

      FROM actionable_customer_understanding.gold_market_share'
- name: gold_product_affinity_pairwise
  physicalName: actionable_customer_understanding.gold_product_affinity_pairwise
  physicalType: view
  description: 'Rules-based product affinity: "frequently bought together" association rules (support
    / confidence / lift) computed by MARKET BASKET ANALYSIS over the customer-attributed order fact (customer_order_line),
    for MULTIPLE TRAILING WINDOWS. One row per DIRECTED product pair × time_window (A -> B): support and
    lift are symmetric, confidence is directional, so both A->B and B->A are emitted. Built entirely on
    the BASE dimensional model — no ML, no stored affinity table, no synthetic producer: the durable product_id
    lives on customer_order_line, and `product` is read (current version) only for display labels (name
    / category / brand).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_affinity_id
    logicalType: string
    physicalType: STRING
    description: 'Durable grain key for the directed pair: product_id_a|product_id_b|time_window.'
  - name: product_id_a
    logicalType: string
    physicalType: STRING
    description: Antecedent product (the durable business key). The "if a customer buys A" side.
  - name: product_name_a
    logicalType: string
    physicalType: STRING
    description: Display name of product A (current product version; label only).
  - name: category_a
    logicalType: string
    physicalType: STRING
    description: Merchandising category of product A (current version; label only).
  - name: brand_a
    logicalType: string
    physicalType: STRING
    description: Brand of product A (current version; label only).
  - name: product_id_b
    logicalType: string
    physicalType: STRING
    description: Consequent product (the durable business key). The "...they also buy B" side.
  - name: product_name_b
    logicalType: string
    physicalType: STRING
    description: Display name of product B (current product version; label only).
  - name: category_b
    logicalType: string
    physicalType: STRING
    description: Merchandising category of product B (current version; label only).
  - name: brand_b
    logicalType: string
    physicalType: STRING
    description: Brand of product B (current version; label only).
  - name: time_window
    logicalType: string
    physicalType: STRING
    description: 'The trailing window the rule was computed over: 30D / 90D / ALL_TIME, each anchored
      to MAX(order_date) (not current_date). support/confidence/lift are recomputed per window, so a pair
      can rank differently or drop out in a shorter window.'
  - name: computed_through_date
    logicalType: date
    physicalType: DATE
    description: 'The anchor the trailing windows trail from: MAX(order_date) in the data (same value
      on every row). A 30D row therefore covers computed_through_date - 30 days .. computed_through_date;
      makes the window end explicit for interpretability.'
  - name: cooccurrence_baskets
    logicalType: integer
    physicalType: BIGINT
    description: Baskets (orders) containing BOTH A and B — the numerator for support and confidence.
  - name: antecedent_baskets
    logicalType: integer
    physicalType: BIGINT
    description: Baskets containing A (the confidence denominator).
  - name: consequent_baskets
    logicalType: integer
    physicalType: BIGINT
    description: Baskets containing B.
  - name: total_baskets
    logicalType: integer
    physicalType: BIGINT
    description: Distinct baskets (orders) in the window — the support denominator.
  - name: support
    logicalType: number
    physicalType: DECIMAL(12, 8)
    description: 'Support = cooccurrence_baskets / total_baskets: how common the pair is across all baskets
      (0..1).'
  - name: confidence
    logicalType: number
    physicalType: DECIMAL(12, 8)
    description: 'Confidence(A->B) = cooccurrence_baskets / antecedent_baskets: P(B in basket | A in basket)
      (0..1). Directional.'
  - name: lift
    logicalType: number
    physicalType: DECIMAL(18, 8)
    description: 'Lift = support(A,B) / (support(A) x support(B)): association strength vs. chance. >
      1 = positive/meaningful, = 1 = independent, < 1 = substitutes.'
  - name: is_mirrored_pair
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE on the mirror copy (product_id_a > product_id_b). Filter to FALSE for one row per
      undirected pair; keep both for directional confidence.
  quality:
  - name: product_affinity_pairwise_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per directed pair × window (product_id_a × product_id_b × time_window).
    query: 'SELECT product_id_a, product_id_b, time_window

      FROM actionable_customer_understanding.gold_product_affinity_pairwise

      GROUP BY product_id_a, product_id_b, time_window

      HAVING COUNT(*) > 1'
  - name: product_affinity_pairwise_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The grain key and both pair legs must be non-null (symmetric with customer_product_affinity_keys_not_null).
      The view can't emit nulls today (its source filters product_id/order_id IS NOT NULL), so this guards
      the invariant against future source changes rather than a current defect.
    query: 'SELECT *

      FROM actionable_customer_understanding.gold_product_affinity_pairwise

      WHERE product_affinity_id IS NULL OR product_id_a IS NULL OR product_id_b IS NULL OR time_window
      IS NULL'
  - name: product_affinity_pairwise_metric_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Support/confidence are probabilities (0..1); lift is a non-negative ratio; a pair never
      pairs a product with itself.
    query: "SELECT *\nFROM actionable_customer_understanding.gold_product_affinity_pairwise\nWHERE support\
      \ NOT BETWEEN 0 AND 1\n   OR confidence NOT BETWEEN 0 AND 1\n   OR lift < 0\n   OR product_id_a\
      \ = product_id_b"
  - name: product_affinity_pairwise_count_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Co-occurrence cannot exceed either single-item basket count or the basket total.
    query: "SELECT *\nFROM actionable_customer_understanding.gold_product_affinity_pairwise\nWHERE cooccurrence_baskets\
      \ > antecedent_baskets\n   OR cooccurrence_baskets > consequent_baskets\n   OR antecedent_baskets\
      \ > total_baskets\n   OR consequent_baskets > total_baskets"
  - name: product_affinity_pairwise_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Both pair legs must resolve to a current product (durable-key FK into product).
    query: "SELECT g.product_affinity_id\nFROM actionable_customer_understanding.gold_product_affinity_pairwise\
      \ g\nWHERE NOT EXISTS (\n        SELECT 1 FROM product.product p\n        WHERE p.product_id = g.product_id_a\
      \ AND p.is_current = TRUE)\n   OR NOT EXISTS (\n        SELECT 1 FROM product.product p\n      \
      \  WHERE p.product_id = g.product_id_b AND p.is_current = TRUE)"
  - name: product_affinity_pairwise_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: product_affinity_pairwise_rowcount
    query: 'SELECT COUNT(*) AS pairwise_affinity_rows

      FROM actionable_customer_understanding.gold_product_affinity_pairwise'
- name: mv_competitive_position
  physicalName: actionable_customer_understanding.mv_competitive_position
  physicalType: view
  description: Observation-native competitive price, promotion, distribution, availability, assortment,
    match-quality and detection-bound measures by category, durable competitor, observed channel and fiscal
    period. Price remains on national all-channel rows; measure_scope is price, promotion, assortment,
    or promotion_assortment. Assortment rollups across competitors or channels are presence-weighted per-grain
    averages, not own-catalog unions.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: category
    logicalType: string
    businessName: Category
    customProperties:
    - property: synonyms
      value:
      - merchandising_category
      - product_category
    description: Own merchandising category captured by the version-specific price product or source observation.
  - name: competitor_id
    logicalType: string
    businessName: Competitor ID
    customProperties:
    - property: synonyms
      value:
      - rival_id
      - competitor
    description: Durable competitor business key, stable across SCD2 versions.
  - name: competitor_name
    logicalType: string
    businessName: Competitor Name
    customProperties:
    - property: synonyms
      value:
      - rival_name
      - banner_name
    description: Competitor display name effective at fiscal-period end.
  - name: channel_code
    logicalType: string
    businessName: Observation Channel
    customProperties:
    - property: synonyms
      value:
      - sales_channel
      - competitive_channel
    description: Source-observed channel for promotion and assortment; all for national competitor-price
      observations.
  - name: fiscal_year
    logicalType: integer
    businessName: Fiscal Year
    customProperties:
    - property: synonyms
      value:
      - retail_year
    description: NRF 4-5-4 fiscal year.
  - name: fiscal_period
    logicalType: integer
    businessName: Fiscal Period
    customProperties:
    - property: synonyms
      value:
      - retail_period
    description: NRF 4-5-4 fiscal period within the fiscal year.
  - name: period_start_date
    logicalType: date
    businessName: Period Start Date
    customProperties:
    - property: synonyms
      value:
      - period_start
    description: First date of the fiscal period.
  - name: period_end_date
    logicalType: date
    businessName: Period End Date
    customProperties:
    - property: synonyms
      value:
      - period_end
    description: Last date of the fiscal period and competitor-name as-of date.
  - name: currency_code
    logicalType: string
    businessName: Currency
    customProperties:
    - property: synonyms
      value:
      - reporting_currency
      - base_currency
    description: ISO 4217 reporting currency where the available monetary observation families agree.
  - name: measure_scope
    logicalType: string
    businessName: Measure Scope
    customProperties:
    - property: synonyms
      value:
      - row_measure_scope
      - observation_family_scope
    description: 'Reachable observation-family scope: price, promotion, assortment, or promotion_assortment.
      Use with channel_code because national price cannot co-occur with source-channel promotion/assortment.'
  - name: price_index_basis
    logicalType: string
    businessName: Price Index Basis
    customProperties:
    - property: synonyms
      value:
      - price_basis
    description: 'Regular-price basis: own list price versus competitor MRP.'
  - name: price_coverage_basis
    logicalType: string
    businessName: Price Coverage Basis
    customProperties:
    - property: synonyms
      value:
      - coverage_basis
    description: Usable regular-price products divided by observed matched price products.
  - name: promo_sov_basis
    logicalType: string
    businessName: Promotion SOV Basis
    customProperties:
    - property: synonyms
      value:
      - promo_presence_basis
      - share_of_voice_basis
    description: Promoted product-day presence over own product-days covered by any competitor observation;
      placement and spend bases are not blended.
  - name: distribution_basis
    logicalType: string
    businessName: Distribution Basis
    customProperties:
    - property: synonyms
      value:
      - points_of_availability_basis
    description: Observed listing locations and unmatched listed competitor items; no fabricated ACV weighting.
  - name: availability_basis
    logicalType: string
    businessName: Availability Basis
    customProperties:
    - property: synonyms
      value:
      - stock_basis
    description: Listed assortment observations with an explicit stock state.
  - name: assortment_basis
    logicalType: string
    businessName: Assortment Basis
    customProperties:
    - property: synonyms
      value:
      - overlap_basis
      - match_floor_basis
    description: Observed active own products versus observed competitor items using exact/equivalent
      matches at confidence 0.80 or higher.
  - name: detection_basis
    logicalType: string
    businessName: Detection Basis
    customProperties:
    - property: synonyms
      value:
      - detection_bound_basis
      - freshness_basis
    description: Upper-bound lag from displayed promotion start or the prior assortment observation; not
      event-time certainty.
  - name: channel_basis
    logicalType: string
    businessName: Channel Basis
    customProperties:
    - property: synonyms
      value:
      - geography_channel_basis
    description: Distinguishes national all-channel price rows from source-observed promotion and assortment
      channels.
  - name: price_index_vs_competitor
    logicalType: number
    businessName: Price Index vs Competitor
    customProperties:
    - property: synonyms
      value:
      - competitor_price_index
      - price_parity_index
    description: Arithmetic mean of usable product-day own-list/competitor-MRP price relatives, unweighted
      across observations; 100 is regular-price parity.
  - name: sales_weighted_price_index_vs_competitor
    logicalType: number
    businessName: Sales-Weighted Price Index
    customProperties:
    - property: synonyms
      value:
      - weighted_competitor_price_index
    description: Own-unit-weighted arithmetic mean of usable product-day own-list/competitor-MRP price
      relatives; not a ratio of aggregate price totals.
  - name: price_observation_coverage_pct
    logicalType: number
    businessName: Usable Price-Product Coverage %
    customProperties:
    - property: synonyms
      value:
      - price_coverage
      - matched_price_coverage
    description: Usable price-product counts divided by observed matched price-product counts; no cap.
  - name: promo_sov_pct
    logicalType: number
    businessName: Promotion Share of Voice %
    customProperties:
    - property: synonyms
      value:
      - promotion_sov
      - promo_presence_share
    description: Own promoted product-day presence divided by own plus competitor promoted presence over
      the same observation-coverage product-days.
  - name: avg_discount_depth_pct
    logicalType: number
    businessName: Average Competitor Discount Depth %
    customProperties:
    - property: synonyms
      value:
      - competitor_discount_depth
    description: Arithmetic mean of observed or ingest-derived competitor-promotion discount-depth percentages
      with known depth.
  - name: listed_share_pct
    logicalType: number
    businessName: Observed Listed Share %
    customProperties:
    - property: synonyms
      value:
      - listing_rate
      - listed_presence_share
    description: Listed observations divided by all assortment observations.
  - name: availability_rate_pct
    logicalType: number
    businessName: Observed Availability Rate %
    customProperties:
    - property: synonyms
      value:
      - in_stock_rate
      - observed_availability
    description: Available listed observations divided by listed observations with known stock state.
  - name: assortment_overlap_pct
    logicalType: number
    businessName: Assortment Overlap %
    customProperties:
    - property: synonyms
      value:
      - range_overlap
      - matched_assortment_share
    description: Confidence-qualified active-own matched listings divided by observed active-own product-periods.
      Rollups across competitors or channels are presence-weighted averages, not a union over the own
      catalog.
  - name: assortment_uniqueness_pct
    logicalType: number
    businessName: Own Assortment Uniqueness %
    customProperties:
    - property: synonyms
      value:
      - range_uniqueness
      - differentiated_assortment_share
    description: Observed active-own product-periods without a confidence-qualified competitor listing.
      Rollups across competitors or channels are presence-weighted averages, not a union over the own
      catalog.
  - name: assortment_jaccard_index_pct
    logicalType: number
    businessName: Assortment Jaccard Index %
    customProperties:
    - property: synonyms
      value:
      - jaccard_similarity
      - symmetric_assortment_overlap
    description: Product-space intersection divided by observed active-own products plus unmatched competitor
      items. Rollups across competitors or channels are presence-weighted averages, not a set union.
  - name: match_coverage_pct
    logicalType: number
    businessName: Competitor Item Match Coverage %
    customProperties:
    - property: synonyms
      value:
      - entity_resolution_coverage
      - assortment_match_coverage
    description: Listed competitor item-periods with exact/equivalent matches at confidence 0.80 or higher.
  - name: share_of_search_avg_rank
    logicalType: number
    businessName: Average Search Rank
    customProperties:
    - property: synonyms
      value:
      - search_visibility_rank
      - digital_shelf_rank
    description: Ratio-of-sums average rank where digital-shelf observations provide search position.
  - name: avg_detection_lag_upper_bound_days
    logicalType: number
    businessName: Average Detection-Lag Upper Bound (Days)
    customProperties:
    - property: synonyms
      value:
      - time_to_detect
      - detection_bound_days
    description: Average upper bound across promotion starts and observed assortment state changes; cadence
      is published separately.
  - name: avg_promotion_detection_lag_days
    logicalType: number
    businessName: Average Promotion Detection-Lag Bound (Days)
    customProperties:
    - property: synonyms
      value:
      - promotion_time_to_detect
      - promo_detection_bound_days
    description: Mean upper bound from displayed promotion start to observation; exposed separately because
      promotion and assortment bounds are not interchangeable.
  - name: avg_assortment_detection_lag_days
    logicalType: number
    businessName: Average Assortment Detection-Lag Bound (Days)
    customProperties:
    - property: synonyms
      value:
      - assortment_time_to_detect
      - listing_detection_bound_days
    description: Mean prior-observation interval when listing or availability changed; exposed separately
      from promotion detection.
  - name: avg_observation_cadence_days
    logicalType: number
    businessName: Average Assortment Observation Cadence (Days)
    customProperties:
    - property: synonyms
      value:
      - crawl_cadence_days
      - observation_interval
    description: Elapsed days between consecutive assortment observations for the same durable competitor
      item, location and channel.
  - name: points_of_availability_count
    logicalType: integer
    businessName: Points of Availability
    customProperties:
    - property: synonyms
      value:
      - distribution_points
      - availability_points
    description: Observed listed location-points summed across selected category/competitor/channel periods;
      national v1 uses ALL.
  - name: listed_channel_count
    logicalType: integer
    businessName: Listed Channels
    customProperties:
    - property: synonyms
      value:
      - channel_points_of_availability
      - distribution_channel_count
    description: Distinct source-observed channels with a listed item for one category, competitor and
      fiscal period. Group by those dimensions; this context count is repeated across channel rows and
      is not additive.
  - name: valid_price_observation_count
    logicalType: integer
    businessName: Valid Price Observations
    customProperties:
    - property: synonyms
      value:
      - usable_price_pairs
    description: Positive regular-price pairs in the same reporting currency.
  - name: valid_price_product_count
    logicalType: integer
    businessName: Valid Price Products
    customProperties:
    - property: synonyms
      value:
      - usable_price_products
    description: Distinct usable price products summed as product-period counts.
  - name: observed_price_product_count
    logicalType: integer
    businessName: Observed Price Products
    customProperties:
    - property: synonyms
      value:
      - price_coverage_denominator
    description: Distinct matched price products summed as product-period counts.
  - name: matched_units
    logicalType: number
    businessName: Matched Own Units
    customProperties:
    - property: synonyms
      value:
      - price_matched_units
    description: Own units sold on usable regular-price-pair product-days.
  - name: competitor_observation_count
    logicalType: integer
    businessName: Competitor Price Observations
    customProperties:
    - property: synonyms
      value:
      - price_crawl_observations
    description: Competitor price rows represented by the selected gold grains.
  - name: own_promo_presence_count
    logicalType: integer
    businessName: Own Promo Presence Count
    customProperties:
    - property: synonyms
      value:
      - own_promo_product_days
    description: Own promoted product-days on comparable competitor-promotion observations.
  - name: competitor_promo_presence_count
    logicalType: integer
    businessName: Competitor Promo Presence Count
    customProperties:
    - property: synonyms
      value:
      - rival_promo_product_days
    description: Comparable matched competitor promotion product-days.
  - name: competitor_promotion_observation_count
    logicalType: integer
    businessName: Competitor Promotion Observations
    customProperties:
    - property: synonyms
      value:
      - promo_observations
    description: All source promotion observations, including category-only placements.
  - name: assortment_observation_count
    logicalType: integer
    businessName: Assortment Observations
    customProperties:
    - property: synonyms
      value:
      - listing_observations
    description: All listing and availability observations.
  - name: listed_observation_count
    logicalType: integer
    businessName: Listed Observations
    customProperties:
    - property: synonyms
      value:
      - listing_presence_count
    description: Assortment observations explicitly marked listed.
  - name: available_observation_count
    logicalType: integer
    businessName: Available Listed Observations
    customProperties:
    - property: synonyms
      value:
      - in_stock_observations
    description: Listed observations explicitly marked available.
  - name: out_of_stock_observation_count
    logicalType: integer
    businessName: Out-of-Stock Listed Observations
    customProperties:
    - property: synonyms
      value:
      - oos_observations
    description: Listed observations explicitly marked unavailable.
  - name: stock_flagged_observation_count
    logicalType: integer
    businessName: Stock-State-Known Listed Observations
    customProperties:
    - property: synonyms
      value:
      - availability_denominator
    description: Listed observations with a non-null availability state.
  - name: competitor_listed_item_count
    logicalType: integer
    businessName: Competitor Listed Item-Periods
    customProperties:
    - property: synonyms
      value:
      - competitor_assortment_items
    description: Distinct listed competitor items summed across gold periods.
  - name: matched_listed_product_count
    logicalType: integer
    businessName: Matched Listed Product-Periods
    customProperties:
    - property: synonyms
      value:
      - assortment_intersection_count
    description: Distinct own products with confidence-qualified competitor listings, summed across periods.
  - name: matched_listed_inactive_product_count
    logicalType: integer
    businessName: Matched Listed Inactive Own Product-Periods
    customProperties:
    - property: synonyms
      value:
      - inactive_matched_listing_count
      - excluded_overlap_matches
    description: Confidence-qualified competitor listings whose matched own product is outside the active
      period-end catalog; excluded from overlap but published for audit.
  - name: observed_own_product_count
    logicalType: integer
    businessName: Observed Active Own Product-Periods
    customProperties:
    - property: synonyms
      value:
      - matchable_own_products
      - observed_own_assortment
    description: Active own products represented by at least one assortment observation; denominator for
      overlap and uniqueness.
  - name: unmatched_listed_item_count
    logicalType: integer
    businessName: Unmatched Listed Item-Periods
    customProperties:
    - property: synonyms
      value:
      - assortment_gap_count
    description: Distinct listed competitor items without a confidence-qualified exact/equivalent match.
  - name: own_catalog_product_count
    logicalType: integer
    businessName: Own Catalog Product-Periods
    customProperties:
    - property: synonyms
      value:
      - own_assortment_denominator
    description: Distinct active own products for one category and fiscal period. Group by those dimensions;
      this context count is repeated across competitor/channel rows and is not additive.
  - name: assortment_state_change_count
    logicalType: integer
    businessName: Observed Assortment State Changes
    customProperties:
    - property: synonyms
      value:
      - competitor_move_count
    description: Listing or availability changes versus the prior observation for the same durable competitor
      item.
  - name: detection_lag_observation_count
    logicalType: integer
    businessName: Detection-Bound Observations
    customProperties:
    - property: synonyms
      value:
      - detection_denominator
    description: Promotion and assortment change observations with a computable upper-bound lag.
  - name: observation_interval_count
    logicalType: integer
    businessName: Assortment Observation Intervals
    customProperties:
    - property: synonyms
      value:
      - cadence_denominator
    description: Consecutive assortment-observation intervals used for cadence.
  - name: circular_print_promo_count
    logicalType: integer
    businessName: Print Circular Promotions
    customProperties:
    - property: synonyms
      value:
      - print_feature_count
    description: Observed print-circular promotion placements.
  - name: circular_digital_promo_count
    logicalType: integer
    businessName: Digital Circular Promotions
    customProperties:
    - property: synonyms
      value:
      - digital_feature_count
    description: Observed digital-circular promotion placements.
  - name: onsite_promo_count
    logicalType: integer
    businessName: Onsite Promotions
    customProperties:
    - property: synonyms
      value:
      - web_promo_count
    description: Observed onsite promotion placements.
  - name: in_store_promo_count
    logicalType: integer
    businessName: In-Store Promotions
    customProperties:
    - property: synonyms
      value:
      - store_promo_count
    description: Observed in-store promotion placements.
  - name: email_app_promo_count
    logicalType: integer
    businessName: Email/App Promotions
    customProperties:
    - property: synonyms
      value:
      - direct_digital_promo_count
    description: Observed email or app promotion placements.
  - name: other_promo_count
    logicalType: integer
    businessName: Other Promotions
    customProperties:
    - property: synonyms
      value:
      - other_promotion_count
    description: Observed promotion placements in other vehicles.
- name: mv_customer_lifetime_value
  physicalName: actionable_customer_understanding.mv_customer_lifetime_value
  physicalType: view
  description: 'Customer lifetime value KPIs: historical and predicted CLV, spend per order, purchase
    frequency and recency, and churn-risk share, by value tier and RFM cell.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: value_tier
    logicalType: string
    businessName: Value Tier
    customProperties:
    - property: synonyms
      value:
      - tier
      - customer_value_tier
    description: 'historical_clv bucketed on stable fixed thresholds: PLATINUM >= 2500 / GOLD >= 1000
      / SILVER >= 250 / BRONZE else.'
  - name: rfm_score
    logicalType: integer
    businessName: RFM Cell
    customProperties:
    - property: synonyms
      value:
      - rfm
      - rfm_cell
    description: Combined RFM cell = 100*R + 10*F + M (111..555), each score from stable fixed thresholds.
  - name: r_score
    logicalType: integer
    businessName: Recency Score
    customProperties:
    - property: synonyms
      value:
      - recency_score
    description: Recency score 1-5 (5 = most recent).
  - name: f_score
    logicalType: integer
    businessName: Frequency Score
    customProperties:
    - property: synonyms
      value:
      - frequency_score
    description: Frequency score 1-5 (5 = most frequent).
  - name: m_score
    logicalType: integer
    businessName: Monetary Score
    customProperties:
    - property: synonyms
      value:
      - monetary_score
    description: Monetary score 1-5 (5 = highest spend).
  - name: churn_risk_proxy
    logicalType: boolean
    businessName: Churn Risk
    customProperties:
    - property: synonyms
      value:
      - at_risk
      - churn_flag
    description: 'Heuristic flag: recency exceeds 2x the customer''s typical purchase cadence (tenure
      / frequency).'
  - name: customer_count
    logicalType: integer
    businessName: Customers
    customProperties:
    - property: synonyms
      value:
      - clv_customers
      - customers_with_clv
    description: Count of customers with a lifetime-value record.
  - name: total_historical_clv
    logicalType: number
    businessName: Historical CLV (Total)
    customProperties:
    - property: synonyms
      value:
      - realized_clv
      - lifetime_margin
    description: Total realized gross margin to date, SUM(net_amount - units x unit_cost), reporting/base
      currency; can be negative (a real loss).
  - name: avg_historical_clv
    logicalType: number
    businessName: Historical CLV (Avg per Customer)
    customProperties:
    - property: synonyms
      value:
      - avg_clv
      - clv_per_customer
    description: Mean realized gross margin to date per customer, reporting/base currency.
  - name: total_predicted_clv
    logicalType: number
    businessName: Predicted CLV (Total)
    customProperties:
    - property: synonyms
      value:
      - forward_clv
      - expected_value
    description: 'Total transparent forward estimate (not an ML model): avg_order_margin x frequency_per_period
      x expected_active_periods, clamped >= 0 per customer, reporting/base currency.'
  - name: avg_predicted_clv
    logicalType: number
    businessName: Predicted CLV (Avg per Customer)
    customProperties:
    - property: synonyms
      value:
      - avg_forward_clv
    description: Mean predicted CLV per customer, reporting/base currency.
  - name: total_spend
    logicalType: number
    businessName: Total Spend
    customProperties:
    - property: synonyms
      value:
      - lifetime_spend
      - net_spend
    description: Total net spend in the observation window, reporting/base currency.
  - name: avg_order_value
    logicalType: number
    businessName: Avg Order Value
    customProperties:
    - property: synonyms
      value:
      - aov
      - spend_per_order
    description: Net spend per order across the selected customers = SUM(total_spend) / SUM(frequency),
      a ratio-of-sums, reporting/base currency.
  - name: avg_frequency
    logicalType: number
    businessName: Avg Purchase Frequency
    customProperties:
    - property: synonyms
      value:
      - orders_per_customer
      - frequency
    description: Mean distinct purchase occasions (orders) per customer in the observation window.
  - name: avg_recency_periods
    logicalType: number
    businessName: Avg Recency (Fiscal Periods)
    customProperties:
    - property: synonyms
      value:
      - avg_recency
      - periods_since_last_order
    description: Mean fiscal periods (NRF 4-5-4) since each customer's last order.
  - name: churn_risk_rate
    logicalType: number
    businessName: Churn Risk Rate
    customProperties:
    - property: synonyms
      value:
      - at_risk_share
      - churn_risk_share
    description: Share of customers flagged by the churn-risk heuristic.
- name: mv_market_share
  physicalName: actionable_customer_understanding.mv_market_share
  physicalType: view
  description: Current restatement-resolved market share by provider market definition, geography, category,
    non-total subject and provider period. Total-category inputs are denominator-only and are not served.
    Licensed benchmark data remains internal-use-only by default.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: record_source
    logicalType: string
    businessName: Benchmark Source
    customProperties:
    - property: synonyms
      value:
      - measurement_source
      - provider_source
    description: Licensed source-system namespace; required to interpret methodology and usage rights.
  - name: market_definition
    logicalType: string
    businessName: Market Definition
    customProperties:
    - property: synonyms
      value:
      - measured_market
      - market_universe
    description: Measured store/channel universe supplied by the benchmark source; always display with
      share.
  - name: geography_level
    logicalType: string
    businessName: Geography Level
    customProperties:
    - property: synonyms
      value:
      - market_level
      - geo_level
    description: Provider geography hierarchy level.
  - name: geography_code
    logicalType: string
    businessName: Geography
    customProperties:
    - property: synonyms
      value:
      - market_geography
      - geo_code
    description: Provider or adopter geography identifier at the stated level.
  - name: category_ref
    logicalType: string
    businessName: Category
    customProperties:
    - property: synonyms
      value:
      - merchandising_category
      - benchmark_category
    description: Adopter-owned mapping from the benchmark category to the own merchandising hierarchy.
  - name: subject_type
    logicalType: string
    businessName: Subject Type
    customProperties:
    - property: synonyms
      value:
      - share_subject_type
      - entity_type
    description: 'Served benchmark subject: own banner, competitor banner, brand, or private label. Total-category
      cells are denominator-only inputs.'
  - name: subject_id
    logicalType: string
    businessName: Subject
    customProperties:
    - property: synonyms
      value:
      - banner_or_brand
      - share_subject
    description: Source identifier for the served non-total subject.
  - name: competitor_id
    logicalType: string
    businessName: Competitor ID
    customProperties:
    - property: synonyms
      value:
      - rival_id
      - competitor
    description: Durable competitor business key when a competitor-banner subject is mapped to BMV identity.
  - name: competitor_name
    logicalType: string
    businessName: Competitor Name
    customProperties:
    - property: synonyms
      value:
      - rival_name
      - banner_name
    description: Competitor display name effective at provider period end.
  - name: period_type
    logicalType: string
    businessName: Provider Period Type
    customProperties:
    - property: synonyms
      value:
      - measurement_period_type
      - benchmark_period_type
    description: Provider period vocabulary; it is not relabeled as an own fiscal period.
  - name: period_end_date
    logicalType: date
    businessName: Provider Period End
    customProperties:
    - property: synonyms
      value:
      - measurement_period_end
      - benchmark_period_end
    description: Provider-defined period end date.
  - name: currency_code
    logicalType: string
    businessName: Currency
    customProperties:
    - property: synonyms
      value:
      - reporting_currency
      - base_currency
    description: ISO 4217 reporting/base currency for additive sales measures.
  - name: market_share_basis
    logicalType: string
    businessName: Market Share Basis
    customProperties:
    - property: synonyms
      value:
      - share_basis
    description: Subject sales divided by the matching total-category sales cell.
  - name: license_posture
    logicalType: string
    businessName: License Posture
    customProperties:
    - property: synonyms
      value:
      - data_usage_posture
      - sharing_posture
    description: Default usage boundary for licensed benchmark cells and their derivatives.
  - name: market_share_pct
    logicalType: number
    businessName: Market Share %
    customProperties:
    - property: synonyms
      value:
      - share_of_market
      - sales_share
    description: Subject sales divided by matching total-category sales. Group by subject; period rollups
      are market-size-weighted ratio-of-sums.
  - name: market_share_sales_amount
    logicalType: number
    businessName: Subject Sales
    customProperties:
    - property: synonyms
      value:
      - benchmark_subject_sales
      - share_numerator
    description: Additive measured sales for the selected subject cells.
  - name: market_size_sales_amount
    logicalType: number
    businessName: Measured Market Sales
    customProperties:
    - property: synonyms
      value:
      - benchmark_market_size
      - share_denominator
    description: Matching total-category sales denominator. Group by subject before combining multiple
      subjects.
  - name: subject_unit_volume
    logicalType: number
    businessName: Subject Unit Volume
    customProperties:
    - property: synonyms
      value:
      - benchmark_units
      - subject_units
    description: Additive measured unit volume for the selected subject cells.
  - name: benchmark_cell_count
    logicalType: integer
    businessName: Benchmark Cells
    customProperties:
    - property: synonyms
      value:
      - market_cell_count
      - measurement_cell_count
    description: Current logical benchmark cells represented by the selected dimensions.
- name: mv_product_affinity
  physicalName: actionable_customer_understanding.mv_product_affinity
  physicalType: view
  description: 'Customer→product affinity reach and strength by category / brand / driver / band: how
    many customers and products carry an affinity, their average purchase-history affinity score and recency
    weight, and the units/spend behind them. Means are ratio-of-sums and re-aggregate at any grain.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: category
    logicalType: string
    businessName: Category
    customProperties:
    - property: synonyms
      value:
      - product_category
      - department
    description: Product merchandising category (durable current label).
  - name: subcategory
    logicalType: string
    businessName: Subcategory
    customProperties:
    - property: synonyms
      value:
      - product_subcategory
    description: Product merchandising subcategory (durable current label).
  - name: brand
    logicalType: string
    businessName: Brand
    customProperties:
    - property: synonyms
      value:
      - product_brand
      - label
    description: Product brand (durable current label).
  - name: primary_driver
    logicalType: string
    businessName: Affinity Driver
    customProperties:
    - property: synonyms
      value:
      - driver
      - affinity_source
      - signal
    description: What the affinity is derived from. v1 is always PURCHASE_HISTORY; browse-behavior and
      latent/embedding (ML) drivers are a documented follow-on.
  - name: affinity_band
    logicalType: string
    businessName: Affinity Band
    customProperties:
    - property: synonyms
      value:
      - affinity_tier
      - strength_band
    description: 'Coarse affinity strength bucket: high (>= 0.6) / medium (>= 0.2) / low.'
  - name: customer_product_pairs
    logicalType: integer
    businessName: Customer-Product Pairs
    customProperties:
    - property: synonyms
      value:
      - affinity_pairs
      - pairs
    description: Count of (customer × product) affinity rows. Additive over the dimensions.
  - name: distinct_customers
    logicalType: integer
    businessName: Customers with Affinity
    customProperties:
    - property: synonyms
      value:
      - customers
      - reach
      - audience_size
    description: Distinct customers carrying an affinity on the selected slice (keyed on the durable pseudonymous
      profile_id).
  - name: distinct_products
    logicalType: integer
    businessName: Products with Affinity
    customProperties:
    - property: synonyms
      value:
      - products
      - sku_reach
    description: Distinct products carrying an affinity on the selected slice.
  - name: avg_affinity_score
    logicalType: number
    businessName: Average Affinity Score
    customProperties:
    - property: synonyms
      value:
      - mean_affinity
      - affinity_strength
    description: Mean purchase-history affinity score (0..1). Ratio-of-sums, so it re-aggregates at any
      grain.
  - name: avg_recency_weight
    logicalType: number
    businessName: Average Recency Weight
    customProperties:
    - property: synonyms
      value:
      - mean_recency
      - recency
    description: Mean recency-decay weight (0..1) across the affinity rows. Ratio-of-sums.
  - name: total_affinity_units
    logicalType: integer
    businessName: Units Behind Affinity
    customProperties:
    - property: synonyms
      value:
      - units
      - quantity
    description: Total units purchased across the affinity rows on the slice.
  - name: total_affinity_spend
    logicalType: number
    businessName: Spend Behind Affinity
    customProperties:
    - property: synonyms
      value:
      - spend
      - revenue
      - net_amount
    description: Total net spend behind the affinity rows on the slice, in the reporting/base currency.
- name: mv_segment_performance
  physicalName: actionable_customer_understanding.mv_segment_performance
  physicalType: view
  description: 'Per behavioral-segment size and activatable reach: total members, gate-eligible members,
    and activatable penetration.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/actionable-customer-understanding/README.md
    type: businessDefinition
  - url: outcome-packages/actionable-customer-understanding/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: audience_id
    logicalType: string
    businessName: Segment ID
    customProperties:
    - property: synonyms
      value:
      - segment_id
      - audience
    description: Durable segment/audience business key.
  - name: audience_name
    logicalType: string
    businessName: Segment Name
    customProperties:
    - property: synonyms
      value:
      - segment_name
    description: Human-readable segment name.
  - name: segmentation_basis
    logicalType: string
    businessName: Segmentation Basis
    customProperties:
    - property: synonyms
      value:
      - segment_type
      - basis
    description: The axis the segment is built on (behavioral, value_rfm, lifecycle, predictive, ...).
  - name: member_count
    logicalType: integer
    businessName: Members
    customProperties:
    - property: synonyms
      value:
      - segment_size
      - audience_size
    description: Distinct customers currently in the segment (latest as-of snapshot).
  - name: reachable_member_count
    logicalType: integer
    businessName: Reachable Members
    customProperties:
    - property: synonyms
      value:
      - activatable_members
      - addressable_members
    description: Distinct members who clear the consent+preference+reachability activation gate on an
      OWNED channel (email/sms/phone/postal). Channel-agnostic analytics/personalization consent alone
      does not make a member reachable.
  - name: activatable_penetration
    logicalType: number
    businessName: Activatable Penetration
    customProperties:
    - property: synonyms
      value:
      - reach_rate
      - addressable_rate
    description: 'Share of segment members that are activatable (ratio-of-sums: reachable / total, not
      an avg of per-row ratios). A non-addressable (analytics-only) segment has no reachable members,
      so this reads 0 by design, not a data gap.'
