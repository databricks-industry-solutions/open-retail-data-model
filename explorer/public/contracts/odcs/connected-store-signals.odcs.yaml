    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable zone business key.
  - name: zone_code
    logicalType: string
    physicalType: STRING
    description: Zone code from the exact dimension version referenced by the interval.
  - name: interval_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: UTC start instant of the published canonical interval.
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: UTC end instant of the published canonical interval.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date used to resolve the effective disclosure policy.
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    description: Canonical interval duration. Rows below the policy minimum are omitted.
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Zone footfall for an interval that cleared the effective threshold. Suppressed intervals
      are omitted rather than emitted with NULL.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Dwell numerator for a disclosure-approved interval.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Dwell denominator for a disclosure-approved interval.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: dwell_seconds_total / dwell_count for a disclosure-approved interval.
  - name: sensing_disclosure_policy_id
    logicalType: string
    physicalType: STRING
    description: Durable policy assignment whose effective version admitted this interval.
  quality:
  - name: shared_interval_policy_enforced
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_interval_policy_enforced
    query: "SELECT s.shared_zone_traffic_interval_id\nFROM connected_store_signals.gold_zone_traffic_interval_shared\
      \ s\nJOIN connected_store_signals.sensor_report_interval f\n  ON s.shared_zone_traffic_interval_id\
      \ = CONCAT_WS(\n    '|',\n    f.store_id,\n    f.store_zone_id,\n    CAST(UNIX_TIMESTAMP(f.interval_start_ts)\
      \ AS STRING),\n    CAST(f.interval_minutes AS STRING)\n  )\nJOIN connected_store_signals.foot_traffic_interval_detail\
      \ t\n  ON f.sensor_report_interval_sk = t.sensor_report_interval_sk\nJOIN connected_store_signals.sensing_deployment\
      \ d\n  ON f.sensing_deployment_sk = d.sensing_deployment_sk\nJOIN connected_store_signals.sensing_disclosure_policy\
      \ p\n  ON d.external_disclosure_policy_id = p.sensing_disclosure_policy_id\n AND f.trading_date\
      \ >= p.effective_from_date\n AND (p.effective_to_date IS NULL OR f.trading_date < p.effective_to_date)\n\
      WHERE COALESCE(f.measurement_validity, 'valid') = 'invalid'\n   OR f.interval_minutes < p.minimum_interval_minutes\n\
      \   OR t.footfall_count IS NULL\n   OR (t.footfall_count = 0 AND p.suppress_zero_flag)\n   OR t.footfall_count\
      \ < p.k_threshold"
- name: gold_zone_traffic_shared
  physicalName: connected_store_signals.gold_zone_traffic_shared
  physicalType: view
  description: 'GRAIN: one row per durable store zone × trading_date, for an explicitly shared audience.
    Suppression is evaluated after canonical intervals have been aggregated to a day. Every traffic-derived
    measure is NULL together; operational truth remains in gold_zone_traffic_current.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable zone business key.
  - name: zone_code
    logicalType: string
    physicalType: STRING
    description: Zone code from the version effective for the measured intervals.
  - name: zone_name
    logicalType: string
    physicalType: STRING
    description: Human-readable zone name.
  - name: zone_type
    logicalType: string
    physicalType: STRING
    description: Depth or role of the zone in the in-store spatial hierarchy.
  - name: parent_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the containing zone.
  - name: hierarchy_depth
    logicalType: integer
    physicalType: INT
    description: Materialised zone depth, where zero is the site.
  - name: is_sales_floor
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the zone is customer-accessible selling space.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date whose effective disclosure policy governs this shared cell.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year for the trading date.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: NRF fiscal week identifier.
  - name: day_of_week
    logicalType: integer
    physicalType: INT
    description: ISO day of week for the trading date.
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone footfall. NULL with disclosure_suppressed_flag = TRUE means
      suppressed, not zero.
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone entries. NULL with disclosure_suppressed_flag = TRUE means
      suppressed.
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone exits. NULL with disclosure_suppressed_flag = TRUE means suppressed;
      otherwise NULL can mean a non-directional source.
  - name: passersby_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled pass-by traffic. NULL with disclosure_suppressed_flag = TRUE means
      suppressed.
  - name: peak_occupancy
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled zone peak occupancy. NULL with disclosure_suppressed_flag = TRUE
      means suppressed.
  - name: avg_occupancy
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled duration-weighted mean occupancy. NULL with disclosure_suppressed_flag
      = TRUE means suppressed.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell numerator. NULL with disclosure_suppressed_flag = TRUE means
      suppressed.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell denominator. NULL with disclosure_suppressed_flag = TRUE
      means suppressed.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled dwell_seconds_total / dwell_count. NULL with disclosure_suppressed_flag
      = TRUE means suppressed.
  - name: engaged_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell observations at or above the engagement threshold.
  - name: passing_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell observations below the engagement threshold.
  - name: engagement_rate
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled engaged_count / dwell_count.
  - name: footfall_per_sqm
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled daily zone traffic density.
  - name: occupancy_per_sqm
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled mean occupancy density.
  - name: peak_capacity_utilisation
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled peak occupancy as a share of effective capacity.
  - name: area_sqm
    logicalType: number
    physicalType: DECIMAL
    description: Duration-weighted effective zone area. This non-traffic dimension remains visible when
      traffic measures are suppressed.
  - name: capacity_persons
    logicalType: number
    physicalType: DOUBLE
    description: Duration-weighted effective zone capacity. This non-traffic dimension remains visible
      when traffic measures are suppressed.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
    description: 'What one published count represents: person, group, device or object.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when staff were excluded from the operational count behind this shared row.
  - name: sensing_disclosure_policy_id
    logicalType: string
    physicalType: STRING
    description: Durable policy assignment whose effective version was resolved for this trading date.
  - name: disclosure_suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when every traffic-derived measure in this cell is NULL under same-cell dependent-measure
      suppression.
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
    description: Always area. Zone footfall is not additive across zones.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the shared view was evaluated.
  quality:
  - name: shared_suppression_threshold
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_suppression_threshold
    query: "SELECT 'zone' AS shared_view, s.store_id, s.trading_date, s.footfall_count\nFROM connected_store_signals.gold_zone_traffic_shared\
      \ s\nJOIN connected_store_signals.sensing_disclosure_policy p\n  ON s.sensing_disclosure_policy_id\
      \ = p.sensing_disclosure_policy_id\n AND s.trading_date >= p.effective_from_date\n AND (p.effective_to_date\
      \ IS NULL OR s.trading_date < p.effective_to_date)\nWHERE s.footfall_count IS NOT NULL\n  AND s.footfall_count\
      \ < p.k_threshold\nUNION ALL\nSELECT 'store' AS shared_view, s.store_id, s.trading_date, s.footfall_count\n\
      FROM connected_store_signals.gold_store_traffic_daily_shared s\nJOIN connected_store_signals.sensing_disclosure_policy\
      \ p\n  ON s.sensing_disclosure_policy_id = p.sensing_disclosure_policy_id\n AND s.trading_date >=\
      \ p.effective_from_date\n AND (p.effective_to_date IS NULL OR s.trading_date < p.effective_to_date)\n\
      WHERE s.footfall_count IS NOT NULL\n  AND s.footfall_count < p.k_threshold"
  - name: shared_zero_suppression
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_zero_suppression
    query: "SELECT 'zone' AS shared_view, s.store_id, s.trading_date, s.footfall_count\nFROM connected_store_signals.gold_zone_traffic_shared\
      \ s\nJOIN connected_store_signals.sensing_disclosure_policy p\n  ON s.sensing_disclosure_policy_id\
      \ = p.sensing_disclosure_policy_id\n AND s.trading_date >= p.effective_from_date\n AND (p.effective_to_date\
      \ IS NULL OR s.trading_date < p.effective_to_date)\nWHERE p.suppress_zero_flag = TRUE\n  AND s.footfall_count\
      \ = 0\nUNION ALL\nSELECT 'store' AS shared_view, s.store_id, s.trading_date, s.footfall_count\n\
      FROM connected_store_signals.gold_store_traffic_daily_shared s\nJOIN connected_store_signals.sensing_disclosure_policy\
      \ p\n  ON s.sensing_disclosure_policy_id = p.sensing_disclosure_policy_id\n AND s.trading_date >=\
      \ p.effective_from_date\n AND (p.effective_to_date IS NULL OR s.trading_date < p.effective_to_date)\n\
      WHERE p.suppress_zero_flag = TRUE\n  AND s.footfall_count = 0"
  - name: shared_dependent_measure_suppression
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: shared_dependent_measure_suppression
    query: "SELECT 'zone' AS shared_view, store_id, trading_date\nFROM connected_store_signals.gold_zone_traffic_shared\n\
      WHERE disclosure_suppressed_flag = TRUE\n  AND (\n    footfall_count IS NOT NULL\n    OR entry_count\
      \ IS NOT NULL\n    OR exit_count IS NOT NULL\n    OR passersby_count IS NOT NULL\n    OR peak_occupancy\
      \ IS NOT NULL\n    OR avg_occupancy IS NOT NULL\n    OR dwell_seconds_total IS NOT NULL\n    OR\
      \ dwell_count IS NOT NULL\n    OR avg_dwell_seconds IS NOT NULL\n    OR engaged_count IS NOT NULL\n\
      \    OR passing_count IS NOT NULL\n    OR engagement_rate IS NOT NULL\n    OR footfall_per_sqm IS\
      \ NOT NULL\n    OR occupancy_per_sqm IS NOT NULL\n    OR peak_capacity_utilisation IS NOT NULL\n\
      \  )\nUNION ALL\nSELECT 'store' AS shared_view, store_id, trading_date\nFROM connected_store_signals.gold_store_traffic_daily_shared\n\
      WHERE disclosure_suppressed_flag = TRUE\n  AND (\n    footfall_count IS NOT NULL\n    OR entry_count\
      \ IS NOT NULL\n    OR exit_count IS NOT NULL\n    OR peak_occupancy IS NOT NULL\n    OR avg_occupancy\
      \ IS NOT NULL\n    OR dwell_seconds_total IS NOT NULL\n    OR dwell_count IS NOT NULL\n    OR avg_dwell_seconds\
      \ IS NOT NULL\n  )"
- name: mv_automation_response
  physicalName: connected_store_signals.mv_automation_response
  physicalType: view
  description: 'Connected Store Signals automation control loop: firings, success rate, response latency
    and breach magnitude across the sense -> evaluate -> act -> log loop, dimensioned by device, rule,
    action target and severity.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - location
      - site
      - branch
    description: Durable store business key of the device that fired the loop.
  - name: sensor_device_id
    logicalType: string
    businessName: Device
    customProperties:
    - property: synonyms
      value:
      - device
      - sensor
      - probe
    description: Durable business key of the observing device whose reading breached the rule.
  - name: store_zone_id
    logicalType: string
    businessName: Zone
    customProperties:
    - property: synonyms
      value:
      - zone
      - area
      - location_in_store
    description: Durable id of the zone the observing device is installed in.
  - name: device_type
    logicalType: string
    businessName: Device Type
    customProperties:
    - property: synonyms
      value:
      - sensor_type
      - device_kind
    description: Kind of device that triggered the firing, e.g. temperature for the cold-chain excursion
      loop.
  - name: evaluation_rule_id
    logicalType: string
    businessName: Rule
    customProperties:
    - property: synonyms
      value:
      - rule
      - threshold
      - alert_rule
    description: Durable business key of the rule whose breach fired the action.
  - name: rule_name
    logicalType: string
    businessName: Rule Name
    customProperties:
    - property: synonyms
      value:
      - rule_label
      - condition_name
    description: Human-readable rule name, e.g. an over-temperature excursion on a named device.
  - name: report_type
    logicalType: string
    businessName: Report Type
    customProperties:
    - property: synonyms
      value:
      - measurement_type
      - signal_type
      - property
    description: The GS1 CBV property the rule watches, e.g. gs1:Temperature. Shared vocabulary with sensor_report_interval,
      so a rule and the readings it evaluates speak the same language.
  - name: severity
    logicalType: string
    businessName: Severity
    customProperties:
    - property: synonyms
      value:
      - priority
      - criticality
    description: 'Operational severity of a breach: info, warning or critical.'
  - name: condition_operator
    logicalType: string
    businessName: Condition
    customProperties:
    - property: synonyms
      value:
      - operator
      - comparison
    description: The comparison the rule applied to the observed value, e.g. greater_than.
  - name: action_type
    logicalType: string
    businessName: Action Type
    customProperties:
    - property: synonyms
      value:
      - action_kind
      - response_type
    description: 'What kind of action fired: system_command, notification, webhook, ticket or log_only.
      One breach can fan out to several action types.'
  - name: target_entity_type
    logicalType: string
    businessName: Target Type
    customProperties:
    - property: synonyms
      value:
      - target_kind
      - recipient_type
    description: The kind of thing the action targeted -- actuator, role, person or external_system. Only
      the actuator target carries a typed actuator FK (§A.5).
  - name: command_type
    logicalType: string
    businessName: Command Type
    customProperties:
    - property: synonyms
      value:
      - actuator_command
      - device_command
    description: What the actuator was commanded to do, e.g. toggle_power. NULL for a non-actuator action
      such as a notification.
  - name: actuator_capability_id
    logicalType: string
    businessName: Actuator
    customProperties:
    - property: synonyms
      value:
      - actuator
      - relay
      - controller
    description: Durable id of the actuator the command hit. NULL for non-actuator actions.
  - name: execution_status
    logicalType: string
    businessName: Execution Status
    customProperties:
    - property: synonyms
      value:
      - status
      - outcome
      - result
    description: 'Outcome of the firing: success, failure, pending, timeout or skipped.'
  - name: response_latency_band
    logicalType: string
    businessName: Response Latency Band
    customProperties:
    - property: synonyms
      value:
      - latency_band
      - responsiveness
    description: 'Automation responsiveness band from the firing latency: fast (<= 250 ms), normal (<=
      1000 ms), slow (> 1000 ms), or unknown. This is act-response latency, NOT ingest freshness.'
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - business_date
    description: Business date of the breach that fired the loop.
  - name: firing_count
    logicalType: integer
    businessName: Firings
    customProperties:
    - property: synonyms
      value:
      - executions
      - firings
      - triggers
    description: Realised automation firings in the grouping -- one per execution_log row. The primary
      volume measure.
  - name: rules_fired
    logicalType: integer
    businessName: Rules Fired
    customProperties:
    - property: synonyms
      value:
      - distinct_rules
      - active_rules
    description: Distinct rules that fired, counted on the durable rule id so a rule retuned mid-window
      counts once.
  - name: devices_with_firings
    logicalType: integer
    businessName: Devices With Firings
    customProperties:
    - property: synonyms
      value:
      - devices
      - affected_devices
    description: Distinct observing devices whose readings fired a rule, on the durable device id.
  - name: success_count
    logicalType: integer
    businessName: Successful Firings
    customProperties:
    - property: synonyms
      value:
      - successes
      - completed_firings
    description: Firings whose target reported success.
  - name: failure_count
    logicalType: integer
    businessName: Failed Firings
    customProperties:
    - property: synonyms
      value:
      - failures
      - errors
    description: Firings whose target reported failure.
  - name: success_rate
    logicalType: number
    businessName: Success Rate
    customProperties:
    - property: synonyms
      value:
      - success_percentage
      - firing_success_share
    description: Successful firings / all logged firings (every execution_status, including pending, timeout
      and skipped), from summed counts.
  - name: actuator_firing_count
    logicalType: integer
    businessName: Actuator Firings
    customProperties:
    - property: synonyms
      value:
      - physical_commands
      - device_firings
    description: Firings that drove a physical actuator (the typed-FK branch of the polymorphic target),
      as opposed to a notification or webhook.
  - name: notification_count
    logicalType: integer
    businessName: Notifications
    customProperties:
    - property: synonyms
      value:
      - alerts_sent
      - notifications
    description: Firings that raised a notification to a role or person rather than commanding a device.
  - name: critical_firing_count
    logicalType: integer
    businessName: Critical Firings
    customProperties:
    - property: synonyms
      value:
      - critical_alerts
      - severe_firings
    description: Firings from a rule marked critical, e.g. a cold-chain over-temperature excursion.
  - name: avg_response_latency_ms
    logicalType: number
    businessName: Avg Response Latency (ms)
    customProperties:
    - property: synonyms
      value:
      - latency
      - response_time
      - responsiveness
    description: Mean milliseconds from the breaching observation to the firing. Automation responsiveness,
      NOT ingest latency.
  - name: max_response_latency_ms
    logicalType: integer
    businessName: Max Response Latency (ms)
    customProperties:
    - property: synonyms
      value:
      - peak_latency
      - worst_response
    description: Worst-case response latency observed in the grouping.
  - name: slow_response_count
    logicalType: integer
    businessName: Slow Responses
    customProperties:
    - property: synonyms
      value:
      - slow_firings
      - laggy_responses
    description: Firings that took longer than 1000 ms to respond -- a responsiveness concern worth isolating.
  - name: avg_breach_margin
    logicalType: number
    businessName: Avg Breach Margin
    customProperties:
    - property: synonyms
      value:
      - avg_exceedance
      - avg_overshoot
    description: Mean signed difference of the observed value from the rule threshold, in the rule unit.
      Positive means above threshold -- how far past the limit the readings that fired were, on average.
  - name: max_breach_value
    logicalType: number
    businessName: Max Breach Value
    customProperties:
    - property: synonyms
      value:
      - peak_reading
      - worst_reading
    description: Highest observed value that fired a rule in the grouping, e.g. the peak temperature during
      a cold-chain excursion.
- name: mv_count_operations
  physicalName: connected_store_signals.mv_count_operations
  physicalType: view
  description: 'RFID count execution by store, method and scope: session cadence, duration, observed units
    and honest full-store zone coverage.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - site
      - location
    description: Durable store business key.
  - name: count_method
    logicalType: string
    businessName: Count Method
    customProperties:
    - property: synonyms
      value:
      - method
      - count_type
      - reader_mode
    description: handheld_sweep, fixed_window or robot_sweep.
  - name: scope_type
    logicalType: string
    businessName: Scope Type
    customProperties:
    - property: synonyms
      value:
      - scope
      - count_scope
    description: full_store has a derivable zone plan; partial makes no plan-completion claim.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - business_date
    description: Business date on which the count session started.
  - name: count_session_count
    logicalType: integer
    businessName: Count Session Count
    customProperties:
    - property: synonyms
      value:
      - counts_completed
      - session_count
      - count_attempts
    description: Distinct bounded RFID count sessions.
  - name: average_duration_minutes
    logicalType: number
    businessName: Average Count Duration (Minutes)
    customProperties:
    - property: synonyms
      value:
      - count_duration
      - sweep_duration
    description: Mean elapsed time from session start to end.
  - name: units_observed
    logicalType: integer
    businessName: Units Observed
    customProperties:
    - property: synonyms
      value:
      - items_counted
      - rfid_units
    description: Serialized units observed across count sessions.
  - name: zones_covered
    logicalType: integer
    businessName: Zones Covered
    customProperties:
    - property: synonyms
      value:
      - covered_zones
      - zone_counts
    description: Observed zone-session combinations.
  - name: full_store_zone_coverage_rate
    logicalType: number
    businessName: Full-Store Zone Coverage
    customProperties:
    - property: synonyms
      value:
      - coverage_rate
      - count_coverage
      - zone_completion
    description: Covered zones divided by active planned zones for full-store sessions only. Partial sessions
      are excluded.
- name: mv_device_health
  physicalName: connected_store_signals.mv_device_health
  physicalType: view
  description: 'Sensing-fleet health across all Connected Store Signals device types: uptime, coverage,
    feed freshness, session integrity, calibration status and governance completeness. One view for the
    whole estate.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - location
      - site
      - branch
    description: Durable store business key.
  - name: device_type
    logicalType: string
    businessName: Device Type
    customProperties:
    - property: synonyms
      value:
      - sensor_type
      - equipment_type
      - device_kind
    description: 'The dimension that lets one view serve the whole estate: people_counter, occupancy_sensor,
      temperature, humidity, co2, illuminance, energy_meter, door_contact, rfid_reader, shelf_sensor,
      camera, esl_gateway.'
  - name: sensing_technology
    logicalType: string
    businessName: Sensing Technology
    customProperties:
    - property: synonyms
      value:
      - technology
      - sensor_technology
      - method
    description: How the device senses. Drives both the accuracy and the privacy profile.
  - name: sensor_device_id
    logicalType: string
    businessName: Device
    customProperties:
    - property: synonyms
      value:
      - device
      - sensor
      - device_id
    description: Durable device business key.
  - name: store_zone_id
    logicalType: string
    businessName: Zone
    customProperties:
    - property: synonyms
      value:
      - zone
      - area
      - location_in_store
    description: Durable id of the zone the device is installed in.
  - name: device_status
    logicalType: string
    businessName: Device Status
    customProperties:
    - property: synonyms
      value:
      - status
      - state
    description: active, inactive, faulty, maintenance or decommissioned.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - business_date
    description: Business date of the health observation.
  - name: feed_freshness_status
    logicalType: string
    businessName: Feed Freshness
    customProperties:
    - property: synonyms
      value:
      - freshness
      - feed_status
      - pipeline_status
    description: fresh (<= 60 min), delayed (<= 6 hr), stale (> 6 hr).
  - name: calibration_status
    logicalType: string
    businessName: Calibration Status
    customProperties:
    - property: synonyms
      value:
      - calibration
      - cal_status
    description: current, expiring_soon (<= 30 days), expired, or unknown. Regulated metrology for vaccine
      storage -- CDC/VFC requires recalibration or replacement per the certificate.
  - name: manufacturer
    logicalType: string
    businessName: Manufacturer
    customProperties:
    - property: synonyms
      value:
      - vendor
      - make
      - oem
    description: Device manufacturer. Useful for isolating a fleet-wide fault to one vendor.
  - name: firmware_version
    logicalType: string
    businessName: Firmware Version
    customProperties:
    - property: synonyms
      value:
      - firmware
      - software_version
    description: Current firmware. A common cause of a step change in counting behaviour, so it is worth
      grouping by when investigating a discontinuity.
  - name: report_type
    logicalType: string
    businessName: Report Type
    customProperties:
    - property: synonyms
      value:
      - measurement_type
      - signal_type
      - sensor_report
    description: 'What the device was reporting in these intervals: footfall, occupancy, dwell, temperature,
      humidity and so on. PART OF THE SOURCE GRAIN, because one device can report more than one thing
      -- filter on it when comparing interval counts across devices.'
  - name: aggregation_level
    logicalType: string
    businessName: Aggregation Level
    customProperties:
    - property: synonyms
      value:
      - level
      - spatial_level
      - grain
    description: 'The spatial level the intervals were reported at: site, area or object. PART OF THE
      SOURCE GRAIN -- an entrance counter emits both its own area rows and the store''s site rows, so
      interval counts are only comparable within one level.'
  - name: sensing_method_code
    logicalType: string
    businessName: Sensing Method
    customProperties:
    - property: synonyms
      value:
      - deployment_method
      - governance_method
    description: Method from the governance record. Present so a fleet review and a privacy review read
      the same row.
  - name: device_count
    logicalType: integer
    businessName: Device Count
    customProperties:
    - property: synonyms
      value:
      - sensors
      - fleet_size
      - devices
    description: Distinct devices in the grouping.
  - name: online_rate
    logicalType: number
    businessName: Online Rate
    customProperties:
    - property: synonyms
      value:
      - uptime
      - availability
      - online_percentage
    description: Mean share of the interval devices were online, weighted by intervals reported so a device
      that sent two rows cannot outvote one that sent ninety-six.
  - name: coverage_rate
    logicalType: number
    businessName: Coverage Rate
    customProperties:
    - property: synonyms
      value:
      - coverage
      - reporting_rate
    description: Mean share of expected sensors that reported, weighted by intervals reported.
  - name: missing_observation_rate
    logicalType: number
    businessName: Missing Observation Rate
    customProperties:
    - property: synonyms
      value:
      - missing_rate
      - data_loss_rate
      - gap_rate
    description: 'Share of expected observations that never arrived, computed from the SUMMED numerator
      and denominator. The primary fleet KPI, so it must not be AVG(missing_observation_rate): that averages
      per-device rates and gives a device expecting 4 observations the same weight as one expecting 400,
      which understates a fleet-wide outage precisely when it matters.'
  - name: valid_interval_share
    logicalType: number
    businessName: Valid Interval Share
    customProperties:
    - property: synonyms
      value:
      - validity_rate
      - data_quality
    description: Share of reported sensor intervals whose measurement was valid, from the summed counts
      rather than an average of per-device shares. Degraded, invalid and imputed intervals remain in the
      denominator. RFID events are excluded because their validity field represents non-stray reads; use
      mv_item_visibility.stray_read_rate for RFID quality.
  - name: feed_age_minutes
    logicalType: integer
    businessName: Feed Age (Minutes)
    customProperties:
    - property: synonyms
      value:
      - staleness
      - age_minutes
      - lag
    description: Worst feed age in the grouping. Lower is fresher.
  - name: avg_latency_seconds
    logicalType: number
    businessName: Avg Ingest Latency (Seconds)
    customProperties:
    - property: synonyms
      value:
      - latency
      - ingest_lag
      - processing_delay
    description: Mean seconds between interval end and ingest, weighted by intervals reported.
  - name: max_latency_seconds
    logicalType: integer
    businessName: Max Ingest Latency (Seconds)
    customProperties:
    - property: synonyms
      value:
      - peak_latency
      - worst_lag
    description: Worst-case ingest latency observed.
  - name: stale_device_count
    logicalType: integer
    businessName: Stale Devices
    customProperties:
    - property: synonyms
      value:
      - stale_count
      - silent_devices
      - unhealthy_devices
    description: Devices with no data in over 6 hours.
  - name: sequence_gap_count
    logicalType: integer
    businessName: Sequence Gaps
    customProperties:
    - property: synonyms
      value:
      - lost_messages
      - seq_gaps
      - message_loss
    description: Source messages inferred missing within source sessions, summarized at interval grain.
  - name: session_restart_count
    logicalType: integer
    businessName: Session Restarts
    customProperties:
    - property: synonyms
      value:
      - reboots
      - restarts
      - session_breaks
    description: Device-days with more than one source_session_id.
  - name: historical_message_count
    logicalType: integer
    businessName: Historical Messages
    customProperties:
    - property: synonyms
      value:
      - buffered_messages
      - historical_replay
    description: Delivered source messages marked as buffered or historical.
  - name: late_arrived_count
    logicalType: integer
    businessName: Late-Arrived Intervals
    customProperties:
    - property: synonyms
      value:
      - late_data
      - backfilled_intervals
    description: Intervals that landed after their window closed. These feeds are not append-only -- vendors
      document data arriving hours or days late.
  - name: imputed_interval_count
    logicalType: integer
    businessName: Imputed Intervals
    customProperties:
    - property: synonyms
      value:
      - estimated_intervals
      - modelled_intervals
    description: Intervals whose value was modelled rather than measured.
  - name: capped_interval_count
    logicalType: integer
    businessName: Capped Intervals
    customProperties:
    - property: synonyms
      value:
      - saturated_intervals
      - ceiling_hits
    description: Intervals that hit the hardware detection ceiling. A capped peak is not an exact peak.
  - name: expired_calibration_count
    logicalType: integer
    businessName: Expired Calibrations
    customProperties:
    - property: synonyms
      value:
      - out_of_calibration
      - calibration_overdue
    description: Devices past their calibration validity date. For vaccine storage this is a compliance
      failure, not a maintenance backlog item.
  - name: out_of_service_count
    logicalType: integer
    businessName: Out-of-Service Devices
    customProperties:
    - property: synonyms
      value:
      - simulated_devices
      - commissioning_devices
    description: BACnet Out_Of_Service devices. Their Present_Value is SIMULATED, so any reading from
      them is fabricated.
  - name: missing_dpia_count
    logicalType: integer
    businessName: Devices Without a DPIA
    customProperties:
    - property: synonyms
      value:
      - governance_gaps
      - no_dpia
      - unassessed_devices
    description: 'Active devices whose deployment has no completed impact assessment. COALESCE is load-bearing:
      the deployment join is a LEFT JOIN, so a device with NO governance record at all yields NULL, and
      a bare NOT NULL is NULL rather than TRUE -- the least-governed devices in the estate would have
      been the ones this count silently omitted. A governance gap surfaced alongside fleet health, because
      the two are reviewed by different people who need the same view.'
- name: mv_environmental_compliance
  physicalName: connected_store_signals.mv_environmental_compliance
  physicalType: view
  description: 'Environmental and cold-chain compliance: readings in range, breach counts and compliance
    share against the configured control rule across monitored assets.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - location
      - site
      - branch
    description: Durable store business key.
  - name: sensor_device_id
    logicalType: string
    businessName: Device
    customProperties:
    - property: synonyms
      value:
      - device
      - probe
      - sensor
      - temperature_probe
    description: Durable business key of the temperature or environmental sensor.
  - name: subject_id
    logicalType: string
    businessName: Measured Subject
    customProperties:
    - property: synonyms
      value:
      - subject
      - channel
      - monitored_point
    description: Measured subject within the device, interpreted per subject_type (for example one case
      on a multi-channel logger). Slices a multi-channel device by channel.
  - name: equipment_id
    logicalType: string
    businessName: Equipment
    customProperties:
    - property: synonyms
      value:
      - asset
      - unit
      - equipment
      - refrigeration_unit
    description: Durable business key of the refrigeration or maintained asset the sensor monitors. NULL
      for ambient sensing.
  - name: report_type
    logicalType: string
    businessName: Report Type
    customProperties:
    - property: synonyms
      value:
      - measurement_type
      - sensor_type
      - property
    description: The environmental property measured, e.g. gs1:Temperature. Shared vocabulary with evaluation_rule,
      so a reading and its rule speak the same language.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - business_date
    description: Business date of the compliance observation.
  - name: evaluation_rule_id
    logicalType: string
    businessName: Rule
    customProperties:
    - property: synonyms
      value:
      - control_rule
      - threshold_rule
    description: 'Rule the row is evaluated against. Reading and minute measures are per rule: a device
      watched by two rules contributes its readings once per rule, so filter or group by rule when comparing
      devices.'
  - name: condition_operator
    logicalType: string
    businessName: Rule Operator
    customProperties:
    - property: synonyms
      value:
      - operator
      - comparison
      - rule_type
    description: 'The comparison the applicable rule applies: greater_than, less_than, inside_range, outside_range,
      etc.'
  - name: threshold_value
    logicalType: number
    businessName: Threshold Value
    customProperties:
    - property: synonyms
      value:
      - limit
      - setpoint
      - threshold
    description: The lower bound or single threshold from the control rule, in the measurement unit.
  - name: uom_code
    logicalType: string
    businessName: Unit
    customProperties:
    - property: synonyms
      value:
      - unit
      - unit_of_measure
    description: UN/CEFACT Recommendation 20 unit code, e.g. CEL for Celsius.
  - name: is_compliant
    logicalType: boolean
    businessName: Compliant
    customProperties:
    - property: synonyms
      value:
      - in_range
      - meets_threshold
      - passes_check
    description: TRUE when no valid reading breached the rule on the day, FALSE when one did, NULL when
      no rule applies or no valid reading was evaluated.
  - name: reading_count
    logicalType: integer
    businessName: Total Readings
    customProperties:
    - property: synonyms
      value:
      - observations
      - intervals
      - data_points
    description: 'Total intervals, counted once per rule: a device watched by two rules contributes its
      readings twice. Filter or group by evaluation_rule_id for a per-device count.'
  - name: valid_reading_count
    logicalType: integer
    businessName: Valid Readings
    customProperties:
    - property: synonyms
      value:
      - valid_observations
      - valid_intervals
    description: Valid intervals, counted once per rule (see Total Readings). Denominator of the average
      reading; the compliance rate divides by evaluated intervals.
  - name: min_reading
    logicalType: number
    businessName: Min Reading
    customProperties:
    - property: synonyms
      value:
      - minimum
      - low_point
    description: Lowest value observed during the day.
  - name: max_reading
    logicalType: number
    businessName: Max Reading
    customProperties:
    - property: synonyms
      value:
      - maximum
      - peak_reading
      - high_point
    description: Highest value observed during the day. For cold-chain, this is the peak excursion.
  - name: avg_reading
    logicalType: number
    businessName: Average Reading
    customProperties:
    - property: synonyms
      value:
      - mean
      - average
      - center
    description: Mean valid reading across the grouping, computed as a ratio of sums so it re-aggregates
      correctly.
  - name: breach_count
    logicalType: integer
    businessName: Breaching Intervals
    customProperties:
    - property: synonyms
      value:
      - excursions
      - violations
      - out_of_range_intervals
    description: Valid intervals whose value breached the rule limit. Evaluated from readings, independent
      of automation firings.
  - name: minutes_out_of_range
    logicalType: integer
    businessName: Minutes Out of Range
    customProperties:
    - property: synonyms
      value:
      - breach_duration
      - excursion_time
    description: 'Minutes beyond the rule limit, summed per rule: minutes where two rules both breach
      are counted for each rule.'
  - name: compliance_rate
    logicalType: number
    businessName: Compliance Rate
    customProperties:
    - property: synonyms
      value:
      - in_range_rate
      - share_in_range
    description: Share of evaluated valid intervals in range across the grouping (ratio of sums, not an
      average of daily shares).
  - name: compliant_device_rule_days
    logicalType: integer
    businessName: Compliant Device-Rule-Days
    customProperties:
    - property: synonyms
      value:
      - devices_fully_compliant
      - compliant_count
    description: Count of device x rule x day rows with is_compliant = TRUE. A device watched by two rules
      contributes one row per rule.
  - name: breaching_device_rule_days
    logicalType: integer
    businessName: Device-Rule-Days With Breaches
    customProperties:
    - property: synonyms
      value:
      - devices_with_breaches
      - non_compliant_count
    description: Count of device x rule x day rows with is_compliant = FALSE. A device can appear here
      for one rule and as compliant for another.
  - name: compliance_status_known_count
    logicalType: integer
    businessName: Device-Rule-Days Evaluated
    customProperties:
    - property: synonyms
      value:
      - assessed_devices
      - devices_with_rules
    description: Count of device-day-rule rows with a current rule and at least one valid reading (is_compliant
      is not NULL).
- name: mv_excursion_episodes
  physicalName: connected_store_signals.mv_excursion_episodes
  physicalType: view
  description: 'Excursion episodes: characterising cold-chain breaches as contiguous events and measuring
    how the control loop responded. A successful firing shows the loop responded; it is not proof that
    it ended the excursion.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - site
      - location
    description: Durable store business key.
  - name: sensor_device_id
    logicalType: string
    businessName: Device
    customProperties:
    - property: synonyms
      value:
      - device
      - probe
      - sensor
    description: Durable business key of the temperature sensor that detected the excursion.
  - name: subject_id
    logicalType: string
    businessName: Measured Subject
    customProperties:
    - property: synonyms
      value:
      - subject
      - channel
      - monitored_point
    description: Measured subject within the device, interpreted per subject_type (for example one case
      on a multi-channel logger). Slices a multi-channel device by channel.
  - name: equipment_id
    logicalType: string
    businessName: Equipment
    customProperties:
    - property: synonyms
      value:
      - asset
      - unit
      - equipment
    description: Durable business key of the refrigeration unit or maintained asset experiencing the excursion.
  - name: evaluation_rule_id
    logicalType: string
    businessName: Rule
    customProperties:
    - property: synonyms
      value:
      - rule
      - threshold
      - control_rule
    description: Durable id of the rule whose breach defined this episode.
  - name: trading_date_of_start
    logicalType: date
    businessName: Episode Start Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - start_date
    description: Business date when the episode began (first breaching interval).
  - name: report_type
    logicalType: string
    businessName: Report Type
    customProperties:
    - property: synonyms
      value:
      - property
      - measurement_type
    description: Monitored property of the episode, for example gs1:Temperature.
  - name: has_successful_action
    logicalType: boolean
    businessName: Has Successful Action
    customProperties:
    - property: synonyms
      value:
      - action_succeeded
      - loop_responded
    description: TRUE when a firing triggered by one of the episode intervals succeeded (the firing may
      land after the last breaching interval). Evidence the loop responded, not proof that it ended the
      excursion.
  - name: is_open_at_dataset_end
    logicalType: boolean
    businessName: Open at Data End
    customProperties:
    - property: synonyms
      value:
      - ongoing
      - in_progress
      - unfinished
    description: TRUE if the episode was still ongoing at the end of available data (has not yet ended).
      Use to exclude ongoing episodes from analysis of completed events.
  - name: episode_count
    logicalType: integer
    businessName: Episodes
    customProperties:
    - property: synonyms
      value:
      - excursions
      - events
      - breaches
    description: Number of distinct excursion episodes in the grouping.
  - name: episodes_with_successful_action
    logicalType: integer
    businessName: Episodes With Successful Action
    customProperties:
    - property: synonyms
      value:
      - answered_episodes
    description: Count of episodes with at least one successful firing triggered by an episode interval.
  - name: episodes_without_successful_action
    logicalType: integer
    businessName: Episodes Without Successful Action
    customProperties:
    - property: synonyms
      value:
      - unanswered_episodes
    description: Count of episodes with no successful firing triggered by an episode interval.
  - name: avg_episode_duration_minutes
    logicalType: number
    businessName: Avg Episode Duration (min)
    customProperties:
    - property: synonyms
      value:
      - avg_excursion_time
      - mean_duration
    description: Mean duration of episodes in the grouping, from first to last breaching interval.
  - name: max_episode_duration_minutes
    logicalType: integer
    businessName: Max Episode Duration (min)
    customProperties:
    - property: synonyms
      value:
      - longest_episode
      - worst_duration
    description: Longest-running excursion in the grouping.
  - name: total_breach_intervals
    logicalType: integer
    businessName: Breach Intervals
    customProperties:
    - property: synonyms
      value:
      - total_intervals
      - cumulative_breaches
    description: Total number of individual breaching intervals across all episodes. A measure of total
      breach volume.
  - name: avg_intervals_per_episode
    logicalType: number
    businessName: Avg Intervals per Episode
    customProperties:
    - property: synonyms
      value:
      - avg_run_length
      - mean_intervals
    description: Mean number of consecutive intervals per episode.
  - name: peak_excursion_value
    logicalType: number
    businessName: Peak Excursion Value
    customProperties:
    - property: synonyms
      value:
      - worst_reading
      - maximum_breach
    description: 'Worst reading across episodes in the direction of the rule limit. For a cold-chain upper
      limit, the highest excursion temperature. Only meaningful within one evaluation_rule_id (or one
      report_type with same-direction rules): MAX across upper- and lower-limit rules hides the worst
      low excursion.'
  - name: avg_peak_excursion_magnitude
    logicalType: number
    businessName: Avg Peak Exceedance
    customProperties:
    - property: synonyms
      value:
      - avg_overshoot
      - mean_margin
    description: 'Mean distance past the rule limit at the worst reading of each episode, in the rule
      unit. Indicates typical excursion severity. Only meaningful within one report_type: averaging across
      properties mixes units (for example degrees and percent humidity).'
  - name: firings_in_episodes
    logicalType: integer
    businessName: Control-Loop Firings
    customProperties:
    - property: synonyms
      value:
      - automation_events
      - control_actions
    description: Total automation firings triggered by breaches in the episodes.
  - name: successful_firings
    logicalType: integer
    businessName: Successful Firings
    customProperties:
    - property: synonyms
      value:
      - completed_actions
      - successful_controls
    description: Automation actions that completed with execution_status = 'success'.
  - name: action_success_rate
    logicalType: number
    businessName: Episode Firing Success Share
    customProperties:
    - property: synonyms
      value:
      - episode_firing_success_share
      - share_of_episode_firings_successful
    description: 'Share of firings credited to episodes that succeeded: successful / all non-skipped firings
      (pending, failure and timeout count as not successful), ratio of sums. Not the completion success
      rate of gold_css_rule_effectiveness_daily, which divides by completed firings only (success, failure,
      timeout).'
  - name: avg_minutes_to_first_successful_action
    logicalType: number
    businessName: Avg Minutes to First Successful Action
    customProperties:
    - property: synonyms
      value:
      - avg_response_time
      - time_to_first_success
    description: Mean time from episode start to the first successful automation action. NULL episodes
      (those with no successful action) are excluded from the average.
  - name: avg_first_response_time_minutes
    logicalType: number
    businessName: Avg First Response Time (min)
    customProperties:
    - property: synonyms
      value:
      - avg_response_delay
      - mean_detection_time
    description: Mean time from episode start to the very first firing (successful or not). Measures automation
      trigger speed.
- name: mv_inventory_accuracy
  physicalName: connected_store_signals.mv_inventory_accuracy
  physicalType: view
  description: RFID observed-versus-book reconciliation. Inventory accuracy is restricted to aligned full-store
    EOD counts; other sessions remain explicitly labeled agreement evidence.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - site
      - location
    description: Durable store business key.
  - name: product_id
