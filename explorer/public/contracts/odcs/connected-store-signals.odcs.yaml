- name: gold_zone_traffic_current
  physicalName: connected_store_signals.gold_zone_traffic_current
  physicalType: view
  description: 'GRAIN: one row per store × zone × trading_date.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable zone business key -- the SCD2-safe join key. Prefer this over the surrogate.
  - name: latest_store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key of the zone version effective at the latest interval of the trading_date.
  - name: zone_code
    logicalType: string
    physicalType: STRING
    description: Zone code as emitted by the source system.
  - name: zone_name
    logicalType: string
    physicalType: STRING
    description: Human-readable zone name from the version effective at the latest interval.
  - name: zone_type
    logicalType: string
    physicalType: STRING
    description: 'Depth in the spatial hierarchy: entrance, area, department, aisle, bay, shelf_position,
      queue, fitting_room.'
  - name: parent_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the containing zone.
  - name: hierarchy_depth
    logicalType: integer
    physicalType: INT
    description: Materialised depth (0 = site), so consumers avoid a recursive CTE.
  - name: is_sales_floor
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the zone is customer-accessible selling space.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date of the zone traffic observation.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year for the trading date.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: NRF fiscal week identifier.
  - name: day_of_week
    logicalType: integer
    physicalType: INT
    description: ISO day of week for the trading date.
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Zone footfall for the day. Additive over TIME within the zone; NOT additive across zones.
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
    description: Measured entries into the zone for the day.
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
    description: Measured exits from the zone for the day. NULL when the zone sensors are non-directional.
  - name: passersby_count
    logicalType: integer
    physicalType: BIGINT
    description: Pass-by traffic. Vendors define this two OPPOSITE ways (including or excluding entrants),
      so it is only comparable within one convention.
  - name: peak_occupancy
    logicalType: integer
    physicalType: BIGINT
    description: Zone peak occupancy. A STORE peak is not the MAX of these -- it comes from the site row.
  - name: avg_occupancy
    logicalType: number
    physicalType: DOUBLE
    description: Duration-weighted mean occupancy for the zone.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Sum of dwell durations in the zone. Numerator for zone-level dwell re-aggregation.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Count of distinct dwell observations in the zone. Denominator for zone-level dwell re-aggregation.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: dwell_seconds_total / dwell_count for the zone-day.
  - name: engaged_count
    logicalType: integer
    physicalType: BIGINT
    description: Dwell observations exceeding the engagement threshold.
  - name: passing_count
    logicalType: integer
    physicalType: BIGINT
    description: Dwell observations below the engagement threshold. Distinct from passersby_count, which
      is storefront traffic rather than a dwell bucket.
  - name: engagement_rate
    logicalType: number
    physicalType: DOUBLE
    description: engaged_count / dwell_count.
  - name: area_sqm_minutes
    logicalType: number
    physicalType: DECIMAL(12, 2)
    description: Zone area multiplied by the duration of intervals where area was known; numerator for
      re-aggregating effective area.
  - name: area_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a recorded zone area; denominator for area_sqm.
  - name: area_sqm
    logicalType: number
    physicalType: DECIMAL
    description: Duration-weighted effective zone floor area in square metres for the zone-day.
  - name: capacity_persons
    logicalType: number
    physicalType: DOUBLE
    description: Duration-weighted effective safe or design occupancy for the zone-day.
  - name: capacity_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a recorded zone capacity; denominator for capacity_persons.
  - name: footfall_per_sqm
    logicalType: number
    physicalType: DECIMAL
    description: 'Traffic density for THIS zone-day: footfall / area_sqm. Re-aggregating over several
      days divides by the summed area of the grouped zone-days, which yields an AVERAGE DAILY density
      rather than a period total -- mv_zone_foot_traffic names the measure avg_daily_footfall_per_sqm
      for that reason.'
  - name: occupancy_per_sqm
    logicalType: number
    physicalType: DOUBLE
    description: 'Occupancy density: avg_occupancy / area_sqm.'
  - name: peak_capacity_utilisation
    logicalType: number
    physicalType: DOUBLE
    description: peak_occupancy / capacity_persons. Above 1 is either a safety event or a broken counter.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
    description: 'What one count represents: person, group, device or object.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if staff were excluded from the operational count behind this zone-day row.
  - name: avg_uptime_ratio
    logicalType: number
    physicalType: DOUBLE
    description: Mean share of canonical interval duration the zone sensors were online.
  - name: avg_coverage_ratio
    logicalType: number
    physicalType: DOUBLE
    description: Mean share of expected sensors that reported for the zone.
  - name: valid_interval_share
    logicalType: number
    physicalType: DOUBLE
    description: Share of intervals whose measurement was valid for the zone.
  - name: is_zero_observed
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when footfall_count = 0 AND any interval carried is_zero_observed = TRUE.
  - name: interval_count
    logicalType: integer
    physicalType: BIGINT
    description: Source intervals behind the zone-day aggregation.
  - name: interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Total duration of valid traffic intervals. This generic duration is not the denominator
      for measures reported on only some intervals.
  - name: occupancy_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of valid intervals with a reported occupancy average; the re-aggregation denominator
      for avg_occupancy.
  - name: uptime_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a reported uptime ratio; the re-aggregation denominator for
      avg_uptime_ratio.
  - name: coverage_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a reported coverage ratio; the re-aggregation denominator
      for avg_coverage_ratio.
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
    description: Always area for this view. NEVER sum footfall across rows of this view to get a store
      total -- use gold_store_traffic_daily_current.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the view was evaluated.
  quality:
  - name: css_zone_traffic_grain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: css_zone_traffic_grain
    query: 'SELECT store_zone_id, trading_date, COUNT(*) AS n

      FROM connected_store_signals.gold_zone_traffic_current

      GROUP BY store_zone_id, trading_date

      HAVING COUNT(*) > 1'
