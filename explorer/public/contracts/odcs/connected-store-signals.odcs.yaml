  - name: is_misplaced_detected
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if a product other than expected was detected at this position.
  - name: is_price_tag_mismatch_detected
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if the displayed price did not match the expected price.
  - name: measurement_validity
    logicalType: string
    physicalType: STRING
    description: 'Validity of the measurement: valid, degraded, invalid, or imputed.'
  - name: confidence_score
    logicalType: number
    physicalType: DOUBLE
    description: Platform-specific confidence score for the observation (0-100 or equivalent).
  - name: coverage_ratio
    logicalType: number
    physicalType: DOUBLE
    description: Estimated percentage of the shelf position the device could observe.
  - name: is_usable
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'TRUE if the observation is usable for compliance evaluation: measurement_validity <>
      invalid AND shelf_state <> unknown.'
  - name: shelf_position_assignment_id
    logicalType: string
    physicalType: STRING
    description: Durable id of the expected assignment in effect at observation time.
  - name: expected_facing_count
    logicalType: integer
    physicalType: INT
    description: Expected number of facings from the assignment active at observation time.
  - name: min_facing_count
    logicalType: integer
    physicalType: INT
    description: Minimum facing count from the assignment active at observation time.
  - name: assignment_source
    logicalType: string
    physicalType: STRING
    description: 'Source of the expected assignment: plano, bmv, or system.'
  - name: is_presence_compliant
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if the shelf_state is in_stock or low_stock (product present); NULL if not usable.
  - name: is_position_compliant
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if no misplacement was detected; NULL if not usable or misplacement state unknown.
  - name: is_facing_compliant
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if observed_facing_count >= expected_facing_count; NULL if not usable or facing
      data missing.
  - name: is_price_tag_compliant
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if no price mismatch was detected; NULL if not usable or price data missing.
  - name: freshness_window_minutes
    logicalType: integer
    physicalType: INT
    description: 'Platform-dependent freshness window: typically 120 minutes for fixed devices, 1440 minutes
      for mobile.'
  - name: freshness_age_minutes
    logicalType: integer
    physicalType: INT
    description: Minutes since observation_ts was captured at the evaluation clock.
  - name: is_stale
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if freshness_age_minutes exceeds the freshness_window_minutes.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the view was evaluated.
