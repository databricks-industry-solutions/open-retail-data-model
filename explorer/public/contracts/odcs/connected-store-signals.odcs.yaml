- name: mv_on_shelf_availability
  physicalName: connected_store_signals.mv_on_shelf_availability
  physicalType: view
  description: 'Observed on-shelf availability from shelf sensing: expected-vs-observed positions, OSA
    %, full-OOS vs low-stock split, intraday floor, and denominator honesty (coverage and known-state
    rates).'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - site
      - location
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - business_date
    description: Business date of the shelf observations.
  - name: category
    logicalType: string
    businessName: Category
    customProperties:
    - property: synonyms
      value:
      - product_category
      - merch_category
    description: Merchandising category of the expected product. NULL groups positions whose product carries
      no category.
  - name: expected_positions
    logicalType: integer
    businessName: Expected Positions
    customProperties:
    - property: synonyms
      value:
      - assigned_positions
      - planned_positions
    description: Shelf positions with an assignment effective on the trading date - the OSA denominator
      universe.
  - name: observed_positions
    logicalType: integer
    businessName: Observed Positions
    customProperties:
    - property: synonyms
      value:
      - covered_positions
    description: Expected positions with at least one capture that day.
  - name: positions_unobserved
    logicalType: integer
    businessName: Unobserved Positions
    customProperties:
    - property: synonyms
      value:
      - uncovered_positions
      - coverage_gap
    description: Expected positions with no capture that day - a coverage gap, never counted as available
      or unavailable.
  - name: positions_unknown
    logicalType: integer
    businessName: Unknown-State Positions
    customProperties:
    - property: synonyms
      value:
      - unevaluable_positions
    description: Observed positions whose day's LAST capture was unknown or invalid. The newest capture
      wins; an unknown reading is the current truth, never replaced by an older good one.
  - name: on_shelf_availability_pct
    logicalType: number
    businessName: On-Shelf Availability %
    customProperties:
    - property: synonyms
      value:
      - osa
      - osa_pct
      - availability
      - shelf_availability
    description: Positions in stock or low stock at the day's last known reading, over KNOWN positions
      only. Unknown and unobserved positions never inflate this.
  - name: full_oos_positions
    logicalType: integer
    businessName: Out-of-Stock Positions
    customProperties:
    - property: synonyms
      value:
      - oos_positions
      - stockouts
      - empty_positions
    description: Positions fully out of stock at the day's last known reading. Kept separate from low
      stock - two failure classes, not one boolean.
  - name: low_stock_positions
    logicalType: integer
    businessName: Low-Stock Positions
    customProperties:
    - property: synonyms
      value:
      - near_oos_positions
      - below_min_positions
    description: Positions below their minimum facing threshold but not empty at the day's last known
      reading.
  - name: osa_intraday_floor_pct
    logicalType: number
    businessName: OSA Intraday Floor %
    customProperties:
    - property: synonyms
      value:
      - worst_case_osa
      - intraday_osa
    description: Known positions never observed out of stock at ANY point in the day. The gap between
      this and end-of-day OSA is the intraday masking a daily average hides.
  - name: observation_coverage_pct
    logicalType: number
    businessName: Observation Coverage %
    customProperties:
    - property: synonyms
      value:
      - audit_coverage
      - sensing_coverage
    description: Share of expected positions captured at least once that day (the compliance-audit-coverage
      KPI's sensing half).
  - name: known_state_pct
    logicalType: number
    businessName: Known-State %
    customProperties:
    - property: synonyms
      value:
      - usable_reading_rate
      - evaluable_rate
    description: Share of observed positions whose day's last capture was usable. Publishes the honesty
      of the OSA denominator.
