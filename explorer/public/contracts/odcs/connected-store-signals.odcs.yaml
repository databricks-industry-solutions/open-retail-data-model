      observed).
  - name: high_severity_count
    logicalType: integer
    businessName: High Severity Episodes
    customProperties:
    - property: synonyms
      value:
      - high_priority
      - urgent_episodes
    description: Number of episodes at high severity (severity bands are high, medium, low).
  - name: suspect_quality_count
    logicalType: integer
    businessName: Suspect Quality Episodes
