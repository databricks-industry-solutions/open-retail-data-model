    physicalType: BIGINT
    description: Known positions in in_stock or low_stock state at the latest valid capture of the day.
  - name: positions_low_stock_eod
    logicalType: integer
    physicalType: BIGINT
    description: Known positions in low_stock state at the latest valid capture of the day.
  - name: positions_oos_eod
    logicalType: integer
    physicalType: BIGINT
    description: Known positions in out_of_stock state at the latest valid capture of the day.
  - name: positions_misplaced_eod
    logicalType: integer
    physicalType: BIGINT
    description: Known positions showing a misplaced product at the latest capture of the day (rare by
      construction).
  - name: positions_oos_any_time
    logicalType: integer
    physicalType: BIGINT
    description: Known positions that were observed in out_of_stock state at ANY point in the day.
  - name: positions_known_oos_any_time
    logicalType: integer
    physicalType: BIGINT
    description: Subset of positions_known that were OOS at any point; numerator for intraday floor.
  - name: osa_pct_eod
    logicalType: number
    physicalType: DOUBLE
    description: 'On-shelf availability at end-of-day: positions_available_eod / positions_known.'
  - name: osa_pct_intraday_floor
    logicalType: number
    physicalType: DOUBLE
    description: 'Worst-case availability: positions never observed OOS during the day / positions_known.'
  - name: observation_coverage_pct
    logicalType: number
    physicalType: DOUBLE
    description: 'Share of expected positions captured at least once: observed_positions / expected_positions.'
  - name: known_state_pct
    logicalType: number
    physicalType: DOUBLE
    description: 'Share of observed positions in a known state: positions_known / observed_positions.'
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the view was evaluated.
