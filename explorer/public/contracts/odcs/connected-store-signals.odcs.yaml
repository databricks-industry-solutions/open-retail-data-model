  - name: avg_occupancy
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled duration-weighted mean occupancy. NULL with disclosure_suppressed_flag
      = TRUE means suppressed.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell numerator. NULL with disclosure_suppressed_flag = TRUE means
      suppressed.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Disclosure-controlled dwell denominator. NULL with disclosure_suppressed_flag = TRUE
      means suppressed.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: Disclosure-controlled dwell_seconds_total / dwell_count. NULL with disclosure_suppressed_flag
      = TRUE means suppressed.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
    description: 'What one published count represents: person, group, device or object.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when staff were excluded from the operational count behind this shared row.
  - name: group_counting_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when shopping groups were counted as one.
  - name: time_mode
    logicalType: string
    physicalType: STRING
    description: Whether the underlying observations cover operating hours only or all day.
  - name: sensing_disclosure_policy_id
    logicalType: string
    physicalType: STRING
    description: Durable policy assignment whose effective version was resolved for this trading date.
  - name: disclosure_suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when every traffic-derived measure in this cell is NULL under same-cell dependent-measure
      suppression.
  - name: aggregation_level
    logicalType: string
    physicalType: STRING
    description: Always site. Store footfall is not a sum of zone rows.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the shared view was evaluated.
- name: gold_traffic_sales_productivity_current
  physicalName: connected_store_signals.gold_traffic_sales_productivity_current
  physicalType: view
  description: 'GRAIN: one row per store × trading_date. This is the ONLY grain at which traffic and sales
    can legitimately meet: canonical-core.transaction.sales is product × store × DAY with no zone and
    no hour. This view publishes the measures ORDM can support: sales per entry and units per entry. It
    deliberately has no conversion-rate surface; a canonical transaction or receipt count does not yet
    exist, so the numerator for transactions / visitors is unavailable.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date of the productivity observation.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year for the trading date.
  - name: fiscal_week
    logicalType: integer
    physicalType: INT
    description: NRF fiscal week number within the fiscal year.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: NRF fiscal week identifier.
  - name: fiscal_week_index
    logicalType: integer
    physicalType: INT
    description: Monotonic fiscal week index.
  - name: day_of_week
    logicalType: integer
    physicalType: INT
    description: ISO day of week for the trading date.
  - name: is_holiday
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when the trading date is a recognised retail holiday.
  - name: footfall_count
    logicalType: integer
    physicalType: BIGINT
    description: Measured store footfall for the day. NOT a sum over zones.
  - name: entry_count
    logicalType: integer
    physicalType: BIGINT
    description: Measured entries for the day.
  - name: exit_count
    logicalType: integer
    physicalType: BIGINT
    description: Measured exits for the day. NULL when entry direction is not observed.
  - name: visitor_count_adjusted
    logicalType: integer
    physicalType: BIGINT
    description: Footfall after staff exclusion.
  - name: avg_dwell_seconds
    logicalType: number
    physicalType: DOUBLE
    description: Mean dwell duration in seconds.
  - name: dwell_seconds_total
    logicalType: integer
    physicalType: BIGINT
    description: Sum of all dwell durations for re-aggregation.
  - name: dwell_count
    logicalType: integer
    physicalType: BIGINT
    description: Count of dwell observations for re-aggregation.
  - name: peak_occupancy
    logicalType: integer
    physicalType: BIGINT
    description: Highest simultaneous occupancy for the day.
  - name: avg_occupancy
    logicalType: number
    physicalType: DOUBLE
    description: Duration-weighted mean simultaneous occupancy.
  - name: interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Total duration of valid traffic intervals.
  - name: occupancy_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of valid intervals with a reported occupancy average; denominator for re-aggregating
      avg_occupancy.
  - name: coverage_interval_minutes_total
    logicalType: integer
    physicalType: BIGINT
    description: Duration of intervals with a reported coverage ratio; denominator for re-aggregating
      avg_coverage_ratio.
  - name: interval_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of intervals aggregated for the day.
  - name: footfall_count_py
    logicalType: integer
    physicalType: BIGINT
    description: Footfall on the equivalent NRF fiscal week and weekday in the prior year.
  - name: footfall_growth_py
    logicalType: number
    physicalType: DOUBLE
    description: 'Fractional growth: (footfall_count - footfall_count_py) / footfall_count_py.'
  - name: units
    logicalType: integer
    physicalType: BIGINT
    description: Units sold at the store-day. An item count, not a basket or transaction count.
  - name: gross_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Gross sales revenue before discounts at the store-day.
  - name: net_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Net revenue after discount, in the single reporting currency.
  - name: discount_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total discounts applied at the store-day.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: ISO 4217 reporting currency.
  - name: promo_active_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if any product at the store-day carried a real promotion; NO_PROMO is excluded.
  - name: active_promo_count
    logicalType: integer
    physicalType: BIGINT
    description: Distinct real promotions active at the store-day.
  - name: sales_per_entry
    logicalType: number
    physicalType: DECIMAL
    description: Net revenue divided by measured entries. A productivity measure, not conversion.
  - name: units_per_entry
    logicalType: number
    physicalType: DOUBLE
    description: Items sold divided by measured entries. Items are not transactions.
  - name: sales_per_footfall
    logicalType: number
    physicalType: DECIMAL
    description: Net revenue divided by measured footfall. Available when entry direction is not observed.
  - name: units_per_footfall
    logicalType: number
    physicalType: DOUBLE
    description: Items sold divided by measured footfall. Items are not transactions.
  - name: counting_unit
    logicalType: string
    physicalType: STRING
    description: 'What one traffic count represents: person, group, device or object.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if staff were excluded from the traffic count.
  - name: avg_coverage_ratio
    logicalType: number
    physicalType: DOUBLE
    description: Mean share of expected traffic sensors that reported.
  - name: valid_interval_share
    logicalType: number
    physicalType: DOUBLE
    description: Share of intervals whose traffic measurement was valid.
  - name: complete_interval_share
    logicalType: number
    physicalType: DOUBLE
    description: Share of intervals where all data had fully landed.
  - name: is_zero_observed
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE when footfall_count = 0 AND any interval carried is_zero_observed = TRUE.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the view was evaluated.
  quality:
  - name: productivity_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: productivity_single_currency
    query: "SELECT g.store_id, g.trading_date, COUNT(DISTINCT s.currency_code) AS currencies\nFROM connected_store_signals.gold_traffic_sales_productivity_current\
      \ g\nJOIN transaction.sales s\n  ON g.store_id = s.store_id AND g.trading_date = s.date_key\nGROUP\
      \ BY g.store_id, g.trading_date\nHAVING COUNT(DISTINCT s.currency_code) > 1"
