    split, mismatch magnitudes, correction times, and ack sync latency.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - site
      - location
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - business_date
    description: Business date of the price-display observations.
  - name: currency_code
    logicalType: string
    businessName: Currency
    customProperties:
    - property: synonyms
      value:
      - currency
      - iso_currency
      - reporting_currency
    description: ISO 4217 currency of the label's last daily price observation.
  - name: labels_observed
    logicalType: integer
    businessName: Labels Observed
    customProperties:
    - property: synonyms
      value:
      - esl_labels_seen
      - labels_checked
    description: Label-days with at least one price observation from any evidence path (ack, shelf CV,
      manual audit).
  - name: labels_evaluable
    logicalType: integer
    businessName: Labels Evaluable
    customProperties:
    - property: synonyms
      value:
      - labels_compared
      - price_checks_evaluable
    description: Observed label-days whose last observation carried an evaluable displayed-versus-record
      comparison.
  - name: price_match_rate
    logicalType: number
    businessName: Price Match Rate
    customProperties:
    - property: synonyms
      value:
      - price_accuracy
      - match_rate
      - display_accuracy
    description: Labels whose day's LAST observation matched the captured price of record, over labels
      where the comparison was evaluable. The HB130-style price accuracy figure.
  - name: labels_mismatched
    logicalType: integer
    businessName: Labels Mismatched (EOD)
    customProperties:
    - property: synonyms
      value:
      - mismatched_labels
      - wrong_price_labels
    description: Labels ending the day displaying a price different from the captured price of record.
  - name: labels_overcharging
    logicalType: integer
    businessName: Labels Overcharging
    customProperties:
    - property: synonyms
      value:
      - overcharges
      - price_too_high
    description: End-of-day mismatches where the displayed price EXCEEDS the price of record. Never netted
      against undercharges - regulators treat the directions asymmetrically.
  - name: labels_undercharging
    logicalType: integer
    businessName: Labels Undercharging
    customProperties:
    - property: synonyms
      value:
      - undercharges
      - price_too_low
    description: End-of-day mismatches where the displayed price is BELOW the price of record.
  - name: max_mismatch_amount
    logicalType: number
    businessName: Largest Mismatch Amount
    customProperties:
    - property: synonyms
      value:
      - worst_mismatch
      - biggest_price_error
    description: Largest absolute displayed-vs-record gap at end of day. Returns NULL when the grouping
      spans currencies; group by Currency for monetary analysis.
  - name: avg_correction_hours
    logicalType: number
    businessName: Average Correction Hours
    customProperties:
    - property: synonyms
      value:
      - time_to_correct
      - mismatch_fix_time
    description: 'Label-weighted mean correction time: first mismatch to first subsequent match on the
      same day.'
  - name: max_open_mismatch_hours
    logicalType: number
    businessName: Longest Open Mismatch (Hours)
    customProperties:
    - property: synonyms
      value:
      - oldest_mismatch
      - mismatch_aging
    description: Longest still-uncorrected mismatch age across the grouping, aged to the day's last evidence,
      not to the reader's wall clock.
  - name: sync_latency_p95_seconds
    logicalType: number
    businessName: Sync Latency p95 (Seconds)
    customProperties:
    - property: synonyms
      value:
      - ack_latency_p95
      - price_update_latency
    description: WORST grouped store-day p95 of price-of-record-effective to label ack. Percentiles cannot
      be re-aggregated, so grouping reports the worst constituent, not a recomputed percentile. Latency
      evidence is only as granular as the captured price authority's effective timestamp.
  - name: ack_observation_count
    logicalType: integer
    businessName: Ack Observations
    customProperties:
    - property: synonyms
      value:
      - acks
      - platform_acks
    description: Platform-acknowledged display confirmations - the only evidence path that measures sync
      latency.
  - name: audit_observation_count
    logicalType: integer
    businessName: Manual Audit Observations
    customProperties:
    - property: synonyms
      value:
      - manual_checks
      - price_audits
    description: Human price checks. Disagreement between evidence paths is signal, not noise.
- name: mv_store_foot_traffic
  physicalName: connected_store_signals.mv_store_foot_traffic
  physicalType: view
  description: In-store footfall, dwell and occupancy at STORE level (one row per store per trading date).
    Store totals only -- zone detail is in mv_zone_foot_traffic, and the two must never be summed together
    because footfall does not sum across zones (a shopper traversing five zones is counted five times).
    Aggregate-only and never person-level.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - location
      - site
      - branch
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - business_date
      - day
    description: Business date of the measurement, derived from the UTC instant plus the store UTC offset.
  - name: fiscal_year
    logicalType: integer
    businessName: Fiscal Year
    customProperties:
    - property: synonyms
      value:
      - retail_year
      - year
    description: NRF 4-5-4 fiscal year.
  - name: fiscal_week_id
    logicalType: integer
    businessName: Fiscal Week
    customProperties:
    - property: synonyms
      value:
      - retail_week
      - week
    description: NRF 4-5-4 week identifier (fiscal_year * 100 + fiscal_week).
  - name: day_of_week
    logicalType: integer
    businessName: Day of Week
    customProperties:
    - property: synonyms
      value:
      - weekday
      - dow
    description: ISO day of week (1 = Monday .. 7 = Sunday).
  - name: counting_unit
    logicalType: string
    businessName: Counting Unit
    customProperties:
    - property: synonyms
      value:
      - count_basis
      - count_unit
    description: 'What one count represents: person, group, device or object. A footfall number is uninterpretable
      without this -- with group counting enabled, a count is of visitor GROUPS, not people.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    businessName: Staff Excluded
    customProperties:
    - property: synonyms
      value:
      - excludes_staff
      - staff_filtered
    description: TRUE if staff are excluded from footfall. Rows with different values must not be compared
      without noting it.
  - name: footfall
    logicalType: integer
    businessName: Footfall
    customProperties:
    - property: synonyms
      value:
      - traffic
      - visitors
      - shoppers
      - foot_traffic
      - visits
    description: Store shopper count. Additive over time and across stores.
  - name: entries
    logicalType: integer
    businessName: Entries
    customProperties:
    - property: synonyms
      value:
      - traffic_in
      - ins
      - arrivals
    description: Measured entries.
  - name: exits
    logicalType: integer
    businessName: Exits
    customProperties:
    - property: synonyms
      value:
      - traffic_out
      - outs
      - departures
    description: Measured exits. NULL for non-directional sensors, which cannot measure them -- not zero.
  - name: visitors_adjusted
    logicalType: integer
    businessName: Visitors (Staff Excluded)
    customProperties:
    - property: synonyms
      value:
      - net_visitors
      - customer_count
    description: Count after staff adjustment.
  - name: staff_count
    logicalType: integer
    businessName: Staff Detections
    customProperties:
    - property: synonyms
      value:
      - employees_detected
      - associates_detected
    description: Staff detections identified and excluded.
  - name: peak_occupancy
    logicalType: integer
    businessName: Peak Occupancy
    customProperties:
    - property: synonyms
      value:
      - max_occupancy
      - peak_people
      - busiest
    description: 'Highest simultaneous occupancy in the store. Semi-additive: a MAX over intervals, never
      a SUM.'
  - name: avg_occupancy
    logicalType: number
    businessName: Average Occupancy
    customProperties:
    - property: synonyms
      value:
      - mean_occupancy
      - typical_occupancy
    description: Mean simultaneous occupancy, weighted by canonical interval duration. Never average interval
      averages without their durations.
  - name: avg_dwell_seconds
    logicalType: number
    businessName: Average Dwell (Seconds)
    customProperties:
    - property: synonyms
      value:
      - dwell_time
      - time_in_store
      - linger_time
    description: Mean dwell time. Computed from the stored SUM and COUNT so it re-aggregates correctly
      at any grain -- a pre-computed average could not.
  - name: uptime
    logicalType: number
    businessName: Sensor Uptime
    customProperties:
    - property: synonyms
      value:
      - availability
      - sensor_uptime
      - online_rate
    description: Mean share of the interval the sensors were online, weighted by interval MINUTES so a
      15-minute outage does not carry the same weight as an hour-long one. Read this before trusting a
      low count.
  - name: avg_coverage
    logicalType: number
    businessName: Sensor Coverage
    customProperties:
    - property: synonyms
      value:
      - coverage
      - reporting_rate
      - completeness
    description: Mean share of expected sensors that reported, weighted by interval MINUTES. A low value
      means the count is partial, not low.
  - name: valid_interval_share
    logicalType: number
    businessName: Valid Interval Share
    customProperties:
    - property: synonyms
      value:
      - data_quality
      - validity_rate
    description: Share of intervals whose measurement was valid. Orthogonal to arrival completeness --
      a sensor can be complete but invalid.
  - name: interval_count
    logicalType: integer
    businessName: Interval Count
    customProperties:
    - property: synonyms
      value:
      - intervals
      - periods
      - observation_count
    description: Number of source intervals behind the row. The denominator for coverage questions.
- name: mv_traffic_sales_productivity
  physicalName: connected_store_signals.mv_traffic_sales_productivity
  physicalType: view
  description: Store-day traffic against sales. Publishes sales and units per entry; no conversion rate
    is exposed until ORDM has canonical transaction or receipt count.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - location
      - site
      - branch
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - business_date
      - day
    description: Business date.
  - name: fiscal_year
    logicalType: integer
    businessName: Fiscal Year
    customProperties:
    - property: synonyms
      value:
      - retail_year
      - year
    description: NRF 4-5-4 fiscal year.
  - name: fiscal_week_id
    logicalType: integer
    businessName: Fiscal Week
    customProperties:
    - property: synonyms
      value:
      - retail_week
      - week
    description: NRF 4-5-4 week identifier.
  - name: day_of_week
    logicalType: integer
    businessName: Day of Week
    customProperties:
    - property: synonyms
      value:
      - weekday
      - dow
    description: ISO day of week (1 = Monday .. 7 = Sunday).
  - name: is_holiday
    logicalType: boolean
    businessName: Holiday
    customProperties:
    - property: synonyms
      value:
      - holiday_flag
      - is_bank_holiday
    description: TRUE on a recognised retail holiday. Traffic comparisons across a holiday boundary are
      not like-for-like.
  - name: promo_active_flag
    logicalType: boolean
    businessName: Promotion Active
    customProperties:
    - property: synonyms
      value:
      - on_promo
      - promotion_running
      - promo
    description: TRUE if any product at the store-day carried a real promotion (the NO_PROMO sentinel
      is excluded).
  - name: counting_unit
    logicalType: string
    businessName: Counting Unit
    customProperties:
    - property: synonyms
      value:
      - count_basis
      - count_unit
    description: 'What one count represents: person, group, device or object.'
  - name: visits
    logicalType: integer
    businessName: Visits
    customProperties:
    - property: synonyms
      value:
      - traffic
      - visitors
      - entries
      - footfall
    description: Store entries -- the denominator for every per-visitor measure here.
  - name: net_sales
    logicalType: number
    businessName: Net Sales
    customProperties:
    - property: synonyms
      value:
      - revenue
      - sales
      - net_revenue
      - turnover
    description: Net revenue after discount, in the single reporting currency.
  - name: gross_sales
    logicalType: number
    businessName: Gross Sales
    customProperties:
    - property: synonyms
      value:
      - gross_revenue
      - gross
    description: Revenue before promotional discount.
  - name: units_sold
    logicalType: integer
    businessName: Units Sold
    customProperties:
    - property: synonyms
      value:
      - units
      - quantity
      - items_sold
    description: Units sold. NOTE this is an ITEM count, not a basket count -- which is exactly why it
      cannot stand in as the conversion numerator.
  - name: sales_per_entry
    logicalType: number
    businessName: Sales per Entry
    customProperties:
    - property: synonyms
      value:
      - revenue_per_entry
      - spend_per_entry
    description: Net revenue divided by measured entries.
  - name: units_per_entry
    logicalType: number
    businessName: Units per Entry
    customProperties:
    - property: synonyms
      value:
      - items_per_entry
      - quantity_per_entry
    description: Units divided by entries.
  - name: sales_per_footfall
    logicalType: number
    businessName: Sales per Footfall
    customProperties:
    - property: synonyms
      value:
      - revenue_per_footfall
      - spend_per_footfall
    description: Net revenue divided by measured footfall. Available when entry direction is not observed.
  - name: units_per_footfall
    logicalType: number
    businessName: Units per Footfall
    customProperties:
    - property: synonyms
      value:
      - items_per_footfall
      - quantity_per_footfall
    description: Units divided by measured footfall. Items are not transactions.
  - name: avg_dwell_seconds
    logicalType: number
    businessName: Average Dwell (Seconds)
    customProperties:
    - property: synonyms
      value:
      - dwell_time
      - time_in_store
    description: Mean dwell time, recomputed from the stored SUM and COUNT so it re-aggregates correctly
      at any grain. Not AVG(avg_dwell_seconds), which would average averages and give a near-empty store-day
      the same weight as a busy one.
  - name: peak_occupancy
    logicalType: integer
    businessName: Peak Occupancy
    customProperties:
    - property: synonyms
      value:
      - max_occupancy
      - busiest
    description: Highest simultaneous occupancy. Semi-additive -- a MAX, never a SUM.
  - name: traffic_vs_py
    logicalType: number
    businessName: Traffic vs Prior Year
    customProperties:
    - property: synonyms
      value:
      - traffic_growth
      - yoy_traffic
      - footfall_growth
    description: Footfall growth against the equivalent NRF fiscal week and weekday last year, not a calendar
      date shift.
  - name: discount_rate
    logicalType: number
    businessName: Discount Rate
    customProperties:
    - property: synonyms
      value:
      - markdown_rate
      - promo_depth
    description: Promotional discount as a share of gross revenue. Pairs with promo_active_flag to read
      traffic lift against margin cost.
  - name: avg_coverage
    logicalType: number
    businessName: Sensor Coverage
    customProperties:
    - property: synonyms
      value:
      - coverage
      - completeness
    description: Mean share of expected sensors reporting, weighted by interval MINUTES so a store-day
      with little observed time cannot outvote a full one. A low-coverage day must not be compared against
      a complete one.
  - name: store_day_count
    logicalType: integer
    businessName: Store Days
    customProperties:
    - property: synonyms
      value:
      - days
      - observation_count
    description: Number of store-days in the grouping.
- name: mv_zone_foot_traffic
  physicalName: connected_store_signals.mv_zone_foot_traffic
  physicalType: view
  description: In-store footfall, dwell, occupancy and density at ZONE level (one row per zone per trading
    date). ZONE FOOTFALL DOES NOT SUM TO A STORE TOTAL -- a shopper traversing five zones is counted five
    times, so use mv_store_foot_traffic for store totals and use this view to compare zones with each
    other. Aggregate-only and never person-level.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - location
      - site
      - branch
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    businessName: Zone
    customProperties:
    - property: synonyms
      value:
      - zone
      - area
      - department
      - in_store_area
    description: Durable in-store zone id.
  - name: zone_type
    logicalType: string
    businessName: Zone Type
    customProperties:
    - property: synonyms
      value:
      - zone_kind
      - area_type
      - space_type
    description: 'Depth in the spatial hierarchy: entrance, area, department, aisle, bay, shelf_position,
      queue, fitting_room.'
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - business_date
      - day
    description: Business date of the measurement, derived from the UTC instant plus the store UTC offset.
  - name: counting_unit
    logicalType: string
    businessName: Counting Unit
    customProperties:
    - property: synonyms
      value:
      - count_basis
      - count_unit
    description: 'What one count represents: person, group, device or object. A footfall number is uninterpretable
      without this -- with group counting enabled, a count is of visitor GROUPS, not people.'
  - name: staff_exclusion_enabled
    logicalType: boolean
    businessName: Staff Excluded
    customProperties:
    - property: synonyms
      value:
      - excludes_staff
      - staff_filtered
    description: TRUE if staff are excluded from footfall. Rows with different values must not be compared
      without noting it.
  - name: zone_footfall
    logicalType: integer
    businessName: Zone Footfall
    customProperties:
    - property: synonyms
      value:
      - zone_traffic
      - zone_visitors
      - zone_shoppers
    description: Zone shopper count. Additive over TIME within one zone. NOT additive across zones --
      summing zones overstates the store, because one shopper appears in every zone entered.
  - name: entries
    logicalType: integer
    businessName: Zone Entries
    customProperties:
    - property: synonyms
      value:
      - zone_ins
      - arrivals
    description: Measured entries into the zone.
  - name: exits
    logicalType: integer
    businessName: Zone Exits
    customProperties:
    - property: synonyms
      value:
      - zone_outs
      - departures
    description: Measured exits from the zone. NULL for non-directional sensors, which cannot measure
      them -- not zero.
  - name: passersby
    logicalType: integer
    businessName: Pass-by Traffic
    customProperties:
    - property: synonyms
      value:
      - outside_traffic
      - walk_by
      - pass_by
    description: Traffic passing the zone without entering. Interpretation depends on the row's pass-by
      convention -- vendors define this two opposite ways, one including entrants and one excluding them.
  - name: capture_rate
    logicalType: number
    businessName: Capture Rate
    customProperties:
    - property: synonyms
      value:
      - draw_rate
      - pull_in_rate
      - walk_in_rate
    description: Share of pass-by traffic that entered the zone. Only meaningful where the pass-by convention
      is uniform across the grouped rows.
  - name: peak_occupancy
    logicalType: integer
    businessName: Peak Occupancy
    customProperties:
    - property: synonyms
      value:
      - max_occupancy
      - peak_people
      - busiest
    description: 'Highest simultaneous occupancy in the zone. Semi-additive: a MAX over intervals, never
      a SUM. A store peak comes from mv_store_foot_traffic, not a MAX over zones -- zones peak at different
      moments.'
  - name: avg_occupancy
    logicalType: number
    businessName: Average Occupancy
    customProperties:
    - property: synonyms
      value:
      - mean_occupancy
      - typical_occupancy
    description: Mean simultaneous occupancy, weighted by canonical interval duration. Never average interval
      averages without their durations.
  - name: avg_dwell_seconds
    logicalType: number
    businessName: Average Dwell (Seconds)
    customProperties:
    - property: synonyms
      value:
      - dwell_time
      - time_in_zone
      - linger_time
    description: Mean dwell time in the zone. Computed from the stored SUM and COUNT so it re-aggregates
      correctly at any grain -- a pre-computed average could not.
  - name: engagement_rate
    logicalType: number
    businessName: Engagement Rate
    customProperties:
    - property: synonyms
      value:
      - engaged_share
      - interaction_rate
    description: Share of dwell observations exceeding the engagement threshold. The denominator is dwell
      observations, not footfall, because not every counted shopper produces a dwell observation.
  - name: avg_daily_footfall_per_sqm
    logicalType: number
    businessName: Avg Daily Footfall per m2
    customProperties:
    - property: synonyms
      value:
      - traffic_density
      - footfall_density
      - density
    description: Traffic density, per zone-DAY. The denominator is the sum of area over the grouped zone-days,
      so grouping a week of one zone gives that zone's AVERAGE DAILY density, not its weekly total density
      -- which is why the measure is named for the day. Requires a recorded zone area.
  - name: area_sqm_days
    logicalType: number
    businessName: Area m2-Days
    customProperties:
    - property: synonyms
      value:
      - area_days
      - density_denominator
    description: 'The explicit denominator behind the density measure: zone area summed over the grouped
      zone-days. Published so the weighting is visible rather than implied.'
  - name: peak_capacity_utilisation
    logicalType: number
    businessName: Peak Capacity Utilisation
    customProperties:
    - property: synonyms
      value:
      - capacity_used
      - utilisation
      - crowding
    description: Peak occupancy as a share of the zone's recorded capacity. A MAX, never averaged across
      zones of different capacity.
  - name: uptime
    logicalType: number
    businessName: Sensor Uptime
    customProperties:
    - property: synonyms
      value:
      - availability
      - sensor_uptime
      - online_rate
    description: Mean share of the interval the sensors were online, weighted by interval MINUTES so a
      15-minute outage does not carry the same weight as an hour-long one. Read this before trusting a
      low count.
  - name: avg_coverage
    logicalType: number
    businessName: Sensor Coverage
    customProperties:
    - property: synonyms
      value:
      - coverage
      - reporting_rate
      - completeness
    description: Mean share of expected sensors that reported, weighted by interval MINUTES. A low value
      means the count is partial, not low.
  - name: interval_count
    logicalType: integer
    businessName: Interval Count
    customProperties:
    - property: synonyms
      value:
      - intervals
      - periods
      - observation_count
    description: Number of source intervals behind the row. The denominator for coverage questions.
