  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - site
      - location
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - day
      - business_date
    description: Business date of the shelf observations.
  - name: product_id
    logicalType: string
    businessName: Product
    customProperties:
    - property: synonyms
      value:
      - product
      - sku
      - item
    description: Durable product business key.
