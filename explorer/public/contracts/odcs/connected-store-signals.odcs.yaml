      id so no grouping fans it out.
  - name: positions_expected
    logicalType: integer
    businessName: Positions Expected
    customProperties:
    - property: synonyms
      value:
      - assigned_positions
      - planned_positions
    description: Assigned position-days in the compliance denominator universe.
  - name: positions_observed
    logicalType: integer
    businessName: Positions Observed
    customProperties:
    - property: synonyms
      value:
      - slots_observed
    description: Position-days observed across the grouping.
  - name: positions_unobserved
    logicalType: integer
    businessName: Unobserved Positions
    customProperties:
    - property: synonyms
      value:
      - uncovered_positions
      - coverage_gaps
    description: Expected position-days with no capture. They are coverage gaps, never compliant or violating.
  - name: positions_known
    logicalType: integer
    businessName: Known-State Positions
    customProperties:
    - property: synonyms
      value:
      - evaluable_positions
      - usable_positions
    description: Observed position-days whose last capture was usable.
  - name: overall_compliance_pct
    logicalType: number
    businessName: Overall Compliance %
    customProperties:
    - property: synonyms
      value:
      - planogram_compliance
      - compliance_rate
      - execution_compliance
    description: Positions compliant on ALL FOUR dimensions, over positions where all four were evaluable.
  - name: presence_compliance_pct
    logicalType: number
    businessName: Presence Compliance %
    customProperties:
    - property: synonyms
      value:
      - product_presence_rate
      - right_product_rate
    description: Right product present (in stock or low stock) at its assigned position.
  - name: position_compliance_pct
    logicalType: number
    businessName: Position Compliance %
    customProperties:
    - property: synonyms
      value:
      - placement_compliance
      - right_position_rate
    description: No misplaced product detected at the position (the right-position dimension).
  - name: facing_compliance_pct
    logicalType: number
    businessName: Facing Compliance %
    customProperties:
    - property: synonyms
      value:
      - facings_rate
      - right_facings_rate
    description: Observed facings meet the expected facing count from the slot assignment.
  - name: price_tag_compliance_pct
    logicalType: number
    businessName: Price Tag Compliance %
    customProperties:
    - property: synonyms
      value:
      - tag_compliance
      - right_tag_rate
    description: No price-tag mismatch flagged by shelf vision. The authoritative displayed-price comparison
      lives in the price-accuracy metric view.
  - name: positions_unknown
    logicalType: integer
    businessName: Unknown-State Positions
    customProperties:
    - property: synonyms
      value:
      - unevaluable_positions
    description: Position-days whose last capture was unknown or invalid - excluded from every compliance
      denominator, published so partial sensing is visible.
  - name: observation_coverage_pct
    logicalType: number
    businessName: Observation Coverage %
    customProperties:
    - property: synonyms
      value:
      - compliance_audit_coverage
      - sensing_coverage
    description: Share of expected position-days captured at least once.
  - name: known_state_pct
    logicalType: number
    businessName: Known-State %
    customProperties:
    - property: synonyms
      value:
      - evaluable_rate
      - usable_reading_rate
    description: Share of observed position-days whose last capture was usable.
  - name: products_allocation_divergent
