- name: gold_observed_oos_episodes
  physicalName: connected_store_signals.gold_observed_oos_episodes
  physicalType: view
  description: 'GRAIN: one row per observed out-of-stock EPISODE (store × position × product × episode
    start): a maximal run of consecutive usable out_of_stock observations, closed by the next usable non-OOS
    observation (recovery) or ongoing (recovery NULL).'
