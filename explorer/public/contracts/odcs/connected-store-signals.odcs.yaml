    physicalType: BIGINT
    description: Expected positions that had at least one observation on the trading_date.
  - name: positions_unobserved
    logicalType: integer
    physicalType: BIGINT
    description: Expected positions with no capture that day — a coverage gap, never counted as available.
  - name: positions_known
    logicalType: integer
    physicalType: BIGINT
    description: Observed positions whose latest capture was a usable state (valid measurement and not
      unknown).
  - name: positions_unknown
    logicalType: integer
    physicalType: BIGINT
    description: Observed positions whose latest capture was unknown or invalid — latest-capture-wins
      rule applies.
  - name: positions_available_eod
