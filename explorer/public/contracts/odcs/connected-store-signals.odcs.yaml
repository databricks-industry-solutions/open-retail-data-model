- name: gold_item_current_state
  physicalName: connected_store_signals.gold_item_current_state
  physicalType: view
  description: 'GRAIN: one row per serialized item (durable tagged_item_id). Stray-suspect reads never
    drive state. A recall is persistent until a future explicit release mechanism is modeled; ordinary
    dispositions use the latest event. Reference freshness windows are 120 minutes for fixed readers and
    24 hours for mobile sweeps. Adopters may tighten them without changing the event contract. The evaluation
    clock defaults to wall clock; historical demos may explicitly evaluate at the RFID event-time maximum
    under ADR 0038 without rewriting history.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/connected-store-signals/README.md
    type: businessDefinition
  - url: outcome-packages/connected-store-signals/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: tagged_item_sk
    logicalType: integer
    physicalType: BIGINT
    description: Serialized item surrogate key.
  - name: tagged_item_id
    logicalType: string
    physicalType: STRING
    description: Durable EPC Pure Identity URI (serialized item business key).
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: Product surrogate key.
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product business key.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Store surrogate key.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_sk
    logicalType: integer
    physicalType: BIGINT
    description: Zone surrogate key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable zone business key.
  - name: sensor_device_sk
    logicalType: integer
    physicalType: BIGINT
    description: Device surrogate key.
  - name: sensor_device_id
    logicalType: string
    physicalType: STRING
    description: Durable device business key.
  - name: sensing_deployment_sk
    logicalType: integer
    physicalType: BIGINT
    description: Deployment surrogate key.
  - name: sensing_deployment_id
    logicalType: string
    physicalType: STRING
    description: Durable deployment business key.
  - name: latest_event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Timestamp of the most recent RFID read event.
  - name: latest_ingest_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Ingest timestamp of the most recent read event.
  - name: latest_biz_step_uri
    logicalType: string
    physicalType: STRING
    description: GS1 CBV business step URI of the latest event (e.g., urn:epcglobal:cbv:bizstep:receiving).
  - name: derived_disposition_uri
    logicalType: string
    physicalType: STRING
    description: Latest attributed disposition, except that a recalled disposition persists until an explicit
      release mechanism is modeled.
  - name: latest_direction_code
    logicalType: string
    physicalType: STRING
    description: Direction code if the latest event was directional (e.g., enter, exit).
  - name: attribution_confidence
    logicalType: number
    physicalType: DOUBLE
    description: Platform confidence score for the zone attribution.
  - name: zone_source
    logicalType: string
    physicalType: STRING
    description: 'How the latest read point was resolved: fixed device placement, operator declaration,
      or mobile-platform localization.'
  - name: is_mobile_platform
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if the latest read came from a mobile reader.
  - name: freshness_window_minutes
    logicalType: integer
    physicalType: INT
    description: Configured freshness window selected from the latest reader platform; starter defaults
      are 120 minutes fixed and 1440 minutes mobile.
  - name: freshness_age_minutes
    logicalType: integer
    physicalType: INT
    description: Minutes since latest_event_ts at the evaluation clock.
  - name: derived_presence_state
    logicalType: string
    physicalType: STRING
    description: present, absent, unavailable, or stale. Stray-suspect reads never drive this state.
  - name: recalled_at_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Timestamp when a recall disposition was applied (NULL if not recalled).
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the view was evaluated.
- name: gold_item_visibility_daily
  physicalName: connected_store_signals.gold_item_visibility_daily
  physicalType: view
  description: 'GRAIN: store × product × trading date. Count fields remain additive inputs for visibility-quality
    rates; average confidence, percentile lag, and freshness are explicitly non-additive diagnostics at
    this daily grain. RFID freshness uses ADR 0038''s resolved item-presence evaluation clock so its freshness_age_minutes
    and fresh_as_of_ts agree with gold_item_current_state.'
