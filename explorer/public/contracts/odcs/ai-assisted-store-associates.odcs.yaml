    logicalType: string
    physicalType: STRING
    description: daily_snapshot (EOD inventory_position only) or event_overlay (intra-day associate_context_event).
  - name: source_event_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: source_ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: current_state_updated_at
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: source_system
    logicalType: string
    physicalType: STRING
  - name: freshness_status
    logicalType: string
    physicalType: STRING
    description: 'For event_overlay: lag bands. For daily_snapshot: calendar age of date_key (EOD semantics
      — not live shelf).'
  - name: freshness_lag_minutes
    logicalType: number
    physicalType: DOUBLE
  - name: explanation
    logicalType: string
    physicalType: STRING
    description: Human-readable provenance for associate UI display; states EOD vs overlay and nearby-match
      rule.
  - name: warning
    logicalType: string
    physicalType: STRING
    description: Honesty warning for EOD grain, stale overlay, or incomplete location; NULL when none.
  quality:
  - name: gold_inv_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_inv_grain_unique
    query: 'SELECT product_id, store_id

      FROM ai_assisted_store_associates.gold_associate_product_inventory_current

      GROUP BY product_id, store_id

      HAVING COUNT(*) > 1'
  - name: gold_inv_stock_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_inv_stock_status_domain
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_product_inventory_current

      WHERE stock_status NOT IN (''IN_STOCK'', ''LOW_STOCK'', ''OUT_OF_STOCK'', ''UNKNOWN'')'
  - name: gold_inv_basis_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_inv_basis_domain
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_product_inventory_current

      WHERE inventory_basis NOT IN (''daily_snapshot'', ''event_overlay'')'
  - name: gold_inv_location_basis_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_inv_location_basis_domain
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_product_inventory_current

      WHERE location_basis NOT IN (''event_location_code'', ''not_modeled'')'
  - name: gold_inv_nearby_basis_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_inv_nearby_basis_domain
    query: "SELECT * FROM ai_assisted_store_associates.gold_associate_product_inventory_current\nWHERE\
      \ nearby_store_match_basis IS NOT NULL\n  AND nearby_store_match_basis NOT IN ('same_region_on_hand')"
  - name: gold_inv_eod_warning_when_snapshot
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Daily snapshots must carry an honesty warning so UIs cannot treat them as live.
    query: "SELECT * FROM ai_assisted_store_associates.gold_associate_product_inventory_current\nWHERE\
      \ inventory_basis = 'daily_snapshot'\n  AND (warning IS NULL OR warning = '')"
  - name: gold_inv_freshness_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_inv_freshness_present
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_product_inventory_current

      WHERE freshness_status IS NULL OR source_system IS NULL'
- name: mv_associate_action_performance
  physicalName: ai_assisted_store_associates.mv_associate_action_performance
  physicalType: view
  description: 'Next Best Action effectiveness at store x zone x associate x trading date x action_type:
    how many actions were generated, their acceptance and completion rates, average time-to-first-response,
    and realized monetary outcome. Break down by associate for individual effectiveness or by zone for
    the staffing signal. Rates are ratio-of-sums and re-aggregate at any grain.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    businessName: Store
    customProperties:
    - property: synonyms
      value:
      - store
      - location
      - site
      - branch
    description: Durable store business key.
  - name: trading_date
    logicalType: date
    businessName: Trading Date
    customProperties:
    - property: synonyms
      value:
      - date
      - business_date
      - day
    description: Business date the action was generated.
  - name: action_type
    logicalType: string
    businessName: Action Type
    customProperties:
    - property: synonyms
      value:
      - task_type
      - action
      - task_class
    description: 'The Next Best Action task class: customer_assist, restock_shelf, bopis_fulfill, safety_loss_prevention,
      maintenance_cleaning, price_check, queue_bust, clienteling.'
  - name: associate_id
    logicalType: string
    businessName: Associate
    customProperties:
    - property: synonyms
      value:
      - associate
      - worker
      - team_member
      - employee
    description: Durable associate business key (not the version-specific surrogate). NULL for actions
      generated but never routed. Break down here for per-associate effectiveness.
  - name: store_zone_id
    logicalType: string
    businessName: Zone
    customProperties:
    - property: synonyms
      value:
      - zone
      - area
      - department
      - location_zone
    description: Durable target-zone id. Break down here for the staffing signal — rejections concentrated
      in one zone. NULL when the action had no target zone.
  - name: actions_generated
    logicalType: integer
    businessName: Actions Generated
    customProperties:
    - property: synonyms
      value:
      - tasks
      - prompts
      - actions
      - suggestions
    description: Count of Next Best Actions dispatched. Additive over time, store and action type.
  - name: actions_accepted
    logicalType: integer
    businessName: Actions Accepted
    customProperties:
    - property: synonyms
      value:
      - accepted
      - taken
    description: Actions the associate accepted.
  - name: actions_completed
    logicalType: integer
    businessName: Actions Completed
    customProperties:
    - property: synonyms
      value:
      - completed
      - done
      - fulfilled
    description: Actions that reached completed status.
  - name: acceptance_rate
    logicalType: number
    businessName: Acceptance Rate
    customProperties:
    - property: synonyms
      value:
      - accept_rate
      - take_rate
    description: Share of generated actions the associate accepted. Ratio-of-sums.
  - name: completion_rate
    logicalType: number
    businessName: Completion Rate
    customProperties:
    - property: synonyms
      value:
      - complete_rate
      - fulfilment_rate
    description: Share of generated actions completed. Ratio-of-sums.
  - name: avg_response_seconds
    logicalType: number
    businessName: Average Response (Seconds)
    customProperties:
    - property: synonyms
      value:
      - response_time
      - time_to_respond
      - latency
    description: Mean time from action dispatch to first associate response, computed from the stored
      total and count so it re-aggregates correctly at any grain.
  - name: realized_outcome_value
    logicalType: number
    businessName: Realized Outcome Value
    customProperties:
    - property: synonyms
      value:
      - outcome_value
      - attributed_revenue
      - roi_value
    description: Sum of monetary outcomes attributed to actions (e.g. closed-sale value). Single reporting
      currency (see outcome_currency_code on the gold view).
  - name: sales_closed
    logicalType: integer
    businessName: Sales Closed
    customProperties:
    - property: synonyms
      value:
      - closed_sales
      - conversions
    description: Count of actions resolved as a closed sale.
