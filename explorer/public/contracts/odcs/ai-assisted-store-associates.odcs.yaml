    logicalType: string
    physicalType: STRING
  - name: warning
    logicalType: string
    physicalType: STRING
  quality:
  - name: gold_price_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_price_grain_unique
    query: 'SELECT product_id, store_id

      FROM ai_assisted_store_associates.gold_associate_price_promotion_current

      GROUP BY product_id, store_id

      HAVING COUNT(*) > 1'
  - name: gold_price_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_price_nonneg
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_price_promotion_current

      WHERE base_price_amount < 0 OR effective_selling_price_amount < 0'
  - name: gold_price_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The associate price surface must report one currency, and a priced row with no currency
      is unauditable. Mirrors wsr_cost_single_currency: filter to price-bearing rows, then fail on multi-currency
      or a missing currency.'
    query: "SELECT 'gold_associate_price_promotion_current' AS table_name,\n       COUNT(DISTINCT currency_code)\
      \ AS currencies\nFROM ai_assisted_store_associates.gold_associate_price_promotion_current\nWHERE\
      \ base_price_amount IS NOT NULL OR effective_selling_price_amount IS NOT NULL\nHAVING COUNT(DISTINCT\
      \ currency_code) > 1\n    OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) > 0"
  - name: gold_price_customer_eligibility_safe
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_price_customer_eligibility_safe
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_price_promotion_current

      WHERE customer_eligibility_status <> ''CUSTOMER_ELIGIBILITY_REQUIRES_AUTHORIZED_CONTEXT'''
