  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: sku
    logicalType: string
    physicalType: STRING
  - name: gtin
    logicalType: string
    physicalType: STRING
  - name: product_name
    logicalType: string
    physicalType: STRING
