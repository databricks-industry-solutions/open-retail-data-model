- name: mv_associate_lookup_audit_metrics
  physicalName: ai_assisted_store_associates.mv_associate_lookup_audit_metrics
  physicalType: view
  description: Associate lookup authorization and reliability metrics from the audit trail.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: capability
    logicalType: string
    businessName: Capability
    customProperties:
    - property: synonyms
      value:
      - lookup_type
      - intent
    description: Which lookup the associate invoked (inventory, price/promotion, order status, operational
      context).
  - name: access_decision
    logicalType: string
    businessName: Access Decision
    customProperties:
    - property: synonyms
      value:
      - auth_decision
      - allow_deny
    description: Whether the policy layer allowed or denied the lookup.
  - name: access_reason_code
    logicalType: string
    businessName: Reason Code
    customProperties:
    - property: synonyms
      value:
      - deny_reason
      - policy_reason
    description: Policy reason accompanying the decision — why a lookup was denied or narrowed.
  - name: response_status
    logicalType: string
    businessName: Response Status
    customProperties:
    - property: synonyms
      value:
      - lookup_status
    description: Outcome of the served lookup (e.g. OK, PARTIAL_RESULT), independent of the access decision.
  - name: associate_role
    logicalType: string
    businessName: Associate Role
    customProperties:
    - property: synonyms
      value:
      - role
    description: Role of the requesting associate, for role-scoped access review.
  - name: store_id
    logicalType: string
    businessName: Store ID
    customProperties:
    - property: synonyms
      value:
      - location_id
    description: Durable store business key the lookup was scoped to.
  - name: channel
    logicalType: string
    businessName: Channel
    customProperties:
    - property: synonyms
      value:
      - request_channel
    description: Client channel the request arrived on (handheld, kiosk, desktop).
  - name: lookup_count
    logicalType: integer
    businessName: Lookup Count
    customProperties:
    - property: synonyms
      value:
      - request_count
    description: Total audited lookups in the selection.
  - name: denied_count
    logicalType: integer
    businessName: Denied Lookups
    customProperties:
    - property: synonyms
      value:
      - access_denied_count
    description: Lookups the policy layer denied — the access-review numerator.
  - name: avg_latency_ms
    logicalType: number
    businessName: Avg Latency (ms)
    customProperties:
    - property: synonyms
      value:
      - mean_latency
    description: Mean end-to-end lookup latency in milliseconds, against the real-time serving target.
  - name: partial_result_count
    logicalType: integer
    businessName: Partial Results
    customProperties:
    - property: synonyms
      value:
      - partial_count
    description: Lookups served with a partial result, typically store-scope narrowing.
- name: mv_associate_lookup_freshness
  physicalName: ai_assisted_store_associates.mv_associate_lookup_freshness
  physicalType: view
  description: Associate Real-Time Data Access feed freshness. Tracks lag and SLA state by feed and store.
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: feed_name
    logicalType: string
    businessName: Feed Name
    customProperties:
    - property: synonyms
      value:
      - data_source
      - pipeline
      - domain_feed
    description: Associate context feed being monitored.
  - name: store_id
    logicalType: string
    businessName: Store ID
    customProperties:
    - property: synonyms
      value:
      - location_id
      - store
    description: Store scope for the freshness observation.
  - name: freshness_status
    logicalType: string
    businessName: Freshness Status
    customProperties:
    - property: synonyms
      value:
      - feed_status
      - staleness_status
    description: fresh (<60 min), delayed (60-1440 min), stale (>1440 min).
  - name: sla_state
    logicalType: string
    businessName: SLA State
    customProperties:
    - property: synonyms
      value:
      - sla_status
      - threshold_state
    description: within_sla or breach relative to the 60-minute associate lookup objective.
  - name: freshness_lag_minutes
    logicalType: number
    businessName: Freshness Lag (Minutes)
    customProperties:
    - property: synonyms
      value:
      - lag_minutes
      - age_minutes
    description: Minutes since last successful ingest for the feed.
  - name: event_count
    logicalType: integer
    businessName: Event Count
    customProperties:
    - property: synonyms
      value:
      - row_count
      - volume
    description: Rows contributing to the freshness observation.
  - name: stale_feed_count
    logicalType: integer
    businessName: Stale Feeds
    customProperties:
    - property: synonyms
      value:
      - stale_count
    description: Feeds with lag over 24 hours.
  - name: sla_breach_count
    logicalType: integer
    businessName: SLA Breaches
    customProperties:
    - property: synonyms
      value:
      - breach_count
      - sla_violations
    description: Feeds exceeding the 60-minute associate freshness objective.
