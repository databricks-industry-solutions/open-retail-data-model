    logicalType: string
    physicalType: STRING
  - name: active_promo_type
    logicalType: string
    physicalType: STRING
  - name: promo_start_date
    logicalType: date
    physicalType: DATE
  - name: promo_end_date
    logicalType: date
    physicalType: DATE
  - name: store_channel_eligibility
    logicalType: string
    physicalType: STRING
  - name: customer_eligibility_status
    logicalType: string
    physicalType: STRING
    description: Always CUSTOMER_ELIGIBILITY_REQUIRES_AUTHORIZED_CONTEXT for associate gold.
  - name: source_event_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
  - name: source_ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
