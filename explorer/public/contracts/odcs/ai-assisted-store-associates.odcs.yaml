    description: afs_order_id_unique
    query: 'SELECT order_id

      FROM ai_assisted_store_associates.associate_fulfillment_status

      GROUP BY order_id

      HAVING COUNT(*) > 1'
  - name: afs_required_ids
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: afs_required_ids
    query: "SELECT * FROM ai_assisted_store_associates.associate_fulfillment_status\nWHERE associate_fulfillment_status_id\
      \ IS NULL\n   OR order_id IS NULL\n   OR store_id IS NULL\n   OR fulfillment_type IS NULL\n   OR\
      \ order_status IS NULL\n   OR pickup_readiness IS NULL"
  - name: afs_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: afs_store_fk_orphan
    query: "SELECT a.*\nFROM ai_assisted_store_associates.associate_fulfillment_status a\nLEFT JOIN store.store\
      \ s\n  ON a.store_sk = s.store_sk\nWHERE a.store_sk IS NOT NULL AND s.store_sk IS NULL"
  - name: afs_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: afs_rowcount
    query: SELECT COUNT(*) AS afs_rows FROM ai_assisted_store_associates.associate_fulfillment_status
- name: associate_lookup_audit
  physicalName: ai_assisted_store_associates.associate_lookup_audit
  physicalType: table
  description: Associate lookup audit trail. Allow/deny, capability, latency, hashed keys only — no customer
    PII or raw search terms.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: associate_lookup_audit_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: associate_lookup_audit_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the audit event.
  - name: request_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Caller-supplied request identifier.
  - name: correlation_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Cross-system correlation identifier.
  - name: request_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the lookup was requested (UTC, ISO 8601).
  - name: generated_at
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the audit row was written (UTC, ISO 8601).
  - name: associate_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Pseudonymous associate / session identifier. Not a legal name.
  - name: associate_role
    logicalType: string
    physicalType: STRING
    required: false
    description: Requester role code (e.g. sales_associate, fulfillment, supervisor, store_manager).
  - name: channel
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Request channel. Allowed values: mobile, kiosk, pos, dashboard, api, test.'
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Store scope asserted on the request.
  - name: capability
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Requested capability. Allowed values: get_product_availability, get_product_location,
      get_price_and_promotions, get_order_fulfillment_status, get_store_operations_context, get_associate_context_summary.'
  - name: access_decision
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Authorization outcome. Allowed values: allow, deny.'
  - name: access_reason_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Machine-readable reason for the access decision.
  - name: response_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Envelope status returned to the caller. Allowed values: SUCCESS, NOT_FOUND, NOT_AVAILABLE,
      STALE_DATA, ACCESS_DENIED, INVALID_REQUEST, PARTIAL_RESULT, UPSTREAM_DATA_DELAY.'
  - name: latency_ms
    logicalType: integer
    physicalType: INT
    required: false
    description: End-to-end lookup latency in milliseconds.
  - name: domains_accessed
    logicalType: string
    physicalType: STRING
    required: false
    description: Comma-separated domain tags actually read (inventory,price,promotion,order,operations).
  - name: data_classification
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Highest classification of returned fields. Allowed values: public_ops, associate_ops,
      restricted.'
  - name: product_id_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: SHA-256 hex of product_id when product-scoped; NULL otherwise. Never store raw search
      text.
  - name: order_id_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: SHA-256 hex of order_id when order-scoped; NULL otherwise.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating lookup service label.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: ala_audit_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ala_audit_id_unique
    query: 'SELECT associate_lookup_audit_id

      FROM ai_assisted_store_associates.associate_lookup_audit

      GROUP BY associate_lookup_audit_id

      HAVING COUNT(*) > 1'
  - name: ala_decision_has_reason
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ala_decision_has_reason
    query: 'SELECT * FROM ai_assisted_store_associates.associate_lookup_audit

      WHERE access_decision IS NULL OR access_reason_code IS NULL OR access_reason_code = '''''
  - name: ala_correlation_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ala_correlation_present
    query: 'SELECT * FROM ai_assisted_store_associates.associate_lookup_audit

      WHERE correlation_id IS NULL OR request_id IS NULL OR request_timestamp IS NULL'
  - name: ala_latency_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ala_latency_nonneg
    query: 'SELECT * FROM ai_assisted_store_associates.associate_lookup_audit

      WHERE latency_ms IS NOT NULL AND latency_ms < 0'
  - name: ala_denied_count
    type: sql
    dimension: accuracy
    severity: info
    description: ala_denied_count
    query: 'SELECT COUNT(*) AS denied_lookups

      FROM ai_assisted_store_associates.associate_lookup_audit

      WHERE access_decision = ''deny'''
  - name: ala_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: ala_rowcount
    query: SELECT COUNT(*) AS ala_rows FROM ai_assisted_store_associates.associate_lookup_audit
- name: outcome_resolution
  physicalName: ai_assisted_store_associates.outcome_resolution
  physicalType: table
  description: ORDM AI-Assisted Store Associates — append-only real-world outcome of a suggested action
    (sale, restock, resolution) for ROI and model training. Adopter-owned; schema + DQ contract.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: outcome_resolution_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per resolution.
  - name: outcome_resolution_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the resolution.
  - name: suggested_action_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to suggested_action.suggested_action_sk — the action resolved.
    relationships:
    - to: suggested_action.suggested_action_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: ai_assisted_store_associates
      - property: enforced
        value: false
  - name: suggested_action_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable action business key.
  - name: resolution_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the real-world outcome was recorded (UTC, ISO 8601).
  - name: outcome_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'What happened. Allowed values: sale_closed, item_restocked, customer_assisted, issue_resolved,
      task_abandoned, no_outcome.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: sale_closed, item_restocked, customer_assisted, issue_resolved, task_abandoned,
        no_outcome.'
  - name: outcome_value_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Realized monetary value attributable to the action (e.g. closed-sale amount), in currency_code.
      NULL for non-monetary outcomes.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (outcome_value_amount IS NULL OR outcome_value_amount >= 0).
    - type: text
      dimension: validity
      severity: error
      description: CHECK ((outcome_value_amount IS NULL AND currency_code IS NULL) OR (outcome_value_amount
        IS NOT NULL AND currency_code IS NOT NULL)).
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: ISO 4217 currency of outcome_value_amount. Required whenever outcome_value_amount is
      present (paired by CHECK).
  - name: units_affected
    logicalType: integer
    physicalType: INT
    required: false
    description: Non-monetary outcome magnitude where it applies, e.g. units restocked. NULL when not
      applicable.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (units_affected IS NULL OR units_affected >= 0).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: or_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: or_grain_unique
    query: SELECT outcome_resolution_id, COUNT(*) AS n FROM ai_assisted_store_associates.outcome_resolution
      GROUP BY outcome_resolution_id HAVING COUNT(*) > 1
  - name: or_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: or_keys_not_null
    query: SELECT * FROM ai_assisted_store_associates.outcome_resolution WHERE outcome_resolution_sk IS
      NULL OR outcome_resolution_id IS NULL OR suggested_action_sk IS NULL OR suggested_action_id IS NULL
      OR resolution_timestamp IS NULL OR outcome_type IS NULL
  - name: or_action_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: or_action_fk_orphan
    query: SELECT o.* FROM ai_assisted_store_associates.outcome_resolution o LEFT JOIN ai_assisted_store_associates.suggested_action
      a ON o.suggested_action_sk = a.suggested_action_sk WHERE a.suggested_action_sk IS NULL
  - name: or_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: or_single_currency
    query: SELECT COUNT(DISTINCT currency_code) AS currencies FROM ai_assisted_store_associates.outcome_resolution
      WHERE currency_code IS NOT NULL HAVING COUNT(DISTINCT currency_code) > 1
  - name: or_amount_currency_pair
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: or_amount_currency_pair
    query: SELECT * FROM ai_assisted_store_associates.outcome_resolution WHERE (outcome_value_amount IS
      NULL) <> (currency_code IS NULL)
- name: suggested_action
  physicalName: ai_assisted_store_associates.suggested_action
  physicalType: table
  description: ORDM AI-Assisted Store Associates — append-only record of each generated Next Best Action
    routed to an associate (lifecycle derived from action_response_log). Adopter-owned; schema + DQ contract.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: suggested_action_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per generated action.
  - name: suggested_action_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the action. Stable; joined by the response log and outcome.
  - name: generated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the engine generated/dispatched the action (UTC, ISO 8601). The business event time
      and the decay origin.
  - name: associate_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to associate.associate_sk — the routed associate (version at dispatch). NULL when
      the action was generated but not yet routed.
    relationships:
    - to: associate.associate_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: ai_assisted_store_associates
      - property: enforced
        value: false
  - name: associate_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable associate business key. The SCD2-safe join/aggregation key. NULL while unrouted.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk (version current at dispatch).
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable zone id of the action's target location. LOGICAL reference to connected-store-signals.store_zone.store_zone_id
      (not a hard cross-package FK; deploy-order independent).
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk — the customer the action concerns. NULL for customer-agnostic
      tasks (restock, cleaning).
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable, pseudonymous customer business key. NULL for customer-agnostic tasks.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product.product_sk — the product the action concerns. NULL when not product-specific.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key. NULL when not product-specific.
  - name: action_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'The task class. Allowed values: customer_assist, restock_shelf, bopis_fulfill, safety_loss_prevention,
      maintenance_cleaning, price_check, queue_bust, clienteling.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: customer_assist, restock_shelf, bopis_fulfill, safety_loss_prevention,
        maintenance_cleaning, price_check, queue_bust, clienteling.'
  - name: trigger_source
    logicalType: string
    physicalType: STRING
    required: false
    description: 'What fired the action. Allowed values: ble_beacon_dwell, pos_inventory_decrement, order_management_system,
      sensor_event, digital_interaction, schedule, manual.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: ble_beacon_dwell, pos_inventory_decrement, order_management_system,
        sensor_event, digital_interaction, schedule, manual.'
  - name: base_score
    logicalType: integer
    physicalType: INT
    required: false
    description: Hierarchy-of-needs base score in [0,100] before dynamic multipliers/decay (e.g. safety_loss_prevention
      90, bopis_fulfill 75, customer_assist 60, restock_shelf 40, maintenance_cleaning 20). See glossary.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (base_score IS NULL OR base_score BETWEEN 0 AND 100).
  - name: priority_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Dynamic Business Value Score in [0,100] AT GENERATION (base_score x context multipliers),
      before time decay. The gold queue view applies decay_type from generated_timestamp to derive the
      current, rank-on score. Non-monetary.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (priority_score IS NULL OR priority_score >= 0).
  - name: decay_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Relevance-decay curve the queue view applies to priority_score. Allowed values: linear,
      exponential, immediate_nullification, none. See glossary.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: linear, exponential, immediate_nullification, none.'
  - name: context_payload
    logicalType: string
    physicalType: STRING
    required: false
    description: Schemaless JSON payload the associate app renders (location, customer_context, product_context,
      suggested_dialogue, ...). Stored as a JSON string so new task types need no schema migration; common
      shapes are documented in glossary.md.
  - name: expiration_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the action becomes stale/un-actionable (UTC). NULL for tasks that persist until
      completed. The queue view drops actions past this instant.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (expiration_timestamp IS NULL OR expiration_timestamp >= generated_timestamp).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: sa_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_grain_unique
    query: SELECT suggested_action_id, COUNT(*) AS n FROM ai_assisted_store_associates.suggested_action
      GROUP BY suggested_action_id HAVING COUNT(*) > 1
  - name: sa_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_keys_not_null
    query: SELECT * FROM ai_assisted_store_associates.suggested_action WHERE suggested_action_sk IS NULL
      OR suggested_action_id IS NULL OR generated_timestamp IS NULL OR action_type IS NULL
  - name: sa_associate_key_pair
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_associate_key_pair
    query: SELECT * FROM ai_assisted_store_associates.suggested_action WHERE (associate_sk IS NULL) <>
      (associate_id IS NULL)
  - name: sa_associate_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_associate_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN ai_assisted_store_associates.associate
      a ON f.associate_sk = a.associate_sk WHERE f.associate_sk IS NOT NULL AND a.associate_sk IS NULL
  - name: sa_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_store_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN store.store s ON
      f.store_sk = s.store_sk WHERE f.store_sk IS NOT NULL AND s.store_sk IS NULL
  - name: sa_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_profile_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN customer.profile
      p ON f.profile_sk = p.profile_sk WHERE f.profile_sk IS NOT NULL AND p.profile_sk IS NULL
  - name: sa_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sa_product_fk_orphan
    query: SELECT f.* FROM ai_assisted_store_associates.suggested_action f LEFT JOIN product.product p
      ON f.product_sk = p.product_sk WHERE f.product_sk IS NOT NULL AND p.product_sk IS NULL
  - name: sa_actioned_requires_associate
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: sa_actioned_requires_associate
    query: 'SELECT a.suggested_action_id

      FROM ai_assisted_store_associates.suggested_action a

      JOIN ai_assisted_store_associates.action_response_log r ON a.suggested_action_sk = r.suggested_action_sk

      WHERE r.response_type IN (''accepted'', ''completed'') AND a.associate_sk IS NULL'
  - name: sa_zone_coverage
    type: sql
    dimension: accuracy
    severity: info
    description: sa_zone_coverage
    query: "SELECT store_id,\n       COUNT(*) AS actions,\n       SUM(CASE WHEN store_zone_id IS NOT NULL\
      \ THEN 1 ELSE 0 END) AS actions_with_zone\nFROM ai_assisted_store_associates.suggested_action\n\
      GROUP BY store_id"
- name: gold_action_outcome_funnel_daily
  physicalName: ai_assisted_store_associates.gold_action_outcome_funnel_daily
  physicalType: view
  description: 'The Next Best Action feedback funnel, one row per store x zone x associate x trading date
    x action_type: how many actions were generated, accepted, rejected, completed and expired, the acceptance/completion
    rates, average time-to-first-response, and the realized monetary outcome. This is the optimization
    surface — it turns the response and outcome logs into the ROI signal and the labeled history for future
    models.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable target-zone id (logical reference to connected-store-signals.store_zone). NULL
      when the actions had no target zone; the grain that exposes the per-zone staffing signal.
  - name: associate_id
    logicalType: string
    physicalType: STRING
    description: Durable associate business key the actions were routed to. NULL for unrouted actions;
      the grain for per-associate effectiveness.
  - name: trading_date
    logicalType: date
    physicalType: DATE
    description: Business date the actions were generated.
  - name: action_type
    logicalType: string
    physicalType: STRING
    description: Task class of the actions in the row.
  - name: actions_generated
    logicalType: integer
    physicalType: BIGINT
    description: Count of actions generated in the cell.
  - name: actions_accepted
    logicalType: integer
    physicalType: BIGINT
    description: Actions with an accepted response (from action_response_log).
  - name: actions_rejected
    logicalType: integer
    physicalType: BIGINT
    description: Actions with a rejected response (from action_response_log).
  - name: actions_completed
    logicalType: integer
    physicalType: BIGINT
    description: Actions with a completed response (from action_response_log).
  - name: actions_expired
    logicalType: integer
    physicalType: BIGINT
    description: Actions with an expired response (from action_response_log).
  - name: acceptance_rate
    logicalType: number
    physicalType: DOUBLE
    description: actions_accepted / actions_generated for the cell (ratio-of-sums-safe components are
      also exposed).
  - name: completion_rate
    logicalType: number
    physicalType: DOUBLE
    description: actions_completed / actions_generated for the cell.
  - name: avg_response_seconds
    logicalType: number
    physicalType: DOUBLE
    description: Mean seconds from dispatch to first response for the cell (display convenience; re-aggregate
      via response_seconds_total / responses_timed).
  - name: response_seconds_total
    description: Sum of dispatch-to-first-response seconds; the additive numerator for average response
      time.
  - name: responses_timed
    logicalType: integer
    physicalType: BIGINT
    description: Count of actions that received a first response; the additive denominator for average
      response time.
  - name: sales_closed
    logicalType: integer
    physicalType: BIGINT
    description: Count of actions resolved as a closed sale.
  - name: realized_outcome_value
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Sum of monetary outcomes attributed to the actions (in outcome_currency_code).
  - name: outcome_currency_code
    logicalType: string
    physicalType: STRING
    description: ISO 4217 currency of realized_outcome_value (single reporting currency; see or_single_currency).
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
  quality:
  - name: gold_funnel_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_funnel_grain_unique
    query: 'SELECT store_id, store_zone_id, associate_id, trading_date, action_type, COUNT(*) AS n

      FROM ai_assisted_store_associates.gold_action_outcome_funnel_daily

      GROUP BY store_id, store_zone_id, associate_id, trading_date, action_type

      HAVING COUNT(*) > 1'
  - name: gold_funnel_actions_positive
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_funnel_actions_positive
    query: 'SELECT * FROM ai_assisted_store_associates.gold_action_outcome_funnel_daily

      WHERE actions_generated <= 0'
  - name: gold_funnel_action_counts_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_funnel_action_counts_nonneg
    query: "SELECT * FROM ai_assisted_store_associates.gold_action_outcome_funnel_daily\nWHERE actions_accepted\
      \ < 0\n   OR actions_rejected < 0\n   OR actions_completed < 0\n   OR actions_expired < 0"
  - name: gold_funnel_rate_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_funnel_rate_bounds
    query: "SELECT * FROM ai_assisted_store_associates.gold_action_outcome_funnel_daily\nWHERE (acceptance_rate\
      \ IS NOT NULL AND (acceptance_rate < 0 OR acceptance_rate > 1))\n   OR (completion_rate IS NOT NULL\
      \ AND (completion_rate < 0 OR completion_rate > 1))"
  - name: gold_funnel_action_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_funnel_action_type_domain
    query: 'SELECT * FROM ai_assisted_store_associates.gold_action_outcome_funnel_daily

      WHERE action_type NOT IN (''customer_assist'', ''restock_shelf'', ''bopis_fulfill'', ''safety_loss_prevention'',
      ''maintenance_cleaning'', ''price_check'', ''queue_bust'', ''clienteling'')'
  - name: gold_funnel_trading_date_present
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_funnel_trading_date_present
    query: 'SELECT * FROM ai_assisted_store_associates.gold_action_outcome_funnel_daily

      WHERE trading_date IS NULL'
  - name: gold_funnel_outcome_currency_pair
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A non-zero realized value must carry its currency. The view sums outcome values with
      COALESCE(..., 0), so a day with no monetary outcome is 0 with a NULL currency (allowed).
    query: 'SELECT * FROM ai_assisted_store_associates.gold_action_outcome_funnel_daily

      WHERE realized_outcome_value <> 0 AND outcome_currency_code IS NULL'
- name: gold_associate_action_queue_current
  physicalName: ai_assisted_store_associates.gold_associate_action_queue_current
  physicalType: view
  description: 'The live prioritized Next Best Action queue an associate sees: one row per OPEN, non-expired
    suggested action, ranked within each associate by the time-decayed Business Value Score. This is the
    "Associates Best Next Actions" serving surface.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/ai-assisted-store-associates/README.md
    type: businessDefinition
  - url: outcome-packages/ai-assisted-store-associates/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: associate_id
    logicalType: string
    physicalType: STRING
    description: Durable associate business key the queue belongs to.
  - name: associate_role
    logicalType: string
    physicalType: STRING
    description: Associate job role (from the associate version at dispatch).
  - name: associate_skill_tags
    logicalType: string
    physicalType: STRING
    description: Associate capability tags (pipe-delimited) used for skill matching.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_zone_id
    logicalType: string
    physicalType: STRING
    description: Durable target-zone id (logical reference to connected-store-signals.store_zone).
  - name: suggested_action_id
    logicalType: string
    physicalType: STRING
    description: Durable action business key.
  - name: action_type
    logicalType: string
    physicalType: STRING
    description: 'Task class: customer_assist, restock_shelf, bopis_fulfill, safety_loss_prevention, maintenance_cleaning,
      price_check, queue_bust, clienteling.'
  - name: trigger_source
    logicalType: string
    physicalType: STRING
    description: What fired the action (ble_beacon_dwell, pos_inventory_decrement, order_management_system,
      sensor_event, digital_interaction, schedule, manual).
  - name: base_score
    logicalType: integer
    physicalType: INT
    description: Hierarchy-of-needs base score in [0,100] before dynamic multipliers/decay.
  - name: priority_score
    logicalType: number
    physicalType: DOUBLE
    description: Business Value Score at generation (before time decay), in [0,100].
  - name: current_priority_score
    logicalType: number
    physicalType: DOUBLE
    description: Time-decayed Business Value Score the queue is ranked on, derived in-view from priority_score
      and decay_type since generated_timestamp.
  - name: decay_type
    logicalType: string
    physicalType: STRING
    description: 'Relevance-decay curve applied to priority_score: linear, exponential, immediate_nullification,
      none.'
  - name: current_state
    description: 'Derived lifecycle state (open states only appear here): pending, or the latest non-terminal
      response (accepted / deferred / reassigned). Sourced from action_response_log, not a stored status.'
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer key the action concerns; NULL for customer-agnostic tasks.
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product key the action concerns; NULL when not product-specific.
  - name: generated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the action was generated/dispatched (UTC).
  - name: expiration_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the action becomes stale; NULL for persistent tasks.
  - name: minutes_to_expiry
    logicalType: number
    physicalType: DOUBLE
    description: Minutes remaining until expiration at view evaluation time; NULL for persistent tasks.
  - name: queue_rank
    logicalType: integer
    physicalType: BIGINT
    description: Rank of the action within the associate's open queue (1 = highest priority_score).
  - name: context_payload
    logicalType: string
    physicalType: STRING
    description: Schemaless JSON payload the associate app renders (location, customer/product context,
      suggested dialogue).
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
  quality:
  - name: gold_queue_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_queue_grain_unique
    query: 'SELECT suggested_action_id, COUNT(*) AS n

      FROM ai_assisted_store_associates.gold_associate_action_queue_current

      GROUP BY suggested_action_id

      HAVING COUNT(*) > 1'
  - name: gold_queue_rank_valid
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_queue_rank_valid
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_action_queue_current

      WHERE queue_rank < 1'
  - name: gold_queue_action_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_queue_action_type_domain
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_action_queue_current

      WHERE action_type NOT IN (''customer_assist'', ''restock_shelf'', ''bopis_fulfill'', ''safety_loss_prevention'',
      ''maintenance_cleaning'', ''price_check'', ''queue_bust'', ''clienteling'')'
  - name: gold_queue_current_state_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_queue_current_state_domain
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_action_queue_current

      WHERE current_state NOT IN (''pending'', ''accepted'', ''rejected'', ''deferred'', ''completed'',
      ''expired'', ''reassigned'')'
  - name: gold_queue_priority_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_queue_priority_nonneg
    query: 'SELECT * FROM ai_assisted_store_associates.gold_associate_action_queue_current

      WHERE base_score < 0 OR priority_score < 0 OR current_priority_score < 0'
