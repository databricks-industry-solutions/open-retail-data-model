  tags:
  - transactional
  authoritativeDefinitions:
  - url: canonical-core/interaction/README.md
    type: businessDefinition
  - url: canonical-core/interaction/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: touchpoint_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per interaction row.
  - name: touchpoint_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the interaction, unique at row grain.
  - name: device_id_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Hashed/tokenized device/cookie/app identifier — the anonymous digital actor key. Never
      a raw device id, cookie, or IP (PII, pseudonymized). NULL for offline touches (identity-first).
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: session_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Session/visit grouping key for sessionization (degenerate attribute; vendor-neutral,
      no PII). NULL for touches with no session (e.g. a single call-center contact).
  - name: identity_link_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.identity_link.identity_link_sk — the assertion that stitched this device/actor
      to a profile, if resolved.
    relationships:
    - to: identity_link.identity_link_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: identity_link_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable identity-link business key.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk (resolved as-of event_date), if the touch is stitched
      to a known customer.
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Durable customer business key (pseudonymous; NULL while the touch is anonymous). Resolved
      AT INGEST: this fact is append-only, so a touch that was anonymous when written stays profile_id=NULL
      even after the device is later stitched - late resolution is re-derived at query time by joining
      device_id_hash through customer.identity_link (touchpoint_resolved_rate is therefore an at-ingest
      rate, not lifetime).'
  - name: interaction_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'The kind of touch. Digital: page_view, product_view, search, add_to_cart, remove_from_cart,
      cart_view, checkout_start, wishlist_add, app_open, session_start, session_end. Offline: store_visit,
      call_center_contact, kiosk_session, offline_marketing_response, phone_activation.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: page_view, product_view, search, add_to_cart, remove_from_cart, cart_view,
        checkout_start, wishlist_add, app_open, session_start, session_end, store_visit, call_center_contact,
        kiosk_session, offline_marketing_response, phone_activation.'
  - name: channel_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Channel the touch occurred on (omnichannel discriminator). The coarse MEDIUM. Allowed
      values: web, mobile_app, in_store, kiosk, call_center, direct_mail, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: web, mobile_app, in_store, kiosk, call_center, direct_mail, other.'
  - name: source_application
    logicalType: string
    physicalType: STRING
    required: false
    description: 'The specific application / property / data stream the touch came from (degenerate attribute;
      vendor-neutral, no PII). The SOURCE that pairs with channel_code (the medium), mirroring how a CDP
      pairs channel with source/data-stream on each event. Allowed values: ios_app, android_app, web_desktop,
      web_mobile, loyalty_kiosk, in_store_pos, call_center_app, email_platform, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: ios_app, android_app, web_desktop, web_mobile, loyalty_kiosk, in_store_pos,
        call_center_app, email_platform, other.'
  - name: touch_origin
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Whether the touch is customer-initiated or brand-initiated. Allowed values: inbound,
      outbound.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: inbound, outbound.'
  - name: event_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the touch occurred at source (UTC, ISO 8601).
  - name: event_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the touch (cluster key). This IS the date_key-role natural key (the
      same calendar-join role sales.date_key plays), joined to fiscal_calendar.date_key (ISO 8601); it
      is named event_date for event semantics (ADR 0011 permits role-named stems). Guarded by the touchpoint_calendar_coverage
      DQ check. No surrogate FK, matching the sales convention.
  - name: ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this touch was ingested into the lakehouse (UTC, ISO 8601).
  - name: latency_seconds
    logicalType: integer
    physicalType: INT
    required: false
    description: Seconds between event_timestamp and ingest_timestamp (freshness monitoring).
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk (version as-of event_date) — set for product_view / cart touches.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk — in-store / kiosk / store-visit context, or the fulfilling store.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable store business key.
  - name: page_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Page/screen class for digital touches. Allowed values: home, category, product, search,
      cart, checkout, account, content, other.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: home, category, product, search, cart, checkout, account, content,
        other.'
  - name: page_url
    logicalType: string
    physicalType: STRING
    required: false
    description: 'De-identified/normalized page path (source contract: no PII, no PII-bearing query params).
      NULL for offline touches.'
  - name: referrer_url
    logicalType: string
    physicalType: STRING
    required: false
    description: 'De-identified/normalized referrer path (source contract: no PII).'
  - name: search_term_text
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Shopper search query for search touches (degenerate attribute; vendor-neutral; source
      contract: de-identified, no PII - a shopper may type a name/email, so ingest must scrub).'
  - name: dwell_seconds
    logicalType: integer
    physicalType: INT
    required: false
    description: 'Engagement depth: seconds spent on the touch, if known. CROSS-MODAL by interaction_type
      - page dwell (digital), call duration (call_center), or visit length (store_visit) - so these are
      NOT the same unit of comparability. A consumer averaging dwell across interaction_type blends incomparable
      durations; restrict to one modality (e.g. digital page_view/product_view) for a comparable engagement
      metric. NULL if not captured.'
  - name: cart_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Cart correlation key linking cart touches within a shopping journey (degenerate; no FK).
  - name: order_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Order correlation key when a checkout touch converts (degenerate business key to the
      order; no surrogate FK, header-grain).
  - name: event_value_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Monetary value the touch carries, if any (e.g. cart value), in the reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Reporting/base currency of event_value_amount, ISO 4217 alpha-3 (single-currency by construction).
  - name: consent_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Consent state at touch time. Allowed values: granted, denied, unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: granted, denied, unknown.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: touchpoint_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_keys_not_null
    query: "SELECT * FROM interaction.touchpoint\nWHERE touchpoint_sk IS NULL OR touchpoint_id IS NULL\n\
      \   OR interaction_type IS NULL OR event_timestamp IS NULL OR event_date IS NULL"
  - name: touchpoint_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_id_unique
    query: 'SELECT touchpoint_id, COUNT(*) AS n

      FROM interaction.touchpoint

      GROUP BY touchpoint_id HAVING COUNT(*) > 1'
  - name: touchpoint_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_pk_unique
    query: 'SELECT touchpoint_sk, COUNT(*) AS n

      FROM interaction.touchpoint

      GROUP BY touchpoint_sk HAVING COUNT(*) > 1'
  - name: touchpoint_interaction_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_interaction_type_domain
    query: "SELECT * FROM interaction.touchpoint\nWHERE interaction_type NOT IN ('page_view', 'product_view',\
      \ 'search', 'add_to_cart',\n  'remove_from_cart', 'cart_view', 'checkout_start', 'wishlist_add',\
      \ 'app_open',\n  'session_start', 'session_end', 'store_visit', 'call_center_contact', 'kiosk_session',\n\
      \  'offline_marketing_response', 'phone_activation')"
  - name: touchpoint_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_channel_domain
    query: "SELECT * FROM interaction.touchpoint\nWHERE channel_code IS NOT NULL\n  AND channel_code NOT\
      \ IN ('web', 'mobile_app', 'in_store', 'kiosk', 'call_center',\n                           'direct_mail',\
      \ 'other')"
  - name: touchpoint_source_application_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_source_application_domain
    query: "SELECT * FROM interaction.touchpoint\nWHERE source_application IS NOT NULL\n  AND source_application\
      \ NOT IN ('ios_app', 'android_app', 'web_desktop', 'web_mobile',\n                             \
      \    'loyalty_kiosk', 'in_store_pos', 'call_center_app',\n                                 'email_platform',\
      \ 'other')"
  - name: touchpoint_consent_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_consent_domain
    query: "SELECT * FROM interaction.touchpoint\nWHERE consent_status IS NOT NULL\n  AND consent_status\
      \ NOT IN ('granted', 'denied', 'unknown')"
  - name: touchpoint_modality_coherence
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The omnichannel design rests on interaction_type + channel_code agreeing; the per-column
      domain checks validate each independently but never assert they are CONSISTENT. This guards the
      discriminator (M2): (a) an OFFLINE interaction_type must carry an offline channel_code, a NULL device_id_hash,
      AND a non-NULL profile_id (offline is identity-first — profile known, no anonymous device key, so
      a person-level offline touch with no actor at all is invalid); (b) a DIGITAL interaction_type must
      carry a digital channel_code; (c) an in-store verb (store_visit / kiosk_session) must populate store_sk.
      NULLs are otherwise tolerated (channel_code is nullable); this fires only on an explicit contradiction
      CI cannot catch (cross-column semantics).'
    query: "SELECT * FROM interaction.touchpoint\nWHERE\n  -- (a) offline verb on a digital channel, carrying\
      \ an anonymous device key, or with no actor\n  ( interaction_type IN ('store_visit', 'call_center_contact',\
      \ 'kiosk_session',\n                         'offline_marketing_response', 'phone_activation')\n\
      \    AND ( channel_code IN ('web', 'mobile_app')\n          OR device_id_hash IS NOT NULL\n    \
      \      OR profile_id IS NULL ) )\n  -- (b) digital verb on an offline channel\n  OR ( interaction_type\
      \ IN ('page_view', 'product_view', 'search', 'add_to_cart',\n                            'remove_from_cart',\
      \ 'cart_view', 'checkout_start', 'wishlist_add',\n                            'app_open', 'session_start',\
      \ 'session_end')\n       AND channel_code IN ('in_store', 'kiosk', 'call_center', 'direct_mail')\
      \ )\n  -- (c) in-store verb with no store context\n  OR ( interaction_type IN ('store_visit', 'kiosk_session')\
      \ AND store_sk IS NULL )"
  - name: touchpoint_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: When resolved, the profile surrogate FK must reference an existing profile.
    query: 'SELECT t.* FROM interaction.touchpoint t

      LEFT JOIN customer.profile p ON t.profile_sk = p.profile_sk

      WHERE t.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: touchpoint_identity_link_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_identity_link_fk_orphan
    query: 'SELECT t.* FROM interaction.touchpoint t

      LEFT JOIN customer.identity_link il ON t.identity_link_sk = il.identity_link_sk

      WHERE t.identity_link_sk IS NOT NULL AND il.identity_link_sk IS NULL'
  - name: touchpoint_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_product_fk_orphan
    query: 'SELECT t.* FROM interaction.touchpoint t

      LEFT JOIN product.product pr ON t.product_sk = pr.product_sk

      WHERE t.product_sk IS NOT NULL AND pr.product_sk IS NULL'
  - name: touchpoint_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_store_fk_orphan
    query: 'SELECT t.* FROM interaction.touchpoint t

      LEFT JOIN store.store s ON t.store_sk = s.store_sk

      WHERE t.store_sk IS NOT NULL AND s.store_sk IS NULL'
  - name: touchpoint_calendar_coverage
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Natural date key: every touch date must exist in the fiscal calendar (event_date is
      an un-minted natural key to fiscal_calendar.date_key, the sales.date_key convention, so a DQ check
      is the guard rather than a UC FK).'
    query: 'SELECT t.event_date FROM interaction.touchpoint t

      LEFT JOIN calendar.fiscal_calendar c ON t.event_date = c.date_key

      WHERE c.date_key IS NULL

      GROUP BY t.event_date'
  - name: touchpoint_profile_pairing
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Anonymous-first contract: profile_sk and profile_id are populated together (a stitched
      touch carries its durable customer key; an unresolved touch has both NULL). Neither the surrogate
      nor the durable key may be set without the other.'
    query: 'SELECT * FROM interaction.touchpoint

      WHERE (profile_sk IS NULL) <> (profile_id IS NULL)'
  - name: touchpoint_single_reporting_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Monetary values are normalized to the base currency; currency_code must be constant.
    query: 'SELECT COUNT(DISTINCT currency_code) AS distinct_currencies

      FROM interaction.touchpoint

      HAVING COUNT(DISTINCT currency_code) > 1'
  - name: touchpoint_resolved_needs_profile
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: If an identity link is attached, the resolved profile_id must be populated (a stitched
      touch carries its durable customer key).
    query: 'SELECT * FROM interaction.touchpoint

      WHERE identity_link_sk IS NOT NULL AND profile_id IS NULL'
  - name: touchpoint_latency_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: touchpoint_latency_nonneg
    query: 'SELECT * FROM interaction.touchpoint

      WHERE latency_seconds IS NOT NULL AND latency_seconds < 0'
  - name: touchpoint_dwell_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Engagement depth is a duration, never negative (mirrors touchpoint_latency_nonneg).
    query: 'SELECT * FROM interaction.touchpoint

      WHERE dwell_seconds IS NOT NULL AND dwell_seconds < 0'
  - name: touchpoint_event_date_matches_timestamp
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'event_date is the date_key-role natural key and MUST be the calendar date of event_timestamp;
      the two columns are independent in the DDL, so this hardens the grain (a drift would silently mis-bucket
      a touch onto the wrong fiscal day). SESSION-TZ ROBUST (M1): event_timestamp is a plain TIMESTAMP
      (UTC by construction; the repo uses no TIMESTAMP_NTZ), and CAST(ts AS DATE) resolves in the runner''s
      session timezone, which the DQ runner does not pin. A tolerance of one day absorbs the legitimate
      UTC-vs-session boundary difference for a near-midnight touch, while still catching a real grain
      drift (a generator/pipeline bug mis-dates by weeks/months, never by a single boundary day), so the
      check no longer goes red on correct data in a west-of-UTC deploy.'
    query: 'SELECT * FROM interaction.touchpoint

      WHERE event_timestamp IS NOT NULL AND ABS(DATEDIFF(CAST(event_timestamp AS DATE), event_date)) >
      1'
  - name: touchpoint_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: touchpoint_rowcount
    query: SELECT COUNT(*) AS touchpoint_rows FROM interaction.touchpoint
  - name: touchpoint_resolved_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Share of touches stitched to a known profile (anonymous-first: many rows are unresolved).'
    query: 'SELECT ROUND(AVG(CASE WHEN profile_id IS NOT NULL THEN 1.0 ELSE 0.0 END), 4) AS resolved_rate

      FROM interaction.touchpoint'
