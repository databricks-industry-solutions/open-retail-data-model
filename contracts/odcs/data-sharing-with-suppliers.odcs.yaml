- name: gold_data_monetization_exceptions
  physicalName: data_sharing_with_suppliers.gold_data_monetization_exceptions
  physicalType: view
  description: 'Data-monetization attention queue over gold_data_product_revenue: the licence × period
    rows a commercial owner should act on, ranked by revenue at risk. An exception is raised when a licence
    was paid for and not used (the churn signal), when consumption ran materially beyond the contracted
    allowance (an upsell or an over-run to true up), when a term is about to lapse without renewal, or
    when the effective price per unit diverges materially from the published rate card. Reads only the
    entitled revenue view, so it exposes no row a partner could not already see.'
  tags:
