    description: 'Which side submitted the plan. Allowed values: retailer, supplier.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: retailer, supplier.'
  - name: supplier_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to supplier.supplier_sk.
    relationships:
    - to: supplier.supplier_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: supplier
      - property: enforced
        value: false
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable supplier business key.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk.
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    required: false
    description: Target demand week = fiscal_year * 100 + fiscal_week (join key to fiscal_calendar.fiscal_week_id).
  - name: forecast_qty
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Submitted forecast demand quantity (units) for the week.
  - name: forecast_value_net
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Submitted forecast net value for the week, reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Amount currency, ISO 4217 alpha-3 (single reporting currency).
  - name: submission_version
    logicalType: integer
    physicalType: INT
    required: false
    description: Monotonic version for this (cycle, party, grain); latest wins in reconciliation.
  - name: submission_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle. Allowed values: draft, submitted, superseded, withdrawn.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: draft, submitted, superseded, withdrawn.'
  - name: submitted_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: 'When this version was submitted (UTC, ISO 8601). NOT NULL: it is the primary latest-wins
      ordering key in gold_joint_demand_plan (event time is cycle-agnostic), so a NULL would sort a genuine
      latest row last and silently serve a stale plan.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: dps_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain integrity: assert the DURABLE business key, not the IDENTITY surrogate.'
    query: 'SELECT demand_plan_submission_id, COUNT(*) AS n

      FROM data_sharing_with_suppliers.demand_plan_submission

      GROUP BY demand_plan_submission_id HAVING COUNT(*) > 1'
  - name: dps_submitted_ts_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: submitted_ts is the primary latest-wins ordering key in gold_joint_demand_plan; a NULL
      would sort a genuine latest submission last and silently serve a stale plan.
    query: 'SELECT * FROM data_sharing_with_suppliers.demand_plan_submission

      WHERE submitted_ts IS NULL'
  - name: dps_supplier_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dps_supplier_fk_orphan
    query: 'SELECT s.* FROM data_sharing_with_suppliers.demand_plan_submission s

      LEFT JOIN supplier.supplier sb ON s.supplier_sk = sb.supplier_sk

      WHERE s.supplier_sk IS NOT NULL AND sb.supplier_sk IS NULL'
  - name: dps_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dps_product_fk_orphan
    query: 'SELECT s.* FROM data_sharing_with_suppliers.demand_plan_submission s

      LEFT JOIN product.product p ON s.product_sk = p.product_sk

      WHERE s.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: dps_party_role_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dps_party_role_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.demand_plan_submission

      WHERE party_role IS NOT NULL AND party_role NOT IN (''retailer'', ''supplier'')'
  - name: dps_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dps_status_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.demand_plan_submission

      WHERE submission_status IS NOT NULL AND submission_status NOT IN (''draft'', ''submitted'', ''superseded'',
      ''withdrawn'')'
  - name: dps_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dps_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM data_sharing_with_suppliers.demand_plan_submission
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: jdp_cross_table_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_joint_demand_plan and gold_demand_plan_exceptions FUSE the submission and consensus
      monetary columns under one COALESCE'd currency_code (and rank via GREATEST across them). The per-table
      dps_/cfs_single_currency checks each pass on a load that is internally consistent but uses a DIFFERENT
      currency between the two tables, which would silently mislabel/mis-rank the fused row. Enforce the
      single-reporting-currency convention ACROSS the two fused tables, matching what the gold views assume.
    query: "SELECT * FROM (\n  SELECT COUNT(DISTINCT currency_code) AS n FROM (\n    SELECT currency_code\
      \ FROM data_sharing_with_suppliers.demand_plan_submission WHERE currency_code IS NOT NULL\n    UNION\n\
      \    SELECT currency_code FROM data_sharing_with_suppliers.consensus_forecast_snapshot WHERE currency_code\
      \ IS NOT NULL\n  )\n) WHERE n > 1"
- name: reporting_entitlement
