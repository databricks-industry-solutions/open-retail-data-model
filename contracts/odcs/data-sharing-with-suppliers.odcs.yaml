      \ IS NULL OR is_current IS NULL"
  - name: dpsub_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dpsub_business_key_unique_current
    query: 'SELECT data_product_subscription_id, COUNT(*) AS n

      FROM data_sharing_with_suppliers.data_product_subscription

      WHERE is_current = true GROUP BY data_product_subscription_id HAVING COUNT(*) > 1'
  - name: dpsub_scope_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Enforce the stated grain: at most one current licence per (principal, data product,
      supplier-scope). Two current grants for the same scope would both rank rn = 1 in gold_data_product_revenue
      and bill the same consumption twice. COALESCE the nullable supplier scope to a sentinel so all-supplier
      licences compare equal.'
    query: 'SELECT principal_id, data_product_id, COALESCE(supplier_id, ''__all_suppliers__'') AS supplier_scope,
      COUNT(*) AS n

      FROM data_sharing_with_suppliers.data_product_subscription

      WHERE is_current = true

      GROUP BY principal_id, data_product_id, COALESCE(supplier_id, ''__all_suppliers__'') HAVING COUNT(*)
      > 1'
