    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: re_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: re_keys_not_null
    query: "SELECT * FROM data_sharing_with_suppliers.reporting_entitlement\nWHERE reporting_entitlement_sk\
      \ IS NULL OR reporting_entitlement_id IS NULL OR principal_id IS NULL\n   OR effective_from_date\
      \ IS NULL OR is_current IS NULL"
