- name: gold_joint_demand_plan
  physicalName: data_sharing_with_suppliers.gold_joint_demand_plan
  physicalType: view
  description: 'The ENTITLED joint demand plan (CPFR reconciliation): per supplier × product × fiscal
    week, the latest retailer submission, the latest supplier submission, and the latest published consensus,
    joined to demand_collaboration so every row carries the principal_id permitted to see it (supplier-wide
    or product-scoped). This is the row-filter source for partner sharing; pairs with consensus_forecast_snapshot
    (the immutable published freeze).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: principal_id
    logicalType: string
    physicalType: STRING
    description: Governance principal entitled to see this row (row-filter key).
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    description: Durable supplier business key.
  - name: supplier_name
    logicalType: string
    physicalType: STRING
    description: Supplier registered/legal name.
  - name: product_id
    logicalType: string
    physicalType: STRING
    description: Durable product business key.
  - name: product_name
    logicalType: string
    physicalType: STRING
    description: Product display name.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: Fiscal week identifier = fiscal_year * 100 + fiscal_week.
  - name: plan_cycle_id
    logicalType: string
    physicalType: STRING
    description: CPFR plan cycle the consensus was agreed in.
  - name: retailer_qty
    logicalType: integer
    physicalType: BIGINT
    description: Latest retailer-submitted demand quantity for the week.
  - name: supplier_qty
    logicalType: integer
    physicalType: BIGINT
    description: Latest supplier-submitted demand quantity for the week.
  - name: consensus_qty
    logicalType: integer
    physicalType: BIGINT
    description: Agreed consensus demand quantity for the week.
  - name: retailer_value_net
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Latest retailer-submitted net value for the week, reporting/base currency.
  - name: supplier_value_net
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Latest supplier-submitted net value for the week, reporting/base currency.
  - name: consensus_value_net
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Agreed consensus net value, reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Amount currency, ISO 4217 alpha-3.
  - name: statistical_forecast_qty
    logicalType: number
    physicalType: DECIMAL
    description: Statistical demand baseline from the Smarter Demand package, allocated to this supplier
      by its demand share of the product x week (so a product shared by multiple suppliers does not fan
      the whole-product baseline onto every row). NULL if that package is absent.
  - name: plan_variance_pct
    logicalType: number
    physicalType: DOUBLE
    description: Retailer-vs-supplier disagreement recomputed LIVE from the latest submissions = (retailer_qty
      - supplier_qty) / supplier_qty. Live counterpart of the frozen consensus_forecast_snapshot.variance_pct.
  - name: consensus_vs_baseline_pct
    logicalType: number
    physicalType: DOUBLE
    description: Consensus lift over the statistical baseline = (consensus_qty - statistical_forecast_qty)
      / statistical_forecast_qty.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
  quality:
  - name: jdp_variance_present
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the party-disagreement signal (both parties must submit).'
    query: 'SELECT ROUND(AVG(CASE WHEN plan_variance_pct IS NULL THEN 1.0 ELSE 0.0 END), 4) AS plan_variance_null_rate

      FROM data_sharing_with_suppliers.gold_joint_demand_plan'
  - name: jdp_baseline_null_rate
    type: sql
    dimension: accuracy
    severity: info
