  - name: exception_reason
    logicalType: string
    physicalType: STRING
    description: 'Why the row needs attention. One of: paid_unused_subscription, under_consumed_subscription,
      over_contracted_consumption, lapsing_term, rate_card_divergence.'
  - name: subscription_status
    logicalType: string
    physicalType: STRING
    description: Licence lifecycle at its latest version.
  - name: term_end_date
    logicalType: date
    physicalType: DATE
    description: Contractual term end; NULL for an evergreen term.
  - name: contracted_units
    logicalType: integer
    physicalType: BIGINT
    description: Committed consumption allowance per billing period.
  - name: consumption_units
