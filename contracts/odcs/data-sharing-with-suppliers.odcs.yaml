    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The optional campaign scope must resolve to an existing campaign (guarded; NULL = brand-wide).
    query: 'SELECT e.* FROM data_sharing_with_suppliers.reporting_entitlement e

      LEFT JOIN commerce_media_networks.campaign c ON e.campaign_sk = c.campaign_sk

      WHERE e.campaign_sk IS NOT NULL AND c.campaign_sk IS NULL'
  - name: re_status_domain
    type: sql
