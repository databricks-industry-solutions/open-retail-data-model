      one reason dominates (usually a mis-set tolerance rather than a real signal).'
    query: 'SELECT exception_reason, COUNT(*) AS rows

      FROM data_sharing_with_suppliers.gold_data_monetization_exceptions

      GROUP BY exception_reason

      ORDER BY rows DESC, exception_reason'
- name: gold_data_product_revenue
  physicalName: data_sharing_with_suppliers.gold_data_product_revenue
  physicalType: view
  description: 'The ENTITLED data-monetization P&L: per principal × data product × supplier scope × fiscal
    period, the licensed commercial terms, the metered consumption, the revenue it billed, and the yield
    of that revenue against both the contract and the partner''s retail-media spend. This is the row-filter
    source for partner-facing revenue reporting; pairs with gold_data_monetization_exceptions (the ranked
    attention queue).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: principal_id
    logicalType: string
    physicalType: STRING
    description: Governance principal entitled to see this row (row-filter key).
  - name: data_product_id
    logicalType: string
    physicalType: STRING
    description: Durable data-product business key.
  - name: data_product_name
    logicalType: string
    physicalType: STRING
    description: Display name of the licensed data product.
  - name: data_product_category
    logicalType: string
    physicalType: STRING
    description: 'Kind of data product. One of: media_measurement, demand_collaboration, category_benchmark,
      audience_insight.'
  - name: pricing_model
    logicalType: string
    physicalType: STRING
    description: 'How the product is charged. One of: subscription_flat, per_consumption_unit, tiered,
      revenue_share.'
  - name: consumption_unit
    logicalType: string
    physicalType: STRING
    description: 'Unit the consumption_units measure is denominated in. One of: query, row_scanned, report_delivery,
      api_call.'
  - name: supplier_scope_id
    logicalType: string
    physicalType: STRING
    description: Durable supplier business key the LICENCE is scoped to; NULL for a licence spanning every
      supplier the product covers (not the supplier of an individual usage row).
  - name: supplier_name
    logicalType: string
    physicalType: STRING
    description: Supplier registered/legal name; NULL for an all-supplier licence.
  - name: advertiser_id
    logicalType: string
    physicalType: STRING
    description: Durable advertiser business key the licence is tied to (the brand role of the supplier);
      NULL when not advertiser-scoped. This is the grain the media allocation is computed over.
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    description: NRF fiscal year.
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    description: NRF 4-5-4 fiscal period (1-12).
  - name: subscription_status
    logicalType: string
    physicalType: STRING
    description: 'Licence lifecycle at its latest version. One of: active, suspended, expired (pending
      and cancelled licences are excluded).'
  - name: billing_frequency
    logicalType: string
    physicalType: STRING
    description: 'How often the subscription bills. One of: monthly, quarterly, annual.'
  - name: term_start_date
    logicalType: date
    physicalType: DATE
    description: Contractual term start.
  - name: term_end_date
    logicalType: date
    physicalType: DATE
    description: Contractual term end; NULL for an evergreen/auto-renewing term.
  - name: contracted_price_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Negotiated price per billing period, reporting/base currency.
  - name: list_price_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Published rate-card price from the data-product catalog, reporting/base currency.
  - name: contracted_units
    logicalType: integer
    physicalType: BIGINT
    description: Committed consumption allowance per BILLING period (not per fiscal period; contract_utilisation_pct
      pro-rates it).
  - name: consumption_units
    logicalType: integer
    physicalType: BIGINT
    description: Metered consumption in the period, in the product consumption_unit. NULL when the licence
      billed no usage that period.
  - name: billed_query_count
    logicalType: integer
    physicalType: BIGINT
    description: Number of billable requests behind consumption_units (transparency; not the billing basis).
  - name: data_revenue_amount
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Revenue billed from metered consumption in the period, reporting/base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    description: Amount currency, ISO 4217 alpha-3.
  - name: last_usage_date
    logicalType: date
    physicalType: DATE
    description: Most recent usage date in the period; NULL when the licence was unused or its usage was
      suppressed.
  - name: usage_suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'TRUE when this period had usage but below the entitled disclosure floor (the grant threshold,
      else the data product default), so the usage measures (and every metric derived from them) are withheld
      as NULL while the licence row itself remains visible. Distinguishes "withheld" from "genuinely unused":
      a row with this flag set must NOT be read as paid-but-unused. Distinct from data_share_consumption.threshold_suppressed_flag,
      which is set upstream on a SOURCE usage row and excludes it before aggregation; this flag marks
      an aggregate that was computed and then withheld.'
  - name: contract_discount_pct
    logicalType: number
    physicalType: DOUBLE
    description: Discount granted off the rate card = (list_price_amount - contracted_price_amount) /
      list_price_amount.
  - name: contract_utilisation_pct
    logicalType: number
    physicalType: DOUBLE
    description: Share of the period allowance consumed = consumption_units / (contracted_units pro-rated
      from the billing frequency to one fiscal period). Greater than 1 means the licence ran over its
      commitment; near 0 means it was paid for and not used. NULL for an uncapped licence or an unrecognised
      billing frequency.
  - name: revenue_per_consumption_unit
    logicalType: number
    physicalType: DOUBLE
    description: Realised price the partner effectively paid per metered unit = data_revenue_amount /
      consumption_units.
  - name: media_spend_net
    logicalType: number
    physicalType: DECIMAL
    description: The advertiser retail-media net spend for the period from the Commerce Media Networks
      package, ALLOCATED to this licence row by its revenue share of the advertiser (so per-row values
      sum back to the advertiser actual spend, rather than fanning the whole total onto every row). NULL
      if that package is absent or unpopulated.
  - name: total_monetised_value
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: 'Total monetised value of the supplier relationship for the period = data_revenue_amount
      + media_spend_net. NULL-propagating: NULL if either component is absent, rather than presenting
      a partial sum as a total.'
  - name: data_revenue_share_pct
    logicalType: number
    physicalType: DOUBLE
    description: Data revenue as a share of total monetised value. Because the media allocation is revenue-proportional,
      this is invariant across the licence rows of one advertiser x period — it is the advertiser-level
      data share, carried per row so it survives the row filter.
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
  quality:
  - name: dpr_media_allocation_reconciles
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_data_product_revenue ALLOCATES each advertiser's period media spend across the licence
      rows sharing that advertiser (by revenue weight), so the per-row allocations must sum back to the
      advertiser's actual spend — the property that makes SUM(media_spend_net) and total_monetised_value
      additive in the metric view. A regression here (e.g. reverting to a fanned-out join) silently double-counts
      spend.
    query: "WITH allocated AS (\n  SELECT advertiser_id, fiscal_year, fiscal_period, SUM(media_spend_net)\
      \ AS allocated_spend\n  FROM data_sharing_with_suppliers.gold_data_product_revenue\n  WHERE media_spend_net\
      \ IS NOT NULL\n  GROUP BY advertiser_id, fiscal_year, fiscal_period\n),\nactual AS (\n  SELECT cp.advertiser_id,\
      \ c.fiscal_year, c.fiscal_period, SUM(cp.media_spend_net) AS actual_spend\n  FROM commerce_media_networks.gold_campaign_performance\
      \ cp\n  JOIN calendar.fiscal_calendar c ON c.date_key = cp.metric_date\n  GROUP BY cp.advertiser_id,\
      \ c.fiscal_year, c.fiscal_period\n)\nSELECT a.advertiser_id, a.fiscal_year, a.fiscal_period, a.allocated_spend,\
      \ x.actual_spend\nFROM allocated a\nJOIN actual x\n  ON x.advertiser_id = a.advertiser_id AND x.fiscal_year\
      \ = a.fiscal_year AND x.fiscal_period = a.fiscal_period\nWHERE ABS(a.allocated_spend - x.actual_spend)\
      \ > 0.01"
  - name: dpr_suppressed_measures_are_withheld
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The suppression contract: when usage_suppressed_flag is TRUE every usage measure AND
      every metric derived from it must be NULL, or the withheld volume leaks back out through a derived
      figure.'
    query: "SELECT * FROM data_sharing_with_suppliers.gold_data_product_revenue\nWHERE usage_suppressed_flag\
      \ = TRUE\n  AND (consumption_units IS NOT NULL OR billed_query_count IS NOT NULL\n       OR data_revenue_amount\
      \ IS NOT NULL OR contract_utilisation_pct IS NOT NULL\n       OR revenue_per_consumption_unit IS\
      \ NOT NULL OR total_monetised_value IS NOT NULL\n       OR data_revenue_share_pct IS NOT NULL)"
  - name: dpr_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: dpr_rowcount
    query: SELECT COUNT(*) AS rows FROM data_sharing_with_suppliers.gold_data_product_revenue
  - name: dpr_suppression_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: share of licence periods whose usage was withheld by the disclosure floor.'
    query: 'SELECT ROUND(AVG(CASE WHEN usage_suppressed_flag THEN 1.0 ELSE 0.0 END), 4) AS suppression_rate

      FROM data_sharing_with_suppliers.gold_data_product_revenue'
  - name: dpr_media_signal_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of the retail-media signal (degraded if the Commerce Media
      Networks package is absent or unpopulated — expected NULL-safe behavior, never a failure).'
    query: 'SELECT ROUND(AVG(CASE WHEN media_spend_net IS NULL THEN 1.0 ELSE 0.0 END), 4) AS media_signal_null_rate

      FROM data_sharing_with_suppliers.gold_data_product_revenue'
  - name: dpr_utilisation_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: NULL-rate of contract utilisation (NULL where a licence commits no units,
      i.e. an uncapped contract — expected, not a failure).'
    query: 'SELECT ROUND(AVG(CASE WHEN contract_utilisation_pct IS NULL THEN 1.0 ELSE 0.0 END), 4) AS
      utilisation_null_rate

      FROM data_sharing_with_suppliers.gold_data_product_revenue'
- name: gold_demand_plan_exceptions
  physicalName: data_sharing_with_suppliers.gold_demand_plan_exceptions
  physicalType: view
  description: 'CPFR exception queue over gold_joint_demand_plan: the plan rows that need collaborative
    attention, ranked by demand value at risk. An exception is raised when the two parties disagree beyond
    a tolerance, when a party has not submitted a plan for a scope the other party (or the consensus)
    did, or when the agreed consensus diverges materially from the statistical baseline. Reads only the
    entitled joint plan, so it exposes no row a partner could not already see.'
  tags:
