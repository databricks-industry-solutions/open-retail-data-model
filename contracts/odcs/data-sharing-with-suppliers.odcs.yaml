    unit: rows
    description: re_status_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.reporting_entitlement

      WHERE entitlement_status IS NOT NULL AND entitlement_status NOT IN (''active'', ''suspended'', ''revoked'')'
  - name: re_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
