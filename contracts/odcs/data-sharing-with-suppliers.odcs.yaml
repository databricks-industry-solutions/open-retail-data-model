  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
