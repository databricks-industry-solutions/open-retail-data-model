    severity: error
    mustBe: 0
    unit: rows
    description: subscribed_ts is the primary latest-wins ordering key in gold_data_product_revenue; a
      NULL would sort a genuine latest licence version last and silently serve stale commercial terms
      (or resurrect a cancelled contract).
    query: 'SELECT * FROM data_sharing_with_suppliers.data_product_subscription

      WHERE subscribed_ts IS NULL'
  - name: dpsub_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dpsub_scd2_current_open
    query: 'SELECT * FROM data_sharing_with_suppliers.data_product_subscription

      WHERE (is_current = true AND effective_to_date IS NOT NULL) OR (is_current = false AND effective_to_date
      IS NULL)'
  - name: dpsub_data_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dpsub_data_product_fk_orphan
    query: 'SELECT s.* FROM data_sharing_with_suppliers.data_product_subscription s

      LEFT JOIN data_sharing_with_suppliers.data_product p ON s.data_product_sk = p.data_product_sk

      WHERE s.data_product_sk IS NOT NULL AND p.data_product_sk IS NULL'
  - name: dpsub_supplier_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The optional supplier scope must resolve to an existing supplier (guarded; NULL = all).
    query: 'SELECT s.* FROM data_sharing_with_suppliers.data_product_subscription s

      LEFT JOIN supplier.supplier sb ON s.supplier_sk = sb.supplier_sk

      WHERE s.supplier_sk IS NOT NULL AND sb.supplier_sk IS NULL'
  - name: dpsub_advertiser_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The optional advertiser scope must resolve to an existing advertiser (guarded; NULL =
      none).
    query: 'SELECT s.* FROM data_sharing_with_suppliers.data_product_subscription s

      LEFT JOIN commerce_media_networks.advertiser a ON s.advertiser_sk = a.advertiser_sk

      WHERE s.advertiser_sk IS NOT NULL AND a.advertiser_sk IS NULL'
  - name: dpsub_billing_frequency_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dpsub_billing_frequency_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.data_product_subscription

      WHERE billing_frequency IS NOT NULL AND billing_frequency NOT IN (''monthly'', ''quarterly'', ''annual'')'
  - name: dpsub_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dpsub_status_domain
    query: "SELECT * FROM data_sharing_with_suppliers.data_product_subscription\nWHERE subscription_status\
      \ IS NOT NULL\n  AND subscription_status NOT IN ('pending', 'active', 'suspended', 'cancelled',\
      \ 'expired')"
  - name: dpsub_billing_frequency_recognised
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_data_product_revenue pro-rates contracted_units to a fiscal period via a CASE on
      billing_frequency, yielding NULL for an unrecognised value. A licence that commits units MUST therefore
      declare a recognised frequency, or contract_utilisation_pct (and the under/over-consumption exceptions
      that read it) silently vanishes for that row.
    query: "SELECT * FROM data_sharing_with_suppliers.data_product_subscription\nWHERE contracted_units\
      \ IS NOT NULL\n  AND (billing_frequency IS NULL OR billing_frequency NOT IN ('monthly', 'quarterly',\
      \ 'annual'))"
  - name: dpsub_term_dates_ordered
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A term that ends before it starts would expand to zero fiscal periods, silently dropping
      the licence from the revenue view rather than failing loud.
    query: 'SELECT * FROM data_sharing_with_suppliers.data_product_subscription

      WHERE term_end_date IS NOT NULL AND term_start_date IS NOT NULL AND term_end_date < term_start_date'
  - name: dpsub_term_start_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: term_start_date anchors the licence-period expansion in gold_data_product_revenue; a
      NULL start drops the licence from its in-term periods entirely (only usage-bearing periods would
      survive), hiding paid-but-unused licences.
    query: 'SELECT * FROM data_sharing_with_suppliers.data_product_subscription

      WHERE term_start_date IS NULL'
  - name: dpsub_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dpsub_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM data_sharing_with_suppliers.data_product_subscription
      WHERE currency_code IS NOT NULL) WHERE n > 1
- name: data_share_consumption
  physicalName: data_sharing_with_suppliers.data_share_consumption
  physicalType: table
  description: Data Sharing with Suppliers — metered data-product consumption and the revenue it billed
    (append-only).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: data_share_consumption_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: data_share_consumption_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable natural/business key (grain hash: subscription, product, usage date).'
  - name: data_product_subscription_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to data_product_subscription.data_product_subscription_sk (the licence this usage
      billed under).
    relationships:
    - to: data_product_subscription.data_product_subscription_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: data_sharing_with_suppliers
      - property: enforced
        value: false
  - name: data_product_subscription_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable subscription business key.
  - name: principal_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Governance principal that consumed the data (denormalized from the subscription so the
      row filter and usage reporting need no join).
  - name: data_product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to data_product.data_product_sk.
    relationships:
    - to: data_product.data_product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: data_sharing_with_suppliers
      - property: enforced
        value: false
  - name: data_product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable data-product business key.
  - name: supplier_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to supplier.supplier_sk (the supplier whose data was consumed); NULL when the licence
      is all-supplier and the usage is not attributable to one.
    relationships:
    - to: supplier.supplier_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: supplier
      - property: enforced
        value: false
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable supplier business key; NULL when not attributable to one supplier.
  - name: usage_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date the consumption occurred (cluster key).
  - name: fiscal_year
    logicalType: integer
    physicalType: INT
    required: false
    description: NRF 4-5-4 fiscal year of usage_date (degenerate key; join-compatible with fiscal_calendar.fiscal_year).
  - name: fiscal_period
    logicalType: integer
    physicalType: INT
    required: false
    description: NRF fiscal period / retail month (1-12) of usage_date (degenerate key; join-compatible
      with fiscal_calendar.fiscal_period).
  - name: access_channel
    logicalType: string
    physicalType: STRING
    required: false
    description: 'How the data was accessed. Allowed values: share, api, file_export, dashboard.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: share, api, file_export, dashboard.'
  - name: consumption_units
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Metered usage for the day, in the data product consumption_unit.
  - name: billed_query_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Number of billable requests behind consumption_units (reported for transparency; not
      itself the billing basis).
  - name: billable_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: 'Money this day of consumption earned, already resolved against the subscription commercial
      terms. Stored rather than computed: a subscription_flat or tiered licence bills the same regardless
      of units, so units x rate would be wrong for three of the four pricing models.'
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Amount currency, ISO 4217 alpha-3 (single reporting currency).
  - name: threshold_suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: 'TRUE if any measure on this SOURCE usage row was threshold-suppressed before it was
      recorded. Set upstream, at ingestion. Not to be confused with gold_data_product_revenue.usage_suppressed_flag,
      which is decided IN the gold view when a period aggregate falls below the entitled floor: rows flagged
      here are excluded before aggregation, whereas that flag marks an aggregate that was computed and
      then withheld.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: dsc_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain integrity: assert the DURABLE business key, not the IDENTITY surrogate (*_sk is
      generated per row and can never collide — a tautology).'
    query: 'SELECT data_share_consumption_id, COUNT(*) AS n

      FROM data_sharing_with_suppliers.data_share_consumption

      GROUP BY data_share_consumption_id HAVING COUNT(*) > 1'
  - name: dsc_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dsc_keys_not_null
    query: "SELECT * FROM data_sharing_with_suppliers.data_share_consumption\nWHERE data_share_consumption_sk\
      \ IS NULL OR data_share_consumption_id IS NULL\n   OR principal_id IS NULL OR usage_date IS NULL"
  - name: dsc_subscription_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dsc_subscription_fk_orphan
    query: 'SELECT c.* FROM data_sharing_with_suppliers.data_share_consumption c

      LEFT JOIN data_sharing_with_suppliers.data_product_subscription s ON c.data_product_subscription_sk
      = s.data_product_subscription_sk

      WHERE c.data_product_subscription_sk IS NOT NULL AND s.data_product_subscription_sk IS NULL'
  - name: dsc_data_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dsc_data_product_fk_orphan
    query: 'SELECT c.* FROM data_sharing_with_suppliers.data_share_consumption c

      LEFT JOIN data_sharing_with_suppliers.data_product p ON c.data_product_sk = p.data_product_sk

      WHERE c.data_product_sk IS NOT NULL AND p.data_product_sk IS NULL'
  - name: dsc_supplier_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dsc_supplier_fk_orphan
    query: 'SELECT c.* FROM data_sharing_with_suppliers.data_share_consumption c

      LEFT JOIN supplier.supplier sb ON c.supplier_sk = sb.supplier_sk

      WHERE c.supplier_sk IS NOT NULL AND sb.supplier_sk IS NULL'
  - name: dsc_access_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dsc_access_channel_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.data_share_consumption

      WHERE access_channel IS NOT NULL AND access_channel NOT IN (''share'', ''api'', ''file_export'',
      ''dashboard'')'
  - name: dsc_fiscal_period_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fiscal_period is a degenerate NRF retail month (1-12), not a week or a day-of-year; an
      out-of-range value would silently mis-bucket revenue against the calendar spine.
    query: 'SELECT * FROM data_sharing_with_suppliers.data_share_consumption

      WHERE fiscal_period IS NOT NULL AND (fiscal_period < 1 OR fiscal_period > 12)'
  - name: dsc_measures_non_negative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Usage and billed revenue are non-negative by construction; a negative would flip the
      sign of a period's revenue and corrupt the allocation weights in the revenue view.
    query: 'SELECT * FROM data_sharing_with_suppliers.data_share_consumption

      WHERE consumption_units < 0 OR billed_query_count < 0 OR billable_amount < 0'
  - name: dsc_usage_date_in_calendar
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'usage_date must resolve to a fiscal_calendar row, because gold_data_product_revenue
      buckets revenue onto a fiscal-period spine DERIVED from that calendar: a usage row outside the calendar
      window is silently dropped from the P&L (its billable_amount just disappears, with no error). This
      is a LEFT JOIN on purpose — the sibling dsc_fiscal_period_matches_usage_date check INNER JOINs,
      so it can only compare rows that already resolved and can never catch an out-of-window date. The
      two are complementary: this one asserts the row EXISTS in the calendar, that one asserts its degenerate
      keys AGREE with it.'
    query: 'SELECT c.data_share_consumption_id, c.usage_date, c.fiscal_year, c.fiscal_period

      FROM data_sharing_with_suppliers.data_share_consumption c

      LEFT JOIN calendar.fiscal_calendar f ON f.date_key = c.usage_date

      WHERE c.usage_date IS NOT NULL AND f.date_key IS NULL'
  - name: dsc_fiscal_period_matches_usage_date
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: fiscal_year/fiscal_period are DEGENERATE keys carried on the fact rather than resolved
      through a calendar FK, so nothing structural stops them drifting from usage_date. The revenue view
      buckets by the degenerate pair while the exception queue judges a lapsing term against the CALENDAR
      period end, so a drifted row would be reported in the wrong period and compared against the wrong
      term window. Reconcile against fiscal_calendar.
    query: "SELECT c.data_share_consumption_id, c.usage_date, c.fiscal_year, c.fiscal_period,\n      \
      \ f.fiscal_year AS calendar_fiscal_year, f.fiscal_period AS calendar_fiscal_period\nFROM data_sharing_with_suppliers.data_share_consumption\
      \ c\nJOIN calendar.fiscal_calendar f ON f.date_key = c.usage_date\nWHERE c.fiscal_year IS NOT NULL\
      \ AND c.fiscal_period IS NOT NULL\n  AND (c.fiscal_year <> f.fiscal_year OR c.fiscal_period <> f.fiscal_period)"
  - name: dsc_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dsc_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM data_sharing_with_suppliers.data_share_consumption
      WHERE currency_code IS NOT NULL) WHERE n > 1
- name: demand_collaboration
  physicalName: data_sharing_with_suppliers.demand_collaboration
  physicalType: table
  description: Data Sharing with Suppliers — joint demand planning collaboration entitlement (row-level
    access + scope anchor, SCD2).
  tags:
  - association
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: demand_collaboration_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: demand_collaboration_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the collaboration grant.
  - name: principal_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Governance principal in the collaboration (UC group / account / service principal; not
      a customer identity).
  - name: principal_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Kind of principal. Allowed values: group, account, service_principal.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: group, account, service_principal.'
  - name: supplier_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to supplier.supplier_sk (the supplier whose demand plan is shared).
    relationships:
    - to: supplier.supplier_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: supplier
      - property: enforced
        value: false
  - name: supplier_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable supplier business key.
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to product.product_sk when scoped to one product (NULL = all products of the supplier).
    relationships:
    - to: product.product_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: product
      - property: enforced
        value: false
  - name: product_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable product business key; NULL for supplier-wide collaboration.
  - name: plan_horizon_weeks
    logicalType: integer
    physicalType: INT
    required: false
    description: Agreed collaborative planning horizon, in fiscal weeks.
  - name: min_disclosure_threshold
    logicalType: integer
    physicalType: INT
    required: false
    description: Minimum demand volume (units) a plan row must reach before it is disclosable to this
      principal — a low-volume/materiality floor, NOT a k-anonymity control (the shared rows are already
      aggregate at supplier x product x week and carry no underlying entity count). NULL means NO floor
      (every entitled row is disclosed regardless of volume).
  - name: collaboration_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle. Allowed values: active, suspended, ended.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: active, suspended, ended.'
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: dc_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dc_keys_not_null
    query: "SELECT * FROM data_sharing_with_suppliers.demand_collaboration\nWHERE demand_collaboration_sk\
      \ IS NULL OR demand_collaboration_id IS NULL OR principal_id IS NULL\n   OR effective_from_date\
      \ IS NULL OR is_current IS NULL"
  - name: dc_business_key_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dc_business_key_unique_current
    query: 'SELECT demand_collaboration_id, COUNT(*) AS n

      FROM data_sharing_with_suppliers.demand_collaboration

      WHERE is_current = true GROUP BY demand_collaboration_id HAVING COUNT(*) > 1'
  - name: dc_scope_unique_current
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Enforce the stated grain: at most one active current grant per (principal, supplier,
      product-scope). Two active grants for the same scope would both match the entitlement join and leave
      the disclosure floor applied nondeterministically. COALESCE the nullable product scope to a sentinel
      so supplier-wide grants (product_sk NULL) compare equal.'
    query: 'SELECT principal_id, supplier_sk, COALESCE(product_sk, -1) AS product_scope, COUNT(*) AS n

      FROM data_sharing_with_suppliers.demand_collaboration

      WHERE is_current = true AND collaboration_status = ''active''

      GROUP BY principal_id, supplier_sk, COALESCE(product_sk, -1) HAVING COUNT(*) > 1'
  - name: dc_supplier_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dc_supplier_fk_orphan
    query: 'SELECT c.* FROM data_sharing_with_suppliers.demand_collaboration c

      LEFT JOIN supplier.supplier sb ON c.supplier_sk = sb.supplier_sk

      WHERE c.supplier_sk IS NOT NULL AND sb.supplier_sk IS NULL'
  - name: dc_product_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The optional product scope must resolve to an existing product (guarded; NULL = supplier-wide).
    query: 'SELECT c.* FROM data_sharing_with_suppliers.demand_collaboration c

      LEFT JOIN product.product p ON c.product_sk = p.product_sk

      WHERE c.product_sk IS NOT NULL AND p.product_sk IS NULL'
  - name: dc_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dc_status_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.demand_collaboration

      WHERE collaboration_status IS NOT NULL AND collaboration_status NOT IN (''active'', ''suspended'',
      ''ended'')'
  - name: dc_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dc_scd2_current_open
    query: 'SELECT * FROM data_sharing_with_suppliers.demand_collaboration

      WHERE (is_current = true AND effective_to_date IS NOT NULL) OR (is_current = false AND effective_to_date
      IS NULL)'
- name: demand_plan_submission
  physicalName: data_sharing_with_suppliers.demand_plan_submission
  physicalType: table
  description: Data Sharing with Suppliers — per-party versioned demand-plan submission (CPFR).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/data-sharing-with-suppliers/README.md
    type: businessDefinition
  - url: outcome-packages/data-sharing-with-suppliers/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: demand_plan_submission_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: demand_plan_submission_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key (grain hash incl. submission_version).
  - name: plan_cycle_id
    logicalType: string
