  - name: dp_pricing_model_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dp_pricing_model_domain
    query: "SELECT * FROM data_sharing_with_suppliers.data_product\nWHERE pricing_model IS NOT NULL\n\
      \  AND pricing_model NOT IN ('subscription_flat', 'per_consumption_unit', 'tiered', 'revenue_share')"
  - name: dp_consumption_unit_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dp_consumption_unit_domain
    query: "SELECT * FROM data_sharing_with_suppliers.data_product\nWHERE consumption_unit IS NOT NULL\n\
      \  AND consumption_unit NOT IN ('query', 'row_scanned', 'report_delivery', 'api_call')"
  - name: dp_delivery_mode_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dp_delivery_mode_domain
    query: 'SELECT * FROM data_sharing_with_suppliers.data_product

      WHERE delivery_mode IS NOT NULL AND delivery_mode NOT IN (''share'', ''api'', ''file_export'', ''dashboard'')'
  - name: dp_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dp_status_domain
    query: "SELECT * FROM data_sharing_with_suppliers.data_product\nWHERE data_product_status IS NOT NULL\n\
      \  AND data_product_status NOT IN ('draft', 'published', 'deprecated', 'retired')"
  - name: dp_usage_priced_products_have_unit
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A per_consumption_unit product must declare WHICH unit it meters, or the rate is uninterpretable
      and gold_data_product_revenue's rate-card divergence is meaningless.
    query: 'SELECT * FROM data_sharing_with_suppliers.data_product

      WHERE pricing_model = ''per_consumption_unit'' AND consumption_unit IS NULL'
  - name: dp_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: dp_single_currency
    query: SELECT * FROM (SELECT COUNT(DISTINCT currency_code) AS n FROM data_sharing_with_suppliers.data_product
      WHERE currency_code IS NOT NULL) WHERE n > 1
  - name: dm_cross_table_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_data_product_revenue FUSES monetary columns from all three data-monetization tables
      under one COALESCE'd currency_code (the licence's contracted_price_amount, the product's list_price_amount,
      and the metered billable_amount), and derives contract_discount_pct and total_monetised_value ACROSS
      them. The per-table *_single_currency checks each pass on a load that is internally consistent but
      uses a DIFFERENT currency between tables, which would silently mislabel the fused row and make the
      discount a currency artefact. Enforce the single-reporting-currency convention ACROSS the three
      fused tables, matching what the gold views assume.
    query: "SELECT * FROM (\n  SELECT COUNT(DISTINCT currency_code) AS n FROM (\n    SELECT currency_code\
      \ FROM data_sharing_with_suppliers.data_product WHERE currency_code IS NOT NULL\n    UNION\n   \
      \ SELECT currency_code FROM data_sharing_with_suppliers.data_product_subscription WHERE currency_code\
      \ IS NOT NULL\n    UNION\n    SELECT currency_code FROM data_sharing_with_suppliers.data_share_consumption\
      \ WHERE currency_code IS NOT NULL\n  )\n) WHERE n > 1"
