- name: offer_event
  physicalName: promote_with_purpose.offer_event
  physicalType: table
  description: Location-based offer delivery/engagement events (pseudonymous keys; consent-verified deliveries)
    for the Location-Based Offers use case.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/promote-with-purpose/README.md
    type: businessDefinition
  - url: outcome-packages/promote-with-purpose/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: offer_event_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: offer_event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable event key assigned by the emitting system (ULID/UUID); the idempotency key for
      replay and de-duplication.
  - name: location_offer_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: FK to location_offer.location_offer_sk — the offer that fired.
    relationships:
    - to: location_offer.location_offer_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: promote_with_purpose
      - property: enforced
        value: false
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Pseudonymous customer key (logical reference to customer profile.profile_id). No PII,
      no device id, no location trail.
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key where the event occurred (logical reference to store.store_id).
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the event occurred (event-time, UTC, ISO 8601).
  - name: event_type
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Event kind. Common values: triggered, suppressed, delivered, opened, redeemed (enum
      enforced in relationships.sql).'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: triggered, suppressed, delivered, opened, redeemed.'
  - name: suppression_reason
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Why a trigger was suppressed; set only when event_type=suppressed, NULL otherwise. Common
      values: no_consent, daily_cap, quiet_hours, frequency_window (enum enforced in relationships.sql).'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: no_consent, daily_cap, quiet_hours, frequency_window.'
  - name: transaction_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable sales-transaction business key for redemption attribution (logical reference
      to transaction sales.sales_id); NULL when not a redemption.
  - name: consent_verified
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE when marketing consent was verified for this customer at event time; must be TRUE
      for every delivered/opened/redeemed event.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Timestamp this row was loaded into the canonical core (UTC, ISO 8601).
  quality:
  - name: offer_event_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: offer_event_keys_not_null
    query: "SELECT * FROM promote_with_purpose.offer_event\nWHERE offer_event_sk IS NULL OR offer_event_id\
      \ IS NULL\n   OR location_offer_sk IS NULL\n   OR customer_id IS NULL OR store_id IS NULL"
  - name: offer_event_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: offer_event_pk_unique
    query: 'SELECT offer_event_sk, COUNT(*) AS rows

      FROM promote_with_purpose.offer_event

      GROUP BY offer_event_sk

      HAVING COUNT(*) > 1'
  - name: offer_event_suppression_reason_iff_suppressed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: suppression_reason is set IFF event_type='suppressed' (both directions).
    query: "SELECT * FROM promote_with_purpose.offer_event\nWHERE (event_type = 'suppressed' AND suppression_reason\
      \ IS NULL)\n   OR (event_type <> 'suppressed' AND suppression_reason IS NOT NULL)"
  - name: offer_event_delivery_requires_consent
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The consent invariant: every delivered/opened/redeemed event is consent-verified.'
    query: "SELECT * FROM promote_with_purpose.offer_event\nWHERE event_type IN ('delivered', 'opened',\
      \ 'redeemed')\n  AND consent_verified IS NOT TRUE"
  - name: offer_event_redeemed_requires_transaction
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: offer_event_redeemed_requires_transaction
    query: 'SELECT * FROM promote_with_purpose.offer_event

      WHERE event_type = ''redeemed'' AND transaction_id IS NULL'
  - name: offer_event_within_offer_window
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: event_ts must fall inside the joined offer's [offer_start_ts, offer_end_ts].
    query: "SELECT e.offer_event_sk\nFROM promote_with_purpose.offer_event e\nJOIN promote_with_purpose.location_offer\
      \ lo\n  ON e.location_offer_sk = lo.location_offer_sk\nWHERE e.event_ts < lo.offer_start_ts OR e.event_ts\
      \ > lo.offer_end_ts"
  - name: offer_event_location_offer_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Explicit referential-integrity check on the declared FK (offer_event -> location_offer).
    query: "SELECT e.offer_event_sk\nFROM promote_with_purpose.offer_event e\nLEFT JOIN promote_with_purpose.location_offer\
      \ lo\n  ON e.location_offer_sk = lo.location_offer_sk\nWHERE lo.location_offer_sk IS NULL"
