    businessName: Suppression Rate
    customProperties:
    - property: synonyms
      value:
      - throttle_rate
      - block_rate
      - suppression_ratio
    description: Suppressed / (delivered + suppressed). Ratio of sums, not an average of per-row rates.
  - name: attributed_sales_amount
    logicalType: number
    businessName: Attributed Sales
    customProperties:
    - property: synonyms
      value:
      - redemption_sales
      - attributed_revenue
      - offer_revenue
    description: Net revenue on transactions attributed to a redeemed offer, in the reporting/base currency.
- name: mv_promo_roi
  physicalName: promote_with_purpose.mv_promo_roi
  physicalType: view
  description: 'Post-promotion ROI by promotion: incremental margin against trade spend, with cannibalization
    and forward-buy drag.'
