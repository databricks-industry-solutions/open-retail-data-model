- name: gold_promo_roi
  physicalName: promote_with_purpose.gold_promo_roi
  physicalType: view
  description: 'Did the promotion pay off? One row per completed promotion: incremental units / revenue
    / margin over baseline, ROI on trade spend, realized vs planned lift, and the two value-killers (cannibalization,
    forward buy).'
  tags:
  - gold
  authoritativeDefinitions:
