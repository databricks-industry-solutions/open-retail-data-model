    type: businessDefinition
  properties:
  - name: location_offer_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Offer surrogate (FK to location_offer.location_offer_sk); part of the grain PK.
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    description: Store business key; part of the grain PK.
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    description: NRF 4-5-4 fiscal week; part of the grain PK.
  - name: trigger_events
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Count of triggered events.
  - name: suppressed_events
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Count of suppressed events.
  - name: delivered_events
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Count of delivered events.
  - name: opened_events
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Count of opened events.
  - name: redemptions
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Count of redeemed events.
  - name: unique_customers_reached
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Distinct pseudonymous customers with a delivered event.
  - name: delivery_rate
    logicalType: number
    physicalType: DECIMAL(9,4)
    required: false
    description: delivered / (delivered + suppressed); bounded 0..1.
  - name: open_rate
    logicalType: number
    physicalType: DECIMAL(9,4)
    required: false
    description: opened / delivered; bounded 0..1.
  - name: redemption_rate
    logicalType: number
    physicalType: DECIMAL(9,4)
    required: false
    description: redemptions / delivered; bounded 0..1.
  - name: suppression_rate
    logicalType: number
    physicalType: DECIMAL(9,4)
    required: false
    description: suppressed / (delivered + suppressed); bounded 0..1.
  - name: attributed_sales_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Sum of transaction net_revenue attributed to redeemed events (base currency).
  quality:
  - name: gold_location_offer_performance_rate_bounds
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_location_offer_performance_rate_bounds
    query: "SELECT * FROM promote_with_purpose.gold_location_offer_performance\nWHERE delivery_rate  \
      \  < 0 OR delivery_rate    > 1\n   OR open_rate        < 0 OR open_rate        > 1\n   OR redemption_rate\
      \  < 0 OR redemption_rate  > 1\n   OR suppression_rate < 0 OR suppression_rate > 1"
