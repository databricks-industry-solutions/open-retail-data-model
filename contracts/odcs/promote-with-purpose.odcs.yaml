    type: businessDefinition
  - url: outcome-packages/promote-with-purpose/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: promo_id
    logicalType: string
    physicalType: STRING
    description: Promotion business key.
  - name: promo_name
    logicalType: string
    physicalType: STRING
    description: Promotion name.
  - name: promo_type
    logicalType: string
    physicalType: STRING
