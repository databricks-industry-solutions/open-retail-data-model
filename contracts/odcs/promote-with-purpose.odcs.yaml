- name: gold_trade_promotion
  physicalName: promote_with_purpose.gold_trade_promotion
  physicalType: view
  description: One row per promotion x product x store x fiscal week. Joins the trade-promotion dimension
    to its product/store scope and to weekly POS sales, with planned trade spend allocated evenly across
    the promo's scope and weeks, and a baseline of trailing non-promoted demand.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/promote-with-purpose/README.md
    type: businessDefinition
  - url: outcome-packages/promote-with-purpose/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: promo_id
    logicalType: string
    physicalType: STRING
  - name: promo_name
    logicalType: string
    physicalType: STRING
  - name: promo_type
    logicalType: string
    physicalType: STRING
  - name: funding_type
    logicalType: string
    physicalType: STRING
  - name: funded_by
    logicalType: string
    physicalType: STRING
  - name: product_id
    logicalType: string
    physicalType: STRING
  - name: product_name
    logicalType: string
    physicalType: STRING
  - name: category
    logicalType: string
    physicalType: STRING
  - name: subcategory
    logicalType: string
    physicalType: STRING
  - name: brand
    logicalType: string
    physicalType: STRING
  - name: store_id
    logicalType: string
    physicalType: STRING
  - name: store_name
    logicalType: string
    physicalType: STRING
  - name: store_format
    logicalType: string
    physicalType: STRING
  - name: region
    logicalType: string
    physicalType: STRING
  - name: fiscal_week_id
    logicalType: integer
    physicalType: INT
    description: Fiscal week identifier (fiscal_year*100 + fiscal_week).
  - name: promoted_units
    logicalType: integer
    physicalType: BIGINT
    description: Promoted units for this promo x product x store x week.
  - name: promoted_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Promoted net revenue for this cell.
  - name: planned_trade_spend
    logicalType: number
    physicalType: DECIMAL
    description: Planned trade spend allocated to this cell (evenly across scope x weeks).
  - name: planned_lift_pct
    logicalType: number
    physicalType: DECIMAL(6, 2)
  - name: baseline_units
    logicalType: number
    physicalType: DOUBLE
    description: Trailing-8-week non-promoted mean units; NULL if < 4 weeks available.
  quality:
  - name: gold_trade_promotion_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per promo x product x store x fiscal week, keyed on the DURABLE ids (never the
      version-specific promo_sk); fiscal_week_id is part of the grain (the view is weekly). A re-versioned
      promotion must not fragment into multiple rows — the SCD2 fragmentation guard (standard §A.16).
      Dormant-green under single-version synthetic data.
    query: 'SELECT promo_id, product_id, store_id, fiscal_week_id

      FROM promote_with_purpose.gold_trade_promotion

      GROUP BY promo_id, product_id, store_id, fiscal_week_id

      HAVING COUNT(*) > 1'
  - name: gold_trade_promotion_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only: number of promo x product x store x week rows in the gold view.'
    query: SELECT COUNT(*) AS gold_rows FROM promote_with_purpose.gold_trade_promotion
  - name: gold_baseline_units_null_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only (never a failure): share of gold rows whose baseline_units is NULL because
      fewer than 4 trailing non-promoted weeks were available.'
    query: 'SELECT ROUND(AVG(CASE WHEN baseline_units IS NULL THEN 1.0 ELSE 0.0 END), 4) AS baseline_null_rate

      FROM promote_with_purpose.gold_trade_promotion'
- name: gold_weekly_baseline
  physicalName: promote_with_purpose.gold_weekly_baseline
  physicalType: view
  description: 'Per product x store x fiscal week: actual sales and the trailing non-promoted baseline.
    Materialized once and reused by gold_promo_roi (for promoted SKUs, substitute SKUs and post-promo
    weeks alike), so the baseline definition lives in ONE place.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/promote-with-purpose/README.md
    type: businessDefinition
  - url: outcome-packages/promote-with-purpose/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: product_sk
    logicalType: integer
    physicalType: BIGINT
    description: FK to product.product_sk (version-specific); resolve to the durable product_id before
      aggregating (§A.16).
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: FK to store.store_sk (version-specific); resolve to the durable store_id before aggregating
      (§A.16).
  - name: fiscal_week_index
    logicalType: integer
    physicalType: INT
    description: Globally monotonic week counter across the whole calendar; use for trailing N-week windows.
  - name: actual_units
    logicalType: integer
    physicalType: BIGINT
    description: Total units sold in the week (promoted and non-promoted).
  - name: actual_revenue
    logicalType: number
    physicalType: DECIMAL(18, 2)
    description: Total net revenue in the week (promoted and non-promoted).
  - name: baseline_units
    logicalType: number
    physicalType: DOUBLE
    description: Trailing-8-week non-promoted mean units; NULL if < 4 weeks available.
  quality:
  - name: gold_weekly_baseline_grain_dupe_rows
    type: sql
    dimension: accuracy
    severity: info
    description: 'Reported only (NOT an error): the view already GROUP BYs (product_sk, store_sk, fiscal_week_index),
      so keyed on those this can never fire — it would be a no-op error check. It is a metric placeholder
      until the fix-the-views PR re-grains the window to durable product_id/store_id, at which point it
      becomes a real error-severity grain guard keyed on the durable ids (like its five siblings).'
    query: "SELECT COUNT(*) AS weekly_baseline_dupe_grain_rows FROM (\n  SELECT product_sk, store_sk,\
      \ fiscal_week_index\n  FROM promote_with_purpose.gold_weekly_baseline\n  GROUP BY product_sk, store_sk,\
      \ fiscal_week_index\n  HAVING COUNT(*) > 1\n)"
