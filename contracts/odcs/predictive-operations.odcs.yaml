  physicalType: table
  description: Preventive maintenance schedules for in-store equipment (SCD2). Defines recurring maintenance
    tasks and their cadence. Versioned so schedule changes are historically auditable.
  tags:
  - master
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: maintenance_schedule_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version; the join/FK target.
  - name: maintenance_schedule_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the schedule entry.
  - name: equipment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to equipment.equipment_sk (version-specific).
