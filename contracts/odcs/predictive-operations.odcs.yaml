  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: ls_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ls_keys_not_null
    query: "SELECT * FROM predictive_operations.labor_standard\nWHERE labor_standard_sk IS NULL OR labor_standard_id\
      \ IS NULL\n   OR standard_version IS NULL OR role_code IS NULL OR demand_driver IS NULL\n   OR interval_minutes\
      \ IS NULL OR driver_units_per_labor_hour IS NULL\n   OR minimum_headcount IS NULL OR coverage_rationale\
      \ IS NULL\n   OR is_active IS NULL OR effective_from_date IS NULL OR is_current IS NULL"
  - name: ls_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ls_pk_unique
    query: 'SELECT labor_standard_sk

      FROM predictive_operations.labor_standard

      GROUP BY labor_standard_sk

      HAVING COUNT(*) > 1'
  - name: ls_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ls_id_unique
    query: 'SELECT labor_standard_id, COUNT(*) AS n

      FROM predictive_operations.labor_standard

      WHERE is_current = TRUE

      GROUP BY labor_standard_id

      HAVING COUNT(*) > 1'
  - name: ls_active_key_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: gold_workforce_labor_requirement INNER JOINs the demand forecast to the ACTIVE standards
      on (role_code, demand_driver, department_or_zone). ls_id_unique only constrains labor_standard_id,
      so nothing yet stops TWO concurrently-active standards sharing one join key -- which would fan the
      requirement out past its declared store x date x interval x zone x role grain and inflate the SUMs
      feeding gold_labor_risk and, through it, gold_store_operational_risk.labor_risk. A NULL zone means
      storewide (the view COALESCEs it), so it is normalized the same way here.
    query: "SELECT role_code,\n       demand_driver,\n       COALESCE(department_or_zone, 'storewide')\
      \ AS department_or_zone,\n       COUNT(*) AS n\nFROM predictive_operations.labor_standard\nWHERE\
      \ is_current = TRUE AND is_active = TRUE\nGROUP BY role_code, demand_driver, COALESCE(department_or_zone,\
      \ 'storewide')\nHAVING COUNT(*) > 1"
  - name: ls_role_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ls_role_domain
    query: 'SELECT * FROM predictive_operations.labor_standard

      WHERE role_code NOT IN (''cashier'', ''sales_associate'', ''fulfillment'', ''inventory'', ''supervisor'')'
  - name: ls_driver_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ls_driver_domain
    query: "SELECT * FROM predictive_operations.labor_standard\nWHERE demand_driver NOT IN (\n  'transaction_count',\
      \ 'foot_traffic', 'pickup_orders',\n  'receiving_units', 'store_open_coverage', 'minimum_coverage'\n\
      )"
  - name: ls_positive_standard
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ls_positive_standard
    query: 'SELECT * FROM predictive_operations.labor_standard

      WHERE driver_units_per_labor_hour <= 0 OR interval_minutes <= 0 OR minimum_headcount < 0'
  - name: ls_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ls_scd2_current_open
    query: 'SELECT * FROM predictive_operations.labor_standard

      WHERE is_current = TRUE AND effective_to_date IS NOT NULL'
  - name: ls_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: ls_rowcount
    query: SELECT COUNT(*) AS labor_standard_rows FROM predictive_operations.labor_standard
- name: maintenance_schedule
