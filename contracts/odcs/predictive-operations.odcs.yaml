  - name: line_total
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Total cost for this line (quantity x unit_cost) in base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Reporting/base currency for cost columns, ISO 4217 alpha-3.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system (CMMS, EAM, or manual entry).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wol_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_pk_unique
    query: 'SELECT work_order_line_sk

      FROM predictive_operations.work_order_line

      GROUP BY work_order_line_sk

      HAVING COUNT(*) > 1'
  - name: wol_wo_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_wo_fk_orphan
    query: 'SELECT wol.* FROM predictive_operations.work_order_line wol

      LEFT JOIN predictive_operations.work_order wo ON wol.work_order_sk = wo.work_order_sk

      WHERE wo.work_order_sk IS NULL AND wol.work_order_sk IS NOT NULL'
  - name: wol_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wol_rowcount
    query: SELECT COUNT(*) AS work_order_line_rows FROM predictive_operations.work_order_line
  - name: wol_type_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: wol_type_distribution
    query: 'SELECT line_type, COUNT(*) AS line_count

      FROM predictive_operations.work_order_line

      GROUP BY line_type'
  - name: wol_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_single_currency
    query: 'SELECT ''work_order_line'' AS table_name, COUNT(DISTINCT currency_code) AS currencies

      FROM predictive_operations.work_order_line

      HAVING COUNT(DISTINCT currency_code) > 1 OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >
      0'
  - name: wol_wo_currency_match
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wol_wo_currency_match
    query: 'SELECT wol.work_order_line_id, wol.currency_code AS line_currency, wo.currency_code AS wo_currency

      FROM predictive_operations.work_order_line wol

      JOIN predictive_operations.work_order wo ON wol.work_order_sk = wo.work_order_sk

      WHERE wol.currency_code != wo.currency_code'
- name: workforce_coverage_exception
  physicalName: predictive_operations.workforce_coverage_exception
  physicalType: table
  description: Unfilled workforce demand exceptions with severity and suggested operational action.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: workforce_coverage_exception_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: workforce_coverage_exception_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the exception.
  - name: workforce_optimization_run_id
    logicalType: string
    physicalType: STRING
    required: true
    description: workforce_optimization_run.workforce_optimization_run_id.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: business_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Local business date (ISO 8601).
  - name: interval_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Inclusive understaffed interval start (UTC).
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Exclusive understaffed interval end (UTC).
  - name: department_or_zone
    logicalType: string
    physicalType: STRING
    required: true
    description: Department or zone.
  - name: role_code
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Role. Allowed values: cashier, sales_associate, fulfillment, inventory, supervisor.'
  - name: required_headcount
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: Required headcount for the interval.
  - name: scheduled_headcount
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: Scheduled / recommended headcount for the interval.
  - name: shortfall_headcount
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: required - scheduled (positive when understaffed).
  - name: severity
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Severity. Allowed values: low, medium, high, critical.'
  - name: exception_explanation
    logicalType: string
    physicalType: STRING
    required: true
    description: Why coverage could not be met.
  - name: suggested_action
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Suggested action. Allowed values: call_in, transfer, shorten_interval_service, overtime,
      accept_risk, hire_temp.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating pipeline or system.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wce_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_keys_not_null
    query: "SELECT * FROM predictive_operations.workforce_coverage_exception\nWHERE workforce_coverage_exception_sk\
      \ IS NULL OR workforce_coverage_exception_id IS NULL\n   OR workforce_optimization_run_id IS NULL\
      \ OR store_id IS NULL OR business_date IS NULL\n   OR interval_start_ts IS NULL OR interval_end_ts\
      \ IS NULL\n   OR department_or_zone IS NULL OR role_code IS NULL\n   OR required_headcount IS NULL\
      \ OR scheduled_headcount IS NULL OR shortfall_headcount IS NULL\n   OR severity IS NULL OR exception_explanation\
      \ IS NULL OR suggested_action IS NULL"
  - name: wce_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_pk_unique
    query: 'SELECT workforce_coverage_exception_sk

      FROM predictive_operations.workforce_coverage_exception

      GROUP BY workforce_coverage_exception_sk

      HAVING COUNT(*) > 1'
  - name: wce_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_id_unique
    query: 'SELECT workforce_coverage_exception_id

      FROM predictive_operations.workforce_coverage_exception

      GROUP BY workforce_coverage_exception_id

      HAVING COUNT(*) > 1'
  - name: wce_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_store_fk_orphan
    query: 'SELECT t.* FROM predictive_operations.workforce_coverage_exception t

      LEFT JOIN store.store st ON t.store_sk = st.store_sk

      WHERE st.store_sk IS NULL AND t.store_sk IS NOT NULL'
  - name: wce_run_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_run_fk_orphan
    query: "SELECT t.* FROM predictive_operations.workforce_coverage_exception t\nLEFT JOIN predictive_operations.workforce_optimization_run\
      \ r\n  ON t.workforce_optimization_run_id = r.workforce_optimization_run_id\nWHERE r.workforce_optimization_run_id\
      \ IS NULL AND t.workforce_optimization_run_id IS NOT NULL"
  - name: wce_interval_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_interval_order
    query: 'SELECT * FROM predictive_operations.workforce_coverage_exception

      WHERE interval_end_ts <= interval_start_ts'
  - name: wce_counts_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_counts_nonnegative
    query: 'SELECT * FROM predictive_operations.workforce_coverage_exception

      WHERE required_headcount < 0 OR scheduled_headcount < 0 OR shortfall_headcount < 0'
  - name: wce_role_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_role_domain
    query: 'SELECT * FROM predictive_operations.workforce_coverage_exception

      WHERE role_code NOT IN (''cashier'', ''sales_associate'', ''fulfillment'', ''inventory'', ''supervisor'')'
  - name: wce_severity_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_severity_domain
    query: 'SELECT * FROM predictive_operations.workforce_coverage_exception

      WHERE severity NOT IN (''low'', ''medium'', ''high'', ''critical'')'
  - name: wce_action_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wce_action_domain
    query: "SELECT * FROM predictive_operations.workforce_coverage_exception\nWHERE suggested_action NOT\
      \ IN (\n  'call_in', 'transfer', 'shorten_interval_service', 'overtime', 'accept_risk', 'hire_temp'\n\
      )"
  - name: wce_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wce_rowcount
    query: 'SELECT COUNT(*) AS workforce_coverage_exception_rows

      FROM predictive_operations.workforce_coverage_exception'
