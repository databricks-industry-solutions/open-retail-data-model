- name: gold_labor_risk
  physicalName: predictive_operations.gold_labor_risk
  physicalType: view
  description: 'Store-grain labor/workforce risk sub-score (0-100, higher = riskier). Transparent heuristic:
    100 * (1 - coverage_pct) over the next 7 days, plus escalators for critical shortfall intervals. Slots
    into gold_store_operational_risk.labor_risk (ADR 0043).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_name
    logicalType: string
    physicalType: STRING
    description: Display name of the store.
  - name: region
    logicalType: string
    physicalType: STRING
    description: Store region for roll-up.
  - name: district
    logicalType: string
    physicalType: STRING
    description: Store district for roll-up.
  - name: as_of_date
    logicalType: date
    physicalType: DATE
    description: Date the sub-score is computed for (the view evaluates at query time).
  - name: required_hours_7d
    description: Required labor hours summed over the 7-day observation window.
  - name: shortfall_hours_7d
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Unmet required hours summed over the 7-day observation window.
  - name: avg_coverage_pct
    logicalType: number
    physicalType: DOUBLE
    description: Mean interval coverage ratio over the window (1.0 = fully covered).
  - name: critical_intervals
    logicalType: integer
    physicalType: BIGINT
    description: Count of intervals in the window at critical coverage (below 35% covered).
  - name: high_or_critical_intervals
    logicalType: integer
    physicalType: BIGINT
    description: Count of intervals in the window at high or critical coverage (below 60% covered).
  - name: intervals_scored
    logicalType: integer
    physicalType: BIGINT
    description: How many intervals contributed to the sub-score; a small count makes the score noisy.
  - name: labor_risk
    logicalType: number
    physicalType: DOUBLE
    description: Labor/workforce sub-score, 0-100, higher = riskier. A transparent HEURISTIC INDEX built
      from coverage shortfall plus critical-interval escalators, not a calibrated probability. Feeds gold_store_operational_risk.labor_risk
      (ADR 0043).
