- name: labor_standard
  physicalName: predictive_operations.labor_standard
  physicalType: table
  description: Versioned workload-to-labor standards for Workforce Optimization. Data-driven configuration,
    not hardcoded pipeline logic.
  tags:
  - reference
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: labor_standard_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per SCD2 version.
  - name: labor_standard_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the standard (stable across versions).
  - name: standard_version
    logicalType: string
    physicalType: STRING
    required: true
    description: Configuration version label (e.g. v1, 2026-Q3).
  - name: role_code
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Role the standard applies to. Allowed values: cashier, sales_associate, fulfillment,
      inventory, supervisor.'
  - name: demand_driver
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Demand driver. Allowed values: transaction_count, foot_traffic, pickup_orders, receiving_units,
      store_open_coverage, minimum_coverage.'
  - name: department_or_zone
    logicalType: string
    physicalType: STRING
    required: false
    description: Optional department/zone scope; NULL or storewide = all zones.
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    required: true
    description: Planning interval length in minutes (default 30).
  - name: driver_units_per_labor_hour
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: How many driver units one labor hour covers (e.g. 30 transactions per cashier hour).
      Must be positive except for coverage drivers.
  - name: labor_hours_per_driver_unit
    logicalType: number
    physicalType: DECIMAL(18,6)
    required: false
    description: Optional inverse form (hours per driver unit). When set, used preferentially over driver_units_per_labor_hour.
  - name: minimum_headcount
    logicalType: integer
    physicalType: INT
    required: true
    description: Minimum headcount required whenever the store is open for this role/zone.
  - name: coverage_rationale
    logicalType: string
    physicalType: STRING
    required: true
    description: Human-readable explanation of why this standard exists.
  - name: is_active
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE when this version may be applied.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for current.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the standard was created (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the standard was last modified (UTC, ISO 8601).
