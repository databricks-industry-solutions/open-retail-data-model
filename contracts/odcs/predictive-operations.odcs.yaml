    physicalType: STRING
    required: true
    description: 'Role. Allowed values: cashier, sales_associate, fulfillment, inventory, supervisor.'
  - name: demand_driver
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Driver being forecast. Allowed values: transaction_count, foot_traffic, pickup_orders,
      receiving_units, store_open_coverage, minimum_coverage.'
  - name: forecast_driver_units
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: Forecasted driver units for the interval.
  - name: forecast_lower_bound
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Lower uncertainty proxy bound.
  - name: forecast_upper_bound
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: false
    description: Upper uncertainty proxy bound.
  - name: forecast_method
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Method. Allowed values: seasonal_rolling_avg, hierarchical_fallback, model, manual.'
  - name: model_version
    logicalType: string
    physicalType: STRING
    required: false
    description: Version of the model that produced the row when forecast_method = model; NULL for heuristic
      rows.
  - name: forecast_horizon_days
    logicalType: integer
    physicalType: INT
    required: true
    description: Forward horizon in days this line belongs to.
  - name: forecast_origin_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the forecast was produced (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating pipeline or system.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wdf_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_keys_not_null
    query: "SELECT * FROM predictive_operations.workforce_demand_forecast\nWHERE workforce_demand_forecast_sk\
      \ IS NULL OR workforce_demand_forecast_id IS NULL\n   OR store_id IS NULL OR business_date IS NULL\n\
      \   OR interval_start_ts IS NULL OR interval_end_ts IS NULL\n   OR interval_minutes IS NULL OR department_or_zone\
      \ IS NULL\n   OR role_code IS NULL OR demand_driver IS NULL\n   OR forecast_driver_units IS NULL\
      \ OR forecast_method IS NULL\n   OR forecast_horizon_days IS NULL OR forecast_origin_ts IS NULL"
  - name: wdf_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_pk_unique
    query: 'SELECT workforce_demand_forecast_sk

      FROM predictive_operations.workforce_demand_forecast

      GROUP BY workforce_demand_forecast_sk

      HAVING COUNT(*) > 1'
  - name: wdf_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_id_unique
    query: 'SELECT workforce_demand_forecast_id

      FROM predictive_operations.workforce_demand_forecast

      GROUP BY workforce_demand_forecast_id

      HAVING COUNT(*) > 1'
  - name: wdf_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_store_fk_orphan
    query: 'SELECT t.* FROM predictive_operations.workforce_demand_forecast t

      LEFT JOIN store.store st ON t.store_sk = st.store_sk

      WHERE st.store_sk IS NULL AND t.store_sk IS NOT NULL'
  - name: wdf_run_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_run_fk_orphan
    query: "SELECT t.* FROM predictive_operations.workforce_demand_forecast t\nLEFT JOIN predictive_operations.workforce_optimization_run\
      \ r\n  ON t.workforce_optimization_run_id = r.workforce_optimization_run_id\nWHERE r.workforce_optimization_run_id\
      \ IS NULL AND t.workforce_optimization_run_id IS NOT NULL"
  - name: wdf_interval_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_interval_order
    query: 'SELECT * FROM predictive_operations.workforce_demand_forecast

      WHERE interval_end_ts <= interval_start_ts OR interval_minutes <= 0'
  - name: wdf_units_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_units_nonnegative
    query: 'SELECT * FROM predictive_operations.workforce_demand_forecast

      WHERE forecast_driver_units < 0'
  - name: wdf_role_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_role_domain
    query: 'SELECT * FROM predictive_operations.workforce_demand_forecast

      WHERE role_code NOT IN (''cashier'', ''sales_associate'', ''fulfillment'', ''inventory'', ''supervisor'')'
  - name: wdf_driver_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_driver_domain
    query: "SELECT * FROM predictive_operations.workforce_demand_forecast\nWHERE demand_driver NOT IN\
      \ (\n  'transaction_count', 'foot_traffic', 'pickup_orders',\n  'receiving_units', 'store_open_coverage',\
      \ 'minimum_coverage'\n)"
  - name: wdf_method_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wdf_method_domain
    query: 'SELECT * FROM predictive_operations.workforce_demand_forecast

      WHERE forecast_method NOT IN (''seasonal_rolling_avg'', ''hierarchical_fallback'', ''model'', ''manual'')'
  - name: wdf_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wdf_rowcount
    query: 'SELECT COUNT(*) AS workforce_demand_forecast_rows

      FROM predictive_operations.workforce_demand_forecast'
  - name: wlr_forecast_missing_standard
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every (role, driver, zone) the demand forecast produces must resolve to a CURRENT labor
      standard; an unmatched combination is silently dropped by the requirement step, understating required
      hours rather than erroring. A standard scoped storewide (department_or_zone NULL or 'storewide')
      covers every zone.
    query: "SELECT f.role_code, f.demand_driver, f.department_or_zone\nFROM (\n  SELECT DISTINCT role_code,\
      \ demand_driver, department_or_zone\n  FROM predictive_operations.workforce_demand_forecast\n) f\n\
      LEFT JOIN (\n  SELECT DISTINCT role_code, demand_driver, department_or_zone\n  FROM predictive_operations.labor_standard\n\
      \  WHERE is_current = TRUE\n) s\n  ON  s.role_code = f.role_code\n  AND s.demand_driver = f.demand_driver\n\
      \  AND (s.department_or_zone IS NULL\n       OR s.department_or_zone = 'storewide'\n       OR s.department_or_zone\
      \ = f.department_or_zone)\nWHERE s.role_code IS NULL"
- name: workforce_labor_requirement
  physicalName: predictive_operations.workforce_labor_requirement
  physicalType: table
  description: Required labor hours/headcount from forecast drivers and versioned labor standards.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: workforce_labor_requirement_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: workforce_labor_requirement_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the requirement line.
  - name: workforce_optimization_run_id
