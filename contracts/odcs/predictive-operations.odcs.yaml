    required: true
    description: Whether this schedule is currently active.
  - name: estimated_duration_hours
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: Estimated labor hours per occurrence.
  - name: estimated_cost
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Estimated cost per occurrence in base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Reporting/base currency for cost columns, ISO 4217 alpha-3.
  - name: effective_from_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'SCD2: inclusive start date this version became effective.'
  - name: effective_to_date
    logicalType: date
    physicalType: DATE
    required: false
    description: 'SCD2: exclusive end date; NULL for the current version.'
  - name: is_current
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: 'SCD2: TRUE for the currently active version.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system (CMMS, EAM, or manual entry).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: ms_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ms_pk_unique
    query: 'SELECT maintenance_schedule_sk

      FROM predictive_operations.maintenance_schedule

      GROUP BY maintenance_schedule_sk

      HAVING COUNT(*) > 1'
  - name: ms_scd2_current_open
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ms_scd2_current_open
    query: 'SELECT * FROM predictive_operations.maintenance_schedule

      WHERE is_current = TRUE AND effective_to_date IS NOT NULL'
  - name: ms_scd2_noncurrent_closed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ms_scd2_noncurrent_closed
    query: 'SELECT * FROM predictive_operations.maintenance_schedule

      WHERE is_current = FALSE AND effective_to_date IS NULL'
  - name: ms_scd2_start_before_end
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ms_scd2_start_before_end
    query: 'SELECT * FROM predictive_operations.maintenance_schedule

      WHERE effective_to_date IS NOT NULL AND effective_from_date > effective_to_date'
  - name: ms_equipment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ms_equipment_fk_orphan
    query: 'SELECT ms.* FROM predictive_operations.maintenance_schedule ms

      LEFT JOIN equipment.equipment eq ON ms.equipment_sk = eq.equipment_sk

      WHERE eq.equipment_sk IS NULL AND ms.equipment_sk IS NOT NULL'
  - name: ms_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ms_single_currency
    query: 'SELECT ''maintenance_schedule'' AS table_name, COUNT(DISTINCT currency_code) AS currencies

      FROM predictive_operations.maintenance_schedule

      HAVING COUNT(DISTINCT currency_code) > 1 OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >
      0'
  - name: ms_interval_positive
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ms_interval_positive
    query: 'SELECT * FROM predictive_operations.maintenance_schedule

      WHERE interval_days <= 0'
  - name: ms_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: ms_rowcount
    query: SELECT COUNT(*) AS schedule_rows FROM predictive_operations.maintenance_schedule
  - name: ms_overdue_count
    type: sql
    dimension: accuracy
    severity: info
    description: ms_overdue_count
    query: 'SELECT COUNT(*) AS overdue_schedules

      FROM predictive_operations.maintenance_schedule

      WHERE is_active = TRUE AND next_due_date < CURRENT_DATE()'
- name: store_risk_score
  physicalName: predictive_operations.store_risk_score
  physicalType: table
  description: Append-only store x as_of_date snapshot of the Store Operational Risk Score (heuristic
    index) and its per-domain sub-scores. Store Performance use case, Predictive Operations. See ADR 0028.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_risk_score_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: store_risk_score_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the score snapshot at the table grain (store x as_of_date
      x score_method), e.g. "<store_id>|<as_of_date>|<score_method>". score_method is part of the key
      so a future model-backed row does not collide with the heuristic row for the same store/date.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk. Carries the CURRENT store version (the gold view scores as-of today);
      a historical-backfill pipeline should resolve the version effective at as_of_date. Nullable only
      if an adopter pipeline scores a store absent from the dimension (tolerated by the srs_store_fk_orphan
      check); the shipped gold view always populates it. Join on the durable store_id, not this per-deployment
      surrogate.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: as_of_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Snapshot date; conforms to fiscal_calendar.date_key (ISO 8601).
  - name: horizon_days
    logicalType: integer
    physicalType: INT
    required: true
    description: Declared forward assessment horizon in days (7 in v1) — the label the score is interpreted
      against, uniform across a snapshot so scores are comparable. Not a claim every input is windowed
      to 7 days; sub-score observation windows differ by domain (see design spec §4.7).
  - name: operational_risk_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Store Operational Risk Score, 0-100, higher = riskier. Heuristic index, NOT a probability.
  - name: operational_risk_tier
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Risk tier. Allowed values: UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL. UNKNOWN = no domain
      sub-score was present (domains_scored = 0), so the store is unscored, not low-risk (missing = unknown,
      not safe).'
  - name: domains_scored
    logicalType: integer
    physicalType: INT
    required: false
    description: How many domains had a present (non-NULL) sub-score feeding the composite. Max is 5 when
      labor is present (cx still deferred); 0 means the store is unscored (tier UNKNOWN).
  - name: top_risk_domains
    logicalType: string
    physicalType: STRING
    required: false
    description: Up-to-3 domains with the largest weighted contribution (the Diagnose step), comma-separated.
  - name: inventory_risk
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Inventory domain sub-score (from gold_inventory_risk). 0-100 or NULL.
  - name: supply_chain_risk
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Supply-chain domain sub-score (from gold_procurement_risk). 0-100 or NULL.
  - name: sales_margin_risk
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Sales/margin domain sub-score (from BMV gold). 0-100 or NULL.
  - name: equipment_risk
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Equipment domain sub-score (from gold_equipment_health). 0-100 or NULL.
  - name: labor_risk
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Labor/workforce domain sub-score from gold_labor_risk (0-100). NULL when unscored.
  - name: cx_risk
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Customer-experience domain sub-score. DEFERRED — always NULL until a CX source lands.
  - name: score_method
    logicalType: string
    physicalType: STRING
    required: true
    description: 'How the score was produced. Allowed values: heuristic, model.'
  - name: model_version
    logicalType: string
    physicalType: STRING
    required: false
    description: Version of the model that produced the row when score_method = model; NULL for heuristic
      rows.
  - name: predicted_impact_amount
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Estimated business impact (e.g. lost sales) in currency_code. Reserved for a model/adopter
      pipeline; NULL in the shipped heuristic.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Reporting currency for predicted_impact_amount, ISO 4217 alpha-3; NULL when predicted_impact_amount
      is NULL.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system or pipeline that produced this score.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: srs_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: srs_pk_unique
    query: 'SELECT store_risk_score_sk

      FROM predictive_operations.store_risk_score

      GROUP BY store_risk_score_sk

      HAVING COUNT(*) > 1'
  - name: srs_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Grain is store x as_of_date x score_method; a duplicate is a double-write.
    query: 'SELECT store_id, as_of_date, score_method

      FROM predictive_operations.store_risk_score

      GROUP BY store_id, as_of_date, score_method

      HAVING COUNT(*) > 1'
  - name: srs_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: srs_store_fk_orphan
    query: 'SELECT srs.* FROM predictive_operations.store_risk_score srs

      LEFT JOIN store.store st ON srs.store_sk = st.store_sk

      WHERE st.store_sk IS NULL AND srs.store_sk IS NOT NULL'
  - name: srs_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: srs_score_range
    query: 'SELECT * FROM predictive_operations.store_risk_score

      WHERE operational_risk_score IS NOT NULL AND operational_risk_score NOT BETWEEN 0 AND 100'
  - name: srs_tier_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: srs_tier_domain
    query: 'SELECT * FROM predictive_operations.store_risk_score

      WHERE operational_risk_tier NOT IN (''UNKNOWN'', ''LOW'', ''MEDIUM'', ''HIGH'', ''CRITICAL'')'
  - name: srs_method_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: srs_method_domain
    query: 'SELECT * FROM predictive_operations.store_risk_score

      WHERE score_method NOT IN (''heuristic'', ''model'')'
  - name: srs_subscore_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every present sub-score must be 0-100.
    query: "SELECT * FROM predictive_operations.store_risk_score\nWHERE (inventory_risk    IS NOT NULL\
      \ AND inventory_risk    NOT BETWEEN 0 AND 100)\n   OR (supply_chain_risk IS NOT NULL AND supply_chain_risk\
      \ NOT BETWEEN 0 AND 100)\n   OR (sales_margin_risk IS NOT NULL AND sales_margin_risk NOT BETWEEN\
      \ 0 AND 100)\n   OR (equipment_risk    IS NOT NULL AND equipment_risk    NOT BETWEEN 0 AND 100)\n\
      \   OR (labor_risk        IS NOT NULL AND labor_risk        NOT BETWEEN 0 AND 100)\n   OR (cx_risk\
      \           IS NOT NULL AND cx_risk           NOT BETWEEN 0 AND 100)"
  - name: srs_deferred_subscores_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'ADR 0043: labor_risk is live; only cx_risk remains deferred and must be NULL.'
    query: 'SELECT * FROM predictive_operations.store_risk_score

      WHERE cx_risk IS NOT NULL'
  - name: srs_impact_currency_paired
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A predicted impact amount requires a currency, and vice versa.
    query: 'SELECT * FROM predictive_operations.store_risk_score

      WHERE (predicted_impact_amount IS NULL) != (currency_code IS NULL)'
  - name: srs_impact_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: srs_impact_single_currency
    query: 'SELECT ''store_risk_score'' AS table_name, COUNT(DISTINCT currency_code) AS currencies

      FROM predictive_operations.store_risk_score

      WHERE currency_code IS NOT NULL

      HAVING COUNT(DISTINCT currency_code) > 1'
  - name: srs_horizon_positive
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: srs_horizon_positive
    query: 'SELECT * FROM predictive_operations.store_risk_score

      WHERE horizon_days <= 0'
  - name: srs_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: srs_rowcount
    query: SELECT COUNT(*) AS store_risk_score_rows FROM predictive_operations.store_risk_score
  - name: srs_tier_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: srs_tier_distribution
    query: 'SELECT operational_risk_tier, COUNT(*) AS tier_count

      FROM predictive_operations.store_risk_score

      GROUP BY operational_risk_tier'
- name: work_order
  physicalName: predictive_operations.work_order
  physicalType: table
  description: Maintenance work order header for in-store equipment. Tracks preventive, corrective, and
    emergency maintenance lifecycle.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: work_order_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: work_order_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the work order.
  - name: equipment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to equipment.equipment_sk (version-specific).
    relationships:
    - to: equipment.equipment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: equipment
      - property: enforced
        value: false
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable equipment business key.
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk (version-specific).
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: work_order_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Type of maintenance. Allowed values: preventive, corrective, emergency, inspection.'
  - name: priority
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Work order priority. Allowed values: critical, high, medium, low.'
  - name: work_order_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Lifecycle status. Allowed values: open, in_progress, on_hold, completed, cancelled.'
  - name: title
    logicalType: string
    physicalType: STRING
    required: false
    description: Short summary of the work order.
  - name: description
    logicalType: string
    physicalType: STRING
    required: false
    description: Detailed description of the maintenance task.
  - name: failure_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Standardized failure/reason code triggering the work order.
  - name: assigned_to
    logicalType: string
    physicalType: STRING
    required: false
    description: Technician or team assigned to the work order.
    classification: restricted
    tags:
    - dbx_pii_name
  - name: vendor_name
    logicalType: string
    physicalType: STRING
    required: false
    description: External maintenance vendor, if outsourced.
  - name: created_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Date the work order was created (ISO 8601).
  - name: scheduled_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Planned date for the maintenance work (ISO 8601).
  - name: started_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Date work actually began (ISO 8601).
  - name: completed_date
    logicalType: date
    physicalType: DATE
    required: false
    description: Date the work order was completed (ISO 8601).
  - name: estimated_duration_hours
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: Estimated labor hours for the task.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (estimated_duration_hours IS NULL OR estimated_duration_hours >= 0).
  - name: actual_duration_hours
    logicalType: number
    physicalType: DECIMAL(6,1)
    required: false
    description: Actual labor hours spent.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (actual_duration_hours IS NULL OR actual_duration_hours >= 0).
  - name: estimated_cost
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Estimated total cost (parts + labor) in base currency.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (estimated_cost IS NULL OR estimated_cost >= 0).
  - name: actual_cost
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Actual total cost (parts + labor) in base currency.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (actual_cost IS NULL OR actual_cost >= 0).
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: true
    description: Reporting/base currency for cost columns, ISO 4217 alpha-3.
  - name: downtime_hours
    logicalType: number
    physicalType: DECIMAL(8,2)
    required: false
    description: Equipment downtime caused by this maintenance event, in hours.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (downtime_hours IS NULL OR downtime_hours >= 0).
  - name: root_cause
    logicalType: string
    physicalType: STRING
    required: false
    description: Root cause analysis notes after completion.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system (CMMS, EAM, or manual entry).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wo_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_pk_unique
    query: 'SELECT work_order_sk

      FROM predictive_operations.work_order

      GROUP BY work_order_sk

      HAVING COUNT(*) > 1'
  - name: wo_equipment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_equipment_fk_orphan
    query: 'SELECT wo.* FROM predictive_operations.work_order wo

      LEFT JOIN equipment.equipment eq ON wo.equipment_sk = eq.equipment_sk

      WHERE eq.equipment_sk IS NULL AND wo.equipment_sk IS NOT NULL'
  - name: wo_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_store_fk_orphan
    query: 'SELECT wo.* FROM predictive_operations.work_order wo

      LEFT JOIN store.store st ON wo.store_sk = st.store_sk

      WHERE st.store_sk IS NULL AND wo.store_sk IS NOT NULL'
  - name: wo_completed_has_date
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_completed_has_date
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE work_order_status = ''completed'' AND completed_date IS NULL'
  - name: wo_completed_after_created
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_completed_after_created
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE completed_date IS NOT NULL AND completed_date < created_date'
  - name: wo_cost_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_cost_nonnegative
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE actual_cost IS NOT NULL AND actual_cost < 0'
  - name: wo_downtime_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_downtime_nonnegative
    query: 'SELECT * FROM predictive_operations.work_order

      WHERE downtime_hours IS NOT NULL AND downtime_hours < 0'
  - name: wo_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wo_single_currency
    query: 'SELECT ''work_order'' AS table_name, COUNT(DISTINCT currency_code) AS currencies

      FROM predictive_operations.work_order

      HAVING COUNT(DISTINCT currency_code) > 1 OR COUNT(CASE WHEN currency_code IS NULL THEN 1 END) >
      0'
  - name: wo_store_equipment_mismatch
    type: sql
    dimension: accuracy
    severity: warning
    mustBe: 0
    unit: rows
    description: wo_store_equipment_mismatch
    query: "SELECT wo.work_order_id, wo.store_sk AS wo_store_sk, eq.store_sk AS eq_store_sk\nFROM predictive_operations.work_order\
      \ wo\nJOIN equipment.equipment eq\n  ON eq.equipment_sk = wo.equipment_sk\nWHERE wo.store_sk !=\
      \ eq.store_sk"
  - name: wo_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wo_rowcount
    query: SELECT COUNT(*) AS work_order_rows FROM predictive_operations.work_order
  - name: wo_status_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: wo_status_distribution
    query: 'SELECT work_order_status, COUNT(*) AS status_count

      FROM predictive_operations.work_order

      GROUP BY work_order_status'
  - name: wo_type_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: wo_type_distribution
    query: 'SELECT work_order_type, COUNT(*) AS type_count

      FROM predictive_operations.work_order

      GROUP BY work_order_type'
  - name: wo_open_count
    type: sql
    dimension: accuracy
    severity: info
    description: wo_open_count
    query: 'SELECT COUNT(*) AS open_work_orders

      FROM predictive_operations.work_order

      WHERE work_order_status IN (''open'', ''in_progress'')'
- name: work_order_line
  physicalName: predictive_operations.work_order_line
  physicalType: table
  description: 'Work order line items: parts, labor, and service charges for equipment maintenance.'
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: work_order_line_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: work_order_line_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the line.
  - name: work_order_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to work_order.work_order_sk.
    relationships:
    - to: work_order.work_order_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: predictive_operations
      - property: enforced
        value: false
  - name: work_order_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable work order business key.
  - name: line_type
    logicalType: string
    physicalType: STRING
