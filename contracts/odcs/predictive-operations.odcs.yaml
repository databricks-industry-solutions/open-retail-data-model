        value: false
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable equipment business key.
  - name: schedule_name
    logicalType: string
    physicalType: STRING
    required: true
    description: Name of the maintenance schedule (e.g. "Quarterly HVAC Filter Change").
  - name: task_description
    logicalType: string
    physicalType: STRING
    required: false
    description: Description of the preventive maintenance task.
  - name: frequency
    logicalType: string
    physicalType: STRING
    required: true
    description: 'How often the task recurs. Allowed values: daily, weekly, biweekly, monthly, quarterly,
