  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: business_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Local business date (ISO 8601).
  - name: interval_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Inclusive interval start (UTC).
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Exclusive interval end (UTC).
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    required: true
    description: Interval length in minutes.
  - name: department_or_zone
    logicalType: string
    physicalType: STRING
    required: true
    description: Department or zone.
  - name: role_code
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Role. Allowed values: cashier, sales_associate, fulfillment, inventory, supervisor.'
  - name: demand_driver
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Driver applied. Allowed values: transaction_count, foot_traffic, pickup_orders, receiving_units,
      store_open_coverage, minimum_coverage.'
  - name: forecast_driver_units
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: Forecasted workload units.
  - name: labor_standard_id
    logicalType: string
    physicalType: STRING
    required: true
    description: labor_standard.labor_standard_id applied.
  - name: labor_standard_version
    logicalType: string
    physicalType: STRING
    required: true
    description: labor_standard.standard_version applied.
  - name: applied_labor_standard
    logicalType: number
    physicalType: DECIMAL(18,6)
    required: true
    description: Hours per driver unit (or equivalent) used.
  - name: required_labor_hours
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: Required labor hours for the interval.
  - name: required_headcount
    logicalType: number
    physicalType: DECIMAL(18,4)
    required: true
    description: Required headcount (hours / interval length in hours), ceil-ready.
  - name: minimum_headcount
    logicalType: integer
    physicalType: INT
    required: true
    description: Minimum coverage headcount from the standard.
  - name: coverage_rationale
    logicalType: string
    physicalType: STRING
    required: true
    description: Explanation of why this requirement was generated.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating pipeline or system.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wlr_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_keys_not_null
    query: "SELECT * FROM predictive_operations.workforce_labor_requirement\nWHERE workforce_labor_requirement_sk\
      \ IS NULL OR workforce_labor_requirement_id IS NULL\n   OR store_id IS NULL OR business_date IS\
      \ NULL\n   OR interval_start_ts IS NULL OR interval_end_ts IS NULL\n   OR interval_minutes IS NULL\
      \ OR department_or_zone IS NULL\n   OR role_code IS NULL OR demand_driver IS NULL\n   OR forecast_driver_units\
      \ IS NULL OR labor_standard_id IS NULL\n   OR labor_standard_version IS NULL OR applied_labor_standard\
      \ IS NULL\n   OR required_labor_hours IS NULL OR required_headcount IS NULL\n   OR minimum_headcount\
      \ IS NULL OR coverage_rationale IS NULL"
  - name: wlr_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_pk_unique
    query: 'SELECT workforce_labor_requirement_sk

      FROM predictive_operations.workforce_labor_requirement

      GROUP BY workforce_labor_requirement_sk

      HAVING COUNT(*) > 1'
  - name: wlr_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_id_unique
    query: 'SELECT workforce_labor_requirement_id

      FROM predictive_operations.workforce_labor_requirement

      GROUP BY workforce_labor_requirement_id

      HAVING COUNT(*) > 1'
  - name: wlr_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_store_fk_orphan
    query: 'SELECT t.* FROM predictive_operations.workforce_labor_requirement t

      LEFT JOIN store.store st ON t.store_sk = st.store_sk

      WHERE st.store_sk IS NULL AND t.store_sk IS NOT NULL'
  - name: wlr_run_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_run_fk_orphan
    query: "SELECT t.* FROM predictive_operations.workforce_labor_requirement t\nLEFT JOIN predictive_operations.workforce_optimization_run\
      \ r\n  ON t.workforce_optimization_run_id = r.workforce_optimization_run_id\nWHERE r.workforce_optimization_run_id\
      \ IS NULL AND t.workforce_optimization_run_id IS NOT NULL"
  - name: wlr_labor_standard_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_labor_standard_fk_orphan
    query: "SELECT t.* FROM predictive_operations.workforce_labor_requirement t\nLEFT JOIN (\n  SELECT\
      \ DISTINCT labor_standard_id\n  FROM predictive_operations.labor_standard\n) ls ON t.labor_standard_id\
      \ = ls.labor_standard_id\nWHERE ls.labor_standard_id IS NULL AND t.labor_standard_id IS NOT NULL"
  - name: wlr_interval_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_interval_order
    query: 'SELECT * FROM predictive_operations.workforce_labor_requirement

      WHERE interval_end_ts <= interval_start_ts OR interval_minutes <= 0'
  - name: wlr_hours_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_hours_nonnegative
    query: "SELECT * FROM predictive_operations.workforce_labor_requirement\nWHERE required_labor_hours\
      \ < 0 OR required_headcount < 0\n   OR minimum_headcount < 0 OR forecast_driver_units < 0\n   OR\
      \ applied_labor_standard <= 0"
  - name: wlr_role_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_role_domain
    query: 'SELECT * FROM predictive_operations.workforce_labor_requirement

      WHERE role_code NOT IN (''cashier'', ''sales_associate'', ''fulfillment'', ''inventory'', ''supervisor'')'
  - name: wlr_driver_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wlr_driver_domain
    query: "SELECT * FROM predictive_operations.workforce_labor_requirement\nWHERE demand_driver NOT IN\
      \ (\n  'transaction_count', 'foot_traffic', 'pickup_orders',\n  'receiving_units', 'store_open_coverage',\
      \ 'minimum_coverage'\n)"
  - name: wlr_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wlr_rowcount
    query: 'SELECT COUNT(*) AS workforce_labor_requirement_rows

      FROM predictive_operations.workforce_labor_requirement'
- name: workforce_optimization_run
  physicalName: predictive_operations.workforce_optimization_run
  physicalType: table
  description: Run-level metrics for Workforce Optimization forecast and schedule executions.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: workforce_optimization_run_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: workforce_optimization_run_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable run business key (UUID or deterministic stamp).
  - name: forecast_horizon_days
    logicalType: integer
    physicalType: INT
    required: true
    description: Forward horizon in days.
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    required: true
    description: Planning interval length in minutes.
  - name: forecast_method
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Forecast method used. Allowed values: seasonal_rolling_avg, hierarchical_fallback, model,
      manual.'
  - name: optimizer_method
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Scheduler method. Allowed values: greedy_heuristic, ortools, pulp, other.'
  - name: input_employee_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Employees considered.
  - name: input_demand_intervals
    logicalType: integer
    physicalType: INT
    required: false
    description: Demand intervals considered.
  - name: rejected_quality_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Input rows rejected by quality checks.
  - name: forecast_line_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Forecast lines produced.
  - name: requirement_line_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Labor requirement lines produced.
  - name: recommended_shift_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Recommended shifts produced.
  - name: exception_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Coverage exceptions produced.
  - name: scheduled_hours_total
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Total recommended scheduled hours.
  - name: required_hours_total
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Total required labor hours.
  - name: coverage_pct
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: scheduled_hours_total / required_hours_total (0-1+).
  - name: unfilled_demand_hours
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Hours of unmet demand.
  - name: estimated_labor_cost
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: Estimated labor cost of recommendations.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: ISO 4217 for estimated_labor_cost.
  - name: fairness_score
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Workload balance proxy (e.g. 1 - CV of assigned hours); higher is fairer.
  - name: forecast_mape
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: MAPE vs actuals when available; NULL otherwise.
  - name: forecast_bias
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Mean forecast error when actuals available; NULL otherwise.
  - name: optimization_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Run status. Allowed values: success, success_partial, infeasible, failed.'
  - name: diagnostics_json
    logicalType: string
    physicalType: STRING
    required: false
    description: Structured diagnostics (JSON string) for debugging.
  - name: data_version
    logicalType: string
    physicalType: STRING
    required: false
    description: Input data version / watermark label.
  - name: run_started_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Run start (UTC, ISO 8601).
  - name: run_completed_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Run completion (UTC, ISO 8601).
  - name: stage_durations_json
    logicalType: string
    physicalType: STRING
    required: false
    description: Per-stage durations in seconds (JSON string).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating pipeline or system.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wor_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wor_keys_not_null
    query: "SELECT * FROM predictive_operations.workforce_optimization_run\nWHERE workforce_optimization_run_sk\
      \ IS NULL OR workforce_optimization_run_id IS NULL\n   OR forecast_horizon_days IS NULL OR interval_minutes\
      \ IS NULL\n   OR forecast_method IS NULL OR optimizer_method IS NULL\n   OR optimization_status\
      \ IS NULL OR run_started_ts IS NULL"
  - name: wor_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wor_pk_unique
    query: 'SELECT workforce_optimization_run_sk

      FROM predictive_operations.workforce_optimization_run

      GROUP BY workforce_optimization_run_sk

      HAVING COUNT(*) > 1'
  - name: wor_run_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wor_run_id_unique
    query: 'SELECT workforce_optimization_run_id

      FROM predictive_operations.workforce_optimization_run

      GROUP BY workforce_optimization_run_id

      HAVING COUNT(*) > 1'
  - name: wor_positive_params
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wor_positive_params
    query: 'SELECT * FROM predictive_operations.workforce_optimization_run

      WHERE forecast_horizon_days <= 0 OR interval_minutes <= 0'
  - name: wor_method_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wor_method_domain
    query: "SELECT * FROM predictive_operations.workforce_optimization_run\nWHERE forecast_method NOT\
      \ IN ('seasonal_rolling_avg', 'hierarchical_fallback', 'model', 'manual')\n   OR optimizer_method\
      \ NOT IN ('greedy_heuristic', 'ortools', 'pulp', 'other')\n   OR optimization_status NOT IN ('success',\
      \ 'success_partial', 'infeasible', 'failed')"
  - name: wor_counts_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wor_counts_nonnegative
    query: "SELECT * FROM predictive_operations.workforce_optimization_run\nWHERE COALESCE(input_employee_count,\
      \ 0) < 0\n   OR COALESCE(input_demand_intervals, 0) < 0\n   OR COALESCE(rejected_quality_count,\
      \ 0) < 0\n   OR COALESCE(forecast_line_count, 0) < 0\n   OR COALESCE(requirement_line_count, 0)\
      \ < 0\n   OR COALESCE(recommended_shift_count, 0) < 0\n   OR COALESCE(exception_count, 0) < 0\n\
      \   OR COALESCE(scheduled_hours_total, 0) < 0\n   OR COALESCE(required_hours_total, 0) < 0\n   OR\
      \ COALESCE(unfilled_demand_hours, 0) < 0\n   OR COALESCE(estimated_labor_cost, 0) < 0"
  - name: wor_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wor_single_currency
    query: "SELECT 'workforce_optimization_run' AS table_name, COUNT(DISTINCT currency_code) AS currencies\n\
      FROM predictive_operations.workforce_optimization_run\nHAVING COUNT(DISTINCT currency_code) > 1\n\
      \    OR COUNT(CASE WHEN estimated_labor_cost IS NOT NULL AND currency_code IS NULL THEN 1 END) >\
      \ 0"
  - name: wor_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wor_rowcount
    query: 'SELECT COUNT(*) AS workforce_optimization_run_rows

      FROM predictive_operations.workforce_optimization_run'
- name: workforce_schedule_recommendation
  physicalName: predictive_operations.workforce_schedule_recommendation
  physicalType: table
  description: Recommended associate shifts from the Workforce Optimization scheduler.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: workforce_schedule_recommendation_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: workforce_schedule_recommendation_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable recommendation / shift ID.
  - name: workforce_optimization_run_id
    logicalType: string
    physicalType: STRING
    required: true
    description: workforce_optimization_run.workforce_optimization_run_id that produced this row.
  - name: employee_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to employee.employee_sk.
    relationships:
    - to: employee.employee_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: labor
      - property: enforced
        value: false
  - name: employee_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable pseudonymous employee business key.
    classification: restricted
    tags:
    - dbx_pii_identifier
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to store.store_sk.
    relationships:
    - to: store.store_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: store
      - property: enforced
        value: false
  - name: store_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable store business key.
  - name: department_or_zone
    logicalType: string
    physicalType: STRING
    required: true
    description: Department or zone.
  - name: role_code
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Role. Allowed values: cashier, sales_associate, fulfillment, inventory, supervisor.'
  - name: shift_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Inclusive recommended shift start (UTC).
  - name: shift_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Exclusive recommended shift end (UTC).
  - name: assigned_hours
    logicalType: number
    physicalType: DECIMAL(8,2)
    required: true
    description: Assigned hours (non-negative).
  - name: estimated_labor_cost
    logicalType: number
    physicalType: DECIMAL(18,2)
    required: false
    description: assigned_hours * hourly_labor_cost in base currency.
  - name: currency_code
    logicalType: string
    physicalType: STRING
    required: false
    description: ISO 4217 for estimated_labor_cost.
  - name: is_availability_ok
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE if assignment falls inside availability.
  - name: is_skill_ok
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE if employee has required skill/role.
  - name: is_store_eligible_ok
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE if employee is eligible for the store.
  - name: is_hours_cap_ok
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE if daily/weekly caps respected.
  - name: is_min_rest_ok
    logicalType: boolean
    physicalType: BOOLEAN
    required: true
    description: TRUE if minimum rest respected.
  - name: recommendation_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Status. Allowed values: proposed, accepted, rejected, superseded.'
  - name: optimizer_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Optimizer outcome for this assignment. Allowed values: optimal, feasible, heuristic,
      infeasible_partial.'
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating pipeline or system.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: wsr_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_keys_not_null
    query: "SELECT * FROM predictive_operations.workforce_schedule_recommendation\nWHERE workforce_schedule_recommendation_sk\
      \ IS NULL\n   OR workforce_schedule_recommendation_id IS NULL\n   OR workforce_optimization_run_id\
      \ IS NULL OR employee_id IS NULL OR store_id IS NULL\n   OR department_or_zone IS NULL OR role_code\
      \ IS NULL\n   OR shift_start_ts IS NULL OR shift_end_ts IS NULL OR assigned_hours IS NULL\n   OR\
      \ is_availability_ok IS NULL OR is_skill_ok IS NULL\n   OR is_store_eligible_ok IS NULL OR is_hours_cap_ok\
      \ IS NULL OR is_min_rest_ok IS NULL\n   OR recommendation_status IS NULL OR optimizer_status IS\
      \ NULL"
  - name: wsr_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_pk_unique
    query: 'SELECT workforce_schedule_recommendation_sk

      FROM predictive_operations.workforce_schedule_recommendation

      GROUP BY workforce_schedule_recommendation_sk

      HAVING COUNT(*) > 1'
  - name: wsr_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_id_unique
    query: 'SELECT workforce_schedule_recommendation_id

      FROM predictive_operations.workforce_schedule_recommendation

      GROUP BY workforce_schedule_recommendation_id

      HAVING COUNT(*) > 1'
  - name: wsr_store_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_store_fk_orphan
    query: 'SELECT t.* FROM predictive_operations.workforce_schedule_recommendation t

      LEFT JOIN store.store st ON t.store_sk = st.store_sk

      WHERE st.store_sk IS NULL AND t.store_sk IS NOT NULL'
  - name: wsr_run_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_run_fk_orphan
    query: "SELECT t.* FROM predictive_operations.workforce_schedule_recommendation t\nLEFT JOIN predictive_operations.workforce_optimization_run\
      \ r\n  ON t.workforce_optimization_run_id = r.workforce_optimization_run_id\nWHERE r.workforce_optimization_run_id\
      \ IS NULL AND t.workforce_optimization_run_id IS NOT NULL"
  - name: wsr_employee_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_employee_fk_orphan
    query: 'SELECT wsr.* FROM predictive_operations.workforce_schedule_recommendation wsr

      LEFT JOIN labor.employee emp ON wsr.employee_sk = emp.employee_sk

      WHERE emp.employee_sk IS NULL AND wsr.employee_sk IS NOT NULL'
  - name: wsr_interval_order
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_interval_order
    query: 'SELECT * FROM predictive_operations.workforce_schedule_recommendation

      WHERE shift_end_ts <= shift_start_ts'
  - name: wsr_hours_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_hours_nonnegative
    query: "SELECT * FROM predictive_operations.workforce_schedule_recommendation\nWHERE assigned_hours\
      \ < 0\n   OR (estimated_labor_cost IS NOT NULL AND estimated_labor_cost < 0)"
  - name: wsr_cost_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: estimated_labor_cost is nullable; only cost-bearing rows carry a currency.
    query: "SELECT 'workforce_schedule_recommendation' AS table_name, COUNT(DISTINCT currency_code) AS\
      \ currencies\nFROM predictive_operations.workforce_schedule_recommendation\nWHERE estimated_labor_cost\
      \ IS NOT NULL\nHAVING COUNT(DISTINCT currency_code) > 1\n    OR COUNT(CASE WHEN currency_code IS\
      \ NULL THEN 1 END) > 0"
  - name: wsr_role_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_role_domain
    query: 'SELECT * FROM predictive_operations.workforce_schedule_recommendation

      WHERE role_code NOT IN (''cashier'', ''sales_associate'', ''fulfillment'', ''inventory'', ''supervisor'')'
  - name: wsr_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_status_domain
    query: "SELECT * FROM predictive_operations.workforce_schedule_recommendation\nWHERE recommendation_status\
      \ NOT IN ('proposed', 'accepted', 'rejected', 'superseded')\n   OR optimizer_status NOT IN ('optimal',\
      \ 'feasible', 'heuristic', 'infeasible_partial')"
  - name: wsr_single_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: wsr_single_currency
    query: "SELECT 'workforce_schedule_recommendation' AS table_name, COUNT(DISTINCT currency_code) AS\
      \ currencies\nFROM predictive_operations.workforce_schedule_recommendation\nHAVING COUNT(DISTINCT\
      \ currency_code) > 1\n    OR COUNT(CASE WHEN estimated_labor_cost IS NOT NULL AND currency_code\
      \ IS NULL THEN 1 END) > 0"
  - name: wsr_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: wsr_rowcount
    query: 'SELECT COUNT(*) AS workforce_schedule_recommendation_rows

      FROM predictive_operations.workforce_schedule_recommendation'
