    index, not a probability. Read the over-time series as DIRECTIONAL triage, not a metrologically stable
    series — the sales discount-depth normalizer (cross-store p95) is re-derived per scoring run, so a
    score can move across dates from a shifting fleet distribution as well as from the store itself (design
    spec §4).
