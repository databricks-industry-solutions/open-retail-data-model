      FROM predictive_operations.gold_maintenance_effectiveness

      WHERE mtbf_days IS NOT NULL'
- name: gold_store_operational_risk
  physicalName: predictive_operations.gold_store_operational_risk
  physicalType: view
  description: 'The Store Operational Risk Score: one row per store (current as_of_date), estimating near-term
    operational/financial deterioration risk. Composes FIVE sub-scores -- four from other packages (inventory,
    supply_chain, sales_margin, equipment) plus labor from this package''s gold_labor_risk (ADR 0043)
    -- into a single store-grain triage surface plus a per-domain diagnostic breakdown.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: store_name
    logicalType: string
    physicalType: STRING
    description: Display name of the store.
  - name: region
    logicalType: string
    physicalType: STRING
  - name: district
    logicalType: string
    physicalType: STRING
  - name: as_of_date
    logicalType: date
    physicalType: DATE
    description: Snapshot date the score is computed for (conforms to fiscal_calendar.date_key).
  - name: horizon_days
    logicalType: integer
    physicalType: INT
    description: Declared forward assessment horizon in days (7 in v1) — a comparability label, not a
      claim every input is windowed to 7 days; per-domain observation windows differ (see design spec
      §4.7).
  - name: operational_risk_score
    logicalType: number
    physicalType: DOUBLE
    description: Store Operational Risk Score, 0-100, higher = riskier. A transparent expert-weighted
      HEURISTIC INDEX, not a calibrated probability.
  - name: inventory_risk
    logicalType: number
    physicalType: DOUBLE
    description: 'Inventory domain sub-score (0-100): sales-velocity-weighted mean of gold_inventory_risk.stockout_risk_score
      across the store''s SKUs (weight = trailing_units_sold; plain mean when the store has no velocity).'
  - name: supply_chain_risk
    logicalType: number
    physicalType: DOUBLE
    description: Supply-chain domain sub-score (0-100), spend-weighted supplier risk from gold_procurement_risk
      for suppliers shipping to the store.
  - name: sales_margin_risk
    logicalType: number
    physicalType: DOUBLE
    description: 'Sales/margin domain sub-score (0-100): recent-vs-prior net-sales decline + discount-depth
      compression from BMV gold. The discount half is normalized against a cross-store p95, so it is a
      relative (fleet-comparative) signal — see design spec §4.'
  - name: equipment_risk
    logicalType: number
    physicalType: DOUBLE
    description: Equipment domain sub-score (0-100), criticality-weighted 100 - health_score from gold_equipment_health.
  - name: labor_risk
    logicalType: number
    physicalType: DOUBLE
    description: Labor/workforce domain sub-score from gold_labor_risk (0-100). Present when Workforce
      Optimization / labor domain is deployed (ADR 0043).
  - name: cx_risk
    logicalType: number
    physicalType: DOUBLE
    description: Customer-experience domain sub-score. DEFERRED — always NULL in v1 (no CX source yet).
  - name: domains_scored
    logicalType: integer
    physicalType: INT
    description: How many domains had a present (non-NULL) sub-score feeding the composite. Max is 5 (cx
      deferred); 0 means unscored (tier UNKNOWN).
  - name: operational_risk_tier
    logicalType: string
    physicalType: STRING
    description: 'Risk tier: UNKNOWN (no domain scored, domains_scored = 0), LOW, MEDIUM, HIGH, CRITICAL.
      Any single present domain going critical, or a steep sales/margin decline, forces at least HIGH.'
  - name: top_risk_domains
    logicalType: string
    physicalType: STRING
    description: Up-to-3 domains with the largest weighted contribution to the score (the Diagnose step).
  quality:
  - name: sor_score_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sor_score_range
    query: 'SELECT * FROM predictive_operations.gold_store_operational_risk

      WHERE operational_risk_score IS NOT NULL AND operational_risk_score NOT BETWEEN 0 AND 100'
  - name: sor_tier_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sor_tier_domain
    query: 'SELECT * FROM predictive_operations.gold_store_operational_risk

      WHERE operational_risk_tier NOT IN (''UNKNOWN'', ''LOW'', ''MEDIUM'', ''HIGH'', ''CRITICAL'')'
  - name: sor_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: sor_rowcount
    query: SELECT COUNT(*) AS store_operational_risk_rows FROM predictive_operations.gold_store_operational_risk
  - name: sor_high_or_worse_count
    type: sql
    dimension: accuracy
    severity: info
    description: sor_high_or_worse_count
    query: 'SELECT COUNT(*) AS high_or_worse_stores

      FROM predictive_operations.gold_store_operational_risk

      WHERE operational_risk_tier IN (''HIGH'', ''CRITICAL'')'
- name: gold_workforce_coverage_gap
  physicalName: predictive_operations.gold_workforce_coverage_gap
  physicalType: view
  description: Compares required headcount to published labor_schedule coverage (and proposed recommendations
    when present) to surface understaffed intervals. Feeds labor_risk and coverage exceptions.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_sk
    description: Surrogate key for the store.
  - name: store_id
    description: Durable store business key.
  - name: business_date
    description: Local business date the interval belongs to.
  - name: interval_start_ts
    description: Inclusive start of the planning interval (UTC).
  - name: interval_end_ts
    description: Exclusive end of the planning interval (UTC).
  - name: department_or_zone
    description: Department or zone within the store.
  - name: role_code
    description: Workforce role the gap is measured for.
  - name: required_labor_hours
    description: Labor hours required in the interval, from gold_workforce_labor_requirement.
  - name: required_headcount
    description: Required headcount in the interval.
  - name: scheduled_hours
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Published labor_schedule hours overlapping the interval, clipped to the interval boundaries.
  - name: recommended_hours
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: 'Proposed workforce_schedule_recommendation hours overlapping the interval, clipped to
      the interval boundaries. Status = proposed ONLY: an accepted recommendation is published into labor_schedule
      and is already counted in scheduled_hours, so including it here would double-count the same shift.'
  - name: covered_hours
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Scheduled plus recommended hours overlapping the interval.
  - name: shortfall_hours
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Unmet required hours (required minus covered, floored at 0). Overstaffing is not reported
      as a negative shortfall.
  - name: coverage_pct
    logicalType: number
    physicalType: DOUBLE
    description: Covered hours over required hours, capped at 2.0; 1.0 when nothing is required.
  - name: shortfall_severity
    logicalType: string
    physicalType: STRING
    description: 'Coverage band: none (no shortfall), low (>=85% covered), medium (>=60%), high (>=35%),
      critical (below 35%).'
- name: gold_workforce_demand_forecast
  physicalName: predictive_operations.gold_workforce_demand_forecast
  physicalType: view
  description: Transparent heuristic demand forecast at store x business_date x interval x zone x role.
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_sk
    logicalType: integer
    physicalType: BIGINT
    description: Surrogate key for the store.
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: business_date
    description: Local business date the forecast interval belongs to.
  - name: interval_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Inclusive start of the planning interval (UTC).
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Exclusive end of the planning interval (UTC).
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    description: Planning interval length in minutes, taken from the current labor_standard (30 when none
      is configured).
  - name: department_or_zone
    logicalType: string
    physicalType: STRING
    description: Department or zone within the store the forecast applies to.
  - name: role_code
    logicalType: string
    physicalType: STRING
    description: 'Workforce role the forecast is produced for: cashier, sales_associate, fulfillment,
      inventory, supervisor.'
  - name: demand_driver
    logicalType: string
    physicalType: STRING
    description: Workload driver the forecast is expressed in, derived from role_code (transaction_count,
      foot_traffic, pickup_orders, receiving_units, store_open_coverage).
  - name: forecast_driver_units
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Point forecast of driver units in the interval. A transparent seasonal-average HEURISTIC,
      not a calibrated model output.
  - name: forecast_lower_bound
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: 'Lower uncertainty proxy: 80% of the point forecast. A fixed band, not a fitted prediction
      interval.'
  - name: forecast_upper_bound
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: 'Upper uncertainty proxy: 120% of the point forecast. A fixed band, not a fitted prediction
      interval.'
  - name: forecast_method
    logicalType: string
    physicalType: STRING
    description: 'How the row was produced: seasonal_rolling_avg when store-level history was available,
      hierarchical_fallback when the estimate came from a coarser level.'
  - name: model_version
    logicalType: string
    physicalType: STRING
    description: Reserved for a model-backed pipeline (forecast_method = model); NULL in the shipped heuristic
      (ADR 0028 §4).
  - name: forecast_horizon_days
    logicalType: integer
    physicalType: INT
    description: Forward horizon the forecast covers, in days (7 by default).
  - name: forecast_origin_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: When the forecast was computed (UTC) — the view evaluates at query time.
- name: gold_workforce_forecast_accuracy
  physicalName: predictive_operations.gold_workforce_forecast_accuracy
  physicalType: view
  description: 'Backtest accuracy for workforce demand forecasts when actuals exist. Actuals preference
    (same spirit as the forecast view): foot_traffic     -> CSS site-level footfall when css_schema is
    readable (this view does NOT hard-join CSS — adopters overlay CSS actuals in the notebook / pipeline;
    core actuals use order-line interval buckets and labor_actuals hours). transaction_count / pickup_orders
    -> customer_order_line units in interval else -> NULL actual (row excluded from MAPE denominator)'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/predictive-operations/README.md
    type: businessDefinition
  - url: outcome-packages/predictive-operations/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: store_id
    logicalType: string
    physicalType: STRING
    description: Durable store business key.
  - name: business_date
    logicalType: date
    physicalType: DATE
    description: Local business date the interval belongs to.
  - name: interval_start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Inclusive start of the planning interval (UTC).
  - name: interval_end_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: Exclusive end of the planning interval (UTC).
  - name: interval_minutes
    logicalType: integer
    physicalType: INT
    description: Planning interval length in minutes.
  - name: department_or_zone
    logicalType: string
    physicalType: STRING
    description: Department or zone within the store.
  - name: role_code
    logicalType: string
    physicalType: STRING
    description: Workforce role the forecast was produced for.
  - name: demand_driver
    logicalType: string
    physicalType: STRING
    description: Workload driver the forecast is expressed in.
  - name: forecast_driver_units
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Forecast driver units for the interval.
  - name: actual_driver_units
    logicalType: number
    physicalType: DECIMAL(8, 2)
    description: 'Observed driver units for the interval; NULL when no actuals source is available for
      the driver. STORE-TOTAL grain: actuals are joined on store/date/interval only, NOT on role or zone,
      so every per-role row on one interval repeats the SAME store total. Use it as a per-row diagnostic;
      summing it across roles multiply-counts the interval.'
  - name: forecast_error
    logicalType: number
    physicalType: DECIMAL(18, 4)
    description: Forecast minus actual driver units. Positive = over-forecast.
  - name: ape
    logicalType: number
    physicalType: DOUBLE
    description: Absolute percentage error for the interval; NULL when actuals are absent or zero. Aggregate
      as a weighted ratio of sums, not a mean of these row values.
  - name: forecast_method
    logicalType: string
    physicalType: STRING
    description: How the forecast row was produced.
  - name: model_version
    logicalType: string
    physicalType: STRING
    description: Reserved for a model-backed pipeline (forecast_method = model); NULL for heuristic rows
      (ADR 0028 §4).
  - name: optimization_run_id
    logicalType: string
    physicalType: STRING
    description: workforce_optimization_run.run_id that produced the forecast being scored.
