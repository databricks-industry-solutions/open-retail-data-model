    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every selling date must exist in the fiscal calendar (required for week rollups).
    query: 'SELECT s.date_key FROM transaction.sales s

      LEFT JOIN calendar.fiscal_calendar c ON s.date_key = c.date_key

      WHERE c.date_key IS NULL

      GROUP BY s.date_key'
  - name: sales_single_reporting_currency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Monetary columns are normalized to the base currency, so currency_code must be constant
