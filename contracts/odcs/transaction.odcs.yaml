    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: sales_promotion_fk_orphan
    query: 'SELECT s.* FROM transaction.sales s

      LEFT JOIN marketing.promotion p ON s.promo_sk = p.promo_sk

      WHERE s.promo_sk IS NOT NULL AND p.promo_sk IS NULL'
