    query: 'SELECT COUNT(DISTINCT currency_code) AS distinct_currencies

      FROM transaction.sales

      HAVING COUNT(DISTINCT currency_code) > 1'
  - name: sales_fk_points_to_current_version
    type: sql
    dimension: accuracy
    severity: info
    description: 'Informational: share (%) of sales rows whose product_sk / store_sk resolve to a NON-current
      dimension version. Historical facts may legitimately reference prior SCD2 versions, so this is a
      metric (never fails) that documents the expectation.'
    query: "SELECT ROUND(100.0 * SUM(\n         CASE WHEN COALESCE(p.is_current, true) AND COALESCE(st.is_current,\
      \ true)\n              THEN 0 ELSE 1 END) / COUNT(*), 2) AS pct_sales_noncurrent_version\nFROM transaction.sales\
      \ s\nLEFT JOIN product.product p ON s.product_sk = p.product_sk\nLEFT JOIN store.store st ON s.store_sk\
      \ = st.store_sk"
