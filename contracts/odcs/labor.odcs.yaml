  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: labor_schedule_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: labor_schedule_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the scheduled shift.
  - name: employee_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
