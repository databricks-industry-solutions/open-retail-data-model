- name: labor_schedule
  physicalName: labor.labor_schedule
  physicalType: table
  description: Planned associate shifts. end after start; used as supply baseline and double-booking constraint.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: canonical-core/labor/README.md
    type: businessDefinition
  - url: canonical-core/labor/glossary.md
