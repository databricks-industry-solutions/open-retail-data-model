- name: activation_job
  physicalName: unified_customer_view.activation_job
  physicalType: table
  description: ORDM Unified Customer View — activation/export run audit fact (append-only). Records each
    audience-to-destination publish and its consent-gate counts; the gate itself is gold_activatable_audience_current.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: activation_job_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per run row.
  - name: activation_job_id
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Durable natural/business key for the activation run. Composed from the full grain: audience_id
      + activation_destination_id + jurisdiction_code + job_run_ts (a NULL jurisdiction is its own agnostic
      scope) — so two runs differing only by jurisdiction get distinct ids. If minted opaquely instead,
      it must still be unique at that grain (aj_id_unique).'
  - name: audience_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to marketing.audience.audience_sk — the published audience/segment version.
    relationships:
    - to: audience.audience_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: marketing
      - property: enforced
        value: false
  - name: audience_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable audience business key.
  - name: activation_destination_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to ucv.activation_destination.activation_destination_sk — where the audience was published.
    relationships:
    - to: activation_destination.activation_destination_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: unified_customer_view
      - property: enforced
        value: false
  - name: activation_destination_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable destination business key.
  - name: membership_as_of_date
    logicalType: date
    physicalType: DATE
    required: false
    description: The ACU segment_membership snapshot date this run exported (pins reproducibility to a
      frozen membership).
  - name: job_run_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the activation run executed at source (UTC, ISO 8601).
  - name: job_run_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the run (cluster key).
  - name: job_status
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Terminal or in-flight run state. Allowed values: queued, running, succeeded, partial,
      failed, cancelled.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: queued, running, succeeded, partial, failed, cancelled.'
  - name: purpose_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Processing purpose this activation served — must match the destination required_consent_purpose.
      Allowed values: marketing, personalization, analytics, retail_media, data_sale, service.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: marketing, personalization, analytics, retail_media, data_sale, service.'
  - name: channel_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Channel this activation targeted — must match the destination required_channel. The
      consent-channel values email/sms/phone/postal align with the eligibility gate (so those runs reconcile
      against it); the rest are channels the gate does not evaluate today. Allowed values: email, sms,
      phone, postal, push, web, in_app, ctv, social, display, search.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: email, sms, phone, postal, push, web, in_app, ctv, social, display,
        search.'
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Regulatory regime the counts are scoped to (ISO 3166 country/subdivision, or a regional
      code such as EU — matching consent.jurisdiction_code), so eligible_member_count reconciles against
      the jurisdiction-grained gate. It ALSO gives informational residency traceability against a residency-constrained
      destination (activation_destination.data_residency_region), but the two are NOT DQ-reconciled: a
      regulatory-regime code and a processing-region label do not map 1:1 (e.g. regime EU vs region a
      specific country). NULL = a jurisdiction-agnostic roll-up across regimes.'
  - name: requested_member_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Raw segment size at membership_as_of_date, before the consent gate (>= 0).
  - name: eligible_member_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Members with an eligible gate row for this purpose × channel × jurisdiction (>= 0, <=
      requested_member_count).
  - name: blocked_member_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Members the eligibility gate removed for ANY reason — consent, preference, reachability,
      OR suppression (>= 0) = requested_member_count - eligible_member_count. ALL-CAUSE, NOT suppression-specific
      (ADR 0027 keeps those states distinct); a genuinely suppression-scoped count is a future per-reason
      breakout.
  - name: exported_member_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Members actually published to the destination (>= 0, <= eligible_member_count).
  - name: match_rate
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Provider match rate for exported members (0..1); NULL if the destination does not report
      one.
  - name: sync_mode
    logicalType: string
    physicalType: STRING
    required: false
    description: 'The write operation this run performed against the destination audience. Allowed values:
      full_refresh, incremental_upsert, delete_only. delete_only / the delete leg of an upsert is how
      do-not-sell / DSAR retractions propagate.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: full_refresh, incremental_upsert, delete_only.'
  - name: removed_member_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Members RETRACTED from the destination this run (do-not-sell / DSAR / newly-suppressed
      members removed from a prior export) (>= 0). NULL if the run did not retract (e.g. a first full_refresh).
  - name: delivered_member_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Exported members the destination ACCEPTED / delivered (>= 0, <= exported_member_count).
      NULL if the destination reports no accept/reject split.
  - name: rejected_member_count
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: Exported members the destination REJECTED (bad key, provider-side opt-out, format error)
      (>= 0, <= exported_member_count). NULL if not reported.
  - name: job_started_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the run STARTED executing (UTC, ISO 8601); NULL if not captured. With job_completed_ts
      gives run duration / freshness.
  - name: job_completed_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the run FINISHED (UTC, ISO 8601); NULL while in-flight or if not captured.
  - name: is_consent_enforced_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Three-valued, and the states are distinct (do not conflate FALSE with NULL). TRUE = the
      eligible slice for this run was produced by the consent gate (gold_activatable_audience_current),
      which anti-joins the do-not-target view by construction, so TRUE REQUIRES is_suppression_applied_flag
      = TRUE (enforced by aj_consent_implies_suppression). FALSE = the adopter ASSERTS the gate was NOT
      the source (a plane the gate does not evaluate; see RECONCILIATION SCOPE) — the strongest scrutinize-this-run
      signal. NULL = provenance simply not recorded (unknown), weaker than FALSE but still not gate-attested.
      Audit consumers should treat FALSE and NULL separately.
  - name: is_suppression_applied_flag
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: TRUE if person-level do-not-target suppression (gold_person_do_not_target_current, ADR
      0028) was consulted for this run. On non-owned/paid planes this must be TRUE for the run to be compliant
      with the cross-plane do-not-contact contract.
  - name: destination_audience_ref
    logicalType: string
    physicalType: STRING
    required: false
    description: The provider-side audience identifier returned by the destination (vendor-neutral, no
      PII, no member lists).
  - name: failure_reason_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Why a failed/partial run did not complete. Allowed values: none, auth_error, quota_exceeded,
      schema_mismatch, consent_block, provider_error, timeout.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: none, auth_error, quota_exceeded, schema_mismatch, consent_block,
        provider_error, timeout.'
  - name: model_version
    logicalType: string
    physicalType: STRING
    required: false
    description: Version of the activation job runner / rule set that produced this run (audit / reproducibility).
      NULL if not applicable.
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: aj_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_keys_not_null
    query: "SELECT * FROM unified_customer_view.activation_job\nWHERE activation_job_sk IS NULL OR activation_job_id\
      \ IS NULL\n   OR job_run_ts IS NULL OR job_run_date IS NULL OR job_status IS NULL"
  - name: aj_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain guard: one row per (audience_id, activation_destination_id, jurisdiction_code,
      job_run_ts). jurisdiction_code is nullable (an agnostic roll-up), so COALESCE it. NOTE: the durable
      activation_job_id (aj_id_unique) is the PRIMARY row-uniqueness guarantee; this composite key includes
      a TIMESTAMP (job_run_ts) and is a business-grain sanity check.'
    query: "SELECT audience_id, activation_destination_id,\n       COALESCE(jurisdiction_code, '') AS\
      \ jurisdiction_code, job_run_ts, COUNT(*) AS n\nFROM unified_customer_view.activation_job\nGROUP\
      \ BY audience_id, activation_destination_id, COALESCE(jurisdiction_code, ''), job_run_ts\nHAVING\
      \ COUNT(*) > 1"
  - name: aj_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_pk_unique
    query: 'SELECT activation_job_sk, COUNT(*) AS n

      FROM unified_customer_view.activation_job

      GROUP BY activation_job_sk HAVING COUNT(*) > 1'
  - name: aj_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Durable business key guard (sibling convention: every fact guards its <stem>_id, so
      a duplicate id can''t silently fan out the *_businesskey_orphan joins that resolve on it).'
    query: 'SELECT activation_job_id, COUNT(*) AS n

      FROM unified_customer_view.activation_job

      GROUP BY activation_job_id HAVING COUNT(*) > 1'
  - name: aj_audience_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_audience_fk_orphan
    query: 'SELECT j.* FROM unified_customer_view.activation_job j

      LEFT JOIN marketing.audience a ON j.audience_sk = a.audience_sk

      WHERE j.audience_sk IS NOT NULL AND a.audience_sk IS NULL'
  - name: aj_audience_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_audience_businesskey_orphan
    query: "SELECT j.* FROM unified_customer_view.activation_job j\nLEFT JOIN (SELECT DISTINCT audience_id\
      \ FROM marketing.audience) a\n  ON j.audience_id = a.audience_id\nWHERE j.audience_id IS NOT NULL\
      \ AND a.audience_id IS NULL"
  - name: aj_destination_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_destination_fk_orphan
    query: 'SELECT j.* FROM unified_customer_view.activation_job j

      LEFT JOIN unified_customer_view.activation_destination d ON j.activation_destination_sk = d.activation_destination_sk

      WHERE j.activation_destination_sk IS NOT NULL AND d.activation_destination_sk IS NULL'
  - name: aj_destination_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_destination_businesskey_orphan
    query: "SELECT j.* FROM unified_customer_view.activation_job j\nLEFT JOIN (SELECT DISTINCT activation_destination_id\
      \ FROM unified_customer_view.activation_destination) d\n  ON j.activation_destination_id = d.activation_destination_id\n\
      WHERE j.activation_destination_id IS NOT NULL AND d.activation_destination_id IS NULL"
  - name: aj_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_status_domain
    query: 'SELECT * FROM unified_customer_view.activation_job

      WHERE job_status NOT IN (''queued'', ''running'', ''succeeded'', ''partial'', ''failed'', ''cancelled'')'
  - name: aj_failure_reason_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_failure_reason_domain
    query: "SELECT * FROM unified_customer_view.activation_job\nWHERE failure_reason_code IS NOT NULL\n\
      \  AND failure_reason_code NOT IN ('none', 'auth_error', 'quota_exceeded', 'schema_mismatch', 'consent_block',\
      \ 'provider_error', 'timeout')"
  - name: aj_counts_nonneg
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Member counts are non-negative.
    query: "SELECT * FROM unified_customer_view.activation_job\nWHERE (requested_member_count  IS NOT\
      \ NULL AND requested_member_count  < 0)\n   OR (eligible_member_count   IS NOT NULL AND eligible_member_count\
      \   < 0)\n   OR (blocked_member_count    IS NOT NULL AND blocked_member_count    < 0)\n   OR (exported_member_count\
      \   IS NOT NULL AND exported_member_count   < 0)\n   OR (removed_member_count    IS NOT NULL AND\
      \ removed_member_count    < 0)\n   OR (delivered_member_count  IS NOT NULL AND delivered_member_count\
      \  < 0)\n   OR (rejected_member_count   IS NOT NULL AND rejected_member_count   < 0)"
  - name: aj_counts_monotonic
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Consent gate is fail-closed: a job can never export more than eligible, and never eligible
      more than requested. exported <= eligible <= requested. The destination-side accept/reject split
      (delivered, rejected) can never exceed what was exported.'
    query: "SELECT * FROM unified_customer_view.activation_job\nWHERE (eligible_member_count IS NOT NULL\
      \ AND requested_member_count IS NOT NULL\n        AND eligible_member_count > requested_member_count)\n\
      \   OR (exported_member_count IS NOT NULL AND eligible_member_count IS NOT NULL\n        AND exported_member_count\
      \ > eligible_member_count)\n   OR (delivered_member_count IS NOT NULL AND exported_member_count\
      \ IS NOT NULL\n        AND delivered_member_count > exported_member_count)\n   OR (rejected_member_count\
      \ IS NOT NULL AND exported_member_count IS NOT NULL\n        AND rejected_member_count > exported_member_count)\n\
      \   -- delivered + rejected reconcile to exported (activation_job.sql): their sum cannot exceed\
      \ it.\n   OR (delivered_member_count IS NOT NULL AND rejected_member_count IS NOT NULL\n       \
      \ AND exported_member_count IS NOT NULL\n        AND delivered_member_count + rejected_member_count\
      \ > exported_member_count)"
  - name: aj_blocked_reconciles
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: blocked_member_count is DEFINED as requested - eligible (ADR 0026 §2 / column comment)
      — the ALL-CAUSE count of members the gate removed, not suppression-specific. Enforce that identity
      so the column can't silently disagree with the counts it derives from (which would skew activation_block_rate).
      Only where all three are populated.
    query: "SELECT * FROM unified_customer_view.activation_job\nWHERE requested_member_count IS NOT NULL\n\
      \  AND eligible_member_count  IS NOT NULL\n  AND blocked_member_count   IS NOT NULL\n  AND (requested_member_count\
      \ - eligible_member_count) <> blocked_member_count"
  - name: aj_match_rate_in_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: aj_match_rate_in_range
    query: 'SELECT * FROM unified_customer_view.activation_job

      WHERE match_rate IS NOT NULL AND match_rate NOT BETWEEN 0 AND 1'
  - name: aj_destination_purpose_channel_match
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A run's purpose/channel MUST match the destination's declared required_consent_purpose
      / required_channel (activation_job.sql + activation_destination.sql document this invariant; it's
      what makes the consent gate destination-aware). Enforce it where both sides are set.
    query: "SELECT j.* FROM unified_customer_view.activation_job j\nJOIN unified_customer_view.activation_destination\
      \ d\n  ON j.activation_destination_id = d.activation_destination_id\nWHERE (d.required_consent_purpose\
      \ IS NOT NULL AND j.purpose_code IS NOT NULL\n        AND j.purpose_code <> d.required_consent_purpose)\n\
      \   OR (d.required_channel IS NOT NULL AND j.channel_code IS NOT NULL\n        AND j.channel_code\
      \ <> d.required_channel)"
  - name: aj_export_rate
    type: sql
    dimension: accuracy
    severity: info
    description: Share of eligible members actually exported across runs (activation efficiency).
    query: "SELECT ROUND(\n  SUM(exported_member_count) / NULLIF(SUM(eligible_member_count), 0), 4) AS\
      \ export_rate\nFROM unified_customer_view.activation_job"
  - name: aj_block_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'The activation_block_rate KPI (glossary): all-cause share of requested members the gate
      removed. Ratio-of-sums, not an avg of per-run rates.'
    query: "SELECT ROUND(\n  SUM(blocked_member_count) / NULLIF(SUM(requested_member_count), 0), 4) AS\
      \ block_rate\nFROM unified_customer_view.activation_job"
  - name: aj_match_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'The activation_match_rate KPI (glossary): member-weighted provider match rate across
      exports. Ratio-of-sums (matched estimate / exported), not an avg of per-run rates. The denominator
      counts only exports with a KNOWN match_rate — including NULL-match exports would dilute the rate
      toward 0 (review m1).'
    query: "SELECT ROUND(\n  SUM(exported_member_count * match_rate)\n  / NULLIF(SUM(CASE WHEN match_rate\
      \ IS NOT NULL THEN exported_member_count END), 0), 4) AS match_rate\nFROM unified_customer_view.activation_job"
  - name: aj_job_timestamps_ordered
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Run lifecycle: completion cannot precede start.'
    query: "SELECT * FROM unified_customer_view.activation_job\nWHERE job_started_ts IS NOT NULL AND job_completed_ts\
      \ IS NOT NULL\n  AND job_completed_ts < job_started_ts"
  - name: aj_delete_only_exports_nothing
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: A delete_only run retracts members and publishes none, so exported_member_count must
      be 0/NULL (removed_member_count carries the retraction). Keeps the new sync telemetry as self-consistent
      as the reconciled counts.
    query: 'SELECT * FROM unified_customer_view.activation_job

      WHERE sync_mode = ''delete_only'' AND COALESCE(exported_member_count, 0) <> 0'
  - name: aj_consent_implies_suppression
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Flag-CONSISTENCY only, NOT proof the consult happened: both flags are adopter-supplied,
      so this cannot verify that the do-not-target anti-join actually ran (ORDM does not run the sync).
      What it asserts: a run claiming is_consent_enforced_flag=TRUE (eligible slice sourced from gold_activatable_audience_current,
      which anti-joins the DNT view by construction) must not ALSO claim it did not apply suppression
      — that pairing is self-contradictory. Reject it.'
    query: 'SELECT * FROM unified_customer_view.activation_job

      WHERE is_consent_enforced_flag = TRUE AND COALESCE(is_suppression_applied_flag, FALSE) = FALSE'
  - name: aj_suppression_applied_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'Observability for the ADR 0028 cross-plane contract: share of runs that recorded the
      person-level do-not-target consult (is_suppression_applied_flag). NOT an error gate — the flag is
      adopter-supplied and the paid-plane obligation cannot be CI-proven — but a low rate surfaces runs
      that may have skipped the do-not-target anti-join, worth review.'
    query: 'SELECT ROUND(AVG(CASE WHEN is_suppression_applied_flag THEN 1.0 ELSE 0.0 END), 4) AS suppression_applied_rate

      FROM unified_customer_view.activation_job'
- name: campaign_touch
  physicalName: unified_customer_view.campaign_touch
  physicalType: table
  description: ORDM Unified Customer View — owned/CRM campaign interaction fact (append-only). Outbound
    sends and inbound responses per customer, sourced from an activation; distinct from paid CMN media_event.
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: campaign_touch_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per touch row.
  - name: campaign_touch_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key for the touch — one per INTERACTION EVENT, unique at row
      grain (send/delivery/open/click of the same message are separate touches with distinct ids). A platform
      message id that repeats across event types is NOT this key; carry it in external_campaign_id.
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk — the touched customer (resolved).
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable customer business key (pseudonymous; not raw PII).
  - name: audience_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to marketing.audience.audience_sk — the segment the touch was sourced from, if audience-driven.
    relationships:
    - to: audience.audience_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: marketing
      - property: enforced
        value: false
  - name: audience_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable audience business key.
  - name: promo_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to marketing.promotion.promo_sk — the offer/campaign this touch delivered, if attributable.
    relationships:
    - to: promotion.promo_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: marketing
      - property: enforced
        value: false
  - name: promo_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable promotion/campaign business key.
  - name: activation_job_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to ucv.activation_job.activation_job_sk — the activation run that produced this touch,
      if outbound-activated.
    relationships:
    - to: activation_job.activation_job_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: unified_customer_view
      - property: enforced
        value: false
  - name: activation_job_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Durable activation-job business key.
  - name: external_campaign_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Platform-facing campaign identifier for reconciliation (degenerate attribute; vendor-neutral,
      no PII).
  - name: touch_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the touch occurred at source (UTC, ISO 8601).
  - name: touch_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date of the touch (cluster key).
  - name: touch_direction
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Interaction direction. Allowed values: outbound, inbound.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: outbound, inbound.'
  - name: touch_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Interaction type. Allowed values: send, delivery, open, click, bounce, unsubscribe,
      reply, conversion, complaint.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: send, delivery, open, click, bounce, unsubscribe, reply, conversion,
        complaint.'
  - name: channel_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Channel the touch occurred on. Allowed values: email, sms, push, direct_mail, web, in_app,
      call_center, in_store.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: email, sms, push, direct_mail, web, in_app, call_center, in_store.'
  - name: delivery_status_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'ORDM-canonical delivery state. Allowed values: queued, sent, delivered, bounced, failed,
      suppressed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: queued, sent, delivered, bounced, failed, suppressed.'
  - name: destination_delivery_status
    logicalType: string
    physicalType: STRING
    required: false
    description: Raw provider-facing delivery status, canonicalized-through (vendor label; no PII).
  - name: consent_status
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Consent state AS OBSERVED AT TOUCH TIME (governance evidence / point-in-time snapshot)
      — deliberately a 3-value snapshot domain, the SAME as the sibling fact cmn.media_event.consent_status,
      and NOT the same domain as the canonical-core consent master (customer.consent.consent_status =
      granted/withdrawn/pending/expired, an SCD2 lifecycle). This is not a join key to that master. Allowed
      values: granted, denied, unknown.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: granted, denied, unknown.'
  - name: message_ref
    logicalType: string
    physicalType: STRING
    required: false
    description: Vendor-neutral reference to the message/creative variant sent (no PII, no content body).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: ct_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_keys_not_null
    query: "SELECT * FROM unified_customer_view.campaign_touch\nWHERE campaign_touch_sk IS NULL OR campaign_touch_id\
      \ IS NULL\n   OR touch_ts IS NULL OR touch_date IS NULL OR touch_direction IS NULL OR touch_type\
      \ IS NULL"
  - name: ct_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain guard: one row per (profile_id, promo_id, channel_code, touch_ts, touch_type).
      channel_code is part of the grain — a multi-channel campaign firing e.g. an email AND a push send
      for the same profile/promo at the same touch_ts are two legit touches, not a duplicate (review M1).
      profile_id / promo_id / channel_code are nullable, so COALESCE them — else NULL <> NULL would let
      duplicates slip the guard. The durable campaign_touch_id (ct_id_unique) is the primary row-uniqueness
      guarantee; this is the business-grain sanity check.'
    query: "SELECT COALESCE(profile_id, '') AS profile_id, COALESCE(promo_id, '') AS promo_id,\n     \
      \  COALESCE(channel_code, '') AS channel_code, touch_ts, touch_type, COUNT(*) AS n\nFROM unified_customer_view.campaign_touch\n\
      GROUP BY COALESCE(profile_id, ''), COALESCE(promo_id, ''), COALESCE(channel_code, ''), touch_ts,\
      \ touch_type\nHAVING COUNT(*) > 1"
  - name: ct_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_pk_unique
    query: 'SELECT campaign_touch_sk, COUNT(*) AS n

      FROM unified_customer_view.campaign_touch

      GROUP BY campaign_touch_sk HAVING COUNT(*) > 1'
  - name: ct_id_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Durable business key guard (sibling convention): campaign_touch_id is per INTERACTION
      EVENT and must be unique at row grain — one row per touch_type, so send/delivery/open/click are
      distinct touches with distinct ids (a repeated platform message id belongs in external_campaign_id,
      not here). Also protects ct_activation_job_businesskey_orphan.'
    query: 'SELECT campaign_touch_id, COUNT(*) AS n

      FROM unified_customer_view.campaign_touch

      GROUP BY campaign_touch_id HAVING COUNT(*) > 1'
  - name: ct_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_profile_fk_orphan
    query: 'SELECT t.* FROM unified_customer_view.campaign_touch t

      LEFT JOIN customer.profile p ON t.profile_sk = p.profile_sk

      WHERE t.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: ct_profile_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_profile_businesskey_orphan
    query: "SELECT t.* FROM unified_customer_view.campaign_touch t\nLEFT JOIN (SELECT DISTINCT profile_id\
      \ FROM customer.profile) p\n  ON t.profile_id = p.profile_id\nWHERE t.profile_id IS NOT NULL AND\
      \ p.profile_id IS NULL"
  - name: ct_audience_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_audience_fk_orphan
    query: 'SELECT t.* FROM unified_customer_view.campaign_touch t

      LEFT JOIN marketing.audience a ON t.audience_sk = a.audience_sk

      WHERE t.audience_sk IS NOT NULL AND a.audience_sk IS NULL'
  - name: ct_audience_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_audience_businesskey_orphan
    query: "SELECT t.* FROM unified_customer_view.campaign_touch t\nLEFT JOIN (SELECT DISTINCT audience_id\
      \ FROM marketing.audience) a\n  ON t.audience_id = a.audience_id\nWHERE t.audience_id IS NOT NULL\
      \ AND a.audience_id IS NULL"
  - name: ct_promotion_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_promotion_fk_orphan
    query: 'SELECT t.* FROM unified_customer_view.campaign_touch t

      LEFT JOIN marketing.promotion pr ON t.promo_sk = pr.promo_sk

      WHERE t.promo_sk IS NOT NULL AND pr.promo_sk IS NULL'
  - name: ct_promotion_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_promotion_businesskey_orphan
    query: "SELECT t.* FROM unified_customer_view.campaign_touch t\nLEFT JOIN (SELECT DISTINCT promo_id\
      \ FROM marketing.promotion) pr\n  ON t.promo_id = pr.promo_id\nWHERE t.promo_id IS NOT NULL AND\
      \ pr.promo_id IS NULL"
  - name: ct_activation_job_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_activation_job_fk_orphan
    query: 'SELECT t.* FROM unified_customer_view.campaign_touch t

      LEFT JOIN unified_customer_view.activation_job j ON t.activation_job_sk = j.activation_job_sk

      WHERE t.activation_job_sk IS NOT NULL AND j.activation_job_sk IS NULL'
  - name: ct_activation_job_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_activation_job_businesskey_orphan
    query: "SELECT t.* FROM unified_customer_view.campaign_touch t\nLEFT JOIN (SELECT DISTINCT activation_job_id\
      \ FROM unified_customer_view.activation_job) j\n  ON t.activation_job_id = j.activation_job_id\n\
      WHERE t.activation_job_id IS NOT NULL AND j.activation_job_id IS NULL"
  - name: ct_direction_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_direction_domain
    query: 'SELECT * FROM unified_customer_view.campaign_touch

      WHERE touch_direction NOT IN (''outbound'', ''inbound'')'
  - name: ct_type_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_type_domain
    query: 'SELECT * FROM unified_customer_view.campaign_touch

      WHERE touch_type NOT IN (''send'', ''delivery'', ''open'', ''click'', ''bounce'', ''unsubscribe'',
      ''reply'', ''conversion'', ''complaint'')'
  - name: ct_channel_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_channel_domain
    query: "SELECT * FROM unified_customer_view.campaign_touch\nWHERE channel_code IS NOT NULL\n  AND\
      \ channel_code NOT IN ('email', 'sms', 'push', 'direct_mail', 'web', 'in_app', 'call_center', 'in_store')"
  - name: ct_delivery_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_delivery_status_domain
    query: "SELECT * FROM unified_customer_view.campaign_touch\nWHERE delivery_status_code IS NOT NULL\n\
      \  AND delivery_status_code NOT IN ('queued', 'sent', 'delivered', 'bounced', 'failed', 'suppressed')"
  - name: ct_consent_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ct_consent_status_domain
    query: "SELECT * FROM unified_customer_view.campaign_touch\nWHERE consent_status IS NOT NULL\n  AND\
      \ consent_status NOT IN ('granted', 'denied', 'unknown')"
  - name: ct_touch_count
    type: sql
    dimension: accuracy
    severity: info
    description: ct_touch_count
    query: SELECT COUNT(*) AS campaign_touch_count FROM unified_customer_view.campaign_touch
  - name: ct_campaign_reach
    type: sql
    dimension: accuracy
    severity: info
    description: 'The campaign_reach KPI (glossary): distinct customers touched.'
    query: SELECT COUNT(DISTINCT profile_id) AS campaign_reach FROM unified_customer_view.campaign_touch
  - name: ct_delivered_to_denied
    type: sql
    dimension: accuracy
    severity: info
    description: 'GOVERNANCE SIGNAL (design-gap self-review): this audit fact''s purpose is consent governance,
      so surface the violation it can capture — outbound CONTACT acts (send / delivery) to a customer
      whose consent_status was ''denied'' at touch time = a do-not-contact breach recorded in the data.
      Scoped to the contact acts on purpose: the send/delivery IS the breach; downstream engagement (open/click)
      and inbound responses (conversion/reply) are consequences of that send, not separate breaches, and
      counting them would double-count or cross the direction classification (the banner groups conversion
      as inbound). Metric-severity, not a hard fail: adopter-recorded history to review, not a model defect;
      a non-zero value warrants investigation.'
    query: "SELECT COUNT(*) AS delivered_to_denied\nFROM unified_customer_view.campaign_touch\nWHERE touch_direction\
      \ = 'outbound' AND consent_status = 'denied'\n  AND touch_type IN ('send', 'delivery')"
  - name: ct_activation_job_audience_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Closed-loop integrity (design-gap self-review): a touch sourced from an activation run
      must carry that run''s audience. When both campaign_touch.activation_job_id and audience_id are
      set, they must agree with the referenced activation_job.audience_id — otherwise the touch → job
      → audience lineage is internally inconsistent.'
    query: "SELECT t.* FROM unified_customer_view.campaign_touch t\nJOIN unified_customer_view.activation_job\
      \ j ON t.activation_job_id = j.activation_job_id\nWHERE t.audience_id IS NOT NULL AND j.audience_id\
      \ IS NOT NULL\n  AND t.audience_id <> j.audience_id"
- name: customer_profile_snapshot
  physicalName: unified_customer_view.customer_profile_snapshot
  physicalType: table
  description: ORDM Unified Customer View — append-only per-customer snapshot of identity/consent/preference/household
    roll-ups (no raw PII).
  tags:
  - transactional
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: customer_profile_snapshot_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key. Unique per snapshot row.
  - name: customer_profile_snapshot_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key for the snapshot (e.g. profile_id + snapshot_date).
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to customer.profile.profile_sk (the profile version snapshotted).
    relationships:
    - to: profile.profile_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: customer
      - property: enforced
        value: false
  - name: profile_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable business key of the customer (pseudonymous; not a name).
  - name: snapshot_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Business date this snapshot represents (ISO 8601 date). Part of the grain.
  - name: snapshot_reason_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Why the snapshot was taken. Allowed values: scheduled, pre_campaign, ad_hoc, audit.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: scheduled, pre_campaign, ad_hoc, audit.'
  - name: active_identifier_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Count of current, active resolved identifiers mapped to this profile.
  - name: resolved_identity_confidence
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Summary identity-resolution confidence in [0,1] over active links (max/weighted).
  - name: consented_channel_count
    logicalType: integer
    physicalType: INT
    required: false
    description: Count of channels with a current granted consent for this profile.
  - name: household_size
    logicalType: integer
    physicalType: INT
    required: false
    description: Number of profiles currently sharing this household (outcome-layer roll-up).
  - name: profile_completeness_score
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Populated required attributes / required attributes, in [0,1].
  - name: reachability_score
    logicalType: number
    physicalType: DECIMAL(5,4)
    required: false
    description: Activation-readiness across channels (consent + preference + identifier presence), in
      [0,1].
  - name: customer_status_code
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Lifecycle status snapshotted from profile. Allowed values: prospect, active, inactive,
      closed.'
    quality:
    - type: text
      dimension: validity
      severity: error
      description: 'Allowed values: prospect, active, inactive, closed.'
  - name: created_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was created in the source system (UTC, ISO 8601).
  - name: source_updated_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When the record was last modified in the source system (UTC, ISO 8601).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system of record (vendor-neutral label).
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: cps_keys_not_null
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cps_keys_not_null
    query: "SELECT * FROM unified_customer_view.customer_profile_snapshot\nWHERE customer_profile_snapshot_sk\
      \ IS NULL OR customer_profile_snapshot_id IS NULL\n   OR profile_id IS NULL"
  - name: cps_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain guard: one row per (profile_id, snapshot_date) as the banner promises.'
    query: 'SELECT profile_id, snapshot_date, COUNT(*) AS n

      FROM unified_customer_view.customer_profile_snapshot

      GROUP BY profile_id, snapshot_date HAVING COUNT(*) > 1'
  - name: cps_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cps_pk_unique
    query: 'SELECT customer_profile_snapshot_sk, COUNT(*) AS n

      FROM unified_customer_view.customer_profile_snapshot

      GROUP BY customer_profile_snapshot_sk

      HAVING COUNT(*) > 1'
  - name: cps_profile_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Every snapshot must reference an existing profile (by surrogate FK).
    query: 'SELECT s.* FROM unified_customer_view.customer_profile_snapshot s

      LEFT JOIN customer.profile p ON s.profile_sk = p.profile_sk

      WHERE s.profile_sk IS NOT NULL AND p.profile_sk IS NULL'
  - name: cps_profile_businesskey_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cps_profile_businesskey_orphan
    query: "SELECT s.* FROM unified_customer_view.customer_profile_snapshot s\nLEFT JOIN (SELECT DISTINCT\
      \ profile_id FROM customer.profile) p\n  ON s.profile_id = p.profile_id\nWHERE p.profile_id IS NULL"
  - name: cps_snapshot_reason_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cps_snapshot_reason_domain
    query: "SELECT * FROM unified_customer_view.customer_profile_snapshot\nWHERE snapshot_reason_code\
      \ IS NOT NULL\n  AND snapshot_reason_code NOT IN ('scheduled', 'pre_campaign', 'ad_hoc', 'audit')"
  - name: cps_status_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: cps_status_domain
    query: "SELECT * FROM unified_customer_view.customer_profile_snapshot\nWHERE customer_status_code\
      \ IS NOT NULL\n  AND customer_status_code NOT IN ('prospect', 'active', 'inactive', 'closed')"
  - name: cps_scores_in_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: Confidence and readiness scores are probabilities in [0,1].
    query: "SELECT * FROM unified_customer_view.customer_profile_snapshot\nWHERE (resolved_identity_confidence\
      \ IS NOT NULL AND resolved_identity_confidence NOT BETWEEN 0 AND 1)\n   OR (profile_completeness_score\
      \ IS NOT NULL AND profile_completeness_score NOT BETWEEN 0 AND 1)\n   OR (reachability_score IS\
      \ NOT NULL AND reachability_score NOT BETWEEN 0 AND 1)"
- name: gold_activatable_audience_current
  physicalName: unified_customer_view.gold_activatable_audience_current
  physicalType: view
  description: 'THE ACTIVATION SURFACE: "which customers in segment X may I actually contact for purpose
    P on channel C?" — the reverse-ETL-ready join a warehouse-native / composable CDP activation platform
    reads to sync an addressable audience.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: audience_id
    logicalType: string
    physicalType: STRING
    description: Durable segment/audience key (marketing.audience) being activated.
  - name: audience_name
    logicalType: string
    physicalType: STRING
    description: Human-readable segment name.
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable, pseudonymous customer key — the single stable activation/join key (identifier
      resolution happens at the reverse-ETL boundary, not here).
  - name: purpose_code
    logicalType: string
    physicalType: STRING
    description: 'Activation purpose from the eligibility gate (ADR 0028): marketing, personalization,
      analytics, retail_media, or data_sale (CCPA do-not-sell).'
  - name: channel_code
    logicalType: string
    physicalType: STRING
    description: Owned channel for marketing purposes (email, sms, phone, postal); NULL for the channel-agnostic
      non-marketing purposes (personalization/analytics/retail_media/data_sale), which activate via a
      match key at the reverse-ETL boundary.
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
    description: Consent jurisdiction scope passed through from the gate.
  - name: membership_status
    logicalType: string
    physicalType: STRING
    description: Segment membership state (realized/existing) from segment_membership.
  - name: membership_score
    logicalType: number
    physicalType: DECIMAL(8, 4)
    description: Optional membership confidence/propensity from segment_membership.
  - name: eligible_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: Always TRUE here (the view exposes only gate-eligible rows); kept for consumer clarity.
  - name: blocking_reason_code
    logicalType: string
    physicalType: STRING
    description: From the gate; NULL for eligible rows.
  quality:
  - name: uav_grain_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per (audience_id x profile_id x purpose x channel x jurisdiction). Jurisdiction
      is part of the grain because the eligibility gate is grained by jurisdiction (consent is per-jurisdiction)
      — a profile eligible in >1 jurisdiction for one purpose x channel is an expected shape, not a duplicate.
    query: 'SELECT audience_id, profile_id, purpose_code, channel_code, jurisdiction_code

      FROM unified_customer_view.gold_activatable_audience_current

      GROUP BY audience_id, profile_id, purpose_code, channel_code, jurisdiction_code

      HAVING COUNT(*) > 1'
  - name: uav_all_eligible
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The activation surface exposes ONLY gate-eligible rows (a segment never overrides consent).
    query: 'SELECT * FROM unified_customer_view.gold_activatable_audience_current

      WHERE eligible_flag <> TRUE OR eligible_flag IS NULL'
  - name: uav_no_person_suppressed
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The activation surface must never expose a person-level do-not-target profile (ADR 0028).
      Belt-and-suspenders with the gate''s own suppression block: this asserts the surface itself is PERSON-LEVEL-DNT-safe
      on any plane (owned or paid), independent of the gate''s purpose coverage. This is the person-level
      leg ONLY: a selling/sharing plane must also apply the purpose-level do-not-sell/do-not-share opt-out
      (leg b); see the segment_membership contract.'
    query: "SELECT a.* FROM unified_customer_view.gold_activatable_audience_current a\nJOIN unified_customer_view.gold_person_do_not_target_current\
      \ dnt\n  ON dnt.profile_id = a.profile_id"
  - name: uav_activatable_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: uav_activatable_rowcount
    query: SELECT COUNT(*) AS activatable_rows FROM unified_customer_view.gold_activatable_audience_current
- name: gold_customer_activation_eligibility_current
  physicalName: unified_customer_view.gold_customer_activation_eligibility_current
  physicalType: view
  description: 'The net-permission gate: "can I contact this customer for purpose X on channel Y?" Grain:
    one row per customer x purpose x channel (x jurisdiction), specifically per EVALUABLE consent decision
    — a row exists only where the customer holds a GATE-MAPPED consent record (the four marketing_* types
    plus profiling / cookies / third_party_sharing / data_sale; ADR 0028). A "never asked" customer (no
    consent on record) is intentionally ABSENT here (neither eligible nor consent_denied): absence means
    "no decision to evaluate", and an activation gate must treat unknown consent as NOT eligible (do not
    infer eligibility from absence). Combines the THREE distinct governed states the briefs insist must
    not be collapsed (principle #5): consent (legal permission), preference (soft opt-out / channel),
    and reachability (a valid identifier/contact for the channel).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    description: Customer surrogate key.
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable pseudonymous customer business key.
  - name: purpose_code
    logicalType: string
    physicalType: STRING
    description: 'Processing purpose derived from consent_type (ADR 0028): marketing, personalization,
      analytics, retail_media, or data_sale (CCPA do-not-sell).'
  - name: channel_code
    logicalType: string
    physicalType: STRING
    description: Owned channel for marketing purposes (email, sms, phone, postal); NULL for the channel-agnostic
      non-marketing purposes (personalization/analytics/retail_media), which activate via a match key
      at the reverse-ETL boundary.
  - name: jurisdiction_code
    logicalType: string
    physicalType: STRING
    description: Consent jurisdiction scope, ISO 3166 (GDPR vs CCPA/CPRA).
  - name: consent_granted_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: Current consent is granted for this purpose x channel x jurisdiction.
  - name: preference_allows_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: Customer has not opted out of this channel in preferences. For the channel-agnostic non-marketing
      purposes (channel NULL) this is vacuously TRUE — channel preference does not constrain a channel-agnostic
      purpose (ADR 0028).
  - name: has_identifier_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: A valid identifier/contact exists for the channel. For the channel-agnostic non-marketing
      purposes (personalization/analytics/retail_media, channel NULL) this is vacuously TRUE — reachability
      is resolved at the reverse-ETL match-key boundary, not here (ADR 0028).
  - name: is_suppressed_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: A do-not-contact suppression overlay applies to this scope (consent.suppression_indicator);
      overrides granted consent.
  - name: eligible_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Net permission: consent AND preference AND identifier. For channel-agnostic non-marketing
      purposes eligible_flag does NOT imply an owned identifier exists (has_identifier is vacuously TRUE);
      match-key reachability is resolved downstream.'
  - name: blocking_reason_code
    logicalType: string
    physicalType: STRING
    description: 'First failing rule when not eligible, suppression first: suppressed, withdrawn, consent_denied,
      preference_opt_out, no_identifier.'
  - name: evaluated_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
  quality:
  - name: ucv_eligibility_one_row_per_grain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain guard (mirrors the 360 one-row check): one row per customer x purpose x channel
      x jurisdiction.'
    query: 'SELECT profile_id, purpose_code, channel_code, jurisdiction_code, COUNT(*) AS n

      FROM unified_customer_view.gold_customer_activation_eligibility_current

      GROUP BY profile_id, purpose_code, channel_code, jurisdiction_code

      HAVING COUNT(*) > 1'
  - name: ucv_eligibility_blocking_reason_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ucv_eligibility_blocking_reason_domain
    query: "SELECT * FROM unified_customer_view.gold_customer_activation_eligibility_current\nWHERE blocking_reason_code\
      \ IS NOT NULL\n  AND blocking_reason_code NOT IN ('consent_denied', 'withdrawn', 'preference_opt_out',\n\
      \                                   'no_identifier', 'suppressed')"
  - name: ucv_eligibility_flag_consistency
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: eligible_flag TRUE must have no blocking reason; FALSE must have one.
    query: "SELECT * FROM unified_customer_view.gold_customer_activation_eligibility_current\nWHERE (eligible_flag\
      \ = TRUE  AND blocking_reason_code IS NOT NULL)\n   OR (eligible_flag = FALSE AND blocking_reason_code\
      \ IS NULL)"
  - name: ucv_eligibility_purpose_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The gate purpose must be one of the consent-derived activation purposes (ADR 0028):
      marketing / personalization / analytics / retail_media / data_sale. service + data_processing are
      not consent-gated, so they never appear here. Guards the consent_type -> purpose mapping.'
    query: "SELECT * FROM unified_customer_view.gold_customer_activation_eligibility_current\nWHERE purpose_code\
      \ IS NULL\n   OR purpose_code NOT IN ('marketing', 'personalization', 'analytics', 'retail_media',\
      \ 'data_sale')"
  - name: ucv_eligibility_purpose_channel_pairing
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'The gate is only correct if purpose and channel stay paired (ADR 0028): the marketing
      purpose is a purpose x owned-channel compound, so it must carry a non-NULL channel_code; the channel-agnostic
      purposes (personalization / analytics / retail_media / data_sale) must carry a NULL channel_code
      (they activate via a match key, not an owned email/sms/phone/postal channel). purpose_code and channel_code
      are derived from consent_type in two parallel CASE expressions, so this asserts the load-bearing
      invariant that ties them together: if a future edit drifts one branch (a new marketing_* type added
      to purpose but not channel, or a non-marketing purpose accidentally emitting a channel) the other
      checks still pass while the consent gate silently mis-gates. Equivalent to (purpose=''marketing'')
      = (channel NOT NULL).'
    query: "SELECT * FROM unified_customer_view.gold_customer_activation_eligibility_current\nWHERE (purpose_code\
      \ =  'marketing' AND channel_code IS NULL)\n   OR (purpose_code <> 'marketing' AND channel_code\
      \ IS NOT NULL)"
  - name: ucv_eligibility_person_suppressed_blocked
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Cross-plane do-not-target enforcement (ADR 0028): no profile in the shared do-not-target
      set may ever resolve eligible on the owned gate. Makes "person-level suppression blocks every plane"
      a machine-checked invariant, not just prose.'
    query: "SELECT g.* FROM unified_customer_view.gold_customer_activation_eligibility_current g\nJOIN\
      \ unified_customer_view.gold_person_do_not_target_current dnt\n  ON dnt.profile_id = g.profile_id\n\
      WHERE g.eligible_flag = TRUE"
  - name: ucv_eligible_rate
    type: sql
    dimension: accuracy
    severity: info
    description: Share of customer x purpose x channel rows that are activation-eligible.
    query: 'SELECT ROUND(AVG(CASE WHEN eligible_flag THEN 1.0 ELSE 0.0 END), 4) AS eligible_rate

      FROM unified_customer_view.gold_customer_activation_eligibility_current'
  - name: ucv_suppression_rate
    type: sql
    dimension: accuracy
    severity: info
    description: 'The suppression_rate KPI (glossary): share of purpose x channel rows blocked by a do-not-contact
      suppression overlay.'
    query: 'SELECT ROUND(AVG(CASE WHEN is_suppressed_flag THEN 1.0 ELSE 0.0 END), 4) AS suppression_rate

      FROM unified_customer_view.gold_customer_activation_eligibility_current'
- name: gold_person_do_not_target_current
  physicalName: unified_customer_view.gold_person_do_not_target_current
  physicalType: view
  description: 'The profile-grain, CHANNEL/PURPOSE/JURISDICTION-agnostic do-not-target set: every profile
    carrying a PERSON-level suppression on ANY current consent scope. Person-level reasons (deceased,
    fraud, do_not_contact, legal_objection; a GDPR Art.21 direct-marketing objection) are absolute at
    the person level, so this view is the SINGLE do-not-target consult for EVERY activation plane: * the
    OWNED-channel gate (gold_customer_activation_eligibility_current) sources it, and * any NON-OWNED
    / PAID activation (retail-media / DSP / clean-room onboarding built over ACU segment_membership) that
    does not resolve people through the owned gate MUST anti-join it before targeting, so a person-suppressed
    customer cannot be uploaded to a paid destination (the cross-plane closure of ADR 0027''s "blocks
    every channel" claim; see ADR 0028). Keyed on the durable profile_id only (no jurisdiction predicate)
    — matching ADR 0027''s deliberate, fail-safe cross-jurisdiction propagation (over-suppress rather
    than risk under-suppressing a do-not-contact signal that carries legal weight). No PII is exposed
    (pseudonymous profile_id only).'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable pseudonymous customer key of a profile carrying an active person-level do-not-target
      suppression; the anti-join key every activation plane consults.
  - name: do_not_target_reason_code
    logicalType: string
    physicalType: STRING
    description: Representative person-level suppression reason at legal-weight priority (legal_objection
      > deceased > do_not_contact > fraud); read customer.consent for the full set of reasons and scopes.
  quality:
  - name: dnt_reason_domain
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: The representative reason must be one of the four person-level suppression reasons.
    query: "SELECT * FROM unified_customer_view.gold_person_do_not_target_current\nWHERE do_not_target_reason_code\
      \ IS NULL\n   OR do_not_target_reason_code NOT IN ('deceased', 'fraud', 'do_not_contact', 'legal_objection')"
  - name: dnt_profile_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: One row per profile_id (the view groups by profile_id).
    query: 'SELECT profile_id FROM unified_customer_view.gold_person_do_not_target_current

      GROUP BY profile_id HAVING COUNT(*) > 1'
- name: gold_unified_customer_360_current
  physicalName: unified_customer_view.gold_unified_customer_360_current
  physicalType: view
  description: 'One current row per resolved customer: a conformed 360 summary built ONLY from the thin
    customer core (profile, identity_link, consent, channel_preference, contact, address, household).
    Keyed on the customer SURROGATE; no raw PII (names / dob / loyalty / household ids / contact values)
    is exposed -- those stay in the governed dimension.'
  tags:
  - gold
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: profile_sk
    logicalType: integer
    physicalType: BIGINT
    description: Customer surrogate key (join target).
  - name: profile_id
    logicalType: string
    physicalType: STRING
    description: Durable pseudonymous customer business key.
  - name: household_size
    logicalType: integer
    physicalType: INT
    description: Number of current profiles sharing this household (outcome-layer roll-up).
  - name: active_identifier_count
    logicalType: integer
    physicalType: BIGINT
    description: Count of current, active resolved identifiers for the customer.
  - name: resolved_identity_confidence
    logicalType: number
    physicalType: DECIMAL(5, 4)
    description: 'Identity-resolution confidence in [0,1]: the highest match_confidence across the current
      active identity links of the customer.'
  - name: has_email_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if an active email contact point exists.
  - name: has_phone_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if an active phone contact point exists.
  - name: has_mailable_address_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if an active postal address exists.
  - name: jurisdiction_primary_code
    logicalType: string
    physicalType: STRING
    description: Governing privacy region from primary address (ISO 3166).
  - name: consent_marketing_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Summary: any marketing consent granted (see eligibility view for the per-channel, jurisdiction-resolved
      gate).'
  - name: consent_personalization_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Summary: profiling/personalization consent granted.'
  - name: consent_third_party_sharing_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Summary: third-party-sharing consent granted.'
  - name: consented_purpose_count
    logicalType: integer
    physicalType: BIGINT
    description: Count of distinct consent types currently granted.
  - name: email_contactable_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Summary: has email AND email marketing consent AND not opted out.'
  - name: sms_contactable_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Summary: has phone AND sms marketing consent AND not opted out.'
  - name: marketing_eligible_flag
    logicalType: boolean
    physicalType: BOOLEAN
    description: 'Summary marketing-reachability: marketing consent granted AND customer active.'
  - name: preferred_channel_code
    logicalType: string
    physicalType: STRING
    description: Highest-ranked opted-in communication channel.
  - name: customer_status_code
    logicalType: string
    physicalType: STRING
    description: 'Lifecycle status: prospect, active, inactive, closed.'
  - name: profile_completeness_score
    logicalType: number
    physicalType: DOUBLE
    description: Populated key attributes / required, in [0,1].
  - name: reachability_score
    logicalType: number
    physicalType: DOUBLE
    description: Activation-readiness across channels, in [0,1].
  - name: fresh_as_of_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    description: View evaluation timestamp (UTC).
  quality:
  - name: ucv_360_scores_in_range
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: ucv_360_scores_in_range
    query: "SELECT * FROM unified_customer_view.gold_unified_customer_360_current\nWHERE (resolved_identity_confidence\
      \ IS NOT NULL AND resolved_identity_confidence NOT BETWEEN 0 AND 1)\n   OR (profile_completeness_score\
      \ IS NOT NULL AND profile_completeness_score NOT BETWEEN 0 AND 1)\n   OR (reachability_score IS\
      \ NOT NULL AND reachability_score NOT BETWEEN 0 AND 1)"
  - name: ucv_360_one_row_per_customer
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: 'Grain guard: one current row per resolved customer.'
    query: 'SELECT profile_id, COUNT(*) AS n

      FROM unified_customer_view.gold_unified_customer_360_current

      GROUP BY profile_id

      HAVING COUNT(*) > 1'
  - name: ucv_360_customer_count
    type: sql
    dimension: accuracy
    severity: info
    description: Reports the size of the unified customer population.
    query: 'SELECT COUNT(*) AS unified_customer_count

      FROM unified_customer_view.gold_unified_customer_360_current'
- name: mv_cdp_activation_eligibility
  physicalName: unified_customer_view.mv_cdp_activation_eligibility
  physicalType: view
  description: 'CDP activation-gate KPIs: share of customer x purpose x channel rows with consent granted,
    eligible to activate, and suppressed, by purpose, channel, jurisdiction and blocking reason.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: purpose_code
    logicalType: string
    businessName: Activation Purpose
    customProperties:
    - property: synonyms
      value:
      - purpose
      - consent_purpose
    description: Consent purpose evaluated by the gate (for example marketing, personalization, retail_media,
      data_sale).
  - name: channel_code
    logicalType: string
    businessName: Channel
    customProperties:
    - property: synonyms
      value:
      - channel
      - medium
    description: Contact channel the permission applies to; NULL for channel-agnostic purposes.
  - name: jurisdiction_code
    logicalType: string
    businessName: Jurisdiction
    customProperties:
    - property: synonyms
      value:
      - jurisdiction
      - privacy_region
    description: ISO 3166 jurisdiction the consent is resolved as-of.
  - name: blocking_reason_code
    logicalType: string
    businessName: Blocking Reason
    customProperties:
    - property: synonyms
      value:
      - block_reason
      - ineligibility_reason
    description: 'First failing rule when not eligible, suppression first: suppressed / withdrawn / consent_denied
      / preference_opt_out / no_identifier. NULL when eligible.'
  - name: gate_row_count
    logicalType: integer
    businessName: Gate Rows
    customProperties:
    - property: synonyms
      value:
      - permission_rows
      - evaluated_rows
    description: Count of customer x purpose x channel x jurisdiction rows the gate evaluated.
  - name: consent_granted_rate_by_purpose
    logicalType: number
    businessName: Consent Granted Rate
    customProperties:
    - property: synonyms
      value:
      - consent_rate
      - consent_granted_rate
    description: Share of purpose x channel rows with consent granted (glossary consent_granted_rate_by_purpose).
  - name: eligible_rate
    logicalType: number
    businessName: Activation Eligible Rate
    customProperties:
    - property: synonyms
      value:
      - activatable_rate
      - eligibility_rate
    description: 'Share of purpose x channel rows that are activation-eligible: consent granted AND preference
      allows AND an identifier is present AND not suppressed (glossary eligible_rate).'
  - name: suppression_rate
    logicalType: number
    businessName: Suppression Rate
    customProperties:
    - property: synonyms
      value:
      - suppressed_rate
      - do_not_contact_rate
    description: Share of purpose x channel rows blocked by a do-not-contact suppression overlay, which
      overrides granted consent (glossary suppression_rate).
- name: mv_cdp_activation_jobs
  physicalName: unified_customer_view.mv_cdp_activation_jobs
  physicalType: view
  description: 'CDP activation KPIs over audience-to-destination publish runs: requested, eligible, blocked
    and exported members, export rate, all-cause block rate and member-weighted match rate.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: activation_destination_id
    logicalType: string
    businessName: Destination
    customProperties:
    - property: synonyms
      value:
      - destination
      - endpoint
    description: Activation destination the audience was published to.
  - name: audience_id
    logicalType: string
    businessName: Audience
    customProperties:
    - property: synonyms
      value:
      - segment
      - audience
    description: Audience that was published.
  - name: purpose_code
    logicalType: string
    businessName: Activation Purpose
    customProperties:
    - property: synonyms
      value:
      - purpose
    description: Consent purpose the publish run was gated on.
  - name: channel_code
    logicalType: string
    businessName: Channel
    customProperties:
    - property: synonyms
      value:
      - channel
      - medium
    description: Contact channel of the publish run.
  - name: jurisdiction_code
    logicalType: string
    businessName: Jurisdiction
    customProperties:
    - property: synonyms
      value:
      - jurisdiction
      - privacy_region
    description: ISO 3166 jurisdiction the run was scoped to; NULL when the adopter reports regime-agnostic
      runs.
  - name: job_status
    logicalType: string
    businessName: Job Status
    customProperties:
    - property: synonyms
      value:
      - status
      - run_status
    description: Outcome status of the publish run.
  - name: job_run_date
    logicalType: date
    businessName: Run Date
    customProperties:
    - property: synonyms
      value:
      - date
      - run_date
    description: Date of the publish run.
  - name: activation_run_count
    logicalType: integer
    businessName: Publish Runs
    customProperties:
    - property: synonyms
      value:
      - job_count
      - runs
    description: Count of audience-to-destination publish runs.
  - name: requested_members
    logicalType: integer
    businessName: Requested Members
    customProperties:
    - property: synonyms
      value:
      - requested
    description: Members requested for activation, before the eligibility gate.
  - name: eligible_members
    logicalType: integer
    businessName: Eligible Members
    customProperties:
    - property: synonyms
      value:
      - eligible
    description: Members that passed the net eligibility gate.
  - name: blocked_members
    logicalType: integer
    businessName: Blocked Members
    customProperties:
    - property: synonyms
      value:
      - blocked
    description: Members the gate removed for any reason (requested minus eligible).
  - name: exported_members
    logicalType: integer
    businessName: Exported Members
    customProperties:
    - property: synonyms
      value:
      - exported
      - synced_members
    description: Members synced to the destination.
  - name: activation_export_rate
    logicalType: number
    businessName: Activation Export Rate
    customProperties:
    - property: synonyms
      value:
      - export_rate
      - activation_efficiency
    description: Share of gate-eligible members actually exported, ratio-of-sums (glossary activation_export_rate).
  - name: activation_block_rate
    logicalType: number
    businessName: Activation Block Rate
    customProperties:
    - property: synonyms
      value:
      - block_rate
      - gate_block_rate
    description: Share of requested members the eligibility gate removed for ANY reason (consent, preference,
      reachability or suppression); an all-cause block rate, not suppression-specific (glossary activation_block_rate).
  - name: activation_match_rate
    logicalType: number
    businessName: Activation Match Rate
    customProperties:
    - property: synonyms
      value:
      - match_rate
      - provider_match_rate
    description: Member-weighted provider match rate across exports; the denominator counts only exports
      with a known match_rate (glossary activation_match_rate).
- name: mv_cdp_campaign_touch
  physicalName: unified_customer_view.mv_cdp_campaign_touch
