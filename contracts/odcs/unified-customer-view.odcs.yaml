- name: mv_customer_360
  physicalName: unified_customer_view.mv_customer_360
  physicalType: view
  description: 'Customer 360 and identity-resolution KPIs over the current unified customer view: customer
    count, identity confidence and coverage, consent, contactability, household coverage, reachability
    and profile completeness.'
  tags:
  - metric-view
  authoritativeDefinitions:
  - url: outcome-packages/unified-customer-view/README.md
    type: businessDefinition
  - url: outcome-packages/unified-customer-view/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: jurisdiction_primary_code
    logicalType: string
    businessName: Primary Jurisdiction
    customProperties:
    - property: synonyms
      value:
      - jurisdiction
      - privacy_region
      - region
    description: The customer's governing privacy region (ISO 3166), from the primary address. Per-purpose
      consent precision lives in the eligibility view.
  - name: customer_status_code
    logicalType: string
    businessName: Customer Status
    customProperties:
    - property: synonyms
      value:
      - status
      - lifecycle_status
    description: Lifecycle status of the unified customer.
  - name: active_customer_count
    logicalType: integer
    businessName: Active Customer Count
    customProperties:
    - property: synonyms
      value:
      - customer_count
      - unified_customers
    description: Count of current unified customers (glossary active_customer_count).
  - name: avg_identity_confidence
    logicalType: number
    businessName: Avg Identity Confidence
    customProperties:
    - property: synonyms
      value:
      - identity_confidence
      - match_confidence
    description: 'Mean resolved-identity confidence in [0,1]: per customer, the highest match_confidence
      across current active identity links (glossary avg_identity_confidence).'
  - name: identity_coverage_rate
    logicalType: number
    businessName: Identity Coverage Rate
    customProperties:
    - property: synonyms
      value:
      - identity_coverage
      - resolved_share
    description: Share of customers with at least one active resolved identifier (glossary identity_coverage_rate).
  - name: consent_marketing_rate
    logicalType: number
    businessName: Marketing Consent Rate
    customProperties:
    - property: synonyms
      value:
      - marketing_consent
      - opt_in_rate
    description: Share of customers with marketing consent granted, the 360 summary (granted anywhere).
      Use mv_cdp_activation_eligibility for the per-purpose x channel x jurisdiction permission (glossary
      consent_marketing_rate).
  - name: consent_personalization_rate
    logicalType: number
    businessName: Personalization Consent Rate
    customProperties:
    - property: synonyms
      value:
      - personalization_consent
    description: Share of customers with personalization consent granted (same definition as consent_marketing_rate,
      for the personalization purpose).
  - name: consent_third_party_sharing_rate
    logicalType: number
    businessName: Third-Party Sharing Consent Rate
    customProperties:
    - property: synonyms
      value:
      - sharing_consent
      - third_party_consent
    description: Share of customers with third-party sharing consent granted (same definition as consent_marketing_rate,
      for the third-party sharing purpose).
  - name: email_contactable_rate
    logicalType: number
    businessName: Email Contactable Rate
    customProperties:
    - property: synonyms
      value:
      - email_reach
      - emailable_rate
    description: Share of customers contactable by email (glossary contactable_rate, email channel).
  - name: sms_contactable_rate
    logicalType: number
    businessName: SMS Contactable Rate
    customProperties:
    - property: synonyms
      value:
      - sms_reach
      - textable_rate
    description: Share of customers contactable by SMS (glossary contactable_rate, sms channel).
  - name: household_coverage
    logicalType: number
    businessName: Household Coverage Rate
    customProperties:
    - property: synonyms
      value:
      - household_coverage_rate
      - householded_share
    description: Share of customers assigned to a household (glossary household_coverage).
  - name: avg_reachability_score
    logicalType: number
    businessName: Avg Reachability Score
    customProperties:
    - property: synonyms
      value:
      - reachability
      - activation_readiness
    description: 'Mean activation readiness: per customer, the fraction of channels (email/sms/postal)
      with consent, preference and an identifier present (glossary avg_reachability_score).'
  - name: avg_profile_completeness
    logicalType: number
    businessName: Avg Profile Completeness
    customProperties:
    - property: synonyms
      value:
      - profile_completeness
      - data_completeness
    description: Mean fraction of key profile attributes populated (name, dob, email, address) (glossary
      avg_profile_completeness).
