- name: equipment_reading
  physicalName: equipment.equipment_reading
  physicalType: table
  description: 'ORDM canonical-core equipment sensor readings (append-only). Telemetry from in-store assets:
    temperature, power, vibration, error codes.'
  tags:
  - transactional
  authoritativeDefinitions:
  - url: canonical-core/equipment/README.md
    type: businessDefinition
  - url: canonical-core/equipment/glossary.md
    type: businessDefinition
  - url: docs/data-model-standards.md
    type: businessDefinition
  properties:
  - name: equipment_reading_sk
    logicalType: integer
    physicalType: BIGINT
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    description: Surrogate key.
  - name: equipment_reading_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable natural/business key (equipment_id|reading_type|sequence). Row grain is one sensor
      reading; sequence disambiguates successive readings of the same (equipment_id, reading_type).
  - name: equipment_sk
    logicalType: integer
    physicalType: BIGINT
    required: false
    description: FK to equipment.equipment_sk (version-specific).
    relationships:
    - to: equipment.equipment_sk
      type: foreignKey
      customProperties:
      - property: toSchema
        value: equipment
      - property: enforced
        value: false
  - name: equipment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Durable equipment business key.
  - name: reading_type
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Type of sensor reading. Allowed values: temperature, humidity, power_kw, vibration,
      runtime_hours, error_code, door_open_count, pressure.'
  - name: reading_value
    logicalType: number
    physicalType: DOUBLE
    required: false
    description: Numeric value of the reading (units depend on reading_type).
  - name: reading_unit
    logicalType: string
    physicalType: STRING
    required: false
    description: Unit of measure (e.g. celsius, fahrenheit, kw, mm_s, hours, count, psi).
  - name: error_code
    logicalType: string
    physicalType: STRING
    required: false
    description: Equipment error or fault code (populated when reading_type = error_code).
  - name: error_message
    logicalType: string
    physicalType: STRING
    required: false
    description: Human-readable description of the error code.
  - name: is_anomaly
    logicalType: boolean
    physicalType: BOOLEAN
    required: false
    description: Whether this reading was flagged as anomalous by the ingestion pipeline.
  - name: threshold_breached
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Which threshold was breached, if any. Allowed values: low, high, critical_low, critical_high.'
  - name: event_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the reading was captured at the sensor (UTC, ISO 8601).
  - name: ingest_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this reading was ingested into the lakehouse (UTC, ISO 8601).
  - name: latency_seconds
    logicalType: integer
    physicalType: INT
    required: false
    description: Seconds between event_timestamp and ingest_timestamp.
    quality:
    - type: text
      dimension: validity
      severity: error
      description: CHECK (latency_seconds IS NULL OR latency_seconds >= 0).
  - name: record_source
    logicalType: string
    physicalType: STRING
    required: false
    description: Originating system or IoT platform.
  - name: load_timestamp
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: When this row was loaded (UTC, ISO 8601).
  quality:
  - name: reading_pk_unique
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: reading_pk_unique
    query: 'SELECT equipment_reading_sk

      FROM equipment.equipment_reading

      GROUP BY equipment_reading_sk

      HAVING COUNT(*) > 1'
  - name: reading_equipment_fk_orphan
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: reading_equipment_fk_orphan
    query: 'SELECT er.* FROM equipment.equipment_reading er

      LEFT JOIN equipment.equipment eq ON er.equipment_sk = eq.equipment_sk

      WHERE eq.equipment_sk IS NULL AND er.equipment_sk IS NOT NULL'
  - name: reading_event_ts_not_future
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: reading_event_ts_not_future
    query: 'SELECT * FROM equipment.equipment_reading

      WHERE event_timestamp > CURRENT_TIMESTAMP()'
  - name: reading_latency_nonnegative
    type: sql
    dimension: accuracy
    severity: error
    mustBe: 0
    unit: rows
    description: reading_latency_nonnegative
    query: 'SELECT * FROM equipment.equipment_reading

      WHERE latency_seconds IS NOT NULL AND latency_seconds < 0'
  - name: reading_rowcount
    type: sql
    dimension: accuracy
    severity: info
    description: reading_rowcount
    query: SELECT COUNT(*) AS reading_rows FROM equipment.equipment_reading
  - name: reading_anomaly_count
    type: sql
    dimension: accuracy
    severity: info
    description: reading_anomaly_count
    query: 'SELECT COUNT(*) AS anomaly_count

      FROM equipment.equipment_reading

      WHERE is_anomaly = TRUE'
  - name: reading_type_distribution
    type: sql
    dimension: accuracy
    severity: info
    description: reading_type_distribution
    query: 'SELECT reading_type, COUNT(*) AS reading_count

      FROM equipment.equipment_reading

      GROUP BY reading_type'
  - name: reading_avg_latency
    type: sql
    dimension: accuracy
    severity: info
    description: reading_avg_latency
    query: 'SELECT ROUND(AVG(latency_seconds), 1) AS avg_latency_seconds

      FROM equipment.equipment_reading'
