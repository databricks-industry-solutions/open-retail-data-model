name: Docs guard (advisory)

# One non-blocking nudge: warn (never fail) when a PR changes the model but no docs,
# so keep-docs-in-sync (CONTRIBUTING §8) is surfaced without false-positive friction.
# (The Contributors grid is auto-generated by contributors.yml, so it needs no check here.)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists a PR's changed files via the API

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            model:
              - 'canonical-core/**'
              - 'outcome-packages/**'
            docs:
              # Hand-authored doc surfaces only. Deliberately NOT '**/README.md': the
              # per-domain canonical-core/outcome READMEs are GENERATED + auto-committed
              # by regen-artifacts, so counting them would let a DDL-only change satisfy
              # this nudge while the real hand-written docs (glossary, architecture) went
              # stale.
              - 'docs/**'
              - 'README.md'
              - '**/glossary.md'
              - 'CONTRIBUTING.md'
              - 'GOVERNANCE.md'
      - name: Warn if the model changed but no docs did
        if: steps.changes.outputs.model == 'true' && steps.changes.outputs.docs == 'false'
        run: |
          echo "::warning title=Docs may be out of sync::This PR changes canonical-core/outcome-packages but touches no docs/README/glossary. Confirm the docs are in sync (CONTRIBUTING section 8: any structure, naming, or scope change updates the docs in the same PR). Advisory only; does not block."
