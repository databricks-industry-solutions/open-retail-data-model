name: Databricks setup
description: >-
  Install the Databricks CLI, write ~/.databrickscfg from a host + token, and ensure a
  serverless SQL warehouse exists -- returning its id. Factors out the auth + warehouse-ensure
  block for the deploy workflows that USE it: ordm-lean-pr-deploy and ordm-daily-deploy.
  databricks-ci's validate-and-test still carries its own inline copy (with a 2X-Small
  create size vs this action's Small default -- harmless today since all three share one
  warehouse BY NAME and cluster_size only applies at creation); migrating it here to finish
  the DRY is a deferred follow-up (touches a required gate). See design/59.

inputs:
  host:
    description: Databricks workspace host (from the DATABRICKS_HOST repo variable).
    required: true
  token:
    description: Databricks token (from the DEPLOY_NOTEBOOK_TOKEN secret).
    required: true
  warehouse-name:
    description: Name of the serverless SQL warehouse to find-or-create.
    required: false
    default: "Shared Unity Catalog Serverless"
  cluster-size:
    description: Cluster size used only when the warehouse must be created.
    required: false
    default: "Small"

outputs:
  warehouse-id:
    description: The id of the found-or-created serverless SQL warehouse.
    value: ${{ steps.ensure.outputs.warehouse_id }}

runs:
  using: composite
  steps:
    - name: Set up Databricks CLI
      # Pinned to a COMMIT SHA (not the mutable @main): this composite runs in the same job that
      # holds DEPLOY_NOTEBOOK_TOKEN and writes it to ~/.databrickscfg, so a retargeted/compromised
      # upstream main would execute with the deploy token in scope (AI review #108 M1). SHA is
      # v1.10.0 of databricks/setup-cli; bump the SHA + comment together to upgrade.
      uses: databricks/setup-cli@8821c27b1fe57472264eeb6e50c1f31d69552f28  # v1.10.0

    - name: Configure Databricks CLI authentication
      shell: bash
      env:
        DATABRICKS_HOST: ${{ inputs.host }}
        DATABRICKS_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$DATABRICKS_HOST" ]; then
          echo "::error::Repository variable DATABRICKS_HOST is not set. Define it under Settings > Variables > Actions."
          exit 1
        fi
        # Create the file with 0600 BEFORE writing the token, so the bearer token is never
        # world/group-readable even briefly by a later job step (defense-in-depth; AI review
        # #108 m2). umask covers the redirect that creates it; chmod is belt-and-suspenders.
        umask 077
        : > ~/.databrickscfg
        chmod 600 ~/.databrickscfg
        echo "[DEFAULT]" >> ~/.databrickscfg
        echo "host = $DATABRICKS_HOST" >> ~/.databrickscfg
        echo "token = $DATABRICKS_TOKEN" >> ~/.databrickscfg

    - name: Ensure a serverless SQL warehouse
      id: ensure
      shell: bash
      env:
        DATABRICKS_HOST: ${{ inputs.host }}
        DATABRICKS_TOKEN: ${{ inputs.token }}
        WAREHOUSE_NAME: ${{ inputs.warehouse-name }}
        CLUSTER_SIZE: ${{ inputs.cluster-size }}
      run: |
        LIST=$(curl -s -H "Authorization: Bearer $DATABRICKS_TOKEN" "$DATABRICKS_HOST/api/2.0/sql/warehouses")
        WAREHOUSE_ID=$(echo "$LIST" | python3 -c "
        import sys, json, os
        d = json.load(sys.stdin)
        name = os.environ['WAREHOUSE_NAME']
        m = [w for w in d.get('warehouses', []) if w['name'] == name]
        print(m[0]['id'] if m else '')
        ")
        if [ -z "$WAREHOUSE_ID" ]; then
          RESP=$(curl -s -X POST -H "Authorization: Bearer $DATABRICKS_TOKEN" -H "Content-Type: application/json" \
            "$DATABRICKS_HOST/api/2.0/sql/warehouses" \
            -d "{\"name\":\"${WAREHOUSE_NAME}\",\"cluster_size\":\"${CLUSTER_SIZE}\",\"enable_serverless_compute\":true,\"auto_stop_mins\":10,\"max_num_clusters\":1}")
          WAREHOUSE_ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
        fi
        if [ -z "$WAREHOUSE_ID" ]; then echo "::error::could not get a warehouse id"; exit 1; fi
        echo "warehouse_id=$WAREHOUSE_ID" >> "$GITHUB_OUTPUT"
